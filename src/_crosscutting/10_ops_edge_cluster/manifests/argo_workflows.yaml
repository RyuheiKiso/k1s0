# k1s0 Ops Edge クラスター Argo Workflows Deployment 定義
# エスカレーションエンジンとして Argo Workflows をデプロイする
apiVersion: v1
# リソース種別: ServiceAccount (Argo Workflows 用)
kind: ServiceAccount
metadata:
  # ServiceAccount 名称: argo-workflows-ops-edge
  name: argo-workflows-ops-edge
  # Namespace: k1s0-ops-edge に配置する
  namespace: k1s0-ops-edge
---
# k1s0 Ops Edge Argo Workflows 用 ClusterRole 定義
# Argo Workflows がクラスター API にアクセスするための権限を定義する
apiVersion: rbac.authorization.k8s.io/v1
# リソース種別: ClusterRole
kind: ClusterRole
metadata:
  # ClusterRole 名称: argo-workflows-ops-edge
  name: argo-workflows-ops-edge
rules:
  # Argo Workflows リソースの読み書き権限
  - apiGroups:
      # Argo Workflows の API グループ
      - "argoproj.io"
    resources:
      # Workflow リソースを対象とする
      - workflows
      # WorkflowTemplate リソースを対象とする
      - workflowtemplates
      # CronWorkflow リソースを対象とする
      - cronworkflows
    verbs:
      # 全操作を許可する
      - "*"
  # Pod 操作権限: Argo Workflows が Pod を作成・管理するために必要
  - apiGroups:
      # コア API グループ
      - ""
    resources:
      # Pod リソースを対象とする
      - pods
      # Pod ログを対象とする
      - pods/log
      # Secret を対象とする
      - secrets
      # ConfigMap を対象とする
      - configmaps
      # ServiceAccount を対象とする
      - serviceaccounts
    verbs:
      # 全操作を許可する
      - "*"
---
# k1s0 Ops Edge Argo Workflows ClusterRoleBinding 定義
apiVersion: rbac.authorization.k8s.io/v1
# リソース種別: ClusterRoleBinding
kind: ClusterRoleBinding
metadata:
  # ClusterRoleBinding 名称: argo-workflows-ops-edge
  name: argo-workflows-ops-edge
roleRef:
  # バインド対象の ClusterRole を指定する
  apiGroup: rbac.authorization.k8s.io
  # リソース種別: ClusterRole
  kind: ClusterRole
  # ClusterRole 名称: argo-workflows-ops-edge
  name: argo-workflows-ops-edge
subjects:
  # バインド対象の ServiceAccount を指定する
  - kind: ServiceAccount
    # ServiceAccount 名称: argo-workflows-ops-edge
    name: argo-workflows-ops-edge
    # Namespace: k1s0-ops-edge
    namespace: k1s0-ops-edge
---
# k1s0 Ops Edge エスカレーション用 WorkflowTemplate 定義
# ターゲットクラスター障害時のエスカレーションフローを定義する
apiVersion: argoproj.io/v1alpha1
# リソース種別: WorkflowTemplate
kind: WorkflowTemplate
metadata:
  # WorkflowTemplate 名称: k1s0-escalation-workflow
  name: k1s0-escalation-workflow
  # Namespace: k1s0-ops-edge に配置する
  namespace: k1s0-ops-edge
spec:
  # エントリポイント: エスカレーションの開始ステップを設定する
  entrypoint: escalation-flow
  # テンプレート定義: エスカレーションフローの各ステップを定義する
  templates:
    # エスカレーションフローテンプレート: 順次実行のステップを定義する
    - name: escalation-flow
      # ステップ定義: 検知 → 通知 → 自動回復の順で実行する
      steps:
        # ステップ 1: ターゲットクラスターの障害を検知する
        - - name: detect-failure
            # テンプレート参照: detect-failure テンプレートを使用する
            template: detect-failure
        # ステップ 2: Slack / PagerDuty への障害通知を送信する
        - - name: notify-oncall
            # テンプレート参照: notify-oncall テンプレートを使用する
            template: notify-oncall
        # ステップ 3: 自動回復アクションを実行する
        - - name: auto-recovery
            # テンプレート参照: auto-recovery テンプレートを使用する
            template: auto-recovery
    # 障害検知テンプレート: ターゲットクラスターの稼働状態を確認する
    - name: detect-failure
      # コンテナ定義: kubectl でクラスター状態を確認する
      container:
        # kubectl イメージを使用する
        image: bitnami/kubectl:latest
        # クラスター状態確認コマンドを実行する
        command: [sh, -c]
        # kubectl でノード一覧を確認してクラスターの稼働状態を検知する
        args: ["kubectl get nodes --context=target-cluster 2>&1 | grep -c NotReady || true"]
    # 通知テンプレート: オンコール担当者に障害を通知する
    - name: notify-oncall
      # コンテナ定義: curl で Slack Webhook に通知を送信する
      container:
        # curl イメージを使用する
        image: curlimages/curl:latest
        # Slack Webhook へ通知を送信するコマンドを実行する
        command: [sh, -c]
        # Slack Webhook URL に JSON を POST して障害を通知する
        args: ["curl -X POST -H 'Content-type: application/json' --data '{\"text\":\"k1s0 ターゲットクラスター障害検知: エスカレーション開始\"}' ${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/placeholder}"]
    # 自動回復テンプレート: ターゲットクラスターの自動回復を試みる
    - name: auto-recovery
      # コンテナ定義: kubectl で回復アクションを実行する
      container:
        # kubectl イメージを使用する
        image: bitnami/kubectl:latest
        # 回復アクションコマンドを実行する
        command: [sh, -c]
        # ノードを drain して再スケジュールを試みる
        args: ["echo 'ターゲットクラスター自動回復アクション実行中'; kubectl get nodes 2>&1 || echo '回復失敗: 手動介入が必要'"]
