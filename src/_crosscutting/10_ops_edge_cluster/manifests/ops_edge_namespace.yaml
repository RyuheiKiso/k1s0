# k1s0 Ops Edge クラスター専用 Namespace 定義
# 運用エッジクラスターが使用する独立した Namespace を定義する
apiVersion: v1
# リソース種別: Namespace
kind: Namespace
metadata:
  # Namespace 名称: k1s0-ops-edge
  name: k1s0-ops-edge
  # ラベル: Ops Edge クラスター専用 Namespace を識別するラベルを設定する
  labels:
    # Ops Edge 指定ラベル: この Namespace が Ops Edge 用であることを示す
    k1s0.io/ops-edge: "true"
    # 独立性ラベル: ターゲットクラスターから独立していることを示す
    k1s0.io/independent: "true"
    # 環境ラベル: 運用環境であることを示す
    k1s0.io/environment: "ops"
---
# k1s0 Ops Edge クラスター用 ResourceQuota 定義
# Ops Edge Namespace のリソース使用量を制限する
apiVersion: v1
# リソース種別: ResourceQuota
kind: ResourceQuota
metadata:
  # ResourceQuota 名称: ops-edge-quota
  name: ops-edge-quota
  # Namespace: k1s0-ops-edge に配置する
  namespace: k1s0-ops-edge
spec:
  hard:
    # CPU 要求量の上限: 4 コア
    requests.cpu: "4"
    # CPU 制限量の上限: 8 コア
    limits.cpu: "8"
    # メモリ要求量の上限: 8Gi
    requests.memory: 8Gi
    # メモリ制限量の上限: 16Gi
    limits.memory: 16Gi
    # Pod 数の上限: 50 Pod
    count/pods: "50"
---
# k1s0 Ops Edge クラスター用 NetworkPolicy 定義
# Ops Edge Namespace への不正アクセスを防ぐ NetworkPolicy
apiVersion: networking.k8s.io/v1
# リソース種別: NetworkPolicy
kind: NetworkPolicy
metadata:
  # NetworkPolicy 名称: ops-edge-default-deny
  name: ops-edge-default-deny
  # Namespace: k1s0-ops-edge に配置する
  namespace: k1s0-ops-edge
spec:
  # ポッドセレクタ: 全 Pod に適用する
  podSelector: {}
  # ポリシータイプ: Ingress と Egress を制御する
  policyTypes:
    # Ingress トラフィックを制御する
    - Ingress
    # Egress トラフィックを制御する
    - Egress
  # ingress ルール: Ops Admin からのアクセスのみ許可する
  ingress:
    # 許可ルール: ops-edge-admin ラベルを持つ Pod からの接続のみ許可する
    - from:
        # Ops Admin の Pod セレクタ: k1s0.io/role=ops-admin ラベルを持つ Pod を許可する
        - podSelector:
            matchLabels:
              # Ops Admin ラベル
              k1s0.io/role: ops-admin
  # egress ルール: DNS と外部クラスターへのアクセスを許可する
  egress:
    # DNS への Egress を許可する
    - ports:
        # DNS ポート 53 (UDP) を許可する
        - port: 53
          protocol: UDP
        # DNS ポート 53 (TCP) を許可する
        - port: 53
          protocol: TCP
    # ターゲットクラスターの API サーバーへの Egress を許可する
    - ports:
        # Kubernetes API サーバーポート 6443 を許可する
        - port: 6443
          protocol: TCP
