# k1s0 Apicurio GitOps コントローラ用 ServiceAccount 定義
# コントローラが Kubernetes API にアクセスするための ServiceAccount を作成する
apiVersion: v1
# リソース種別: ServiceAccount
kind: ServiceAccount
metadata:
  # ServiceAccount 名称: apicurio-gitops-controller
  name: apicurio-gitops-controller
  # Namespace: k1s0-system に配置する
  namespace: k1s0-system
---
# k1s0 Apicurio GitOps コントローラ用 ClusterRole 定義
# コントローラが必要とする権限を ClusterRole として定義する
apiVersion: rbac.authorization.k8s.io/v1
# リソース種別: ClusterRole
kind: ClusterRole
metadata:
  # ClusterRole 名称: apicurio-gitops-controller
  name: apicurio-gitops-controller
rules:
  # ApicurioSchema CRD の読み書き権限を付与する
  - apiGroups:
      # k1s0.io API グループを対象とする
      - "k1s0.io"
    resources:
      # ApicurioSchema リソースを対象とする
      - apicurioschemas
      # ApicurioSchema ステータスサブリソースを対象とする
      - apicurioschemas/status
    verbs:
      # 読み取り権限: get, list, watch を付与する
      - get
      - list
      - watch
      # 書き込み権限: create, update, patch を付与する
      - create
      - update
      - patch
  # イベント書き込み権限を付与する
  - apiGroups:
      # コア API グループを対象とする
      - ""
    resources:
      # イベントリソースを対象とする
      - events
    verbs:
      # イベント作成・更新権限を付与する
      - create
      - patch
---
# k1s0 Apicurio GitOps コントローラ用 ClusterRoleBinding 定義
# ServiceAccount に ClusterRole を紐付ける
apiVersion: rbac.authorization.k8s.io/v1
# リソース種別: ClusterRoleBinding
kind: ClusterRoleBinding
metadata:
  # ClusterRoleBinding 名称: apicurio-gitops-controller
  name: apicurio-gitops-controller
roleRef:
  # バインド対象の ClusterRole を指定する
  apiGroup: rbac.authorization.k8s.io
  # リソース種別: ClusterRole
  kind: ClusterRole
  # ClusterRole 名称: apicurio-gitops-controller
  name: apicurio-gitops-controller
subjects:
  # バインド対象の ServiceAccount を指定する
  - kind: ServiceAccount
    # ServiceAccount 名称: apicurio-gitops-controller
    name: apicurio-gitops-controller
    # Namespace: k1s0-system
    namespace: k1s0-system
---
# k1s0 Apicurio GitOps コントローラの Deployment 定義
# コントローラを Kubernetes Deployment としてデプロイする
apiVersion: apps/v1
# リソース種別: Deployment
kind: Deployment
metadata:
  # Deployment 名称: apicurio-gitops-controller
  name: apicurio-gitops-controller
  # Namespace: k1s0-system に配置する
  namespace: k1s0-system
  # ラベル: コントローラコンポーネントを識別するラベルを設定する
  labels:
    # アプリ名ラベル: apicurio-gitops-controller
    app: apicurio-gitops-controller
spec:
  # レプリカ数: 高可用性のため 2 レプリカで起動する
  replicas: 2
  # セレクタ: Deployment が管理する Pod を識別するセレクタを設定する
  selector:
    matchLabels:
      # アプリ名ラベルでマッチングする
      app: apicurio-gitops-controller
  # Pod テンプレート: Deployment が作成する Pod の仕様を定義する
  template:
    metadata:
      # Pod ラベル: セレクタと一致するラベルを設定する
      labels:
        # アプリ名ラベル: apicurio-gitops-controller
        app: apicurio-gitops-controller
    spec:
      # ServiceAccount: apicurio-gitops-controller を使用する
      serviceAccountName: apicurio-gitops-controller
      # コンテナ定義: コントローラコンテナを定義する
      containers:
        # コンテナ名称: controller
        - name: controller
          # コンテナイメージ: Apicurio GitOps コントローライメージ
          image: ghcr.io/k1s0/apicurio-gitops-controller:latest
          # 環境変数: コントローラの動作設定を環境変数で注入する
          env:
            # Apicurio Registry URL 環境変数を設定する
            - name: APICURIO_REGISTRY_URL
              # ConfigMap から URL を取得する
              valueFrom:
                configMapKeyRef:
                  # ConfigMap 名称: apicurio-config
                  name: apicurio-config
                  # キー: registry_url
                  key: registry_url
          # リソース制限: コントローラのリソース使用量を制限する
          resources:
            # リソース要求量を設定する
            requests:
              # CPU 要求量: 100m
              cpu: 100m
              # メモリ要求量: 128Mi
              memory: 128Mi
            # リソース制限量を設定する
            limits:
              # CPU 制限量: 500m
              cpu: 500m
              # メモリ制限量: 256Mi
              memory: 256Mi
