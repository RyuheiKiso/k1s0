# k1s0 BFF 認証エッジの Deployment 定義
# axum ベースの BFF ゲートウェイを Kubernetes Deployment としてデプロイする
apiVersion: apps/v1
# リソース種別: Deployment
kind: Deployment
metadata:
  # Deployment 名称: k1s0-bff
  name: k1s0-bff
  # Namespace: k1s0-system に配置する
  namespace: k1s0-system
  # ラベル: BFF コンポーネントを識別するラベルを設定する
  labels:
    # アプリ名ラベル: k1s0-bff
    app: k1s0-bff
    # コンポーネント種別ラベル: bff
    component: bff
spec:
  # レプリカ数: 高可用性のため 2 レプリカで起動する
  replicas: 2
  # セレクタ: Deployment が管理する Pod を識別するセレクタを設定する
  selector:
    matchLabels:
      # アプリ名ラベルでマッチングする
      app: k1s0-bff
  # Pod テンプレート: Deployment が作成する Pod の仕様を定義する
  template:
    metadata:
      # Pod ラベル: セレクタと一致するラベルを設定する
      labels:
        # アプリ名ラベル: k1s0-bff
        app: k1s0-bff
    spec:
      # セキュリティコンテキスト: Pod レベルのセキュリティ設定
      securityContext:
        # 非 root ユーザーで実行することを要求する
        runAsNonRoot: true
        # UID 65534 (nobody) で実行する
        runAsUser: 65534
      # コンテナ定義: BFF コンテナを定義する
      containers:
        # コンテナ名称: bff
        - name: bff
          # コンテナイメージ: k1s0 BFF イメージを使用する
          image: ghcr.io/k1s0/k1s0-bff:latest
          # コンテナポート: BFF がリッスンするポートを公開する
          ports:
            # HTTP ポート: 8080 で受信する
            - containerPort: 8080
              # ポート名称: http
              name: http
          # 環境変数: BFF の動作設定を環境変数で注入する
          env:
            # OIDC 発行者 URL を設定する
            - name: OIDC_ISSUER
              # ConfigMap からの値参照
              valueFrom:
                configMapKeyRef:
                  # ConfigMap 名称: k1s0-bff-config
                  name: k1s0-bff-config
                  # キー: oidc_issuer
                  key: oidc_issuer
            # Cookie セキュア設定を true にする
            - name: COOKIE_SECURE
              value: "true"
            # OIDC クライアントシークレットを Secret から取得する
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  # Secret 名称: k1s0-bff-secrets
                  name: k1s0-bff-secrets
                  # キー: client_secret
                  key: client_secret
          # リソース制限: BFF のリソース使用量を制限する
          resources:
            requests:
              # CPU 要求量: 100m
              cpu: 100m
              # メモリ要求量: 128Mi
              memory: 128Mi
            limits:
              # CPU 制限量: 500m
              cpu: 500m
              # メモリ制限量: 256Mi
              memory: 256Mi
          # ヘルスチェック設定: BFF の稼働状態を確認する
          livenessProbe:
            # HTTP GET でヘルスチェックを実行する
            httpGet:
              # ヘルスチェックエンドポイント: /health
              path: /health
              # ヘルスチェックポート: 8080
              port: 8080
            # 初期遅延: 10 秒後にヘルスチェックを開始する
            initialDelaySeconds: 10
            # ヘルスチェック間隔: 30 秒ごとに確認する
            periodSeconds: 30
---
# k1s0 BFF 認証エッジの Service 定義
# BFF Pod へのアクセスを提供する ClusterIP Service を定義する
apiVersion: v1
# リソース種別: Service
kind: Service
metadata:
  # Service 名称: k1s0-bff
  name: k1s0-bff
  # Namespace: k1s0-system に配置する
  namespace: k1s0-system
spec:
  # セレクタ: k1s0-bff アプリラベルを持つ Pod を対象とする
  selector:
    # アプリ名ラベルでターゲットを選択する
    app: k1s0-bff
  # ポート: Service が公開するポートを定義する
  ports:
    # HTTP ポート: 80 → 8080 にマッピングする
    - name: http
      # Service のポート番号
      port: 80
      # コンテナのターゲットポート番号
      targetPort: 8080
  # サービスタイプ: ClusterIP (クラスター内部からのみアクセス可能)
  type: ClusterIP
