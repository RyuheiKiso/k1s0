# k1s0 BFF 認証エッジの Cargo.toml: Rust + axum BFF ゲートウェイの依存関係を定義する
[package]
# パッケージ名: k1s0-bff
name = "k1s0-bff"
# バージョン: 0.1.0
version = "0.1.0"
# Rust エディション: 2021 を使用する
edition = "2021"

[dependencies]
# axum: 高性能 Rust Web フレームワーク (HTTP/2 対応)
axum = { version = "0.8", features = ["http2"] }
# tokio: 非同期 I/O ランタイム (全機能を有効化する)
tokio = { version = "1", features = ["full"] }
# tower: ミドルウェア、レイヤリングのための HTTP ユーティリティ
tower = "0.5"
# tower-http: HTTP 特有のミドルウェア (CORS, 圧縮等)
tower-http = { version = "0.6", features = ["cors", "trace"] }
# tower-sessions: セッション管理ライブラリ (CSRF 保護に使用する)
tower-sessions = "0.14"
# serde: データシリアライズ/デシリアライズフレームワーク
serde = { version = "1", features = ["derive"] }
# serde_json: JSON シリアライズ/デシリアライズライブラリ
serde_json = "1"
# reqwest: HTTP クライアント (Authorization ヘッダ中継に使用する)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
# jsonwebtoken: JWT 検証ライブラリ (PKCE flow の token 検証に使用する)
jsonwebtoken = "9"
# uuid: UUID 生成ライブラリ (CSRF トークン生成に使用する)
uuid = { version = "1", features = ["v4"] }
# tracing: 構造化ロギングフレームワーク
tracing = "0.1"
# tracing-subscriber: tracing のサブスクライバー実装
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# anyhow: エラーハンドリングライブラリ
anyhow = "1"
# http: HTTP プリミティブ型定義
http = "1"
# cookie: Cookie 操作ライブラリ (httpOnly cookie 設定に使用する)
cookie = "0.18"
