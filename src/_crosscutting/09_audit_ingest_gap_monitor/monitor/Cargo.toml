# k1s0 監査取り込みギャップモニターの Cargo.toml
[package]
# パッケージ名: k1s0-audit-gap-monitor
name = "k1s0-audit-gap-monitor"
# バージョン: 0.1.0
version = "0.1.0"
# Rust エディション: 2021 を使用する
edition = "2021"

[dependencies]
# tokio: 非同期 I/O ランタイム
tokio = { version = "1", features = ["full"] }
# serde: データシリアライズ/デシリアライズフレームワーク
serde = { version = "1", features = ["derive"] }
# serde_json: JSON シリアライズ/デシリアライズライブラリ
serde_json = "1"
# sha2: SHA-2 ハッシュライブラリ (hash chain 検証に使用する)
sha2 = "0.10"
# hex: 16 進数エンコード/デコードライブラリ
hex = "0.4"
# reqwest: HTTP クライアント (メトリクス送信に使用する / rustls-tls で pkg-config 不要)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# tracing: 構造化ロギングフレームワーク
tracing = "0.1"
# tracing-subscriber: tracing のサブスクライバー実装
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# anyhow: エラーハンドリングライブラリ
anyhow = "1"
# chrono: 日時ライブラリ (タイムスタンプ管理に使用する)
chrono = { version = "0.4", features = ["serde"] }
# prometheus: Prometheus メトリクス計装ライブラリ
prometheus = "0.13"
# axum: HTTP サーバー (メトリクスエンドポイントに使用する)
axum = "0.8"
