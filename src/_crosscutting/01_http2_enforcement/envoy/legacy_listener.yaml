# k1s0 レガシーリスナー設定: TLS + HTTP/1.1 のみを提供するレガシー互換リスナー
# ALPN で h2 を提供しないことで HTTP/2 へのアップグレードを意図的に禁止する
apiVersion: gateway.networking.k8s.io/v1
# リソース種別: Gateway (レガシー専用)
kind: Gateway
metadata:
  # Gateway 名称: k1s0 レガシーゲートウェイ
  name: k1s0-legacy-gateway
  # Namespace: k1s0-system に配置する
  namespace: k1s0-system
  # アノテーション: このゲートウェイが HTTP/1.1 専用であることを明示する
  annotations:
    # レガシーモードアノテーション: HTTP/1.1 のみを提供することを示す
    k1s0.io/legacy-mode: "true"
    # ALPN h2 無効化アノテーション: h2 ALPN を提供しないことを明示する
    k1s0.io/alpn-h2-disabled: "true"
spec:
  # Envoy Gateway クラスを使用してリスナーを構築する
  gatewayClassName: envoy
  # リスナー定義リスト: レガシー HTTP/1.1 用リスナーを宣言する
  listeners:
    # リスナー名称: legacy-http11 (HTTP/1.1 専用レガシーリスナー)
    - name: legacy-http11
      # プロトコル: HTTPS を使用するが HTTP/2 へのアップグレードは行わない
      protocol: HTTPS
      # ポート: レガシー専用ポート 8443 で受信する
      port: 8443
      # TLS 設定: TLS 終端モードを Terminate に設定する (ALPN h2 なし)
      tls:
        # TLS 終端モード: Gateway で TLS を終端する
        mode: Terminate
        # 証明書参照: k1s0-tls-legacy シークレットを参照する
        certificateRefs:
          # レガシー証明書シークレット名: k1s0-tls-legacy
          - name: k1s0-tls-legacy
        # TLS オプション: HTTP/2 ALPN を無効化してレガシー HTTP/1.1 に限定する
        options:
          # ALPN プロトコル制限: http/1.1 のみを提供し h2 を除外する
          gateway.envoyproxy.io/alpn-protocols: "http/1.1"
      # 許可ルート: 同一 Namespace からのルートのみ受け付ける
      allowedRoutes:
        namespaces:
          # 同一 Namespace のルートのみを許可する
          from: Same
---
# k1s0 レガシールート設定: HTTP/1.1 のみを許可するルーティングルール
# HTTP/2 機能を使用しないレガシークライアント向けのルートを定義する
apiVersion: gateway.networking.k8s.io/v1
# リソース種別: HTTPRoute (レガシー専用)
kind: HTTPRoute
metadata:
  # HTTPRoute 名称: k1s0 レガシールート
  name: k1s0-legacy-route
  # Namespace: k1s0-system に配置する
  namespace: k1s0-system
  # アノテーション: HTTP バージョンを 1.1 に制限することを明示する
  annotations:
    # HTTP バージョン制限アノテーション: HTTP/1.1 のみを許可することを示す
    k1s0.io/http-version: "1.1"
spec:
  # 親参照: k1s0-legacy-gateway に紐付けるルートとして定義する
  parentRefs:
    # 参照する Gateway 名称: k1s0-legacy-gateway
    - name: k1s0-legacy-gateway
  # ルールリスト: レガシーパスへの転送ルールを定義する
  rules:
    # マッチ条件: 全パスを対象とするルールを定義する
    - matches:
        # パスマッチ: PathPrefix 型でルートパス "/" を対象とする
        - path:
            # マッチ型: PathPrefix (前方一致)
            type: PathPrefix
            # マッチ値: 全パス "/" を対象とする
            value: /
      # バックエンド参照: legacy-server サービスへ転送する
      backendRefs:
        # レガシーバックエンドサービス名: legacy-server
        - name: legacy-server
          # バックエンドポート: 8080 で legacy-server に接続する
          port: 8080
