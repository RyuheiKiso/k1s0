# k1s0 SLO 保護レイヤ: KEDA ScaledObject によるキュー長ベース自動スケール設定
# 第 2 層保護: キュー長に応じてバックエンドを自動スケールして SLO を維持する
apiVersion: keda.sh/v1alpha1
# リソース種別: ScaledObject
kind: ScaledObject
metadata:
  # ScaledObject 名称: k1s0-tier1-autoscaler
  name: k1s0-tier1-autoscaler
  # Namespace: k1s0-system に配置する
  namespace: k1s0-system
spec:
  # スケール対象リソース: tier1-server Deployment を対象とする
  scaleTargetRef:
    # スケール対象の API バージョン
    apiVersion: apps/v1
    # スケール対象のリソース種別: Deployment
    kind: Deployment
    # スケール対象のリソース名: tier1-server
    name: tier1-server
  # 最小レプリカ数: 常に 2 レプリカ以上を維持する
  minReplicaCount: 2
  # 最大レプリカ数: 最大 50 レプリカまでスケールアウトする
  maxReplicaCount: 50
  # スケールダウン安定ウィンドウ: 急激なスケールダウンを防ぐため 300 秒の安定期間を設ける
  cooldownPeriod: 300
  # スケーリングトリガー: Kafka キュー長と Prometheus メトリクスをトリガーとする
  triggers:
    # Kafka キュー長トリガー: k1s0-events トピックのラグに基づいてスケールする
    - type: kafka
      # メタデータ: Kafka トリガーの設定
      metadata:
        # Kafka ブローカーアドレス: k1s0-system の Kafka サービスを使用する
        bootstrapServers: kafka.k1s0-system.svc.cluster.local:9092
        # 消費グループ ID: tier1-consumer-group
        consumerGroup: tier1-consumer-group
        # 監視対象トピック: k1s0-events
        topic: k1s0-events
        # ラグ閾値: コンシューマーラグが 100 を超えたらスケールアウトする
        lagThreshold: "100"
    # Prometheus メトリクストリガー: リクエストキューの長さに基づいてスケールする
    - type: prometheus
      # メタデータ: Prometheus トリガーの設定
      metadata:
        # Prometheus サーバー URL: k1s0-system の Prometheus を使用する
        serverAddress: http://prometheus.k1s0-system.svc.cluster.local:9090
        # PromQL クエリ: tier1-server のリクエストキュー長を取得する
        query: sum(k1s0_request_queue_length{service="tier1-server"})
        # スケール閾値: キュー長が 50 を超えたらスケールアウトする
        threshold: "50"
