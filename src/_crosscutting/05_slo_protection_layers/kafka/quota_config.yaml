# k1s0 SLO 保護レイヤ: Kafka クォータ ConfigMap 設定
# 第 4 層保護: Kafka クォータでブローカーへの過剰負荷を防ぎ SLO を維持する
apiVersion: v1
# リソース種別: ConfigMap
kind: ConfigMap
metadata:
  # ConfigMap 名称: kafka-quota-config
  name: kafka-quota-config
  # Namespace: k1s0-system に配置する
  namespace: k1s0-system
data:
  # quota.properties: Kafka クォータ設定ファイル
  quota.properties: |
    # クライアントクォータ設定: プロデューサーとコンシューマーのスループットを制限する

    # デフォルトプロデューサークォータ: 全クライアントのデフォルト生成レートを制限する
    # 単位: bytes/second (10 MB/s)
    quota.producer.default=10485760

    # デフォルトコンシューマークォータ: 全クライアントのデフォルト消費レートを制限する
    # 単位: bytes/second (20 MB/s)
    quota.consumer.default=20971520

  # kafka-quotas.yaml: Strimzi KafkaUser による per-user クォータ設定
  kafka-quotas.yaml: |
    # k1s0 tier1 プロデューサー: tier1 サービスのプロデューサークォータを定義する
    apiVersion: kafka.strimzi.io/v1beta2
    kind: KafkaUser
    metadata:
      name: k1s0-tier1-producer
      namespace: k1s0-system
      labels:
        strimzi.io/cluster: k1s0-kafka
    spec:
      authentication:
        type: scram-sha-512
      quotas:
        # プロデューサーバイトレート: 5 MB/s を上限とする
        producerByteRate: 5242880
        # コンシューマーバイトレート: 10 MB/s を上限とする
        consumerByteRate: 10485760
        # リクエストパーセンテージ: CPU の 50% を上限とする
        requestPercentage: 50
