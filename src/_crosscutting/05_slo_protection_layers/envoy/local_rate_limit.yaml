# k1s0 SLO 保護レイヤ: Envoy Gateway ローカルレートリミットフィルター設定
# 第 1 層保護: ローカルレートリミットで過剰リクエストを遮断する
apiVersion: gateway.envoyproxy.io/v1alpha1
# リソース種別: EnvoyFilter (Envoy フィルター設定)
kind: BackendTrafficPolicy
metadata:
  # BackendTrafficPolicy 名称: k1s0-rate-limit
  name: k1s0-rate-limit
  # Namespace: k1s0-system に配置する
  namespace: k1s0-system
spec:
  # 対象リソース: tier1-server サービスに適用する
  targetRef:
    # 対象グループ: core API グループ
    group: ""
    # 対象リソース種別: Service
    kind: Service
    # 対象リソース名: tier1-server
    name: tier1-server
  # レートリミット設定: ローカルレートリミットを定義する
  rateLimit:
    # レートリミット種別: ローカル (per-instance) レートリミット
    type: Local
    # ローカルレートリミット設定
    local:
      # リクエスト数制限: 1 秒間に 1000 リクエストを上限とする
      requests: 1000
      # 時間単位: 秒
      unit: Second
---
# k1s0 SLO 保護レイヤ: Envoy Gateway グローバルレートリミット設定
# 第 1 層保護 (グローバル): Redis バックエンドによる分散レートリミット
apiVersion: gateway.envoyproxy.io/v1alpha1
# リソース種別: RateLimitService
kind: EnvoyProxy
metadata:
  # EnvoyProxy 名称: k1s0-global-rate-limit
  name: k1s0-global-rate-limit
  # Namespace: k1s0-system に配置する
  namespace: k1s0-system
spec:
  # グローバルレートリミットサービス設定
  rateLimit:
    # バックエンド: Redis を使用した分散レートリミット
    backend:
      # バックエンド種別: Redis
      type: Redis
      # Redis 接続設定
      redis:
        # Redis サービス URL を指定する
        url: redis://redis-rate-limit.k1s0-system.svc.cluster.local:6379
  # Telemetry 設定: レートリミットのメトリクスを有効化する
  telemetry:
    # メトリクス: Prometheus 形式でメトリクスを公開する
    metrics:
      # Prometheus エンドポイントを有効化する
      prometheus: {}
