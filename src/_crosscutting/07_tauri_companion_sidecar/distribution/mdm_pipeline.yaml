# k1s0 Tauri コンパニオン Sidecar MDM 配布パイプライン設定
# Mobile Device Management (MDM) による企業端末への自動配布を定義する
apiVersion: v1
# リソース種別: ConfigMap
kind: ConfigMap
metadata:
  # ConfigMap 名称: companion-mdm-config
  name: companion-mdm-config
  # Namespace: k1s0-system に配置する
  namespace: k1s0-system
data:
  # mdm-deploy.yaml: MDM 配布設定ファイル
  mdm-deploy.yaml: |
    # MDM 配布パイプライン設定: 企業端末への Sidecar 配布を定義する
    mdm_config:
      # アプリケーション名: k1s0-companion
      app_name: k1s0-companion
      # アプリケーションバージョン: 0.1.0
      app_version: "0.1.0"
      # バンドル ID: io.k1s0.companion
      bundle_id: io.k1s0.companion
      # 配布チャネル: 企業内 MDM で配布する
      distribution_channel: enterprise_mdm

      # 対象プラットフォーム: Windows と macOS をサポートする
      platforms:
        # Windows 配布設定
        windows:
          # インストーラタイプ: MSI 形式
          installer_type: msi
          # サイレントインストールパラメータ
          silent_install_args: "/quiet /norestart"
          # インストールパス: Program Files 配下
          install_path: "C:\\Program Files\\k1s0\\companion"
        # macOS 配布設定
        macos:
          # インストーラタイプ: PKG 形式
          installer_type: pkg
          # インストールパス: Applications 配下
          install_path: "/Applications/k1s0-companion.app"

      # 署名設定: コード署名を必須とする
      signing:
        # Windows 署名: EV コード署名証明書を使用する
        windows:
          # 証明書ストア: 組織の証明書ストアを使用する
          certificate_store: enterprise
          # タイムスタンプ URL: RFC 3161 タイムスタンプサーバー
          timestamp_url: http://timestamp.digicert.com
        # macOS 署名: Apple Developer ID を使用する
        macos:
          # 署名 ID: Apple Developer ID Application
          signing_identity: "Developer ID Application: k1s0"
          # ノータリゼーション: Apple ノータリゼーションを有効化する
          notarize: true

      # 更新設定: 自動更新を定義する
      update:
        # 更新確認間隔: 24 時間ごとに更新を確認する
        check_interval_hours: 24
        # 更新サーバー URL: 企業内更新サーバー
        update_server: https://updates.k1s0.internal/companion
        # 強制更新: セキュリティアップデートは強制更新する
        force_security_updates: true

  # intune-policy.json: Microsoft Intune ポリシー設定ファイル
  intune-policy.json: |
    {
      "@odata.type": "#microsoft.graph.win32LobApp",
      "displayName": "k1s0 Companion Sidecar",
      "description": "k1s0 コンパニオン Sidecar アプリ (WebUSB/Bluetooth/Serial ブリッジ)",
      "publisher": "k1s0",
      "installCommandLine": "k1s0-companion-setup.msi /quiet",
      "uninstallCommandLine": "msiexec /x {k1s0-companion-guid} /quiet",
      "applicableArchitectures": "x64",
      "minimumSupportedWindowsRelease": "1903",
      "setupFilePath": "k1s0-companion-setup.msi",
      "installExperience": {
        "runAsAccount": "system",
        "deviceRestartBehavior": "suppress"
      }
    }
