# k1s0 Tauri コンパニオン Sidecar の Cargo.toml: Tauri IPC sidecar バイナリ依存関係を定義する
[package]
# パッケージ名: k1s0-companion-sidecar
name = "k1s0-companion-sidecar"
# バージョン: 0.1.0
version = "0.1.0"
# Rust エディション: 2021 を使用する
edition = "2021"

[dependencies]
# axum: HTTP サーバー (Tauri sidecar IPC エンドポイントに使用する)
axum = "0.8"
# tokio: 非同期 I/O ランタイム (Tauri sidecar は standalone binary)
tokio = { version = "1", features = ["full"] }
# serialport: シリアルポート通信ライブラリ (USB/Serial デバイスアクセス / libudev 除外)
serialport = { version = "4", default-features = false }
# serde: データシリアライズ/デシリアライズフレームワーク
serde = { version = "1", features = ["derive"] }
# serde_json: JSON シリアライズ/デシリアライズライブラリ
serde_json = "1"
# tracing: 構造化ロギングフレームワーク
tracing = "0.1"
# tracing-subscriber: tracing のサブスクライバー実装
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# anyhow: エラーハンドリングライブラリ
anyhow = "1"
# uuid: UUID 生成ライブラリ
uuid = { version = "1", features = ["v4"] }

[profile.release]
# リリースビルドでパニック時にアボートする
panic = "abort"
# コード生成単位を 1 にして最適化を強化する
codegen-units = 1
# リンク時最適化を有効化する
lto = true
# ストリップ: デバッグシンボルを除去してバイナリサイズを削減する
strip = true
