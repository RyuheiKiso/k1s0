# k1s0 PII 専用クラスター Namespace 定義
# PII データを扱う専用 Namespace を作成して他 Namespace からの ingress を全 deny する
apiVersion: v1
# リソース種別: Namespace
kind: Namespace
metadata:
  # Namespace 名称: k1s0-pii
  name: k1s0-pii
  # ラベル: PII 専用 Namespace を識別するラベルを設定する
  labels:
    # PII 指定ラベル: この Namespace が PII データを扱うことを示す
    k1s0.io/pii: "true"
    # データ分類ラベル: sensitive に分類する
    k1s0.io/data-classification: "sensitive"
    # Kubernetes ネットワークポリシーモードを制限に設定する
    network-policy: "restricted"
---
# k1s0 PII 専用クラスター NetworkPolicy 定義
# 他の Namespace からの ingress を全て deny するネットワークポリシー
apiVersion: networking.k8s.io/v1
# リソース種別: NetworkPolicy
kind: NetworkPolicy
metadata:
  # NetworkPolicy 名称: pii-default-deny-ingress
  name: pii-default-deny-ingress
  # Namespace: k1s0-pii に配置する
  namespace: k1s0-pii
spec:
  # ポッドセレクタ: k1s0-pii Namespace 内の全 Pod に適用する
  podSelector: {}
  # ポリシータイプ: Ingress ルールを適用する
  policyTypes:
    # Ingress トラフィックを制御する
    - Ingress
  # ingress ルール: 空のルールセットで全 Ingress を拒否する
  # (ingress フィールドを空にすることで全接続を拒否する)
  ingress: []
---
# k1s0 PII 専用クラスター NetworkPolicy: 同一 Namespace 内通信のみ許可する
# PII データベースへのアクセスを k1s0-pii Namespace 内の Pod に限定する
apiVersion: networking.k8s.io/v1
# リソース種別: NetworkPolicy
kind: NetworkPolicy
metadata:
  # NetworkPolicy 名称: pii-allow-intra-namespace
  name: pii-allow-intra-namespace
  # Namespace: k1s0-pii に配置する
  namespace: k1s0-pii
spec:
  # ポッドセレクタ: k1s0-pii Namespace 内の全 Pod に適用する
  podSelector: {}
  # ポリシータイプ: Ingress ルールを適用する
  policyTypes:
    # Ingress トラフィックを制御する
    - Ingress
  # ingress ルール: 同一 Namespace からの通信のみを許可する
  ingress:
    # 許可ルール: 同一 Namespace (k1s0-pii) からの通信のみを許可する
    - from:
        # 同一 Namespace セレクタ: k1s0-pii Namespace の Pod を許可する
        - namespaceSelector:
            matchLabels:
              # Kubernetes が自動付与する Namespace 名ラベルで識別する
              kubernetes.io/metadata.name: k1s0-pii
---
# k1s0 PII 専用クラスター NetworkPolicy: Egress 制限
# PII Namespace からの Egress を制限して意図しないデータ流出を防ぐ
apiVersion: networking.k8s.io/v1
# リソース種別: NetworkPolicy
kind: NetworkPolicy
metadata:
  # NetworkPolicy 名称: pii-restricted-egress
  name: pii-restricted-egress
  # Namespace: k1s0-pii に配置する
  namespace: k1s0-pii
spec:
  # ポッドセレクタ: k1s0-pii Namespace 内の全 Pod に適用する
  podSelector: {}
  # ポリシータイプ: Egress ルールを適用する
  policyTypes:
    # Egress トラフィックを制御する
    - Egress
  # egress ルール: DNS と同一 Namespace への Egress のみを許可する
  egress:
    # DNS への Egress を許可する (名前解決に必要)
    - ports:
        # DNS ポート 53 (UDP) を許可する
        - port: 53
          protocol: UDP
        # DNS ポート 53 (TCP) を許可する
        - port: 53
          protocol: TCP
    # 同一 Namespace への Egress を許可する
    - to:
        # 同一 Namespace セレクタ: k1s0-pii Namespace の Pod への通信を許可する
        - namespaceSelector:
            matchLabels:
              # Kubernetes が自動付与する Namespace 名ラベルで識別する
              kubernetes.io/metadata.name: k1s0-pii
