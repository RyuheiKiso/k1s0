# k1s0 PII 専用 PostgreSQL Cluster 定義 (CloudNativePG)
# PII データ専用の PostgreSQL クラスターを別 WAL チェーンで分離して定義する
apiVersion: postgresql.cnpg.io/v1
# リソース種別: Cluster (CloudNativePG)
kind: Cluster
metadata:
  # Cluster 名称: k1s0-pii-postgres
  name: k1s0-pii-postgres
  # Namespace: k1s0-pii に配置する
  namespace: k1s0-pii
  # アノテーション: PII 専用クラスターであることを明示する
  annotations:
    # PII 指定アノテーション: このクラスターが PII データ専用であることを示す
    k1s0.io/pii: "true"
    # WAL アーカイブ分離アノテーション: 別バケットに WAL をアーカイブすることを示す
    k1s0.io/wal-archive-isolation: "true"
spec:
  # レプリカ数: Primary 1 + Standby 2 の構成
  instances: 3

  # PostgreSQL 設定: PII データ用のパラメータを定義する
  postgresql:
    # PostgreSQL 設定パラメータ
    parameters:
      # pg_audit 有効化: 全クエリを監査ログに記録する
      shared_preload_libraries: "pg_audit"
      # 監査ログ設定: 全 DML 操作を記録する
      pgaudit.log: "write"
      # 接続ログ: 接続を記録する
      log_connections: "on"
      # 切断ログ: 切断を記録する
      log_disconnections: "on"
      # 行セキュリティ: デフォルトで RLS を有効化する
      row_security: "on"

  # ブートストラップ設定: PII データベースを初期化する
  bootstrap:
    # initdb 設定: PII 専用データベースを作成する
    initdb:
      # データベース名: k1s0_pii
      database: k1s0_pii
      # データベースオーナー: pii_owner
      owner: pii_owner
      # Secret 参照: pii_owner のパスワードを Secret から取得する
      secret:
        # Secret 名称: pii-owner-credentials
        name: pii-owner-credentials
      # データエンコーディング: UTF8 を使用する
      encoding: UTF8
      # ロケール: ja_JP.UTF-8 を使用する
      localeCollate: ja_JP.UTF-8

  # ストレージ設定: PII データ用の高速 SSD ストレージを使用する
  storage:
    # ストレージクラス: 暗号化 SSD ストレージクラスを使用する
    storageClass: encrypted-fast-ssd
    # ストレージサイズ: 100Gi を割り当てる
    size: 100Gi

  # WAL ストレージ設定: WAL ログ用に分離されたストレージを使用する
  walStorage:
    # WAL ストレージクラス: 暗号化 SSD ストレージクラスを使用する
    storageClass: encrypted-fast-ssd
    # WAL ストレージサイズ: 20Gi を割り当てる
    size: 20Gi

  # バックアップ設定: 別バケットへの WAL アーカイブを設定する
  backup:
    # バックアップ保持期間: 30 日間保持する
    retentionPolicy: "30d"
    # バックアップターゲット: 別 S3 バケットを使用する (PII 専用)
    barmanObjectStore:
      # オブジェクトストアの宛先: PII 専用バケット
      destinationPath: "s3://k1s0-pii-wal-archive/"
      # S3 エンドポイント: MinIO または AWS S3
      endpointURL: "https://minio.k1s0-system.svc.cluster.local:9000"
      # S3 認証情報: Secret から取得する
      s3Credentials:
        accessKeyId:
          # Secret 名称: pii-s3-credentials
          name: pii-s3-credentials
          # Secret キー: access_key_id
          key: access_key_id
        secretAccessKey:
          # Secret 名称: pii-s3-credentials
          name: pii-s3-credentials
          # Secret キー: secret_access_key
          key: secret_access_key
      # WAL アーカイブ設定: 圧縮を有効化する
      wal:
        # 圧縮: LZ4 圧縮でサイズを削減する
        compression: lz4
      # バックアップデータ圧縮: LZ4 圧縮を使用する
      data:
        compression: lz4

  # 監視設定: PII クラスターの監視を有効化する
  monitoring:
    # カスタムクエリ ConfigMap: PII 専用の監視クエリを定義する
    customQueriesConfigMap:
      # PII クエリ ConfigMap: k1s0-pii-monitoring-queries
      - name: k1s0-pii-monitoring-queries
        # キー: queries.yaml
        key: queries.yaml

  # 暗号化設定: PII データを保存時に暗号化する
  imageName: "ghcr.io/cloudnative-pg/postgresql:16"

  # アフィニティ設定: PII ノードのみにスケジュールする
  affinity:
    # ノードアフィニティ: PII 専用ノードにのみスケジュールする
    nodeAffinity:
      # 必須条件: pii=true ラベルを持つノードにのみスケジュールする
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              # k1s0.io/pii=true ラベルを持つノードに限定する
              - key: k1s0.io/pii
                operator: In
                values:
                  - "true"
