// admin.proto — k1s0 tier2 manufacturing FA 管理境界 admin API (物理分離)
// docs/03_概要設計/03_tier2設計方針/12_API設計規約 §admin package 物理分離に準拠する。
// wire_convention.yaml の admin_convention.package_suffix = ".admin.v1" 規約に従う。
// user API (operation.proto) とは別 package に分離し、混在を禁止する。

syntax = "proto3";

// パッケージ名: manufacturing.fa.admin.v1（wire_convention.yaml admin_package_pattern 準拠）
package manufacturing.fa.admin.v1;

// Java / Kotlin クライアント向けオプション
option java_multiple_files = true;
// Java パッケージ名（管理境界専用名前空間）
option java_package = "io.k1s0.tier2.manufacturing.fa.admin.v1";
// Go パッケージパス
option go_package = "github.com/k1s0/tier2/manufacturing/fa/admin/v1;faadminv1";

// FAOperationAdminService — FA 設備操作の管理者専用サービス
// wire_convention: auth_class = v1_human_session or v1_emergency_step_up
// wire_convention: audit_emit = mandatory
// wire_convention: dual_approval_required = true
service FAOperationAdminService {
  // EmergencyStop は設備の緊急停止を実行する（dual sign-off 必須操作）
  rpc EmergencyStop(EmergencyStopRequest) returns (EmergencyStopResponse);
  // OverrideQuota は quota 値を管理者が上書きする（dual sign-off 必須操作）
  rpc OverrideQuota(OverrideQuotaRequest) returns (OverrideQuotaResponse);
}

// EmergencyStopRequest は緊急停止操作のリクエストを宣言する。
message EmergencyStopRequest {
  // tenant_id: 操作対象テナント識別子（管理者が明示指定する、audit log に記録される）
  string tenant_id = 1;
  // reason: 操作理由（audit_event emit 必須、空文字列は protocol レベルで拒否する）
  string reason = 2;
}

// EmergencyStopResponse は緊急停止操作のレスポンスを宣言する。
message EmergencyStopResponse {
  // success: 緊急停止が成功したかどうか
  bool success = 1;
  // audit_id: 書込まれた audit_event の識別子（監査追跡に使用する）
  string audit_id = 2;
}

// OverrideQuotaRequest は quota 上書き操作のリクエストを宣言する。
message OverrideQuotaRequest {
  // tenant_id: 操作対象テナント識別子（管理者が明示指定する）
  string tenant_id = 1;
  // quota_class: 上書き対象の quota クラス（quota/classes.yaml の class_id と対応する）
  string quota_class = 2;
  // override_value: 上書き後の quota 値（0 以下は protocol レベルで拒否する）
  int64 override_value = 3;
  // reason: 操作理由（audit_event emit 必須）
  string reason = 4;
  // approval_token: dual sign-off トークン（lifecycle/dual_signoff_workflow.yaml が発行する）
  string approval_token = 5;
}

// OverrideQuotaResponse は quota 上書き操作のレスポンスを宣言する。
message OverrideQuotaResponse {
  // success: quota 上書きが成功したかどうか
  bool success = 1;
  // audit_id: 書込まれた audit_event の識別子（監査追跡に使用する）
  string audit_id = 2;
}
