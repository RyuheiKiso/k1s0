// admin_service.proto — k1s0 tier2 manufacturing inspection 管理境界 admin status API
// docs/03_概要設計/03_tier2設計方針/12_API設計規約 §admin package 物理分離に準拠する。
// wire_convention.yaml の admin_convention.package_suffix = ".admin.v1" 規約に従う。
// admin.proto（ドメイン管理操作）と共存し、管理境界の状態確認 API を提供する。

syntax = "proto3";

// パッケージ名: manufacturing.inspection.admin.v1（wire_convention.yaml admin_package_pattern 準拠）
package manufacturing.inspection.admin.v1;

// Java / Kotlin クライアント向けオプション
option java_multiple_files = true;
// Java パッケージ名（管理境界専用名前空間）
option java_package = "io.k1s0.tier2.manufacturing.inspection.admin.v1";
// Go パッケージパス
option go_package = "github.com/RyuheiKiso/remake/k1s0/tier2/proto/manufacturing/inspection/admin/v1;adminv1";

// InspectionAdminStatusService — 検査管理境界の状態確認サービス
// wire_convention: auth_class = v1_human_session
// wire_convention: audit_emit = mandatory
service InspectionAdminStatusService {
  // GetAdminStatus は検査管理境界の現在の稼働状態を返す
  rpc GetAdminStatus(GetAdminStatusRequest) returns (GetAdminStatusResponse);
}

// GetAdminStatusRequest は管理境界状態取得のリクエストを宣言する
message GetAdminStatusRequest {
  // tenant_id: 操作対象テナント識別子（管理者が明示指定する、audit log に記録される）
  string tenant_id = 1;
}

// GetAdminStatusResponse は管理境界状態取得のレスポンスを宣言する
message GetAdminStatusResponse {
  // status: 管理境界の稼働状態（"ok" / "degraded" / "unavailable" 等）
  string status = 1;
}
