// admin.proto — k1s0 tier2 manufacturing inspection 管理境界 admin API (物理分離)
// docs/03_概要設計/03_tier2設計方針/12_API設計規約 §admin package 物理分離に準拠する。
// wire_convention.yaml の admin_convention.package_suffix = ".admin.v1" 規約に従う。
// user API (result.proto) とは別 package に分離し、混在を禁止する。

syntax = "proto3";

// パッケージ名: manufacturing.inspection.admin.v1（wire_convention.yaml admin_package_pattern 準拠）
package manufacturing.inspection.admin.v1;

// Java / Kotlin クライアント向けオプション
option java_multiple_files = true;
// Java パッケージ名（管理境界専用名前空間）
option java_package = "io.k1s0.tier2.manufacturing.inspection.admin.v1";
// Go パッケージパス
option go_package = "github.com/k1s0/tier2/manufacturing/inspection/admin/v1;inspectionadminv1";

// InspectionResultAdminService — 検査結果の管理者専用サービス
// wire_convention: auth_class = v1_human_session or v1_emergency_step_up
// wire_convention: audit_emit = mandatory
// wire_convention: dual_approval_required = true
service InspectionResultAdminService {
  // VoidResult は検査結果を管理者権限で無効化する（dual sign-off 必須操作）
  rpc VoidResult(VoidResultRequest) returns (VoidResultResponse);
  // OverrideVerdict は合否判定を管理者が上書きする（dual sign-off 必須操作）
  rpc OverrideVerdict(OverrideVerdictRequest) returns (OverrideVerdictResponse);
}

// VoidResultRequest は検査結果無効化のリクエストを宣言する。
message VoidResultRequest {
  // tenant_id: 操作対象テナント識別子（管理者が明示指定する、audit log に記録される）
  string tenant_id = 1;
  // result_id: 無効化対象の検査結果識別子（UUID v7）
  string result_id = 2;
  // reason: 無効化理由（audit_event emit 必須、空文字列は protocol レベルで拒否する）
  string reason = 3;
  // approval_token: dual sign-off トークン（lifecycle/dual_signoff_workflow.yaml が発行する）
  string approval_token = 4;
}

// VoidResultResponse は検査結果無効化のレスポンスを宣言する。
message VoidResultResponse {
  // success: 無効化が成功したかどうか
  bool success = 1;
  // audit_id: 書込まれた audit_event の識別子（監査追跡に使用する）
  string audit_id = 2;
}

// OverrideVerdictRequest は合否判定上書きのリクエストを宣言する。
message OverrideVerdictRequest {
  // tenant_id: 操作対象テナント識別子（管理者が明示指定する）
  string tenant_id = 1;
  // result_id: 上書き対象の検査結果識別子（UUID v7）
  string result_id = 2;
  // new_verdict: 上書き後の合否判定（result.proto InspectionVerdict と対応する）
  // 0=UNSPECIFIED, 1=PASS, 2=FAIL, 3=REQUIRES_REVIEW
  int32 new_verdict = 3;
  // reason: 上書き理由（audit_event emit 必須）
  string reason = 4;
  // approval_token: dual sign-off トークン（lifecycle/dual_signoff_workflow.yaml が発行する）
  string approval_token = 5;
}

// OverrideVerdictResponse は合否判定上書きのレスポンスを宣言する。
message OverrideVerdictResponse {
  // success: 上書きが成功したかどうか
  bool success = 1;
  // audit_id: 書込まれた audit_event の識別子（監査追跡に使用する）
  string audit_id = 2;
}
