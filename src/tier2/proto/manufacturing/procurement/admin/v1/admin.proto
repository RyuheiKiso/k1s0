// admin.proto — k1s0 tier2 manufacturing procurement 管理境界 admin API (物理分離)
// docs/03_概要設計/03_tier2設計方針/12_API設計規約 §admin package 物理分離に準拠する。
// wire_convention.yaml の admin_convention.package_suffix = ".admin.v1" 規約に従う。
// user API (order.proto) とは別 package に分離し、混在を禁止する。

syntax = "proto3";

// パッケージ名: manufacturing.procurement.admin.v1（wire_convention.yaml admin_package_pattern 準拠）
package manufacturing.procurement.admin.v1;

// Java / Kotlin クライアント向けオプション
option java_multiple_files = true;
// Java パッケージ名（管理境界専用名前空間）
option java_package = "io.k1s0.tier2.manufacturing.procurement.admin.v1";
// Go パッケージパス
option go_package = "github.com/k1s0/tier2/manufacturing/procurement/admin/v1;procurementadminv1";

// ProcurementOrderAdminService — 調達注文の管理者専用サービス
// wire_convention: auth_class = v1_human_session or v1_emergency_step_up
// wire_convention: audit_emit = mandatory
// wire_convention: dual_approval_required = true
service ProcurementOrderAdminService {
  // CancelOrder は調達注文を管理者権限で強制キャンセルする（dual sign-off 必須操作）
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  // OverrideOrderQuota は注文 quota を管理者が上書きする（dual sign-off 必須操作）
  rpc OverrideOrderQuota(OverrideOrderQuotaRequest) returns (OverrideOrderQuotaResponse);
}

// CancelOrderRequest は注文強制キャンセルのリクエストを宣言する。
message CancelOrderRequest {
  // tenant_id: 操作対象テナント識別子（管理者が明示指定する、audit log に記録される）
  string tenant_id = 1;
  // order_id: キャンセル対象の注文識別子（UUID v7）
  string order_id = 2;
  // reason: キャンセル理由（audit_event emit 必須、空文字列は protocol レベルで拒否する）
  string reason = 3;
  // approval_token: dual sign-off トークン（lifecycle/dual_signoff_workflow.yaml が発行する）
  string approval_token = 4;
}

// CancelOrderResponse は注文強制キャンセルのレスポンスを宣言する。
message CancelOrderResponse {
  // success: キャンセルが成功したかどうか
  bool success = 1;
  // audit_id: 書込まれた audit_event の識別子（監査追跡に使用する）
  string audit_id = 2;
}

// OverrideOrderQuotaRequest は注文 quota 上書きのリクエストを宣言する。
message OverrideOrderQuotaRequest {
  // tenant_id: 操作対象テナント識別子（管理者が明示指定する）
  string tenant_id = 1;
  // quota_class: 上書き対象の quota クラス（quota/classes.yaml の class_id と対応する）
  string quota_class = 2;
  // override_value: 上書き後の quota 値（0 以下は protocol レベルで拒否する）
  int64 override_value = 3;
  // reason: 操作理由（audit_event emit 必須）
  string reason = 4;
  // approval_token: dual sign-off トークン（lifecycle/dual_signoff_workflow.yaml が発行する）
  string approval_token = 5;
}

// OverrideOrderQuotaResponse は注文 quota 上書きのレスポンスを宣言する。
message OverrideOrderQuotaResponse {
  // success: quota 上書きが成功したかどうか
  bool success = 1;
  // audit_id: 書込まれた audit_event の識別子（監査追跡に使用する）
  string audit_id = 2;
}
