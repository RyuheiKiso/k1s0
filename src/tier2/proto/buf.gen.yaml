# buf.gen.yaml — tier2 proto codegen 設定
# buf generate がこのファイルを読んで 4 言語のコードを生成する
# docs/03_概要設計/03_tier2設計方針/README.md §言語スタック（Rust/C#/Go/TypeScript 4 言語等価強度）に準拠する

# Buf の設定ファイルバージョン
version: v1
# 生成プラグインのリスト（4 言語分を定義する）
plugins:
  # ---- Go 言語向け protobuf 生成プラグイン ----
  # Go 言語向け protoc-gen-go プラグイン（Message / Enum の Go 型を生成する）
  - plugin: go
    # 生成先ディレクトリ: Go コードを gen/go に出力する
    out: gen/go
    # 生成オプション
    opt:
      # ソースファイル相対のパスで出力する（Go module path ではなく proto ファイルの相対位置を使う）
      - paths=source_relative
  # Go 言語向け gRPC サービス生成プラグイン（Service の Go クライアント / サーバを生成する）
  - plugin: go-grpc
    # 生成先ディレクトリ: gRPC コードを gen/go に出力する
    out: gen/go
    # 生成オプション
    opt:
      # ソースファイル相対のパスで出力する
      - paths=source_relative

  # ---- TypeScript 言語向け protobuf 生成プラグイン ----
  # TypeScript 言語向け protoc-gen-es プラグイン（Buf Connect 互換の TS 型を生成する）
  - plugin: es
    # 生成先ディレクトリ: TypeScript コードを gen/typescript に出力する
    out: gen/typescript
    # 生成オプション
    opt:
      # TypeScript 型を生成する（js ではなく ts ファイルを出力する）
      - target=ts
  # TypeScript 言語向け Connect-ES プラグイン（Buf Connect クライアントを生成する）
  - plugin: connect-es
    # 生成先ディレクトリ: Connect クライアントを gen/typescript に出力する
    out: gen/typescript
    # 生成オプション
    opt:
      # TypeScript 型を生成する
      - target=ts

  # ---- Rust 言語向け protobuf 生成プラグイン ----
  # Rust 言語向け prost プラグイン（prost を使った Rust 型を生成する）
  - plugin: buf.build/community/neoeinstein-prost
    # 生成先ディレクトリ: Rust コードを gen/rust に出力する
    out: gen/rust
    # 生成オプション
    opt:
      # Google Well-Known Types を pbjson_types として extern 参照する
      - extern_path=.google.protobuf=::pbjson_types

  # ---- C# 言語向け protobuf 生成プラグイン ----
  # C# 言語向け protoc-gen-csharp プラグイン（.NET 8+ 向け C# クラスを生成する）
  - plugin: buf.build/protocolbuffers/csharp
    # 生成先ディレクトリ: C# コードを gen/csharp に出力する
    out: gen/csharp
