# heartbeat.yaml — audit ingest gap monitor 設定
# tier2 業務エラー監査 08: ingest gap 検出経路 (90秒ロスでアラート)
# docs/04_詳細設計/03_クロスカッティング適合仕様/09_audit_ingest_gap_monitor.md に同期
# 至高路線: interval=30s（高頻度検出）+ threshold=90s（高速 gap 検出）
monitor_id: audit_ingest_gap
version: "1.0.0"

heartbeat:
  # emit 間隔: 30 秒（至高路線、60s より 2 倍高頻度で gap を早期検出）
  interval_seconds: 30
  # gap 判定閾値: 90 秒（30s × 2 周期 + 30s 余裕、docs §AGM-B と整合）
  expected_max_gap_seconds: 90
  # 監査 signal class: 03_観測適合仕様 audit signal
  signal_class: audit

  # heartbeat に含む必須フィールド（docs §AGM-A より）
  heartbeat_fields:
    # ingest source 識別子（下記 sources の各 source_id と対応）
    - source_id
    # heartbeat の emit タイムスタンプ（HLC ベース、wall-clock TTL 禁止規律準拠）
    - emitted_at
    # chain の連続性検査用シーケンス番号
    - sequence_number
    # pod / process インスタンス識別子（同一 source_id の複数 instance 区別）
    - source_instance_id

  # 監視対象 ingest source 一覧（docs §AGM-A source_id 列挙と完全一致）
  sources:
    # tier1 Library 内から emit される audit event
    - tier1_library_emit
    # tier2 Service 内から emit される audit event
    - tier2_application_emit
    # PostgreSQL pgaudit extension によるデータベース操作ログ
    - postgresql_pgaudit
    # k8s apiserver audit policy によるクラスタ操作ログ
    - kube_apiserver_audit
    # Vector → ClickHouse 転送パイプライン
    - vector_pipeline
    # OpenBao audit device によるシークレット操作ログ
    - openbao_audit
    # Keycloak event listener SPI による認証イベント
    - keycloak_event_listener
    # cosign / Rekor transparency log によるアーティファクト署名ログ
    - cosign_rekor_log

  # AGM-C: kube-apiserver audit backend 二重化設定への参照
  # kube-apiserver は --audit-log-path（on-host PVC rotated file）+
  # --audit-webhook-config-file（Vector disk-backed persistent buffer 宛 webhook）を並列構成
  # drop 復旧経路: (a) Vector persistent buffer 自動 drain (b) rotated file log からの再投入（日次 CI batch）
  # 詳細: docs/04_詳細設計/03_クロスカッティング適合仕様/09_audit_ingest_gap_monitor.md §AGM-C
  agm_c_reference:
    # 二重出力方式（file + webhook 並列）
    audit_backend: "file_and_webhook"
    # webhook 先のバッファ種別（disk-backed で drop 期間を吸収）
    webhook_sink: "vector_disk_backed_buffer"

alert:
  # アラート重大度: 即時 page（gap 検出で SLO 違反相当）
  severity: page_immediate
  # アラートルーティング先
  routing: ops-on-call
  # アラートメッセージテンプレート
  message: "Audit ingest gap detected: >{expected_max_gap_seconds}s since last event"

prometheus_rule:
  # アラート名
  alert_name: AuditIngestGap
  # 90 秒超過で alert（30s interval × 2 周期 + 30s 余裕）
  expr: "time() - audit_ingest_last_event_ts > 90"
  # 1 分間持続した場合に alert 発火（瞬断を除外）
  for: 1m
  labels:
    # 重大度ラベル
    severity: critical
  annotations:
    # アラートサマリ（SRE が即座に状況を把握できる表現）
    summary: "Audit event ingest gap > 90sec (30s interval × 3 周期超過)"
