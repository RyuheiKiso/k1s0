# tier2 Go golangci-lint 設定: depguard で依存方向を強制する
# tier2 から tier1 直接 import 禁止を depguard で enforce する

# linter 設定
linters:
  enable:
    # depguard: import path の許可リスト制御
    - depguard
    # govet: Go vet による静的解析
    - govet
    # staticcheck: 高度な静的解析
    - staticcheck

# linter 詳細設定
linters-settings:
  # depguard: 禁止 import path の設定
  depguard:
    rules:
      # tier1 直接 import 禁止ルール
      deny-tier1-direct:
        files:
          # tier2 配下のすべての Go ファイルを対象とする
          - "$all"
        deny:
          - pkg: "github.com/k1s0/tier1/library"
            desc: "tier2 から tier1 library への直接 import 禁止 (facade 経由必須)"
          - pkg: "github.com/k1s0/tier1/server"
            desc: "tier2 から tier1 server への直接 import 禁止"
