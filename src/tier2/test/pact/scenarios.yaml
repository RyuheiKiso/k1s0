# scenarios.yaml — tier2 Pact contract test シナリオカタログ
# docs 参照: docs/03_概要設計/03_tier2設計方針/README.md §Pact contract test
# docs 参照: docs/04_詳細設計/02_強制機構/02_tier2強制機構.md §Pact CI 強制
# 9 業務シナリオ × 4 言語（rust / csharp / go / typescript）の coverage 宣言
version: "1.0.0"
# Pact ブローカーの参照先 URL（CI でアップロード先として使用する）
pact_broker_url: "https://pact-broker.k1s0.internal"
scenarios:
  # S1: 発注ライフサイクル（発注→承認→受領）
  - id: s1_purchase_order_lifecycle
    # シナリオの説明
    description: "発注ライフサイクル（発注→承認→受領）の全 aggregate event を検証する"
    # 対応する Avro スキーマ
    avro_schema_refs:
      # 発注イベントスキーマ
      - src/tier2/schemas/avro/manufacturing/procurement/purchase_order.placed.v1.avsc
      # 承認イベントスキーマ
      - src/tier2/schemas/avro/manufacturing/procurement/purchase_order.approved.v1.avsc
    # 対応する extension_point
    extension_point_refs:
      # domain_event_envelope の拡張点と binding する
      - domain_event_envelope
    # 4 言語 consumer の coverage 宣言
    consumer_languages:
      # Rust consumer: 発注 aggregate を Rust で消費する契約
      - lang: rust
        # Pact fixture ファイルパス
        fixture_ref: src/tier2/test/pact/rust/s1_purchase_order_lifecycle.pact.json
        # consumer 名（Pact ブローカーに登録される）
        consumer_name: "k1s0-tier2-rust-procurement-consumer"
      # C# consumer: .NET アプリから発注イベントを消費する契約
      - lang: csharp
        fixture_ref: src/tier2/test/pact/csharp/s1_purchase_order_lifecycle.pact.json
        consumer_name: "k1s0-tier2-csharp-procurement-consumer"
      # Go consumer: Go サービスから発注イベントを消費する契約
      - lang: go
        fixture_ref: src/tier2/test/pact/go/s1_purchase_order_lifecycle.pact.json
        consumer_name: "k1s0-tier2-go-procurement-consumer"
      # TypeScript consumer: フロントエンドから発注イベントを消費する契約
      - lang: typescript
        fixture_ref: src/tier2/test/pact/typescript/s1_purchase_order_lifecycle.pact.json
        consumer_name: "k1s0-tier2-typescript-procurement-consumer"

