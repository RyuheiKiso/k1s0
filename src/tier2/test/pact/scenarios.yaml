    # 対応する Avro スキーマ
    avro_schema_refs:
      - src/tier2/schemas/avro/manufacturing/quality/inspection_result.recorded.v1.avsc
    # 対応する extension_point
    extension_point_refs:
      - domain_event_envelope
    # 4 言語 consumer の coverage 宣言
    consumer_languages:
      - lang: rust
        fixture_ref: src/tier2/test/pact/rust/s2_inspection_result_recording.pact.json
        consumer_name: "k1s0-tier2-rust-quality-consumer"
      - lang: csharp
