# annual_audit_attestation.yaml — tier2 Scheduler: 年次監査チェーン証明 CronWorkflow
# 毎年 1 月 1 日 03:00 UTC に監査チェーンルートハッシュを計算し TSA + Rekor に提出する
# spec: docs/04_詳細設計/01_適合仕様/10_テナント分離適合仕様.md §audit-attestation
apiVersion: argoproj.io/v1alpha1
# CronWorkflow: スケジュール実行ワークフロー種別
kind: CronWorkflow
metadata:
  # CronWorkflow のリソース名（tier2 プレフィックスで識別する）
  name: tier2-annual-audit-chain-attestation
  # 実行対象 Namespace（tier2 システム Namespace に配置する）
  namespace: k1s0-tier2
  # ワークフローラベル（種別と対象軸を識別するために付与する）
  labels:
    # ワークフロー種別ラベル
    workflow.type: annual-audit-attestation
    # 対象軸ラベル
    app.kubernetes.io/component: tier2
spec:
  # 実行スケジュール: 毎年 1 月 1 日 03:00 UTC に実行する
  schedule: "0 3 1 1 *"
  # タイムゾーン（UTC 固定 / wall clock TTL 禁止規約に従い UTC を使用する）
  timezone: "UTC"
  # 前の実行が完了していない場合にスキップする（年次 attestation は重複実行禁止）
  concurrencyPolicy: Forbid
  # 成功ワークフローの保持件数（監査証跡として 5 年分保持する）
  successfulJobsHistoryLimit: 5
  # 失敗ワークフローの保持件数（障害解析のために 3 件保持する）
  failedJobsHistoryLimit: 3
  # ワークフローテンプレート定義
  workflowSpec:
    # ワークフローのエントリポイント（年次監査チェーン証明ステップ群）
    entrypoint: annual-audit-attestation-steps
    # ワークフロー全体のタイムアウト（6 時間 / 年次バッチウィンドウ内に完了させる）
    activeDeadlineSeconds: 21600
    templates:
      # 年次監査チェーン証明の順次ステップ定義
      - name: annual-audit-attestation-steps
        # 順次実行ステップリスト（各ステップは前のステップ完了後に実行する）
        steps:
          # ステップ 1: ClickHouse から監査チェーンルートハッシュを計算する
          - - name: compute-audit-chain-root-hash
              # ルートハッシュ計算テンプレートを参照する
              template: compute-audit-chain-root-hash-tpl
          # ステップ 2: RFC 3161 TSA (Time Stamping Authority) にタイムスタンプを提出する
          - - name: submit-to-rfc3161-tsa
              # TSA 提出テンプレートを参照する
              template: submit-to-rfc3161-tsa-tpl
              # ステップ 1 の出力（ルートハッシュ）を引数として渡す
              arguments:
                parameters:
                  # ルートハッシュパラメータ: ステップ 1 の出力から取得する
                  - name: root-hash
                    value: "{{steps.compute-audit-chain-root-hash.outputs.parameters.root-hash}}"
          # ステップ 3: Sigstore Rekor 透明性ログに証明エントリを提出する
          - - name: submit-to-sigstore-rekor
              # Rekor 提出テンプレートを参照する
              template: submit-to-sigstore-rekor-tpl
              # ステップ 1 の出力（ルートハッシュ）と ステップ 2 の TSA トークンを渡す
              arguments:
                parameters:
                  # ルートハッシュパラメータ
                  - name: root-hash
                    value: "{{steps.compute-audit-chain-root-hash.outputs.parameters.root-hash}}"
                  # TSA タイムスタンプトークンパラメータ: ステップ 2 の出力から取得する
                  - name: tsa-token
                    value: "{{steps.submit-to-rfc3161-tsa.outputs.parameters.tsa-token}}"

      # ステップ 1 テンプレート: ClickHouse から監査チェーンルートハッシュを計算する
      - name: compute-audit-chain-root-hash-tpl
        # 出力パラメータ定義（ルートハッシュを後続ステップに渡す）
        outputs:
          parameters:
            # ルートハッシュを /tmp/root-hash.txt から読み取って出力する
            - name: root-hash
              valueFrom:
                # コンテナ内のファイルから値を取得する
                path: /tmp/root-hash.txt
        container:
          # TSA 証明ワーカーコンテナイメージ（Harbor 内部レジストリを使用する）
          image: harbor.k1s0.internal/k1s0/tsa-attestation-worker:latest
          # ルートハッシュ計算コマンドを実行する
          command: ["/app/tsa-attestation-worker", "compute-root-hash"]
          # ClickHouse 接続先 URL を環境変数で渡す
          env:
            # ClickHouse エンドポイント URL
            - name: CLICKHOUSE_ENDPOINT
              # Kubernetes Secret から ClickHouse 接続文字列を取得する
              valueFrom:
                secretKeyRef:
                  # tier2 ClickHouse 接続情報 Secret 名
                  name: k1s0-tier2-clickhouse-credentials
                  # ClickHouse 接続 URL キー名
                  key: endpoint
            # 監査テーブル名（年次全量を対象にする）
            - name: AUDIT_TABLE
              # 監査ログが格納されている ClickHouse テーブル名を指定する
              value: "tier2_audit.audit_log"
          # リソース制限（ClickHouse 全量集計は CPU を多く使用する）
          resources:
            requests:
              # CPU 要求値（集計処理のため余裕を持たせる）
              cpu: "500m"
              # メモリ要求値
              memory: "512Mi"
            limits:
              # CPU 上限
              cpu: "2"
              # メモリ上限（集計結果のバッファに十分な量を確保する）
              memory: "2Gi"

      # ステップ 2 テンプレート: RFC 3161 TSA にタイムスタンプトークンを発行してもらう
      - name: submit-to-rfc3161-tsa-tpl
        # 入力パラメータ定義（ルートハッシュをステップ 1 から受け取る）
        inputs:
          parameters:
            # ルートハッシュパラメータ
            - name: root-hash
        # 出力パラメータ定義（TSA タイムスタンプトークンを後続ステップに渡す）
        outputs:
          parameters:
            # TSA トークンを /tmp/tsa-token.b64 から読み取って出力する
            - name: tsa-token
              valueFrom:
                # コンテナ内のファイルから値を取得する
                path: /tmp/tsa-token.b64
        container:
          # TSA 証明ワーカーコンテナイメージ
          image: harbor.k1s0.internal/k1s0/tsa-attestation-worker:latest
          # RFC 3161 TSA 提出コマンドを実行する
          command: ["/app/tsa-attestation-worker", "submit-tsa"]
          # ルートハッシュと TSA エンドポイントを環境変数で渡す
          env:
            # ルートハッシュ: ステップ 1 の出力から取得する
            - name: ROOT_HASH
              value: "{{inputs.parameters.root-hash}}"
            # RFC 3161 TSA サービス URL（内部 TSA サービスを使用する）
            - name: TSA_ENDPOINT
              # Kubernetes Secret から TSA エンドポイントを取得する
              valueFrom:
                secretKeyRef:
                  # TSA 接続情報 Secret 名
                  name: k1s0-tier2-tsa-credentials
                  # TSA エンドポイント URL キー名
                  key: endpoint
          # リソース制限（TSA 通信は軽量な処理である）
          resources:
            requests:
              # CPU 要求値
              cpu: "200m"
              # メモリ要求値
              memory: "256Mi"
            limits:
              # CPU 上限
              cpu: "500m"
              # メモリ上限
              memory: "512Mi"

      # ステップ 3 テンプレート: Sigstore Rekor 透明性ログに証明エントリを提出する
      - name: submit-to-sigstore-rekor-tpl
        # 入力パラメータ定義（ルートハッシュと TSA トークンをそれぞれ受け取る）
        inputs:
          parameters:
            # ルートハッシュパラメータ
            - name: root-hash
            # TSA タイムスタンプトークンパラメータ
            - name: tsa-token
        container:
          # TSA 証明ワーカーコンテナイメージ
          image: harbor.k1s0.internal/k1s0/tsa-attestation-worker:latest
          # Sigstore Rekor 提出コマンドを実行する
          command: ["/app/tsa-attestation-worker", "submit-rekor"]
          # ルートハッシュ・TSA トークン・Rekor エンドポイントを環境変数で渡す
          env:
            # ルートハッシュ
            - name: ROOT_HASH
              value: "{{inputs.parameters.root-hash}}"
            # TSA タイムスタンプトークン（Rekor への証拠として添付する）
            - name: TSA_TOKEN
              value: "{{inputs.parameters.tsa-token}}"
            # Sigstore Rekor エンドポイント URL（パブリック Rekor または自社インスタンス）
            - name: REKOR_ENDPOINT
              # Kubernetes ConfigMap から Rekor エンドポイントを取得する
              valueFrom:
                configMapKeyRef:
                  # Rekor 設定 ConfigMap 名
                  name: k1s0-tier2-rekor-config
                  # Rekor サーバ URL キー名
                  key: server-url
          # リソース制限（Rekor 提出は軽量な HTTP リクエストである）
          resources:
            requests:
              # CPU 要求値
              cpu: "200m"
              # メモリ要求値
              memory: "256Mi"
            limits:
              # CPU 上限
              cpu: "500m"
              # メモリ上限
              memory: "512Mi"
