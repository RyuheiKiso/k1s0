# tier2 Scheduler: Argo CronWorkflow バッチ定義（設計方針 25）
# 毎日 02:00 UTC にデータリテンションクリーンアップを実行する
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  # CronWorkflow のリソース名
  name: tier2-data-retention-cleanup
  # 実行対象 Namespace
  namespace: k1s0-tier2
  # ワークフローラベル
  labels:
    # ワークフロー種別ラベル
    workflow.type: data-retention
    # 対象軸ラベル
    app.kubernetes.io/component: tier2
spec:
  # 実行スケジュール（毎日 02:00 UTC）
  schedule: "0 2 * * *"
  # タイムゾーン（UTC 固定 / wall clock TTL 禁止規約に従い UTC を使用する）
  timezone: "UTC"
  # 前の実行が完了していない場合にスキップする
  concurrencyPolicy: Forbid
  # 成功ワークフローの保持件数
  successfulJobsHistoryLimit: 3
  # 失敗ワークフローの保持件数
  failedJobsHistoryLimit: 5
  # ワークフローテンプレート定義
  workflowSpec:
    # ワークフローのエントリポイント
    entrypoint: data-retention-steps
    # ワークフロー全体のタイムアウト（4 時間 / 深夜バッチウィンドウ以内）
    activeDeadlineSeconds: 14400
    templates:
      # データリテンション実行ステップ定義
      - name: data-retention-steps
        # 順次実行ステップリスト
        steps:
          # ステップ 1: 期限切れテナントデータの識別
          - - name: identify-expired-records
              template: identify-expired-records-tpl
          # ステップ 2: PII データの匿名化（削除前に実施する）
          - - name: anonymize-pii
              template: anonymize-pii-tpl
          # ステップ 3: 期限切れレコードの物理削除
          - - name: delete-expired-records
              template: delete-expired-records-tpl

      # 期限切れレコード識別テンプレート
      - name: identify-expired-records-tpl
        container:
          # データリテンションワーカーコンテナイメージ
          image: harbor.k1s0.internal/k1s0/data-retention-worker:latest
          # 識別コマンド（HLC ベースで有効期限を判定する）
          command: ["/app/retention-worker", "identify"]
          # リソース制限（バッチジョブは CPU / メモリを制限する）
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      # PII 匿名化テンプレート
      - name: anonymize-pii-tpl
        container:
          # データリテンションワーカーコンテナイメージ
          image: harbor.k1s0.internal/k1s0/data-retention-worker:latest
          # 匿名化コマンド（field_pii annotation 付きフィールドを対象とする）
          command: ["/app/retention-worker", "anonymize-pii"]
          # リソース制限
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      # 期限切れレコード削除テンプレート
      - name: delete-expired-records-tpl
        container:
          # データリテンションワーカーコンテナイメージ
          image: harbor.k1s0.internal/k1s0/data-retention-worker:latest
          # 削除コマンド（匿名化済みレコードのみ削除する）
          command: ["/app/retention-worker", "delete-expired"]
          # リソース制限
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
