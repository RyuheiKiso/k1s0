# tier2 Scheduler: KEDA ScaledObject（設計方針 25）
# Kafka コンシューマーラグに基づいて tier2 コンシューマーを自動スケールする
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  # ScaledObject のリソース名
  name: tier2-consumer-scaledobject
  # 対象 Namespace
  namespace: k1s0-tier2
  # ScaledObject のラベル
  labels:
    # スケーリング対象コンポーネントラベル
    app.kubernetes.io/component: tier2-consumer
spec:
  # スケーリング対象の Deployment 参照
  scaleTargetRef:
    # スケーリング対象 Deployment 名
    name: tier2-event-consumer
  # スケールアウト時の評価ポーリング間隔（秒）
  pollingInterval: 15
  # スケールインまでの安定化ウィンドウ（秒）
  cooldownPeriod: 60
  # 最小レプリカ数（0 に設定するとゼロスケール有効になる）
  minReplicaCount: 1
  # 最大レプリカ数（テナント数に応じて調整する）
  maxReplicaCount: 20
  # スケーリングトリガー定義
  triggers:
    # Kafka コンシューマーラグトリガー
    - type: kafka
      metadata:
        # Kafka ブートストラップサーバーアドレス
        bootstrapServers: kafka.k1s0-infra.svc.cluster.local:9092
        # コンシューマーグループ ID（tier2 イベントコンシューマー）
        consumerGroup: tier2-event-consumer-group
        # 監視対象トピック名（tier2 ドメインイベントトピック）
        topic: k1s0.tier2.domain_events
        # 1 レプリカあたりの目標ラグ数（この値を超えるとスケールアウトする）
        lagThreshold: "100"
        # オフセットリセットポリシー（earliest: 未コミットのメッセージから処理する）
        offsetResetPolicy: earliest
