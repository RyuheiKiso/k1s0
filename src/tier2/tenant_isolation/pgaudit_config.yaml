# k1s0 tier2 pgaudit 設定
# pii_segregated クラスのテーブルへの全アクセスを DB 層で記録する（P4 対応）
# CloudNativePG cluster.yaml の additionalConfig / postInitSQL に反映する

pgaudit_config:
  # pgaudit の有効化: pii_segregated テーブルへの全 DML を記録する
  enabled: true
  # pgaudit.log: DDL + READ + WRITE + ROLE の全カテゴリを記録する
  log_level: "notice"
  # 記録する操作カテゴリ（pii_segregated では READ も記録する）
  log_catalog:
    # DDL 操作を記録する（スキーマ変更の追跡）
    - ddl
    # SELECT を含む READ 操作を記録する（P4: 全アクセスの記録）
    - read
    # INSERT / UPDATE / DELETE を含む WRITE 操作を記録する
    - write
    # GRANT / REVOKE 等の権限操作を記録する
    - role
  # pgaudit.log_parameter: クエリパラメータも記録する（PII 値はマスクする）
  log_parameter: false
  # pgaudit.log_statement_once: ステートメント本文を 1 回のみ記録する（重複排除）
  log_statement_once: true

# kind cluster 適用手順:
# 1. CloudNativePG cluster.yaml の additionalConfig に以下を追加する:
#    shared_preload_libraries: "pgaudit"
#    pgaudit.log: "ddl,read,write,role"
#    pgaudit.log_parameter: "off"
#    pgaudit.log_statement_once: "on"
# 2. cluster を再起動する
# 3. pii_segregated テーブルに pgaudit.log_relation を設定する:
#    SECURITY LABEL FOR pgaudit ON TABLE k1s0.audit_event IS 'OBJECT';

# 検証クエリ（kind cluster 適用後に実行する）
# SELECT * FROM pg_stat_activity WHERE query LIKE '%k1s0.audit_event%';
# PostgreSQL ログで pgaudit AUDIT: の行が出力されることを確認する
