# restore_drill_workflow.yaml — RTO/RPO restore drill workflow
# 18_信頼性運用準備: drill_cadence_days = 90
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: tier2-restore-drill
spec:
  entrypoint: restore-drill
  arguments:
    parameters:
      - name: target-env
        value: staging
  templates:
    - name: restore-drill
      steps:
        - - name: snapshot-source
            template: create-snapshot
        - - name: restore-to-staging
            template: restore-snapshot
        - - name: verify-integrity
            template: verify
        - - name: measure-rto
            template: record-metrics

    - name: create-snapshot
      container:
        image: bitnami/postgresql:16
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Barman で PostgreSQL スナップショットを作成する
            barman-cloud-backup \
              --cloud-provider aws-s3 \
              --bucket-name k1s0-backup-${TARGET_ENV} \
              tier2-pg drill-$(date +%Y%m%d%H%M%S)
        env:
          - name: TARGET_ENV
            value: "{{inputs.parameters.target-env}}"

    - name: restore-snapshot
      container:
        image: bitnami/postgresql:16
        command: ["/bin/sh", "-c"]
        args:
          - |
            # 最新スナップショットを staging 環境に復元する
            barman-cloud-restore \
              --cloud-provider aws-s3 \
              --bucket-name k1s0-backup-${TARGET_ENV} \
              tier2-pg latest /var/lib/postgresql/data
        env:
          - name: TARGET_ENV
            value: "{{inputs.parameters.target-env}}"

    - name: verify
      container:
        image: bitnami/postgresql:16
        command: ["/bin/sh", "-c"]
        args:
          - |
            # 復元後の整合性を検証する: pg_catalog と audit hash chain を確認する
            psql -h postgres-staging -U tier2 -c "SELECT COUNT(*) FROM domain_event"
            psql -h postgres-staging -U tier2 -c "SELECT COUNT(*) FROM audit_event"

    - name: record-metrics
      container:
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            # RTO 計測結果を Prometheus Pushgateway に送信する
            DRILL_END=$(date +%s)
            echo "tier2_restore_drill_completed_timestamp ${DRILL_END}" | \
              curl --data-binary @- http://pushgateway:9091/metrics/job/restore_drill
