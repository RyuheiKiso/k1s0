# contract_test_bindings.yaml — 各 extension_point と Pact contract test fixture のバインディング定義
# docs 参照: docs/03_概要設計/03_tier2設計方針/README.md §拡張点 / Pact contract test
# docs 参照: docs/04_詳細設計/02_強制機構/02_tier2強制機構.md §Pact contract test
version: "1.0.0"
# バインディングリスト（各拡張点に対応する Pact fixture ファイルを列挙する）
bindings:
  # domain_event_envelope 拡張点: Rust consumer の Pact fixture を参照する
  - ep_id: domain_event_envelope
    # 対応する Pact contract test fixture 参照リスト
    pact_fixture_refs:
      # Rust consumer: DomainEventEnvelope の envelope 形式を検証する
      - src/tier2/test/pact/rust/domain_event_envelope.pact.json
      # C# consumer: .NET から Domain Event envelope を消費する契約を検証する
      - src/tier2/test/pact/csharp/domain_event_envelope.pact.json
      # Go consumer: Go から Domain Event envelope を消費する契約を検証する
      - src/tier2/test/pact/go/domain_event_envelope.pact.json
      # TypeScript consumer: TypeScript から Domain Event envelope を消費する契約を検証する
      - src/tier2/test/pact/typescript/domain_event_envelope.pact.json

  # aggregate_lifecycle_hook 拡張点: 全 4 言語の consumer を参照する
  - ep_id: aggregate_lifecycle_hook
    # 対応する Pact contract test fixture 参照リスト
    pact_fixture_refs:
      # Rust consumer: aggregate lifecycle hook インターフェースを検証する
      - src/tier2/test/pact/rust/aggregate_lifecycle_hook.pact.json
      # C# consumer: .NET から lifecycle hook を呼び出す契約を検証する
      - src/tier2/test/pact/csharp/aggregate_lifecycle_hook.pact.json
      # Go consumer: Go から lifecycle hook を呼び出す契約を検証する
      - src/tier2/test/pact/go/aggregate_lifecycle_hook.pact.json
      # TypeScript consumer: TypeScript から lifecycle hook を呼び出す契約を検証する
      - src/tier2/test/pact/typescript/aggregate_lifecycle_hook.pact.json

  # report_template 拡張点: 帳票テンプレートの consumer を参照する
  - ep_id: report_template
    # 対応する Pact contract test fixture 参照リスト
    pact_fixture_refs:
      # Rust consumer: テンプレートエンジン API の契約を検証する
      - src/tier2/test/pact/rust/report_template.pact.json
      # TypeScript consumer: フロントエンドからのテンプレート呼び出し契約を検証する
      - src/tier2/test/pact/typescript/report_template.pact.json

  # audit_event_enricher 拡張点: 監査イベント enricher の consumer を参照する
  - ep_id: audit_event_enricher
    # 対応する Pact contract test fixture 参照リスト
    pact_fixture_refs:
      # Go consumer: Go から audit enricher インターフェースを呼び出す契約を検証する
      - src/tier2/test/pact/go/audit_event_enricher.pact.json
      # Rust consumer: Rust から audit enricher を呼び出す契約を検証する
      - src/tier2/test/pact/rust/audit_event_enricher.pact.json
      # C# consumer: .NET から audit enricher を呼び出す契約を検証する
      - src/tier2/test/pact/csharp/audit_event_enricher.pact.json

  # quota_policy_hook 拡張点: クォータポリシー hook の consumer を参照する
  - ep_id: quota_policy_hook
    # 対応する Pact contract test fixture 参照リスト
    pact_fixture_refs:
      # C# consumer: .NET からクォータポリシーフックを呼び出す契約を検証する
      - src/tier2/test/pact/csharp/quota_policy_hook.pact.json
      # Rust consumer: Rust からクォータポリシーフックを呼び出す契約を検証する
      - src/tier2/test/pact/rust/quota_policy_hook.pact.json
      # Go consumer: Go からクォータポリシーフックを呼び出す契約を検証する
      - src/tier2/test/pact/go/quota_policy_hook.pact.json
      # TypeScript consumer: TypeScript からクォータポリシーフックを呼び出す契約を検証する
      - src/tier2/test/pact/typescript/quota_policy_hook.pact.json
