# k1s0 tier2 Rust ライブラリクレート: テナント分離の Repository abstraction を提供する
# Cargo workspace 制約（メンバーはルート配下のみ）により tier2/rust は独立 workspace として管理する。
[workspace]
# このディレクトリ自体が workspace メンバー
members = ["."]
# Cargo workspace resolver v2 を使用する
resolver = "2"

[package]
# パッケージ名: k1s0-tier2
name = "k1s0-tier2"
# バージョン: 0.1.0
version = "0.1.0"
# Rust エディション: 2021 を使用する
edition = "2021"

[dependencies]
# serde: シリアライズ/デシリアライズフレームワーク
serde = { version = "1", features = ["derive"] }
# serde_json: JSON ライブラリ
serde_json = "1"
# uuid: UUID 生成（tenant_id / aggregate_id に使用する）
uuid = { version = "1", features = ["v4", "serde"] }
# tracing: 構造化ロギング（audit_event emit の trace context に使用する）
tracing = "0.1"
# anyhow: エラーハンドリング
anyhow = "1"
# chrono: 日時ライブラリ（created_at / updated_at / audit_event.timestamp に使用する）
chrono = { version = "0.4", features = ["serde"] }
# thiserror: エラー型定義ライブラリ（テナント境界違反エラーに使用する）
thiserror = "1"
# sqlx: PostgreSQL 非同期クライアント（実 transaction 実行に使用する）
# features: postgres=Postgres ドライバ / runtime-tokio=tokio 非同期ランタイム
# uuid=UUID 型ネイティブサポート / chrono=日時型ネイティブサポート / json=jsonb 型サポート
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
# tokio: 非同期ランタイム（sqlx の runtime-tokio と対で使用する）
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
# tokio: 非同期テストランタイム（#[tokio::test] アトリビュートに使用する）
tokio = { version = "1", features = ["full"] }

[features]
# integration feature gate: --features integration で有効化される統合テスト群
# 通常の unit test 実行（cargo test）では統合テストをスキップする
integration = []

# P1-P4 invariant の統合 property test
# 環境構築 07 検収コマンド: cargo test --test atomic_write_test
[[test]]
name = "atomic_write_test"
path = "tests/atomic_write_test.rs"

# Domain Event / Aggregate の contract test (integration feature gate)
# 環境構築 07 検収コマンド: cargo test --test domain_ct --features integration
[[test]]
name = "domain_ct"
path = "tests/domain_ct.rs"
required-features = ["integration"]

# cross-tenant isolation の property test
# 環境構築 07 検収コマンド: cargo test --test cross_tenant_property_test
[[test]]
name = "cross_tenant_property_test"
path = "tests/cross_tenant_property_test.rs"

# cross-tenant integration test (PostgreSQL RLS FORCE 環境が必要)
# 環境構築 07 検収コマンド: TEST_DATABASE_URL=... cargo test --test cross_tenant_test -- --ignored
[[test]]
name = "cross_tenant_test"
path = "tests/cross_tenant_test.rs"
