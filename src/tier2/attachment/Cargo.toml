# k1s0-tier2-attachment: 業務添付帳票資産クレート（設計方針 28）
# AttachmentStore トレイトとエンベロープ暗号化を提供する
[package]
# パッケージ名: k1s0-tier2-attachment
name = "k1s0-tier2-attachment"
# バージョン: 0.1.0
version = "0.1.0"
# Rust エディション: 2021 を使用する
edition = "2021"

[dependencies]
# uuid: テナント識別子および添付ファイル識別子に使用する
uuid = { version = "1", features = ["v4", "serde"] }
# serde: AttachmentMetadata のシリアライズに使用する
serde = { version = "1", features = ["derive"] }
# serde_json: JSON ライブラリ
serde_json = "1"
# anyhow: エラーハンドリング
anyhow = "1"
# chrono: 添付ファイルのアップロード日時に使用する（HLC タイムスタンプと併用する）
chrono = { version = "0.4", features = ["serde"] }
