# slash_commands.yaml — k1s0 tier2 Mattermost スラッシュコマンド定義
# Mattermost ChatOps 統合: /k1s0 サブコマンドの定義（deploy / rollback / status）
# webhook_handler.rs がこの設定に基づいてコマンドをディスパッチする

# スラッシュコマンド定義リスト
slash_commands:
  # /k1s0 deploy コマンド: 指定サービスを Argo CD 経由でデプロイする
  - command: /k1s0
    # コマンドのサブコマンド部分（command + text の先頭語で識別する）
    subcommand: deploy
    # コマンドの説明（Mattermost の /help に表示される）
    display_name: "k1s0 Deploy"
    # コマンドの詳細説明
    description: "指定したサービスを Argo CD 経由でデプロイします。例: /k1s0 deploy tier2-api"
    # コマンドを受け付ける URL（webhook_handler.rs が処理するエンドポイント）
    url: "http://k1s0-mattermost-webhook.k1s0-tier2.svc:8090/slash"
    # リクエストメソッド（POST を使用する）
    method: POST
    # アイコン URL（デプロイ操作を示すアイコン）
    icon_url: "https://k1s0.internal/icons/deploy.png"
    # オートコンプリート有効化フラグ
    autocomplete: true
    # オートコンプリートのヒント（引数の形式を示す）
    autocomplete_hint: "[service-name] [--tag image-tag]"
    # ユーザー名表示（Mattermost でのボット表示名）
    username: "k1s0-bot"

  # /k1s0 rollback コマンド: 指定サービスを前バージョンにロールバックする
  - command: /k1s0
    # コマンドのサブコマンド部分
    subcommand: rollback
    # コマンドの説明
    display_name: "k1s0 Rollback"
    # コマンドの詳細説明
    description: "指定したサービスを前バージョンにロールバックします。例: /k1s0 rollback tier2-api"
    # コマンドを受け付ける URL
    url: "http://k1s0-mattermost-webhook.k1s0-tier2.svc:8090/slash"
    # リクエストメソッド
    method: POST
    # アイコン URL（ロールバック操作を示すアイコン）
    icon_url: "https://k1s0.internal/icons/rollback.png"
    # オートコンプリート有効化フラグ
    autocomplete: true
    # オートコンプリートのヒント
    autocomplete_hint: "[service-name]"
    # ユーザー名表示
    username: "k1s0-bot"

  # /k1s0 status コマンド: 指定サービスのデプロイ状況を確認する
  - command: /k1s0
    # コマンドのサブコマンド部分
    subcommand: status
    # コマンドの説明
    display_name: "k1s0 Status"
    # コマンドの詳細説明
    description: "指定したサービスの Argo CD デプロイ状況を確認します。例: /k1s0 status tier2-api"
    # コマンドを受け付ける URL
    url: "http://k1s0-mattermost-webhook.k1s0-tier2.svc:8090/slash"
    # リクエストメソッド
    method: POST
    # アイコン URL（ステータス確認を示すアイコン）
    icon_url: "https://k1s0.internal/icons/status.png"
    # オートコンプリート有効化フラグ
    autocomplete: true
    # オートコンプリートのヒント
    autocomplete_hint: "[service-name]"
    # ユーザー名表示
    username: "k1s0-bot"

# Mattermost 統合設定
integration:
  # Mattermost サーバー URL（クラスター内部 Mattermost インスタンス）
  mattermost_url: "http://mattermost.k1s0-ops.svc:8065"
  # ボットトークン（Kubernetes Secret から取得する / 直接記載禁止）
  # bot_token は環境変数 MATTERMOST_BOT_TOKEN から取得する
  bot_token_env: "MATTERMOST_BOT_TOKEN"
  # 応答チャンネルのデフォルト設定（slash command 発行チャンネルに返信する）
  response_type: "in_channel"
