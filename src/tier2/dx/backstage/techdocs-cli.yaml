# techdocs-cli.yaml — k1s0 tier2 Backstage TechDocs CLI 設定ファイル
# backstage TechDocs CLI (npx @techdocs/cli) が使用する設定
# TechDocs の生成・発行・プレビューをローカルおよび CI から制御する

# TechDocs ビルダー設定
# local: ローカル環境の MkDocs コマンドを使用してドキュメントをビルドする
builder: local

# TechDocs パブリッシャー設定
publisher:
  # type: local — ローカルファイルシステムに生成結果を出力する
  # CI では gcpGcs / awsS3 / azureBlobStorage に変更して Backstage ストレージに発行する
  type: local

# TechDocs プレビューサーバー設定
# npx @techdocs/cli serve コマンド実行時のプレビューサーバー設定
preview:
  # プレビューサーバーのポート番号（ローカル開発用）
  port: 3000

# TechDocs ドキュメントディレクトリ設定
# catalog-info.yaml の backstage.io/techdocs-ref と一致させる
techdocsPath: "."

# Backstage Entity の識別情報（TechDocs との紐付けに使用する）
entity:
  # エンティティの kind を設定する（Component / System / API から選択する）
  kind: Component
  # エンティティの namespace を設定する（default の場合は省略可能）
  namespace: default
  # エンティティの名前（catalog-info.yaml の metadata.name と一致させる）
  name: k1s0-tier2
