# emergency_override/catalog-info.yaml — 緊急操作 Backstage plugin のカタログエントリ
# docs 参照: docs/03_概要設計/03_tier2設計方針/README.md §開発者体験 / Backstage plugin
# docs 参照: docs/04_詳細設計/01_適合仕様/10_テナント分離適合仕様.md §緊急操作
# Backstage API バージョン
apiVersion: backstage.io/v1alpha1
# リソース種別: Component（Backstage Software Catalog に登録する）
kind: Component
metadata:
  # plugin のコンポーネント名（Backstage catalog の一意識別子）
  name: k1s0-tier2-emergency-override-plugin
  # plugin の説明
  description: "k1s0 tier2 緊急操作 plugin — break-glass 緊急アクセス・鍵緊急ローテーション・テナント緊急停止を提供する"
  # ラベル
  labels:
    # 所属軸ラベル
    k1s0.axis: tier2
    # 実装 Phase ラベル
    k1s0.phase: P10
    # plugin 種別ラベル（high-privilege 操作を識別するラベル）
    k1s0.plugin.type: emergency-override
    # 高権限操作フラグ（Kyverno policy と連動する）
    k1s0.privilege.level: high
  # アノテーション
  annotations:
    # GitHub リポジトリリンク
    github.com/project-slug: "RyuheiKiso/k1s0"
    # techdocs 生成対象パス
    backstage.io/techdocs-ref: "dir:."
spec:
  # コンポーネント種別（website: UI plugin）
  type: website
  # ライフサイクルステージ
  lifecycle: experimental
  # オーナーチームの参照（緊急操作 plugin は core チームのみ所有する）
  owner: "team:k1s0-core"
  # 所属システム
  system: "k1s0-platform"
  # この plugin が依存するコンポーネント
  dependsOn:
    # tier2 REST API への依存（緊急操作は tier2 API 経由で実行する）
    - "component:k1s0-tier2"
    # OpenBao Transit（鍵ローテーションに使用する）
    - "resource:k1s0-openbao"
