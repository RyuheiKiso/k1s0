# new_domain_event.yaml — Backstage SoftwareTemplate: 新 domain event 作成
# tier2 の新しい domain event（Avro schema + Outbox relay 設定）を scaffolding する
# spec: docs/03_概要設計/03_tier2設計方針/27_開発者体験設計.md §Backstage テンプレート
# schemas/avro/domain_events.avsc と整合した Avro schema を生成する
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  # テンプレート名（Backstage Software Catalog での識別子）
  name: k1s0-new-tier2-domain-event
  # 表示タイトル
  title: "New Tier2 Domain Event"
  # 説明: tier2 domain event（Avro schema + Outbox relay + audit_event emit）を scaffolding する
  description: "tier2 domain event を scaffolding する。schemas/avro/domain_events.avsc への追記 + atomic_triple_write の outbox relay 設定を含む。"
spec:
  # オーナー: プラットフォームチームが管理する
  owner: platform-team
  # テンプレート種別: domain event 作成
  type: domain-event
  # 申請フォームのパラメータ定義
  parameters:
    # domain event 詳細セクション
    - title: Domain Event Details
      # 必須フィールド: industry / domain / event_name / aggregate_class
      required: [industry, domain, event_name, aggregate_class]
      properties:
        # 業界区分（pack/ 配下のディレクトリ名と一致させる）
        industry:
          title: Industry
          type: string
          enum: [manufacturing]
          description: "pack/<industry>/ の vocabulary.yaml が存在する業界のみ選択可"
        # ドメイン区分（bounded context と一致させる）
        domain:
          title: Domain (bounded context)
          type: string
          description: "bounded context 名（proto パッケージの <domain> 部分と一致させる）"
        # domain event 名（業界中立語、PascalCase）
        event_name:
          title: Event Name (業界中立語、PascalCase)
          type: string
          # 例: ResourceStatusChanged / ProcurementOrderApproved / InspectionResultRecorded
          description: "業界中立語 + 過去形 PascalCase を使用する（forbidden_industry_terms.yaml の禁則語禁止）"
        # 発生元の aggregate クラス（abac/policies の aggregate_class と一致させる）
        aggregate_class:
          title: Source Aggregate Class
          type: string
          description: "domain event を emit する aggregate の aggregate_class（ABAC policy と一致させる）"
        # Kafka トピック名（outbox relay の転送先）
        kafka_topic:
          title: Kafka Topic Name
          type: string
          description: "Outbox relay の転送先 Kafka トピック（<industry>.<domain>.<event_name> 形式を推奨）"
        # PII を含むかどうか（true の場合、Outbox 書込時に redact が必須）
        contains_pii:
          title: Contains PII fields?
          type: boolean
          default: false
          description: "true の場合、Outbox relay 前に PII フィールドの redact が必須"
  # workflow ステップ定義
  steps:
    # domain event Avro schema を生成するステップ
    - id: generate-avro-schema
      name: Generate Avro schema
      action: fetch:template
      input:
        # domain event Avro schema テンプレートのパス
        url: ./skeleton/domain_event
        values:
          industry: "${{ parameters.industry }}"
          domain: "${{ parameters.domain }}"
          event_name: "${{ parameters.event_name }}"
          aggregate_class: "${{ parameters.aggregate_class }}"
          kafka_topic: "${{ parameters.kafka_topic }}"
          contains_pii: "${{ parameters.contains_pii }}"
    # PR を作成するステップ（schemas/avro/domain_events.avsc への追記を review する）
    - id: create-pr
      name: Create pull request for schema review
      action: publish:github:pull-request
      input:
        repoUrl: "github.com?repo=k1s0&owner=k1s0-org"
        title: "feat(tier2): add domain event ${{ parameters.event_name }} in ${{ parameters.industry }}.${{ parameters.domain }}"
        branchName: "feat/tier2-event-${{ parameters.event_name }}"
        # Avro schema 変更は backward compatibility review が必須
        description: |
          ## Domain Event: ${{ parameters.event_name }}

          - Industry: ${{ parameters.industry }}
          - Domain: ${{ parameters.domain }}
          - Source Aggregate: ${{ parameters.aggregate_class }}
          - Kafka Topic: ${{ parameters.kafka_topic }}
          - Contains PII: ${{ parameters.contains_pii }}

          ### Checklist
          - [ ] Avro schema の backward compatibility を確認する
          - [ ] atomic_triple_write の outbox relay 設定を確認する
          - [ ] PII フィールドの redact 設定を確認する（contains_pii = true の場合）
          - [ ] ABAC policy の write 操作に requires_audit: true が設定されていることを確認する
