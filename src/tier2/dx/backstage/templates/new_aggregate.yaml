# new_aggregate.yaml — Backstage SoftwareTemplate: 新 aggregate 作成
# tier2 の新しい aggregate（domain event / state / ABAC policy を含む）を scaffolding する
# spec: docs/03_概要設計/03_tier2設計方針/27_開発者体験設計.md §Backstage テンプレート
# abac/policies/<industry>/<domain>/<aggregate>.yaml と対応する ABAC policy も同時生成する
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  # テンプレート名（Backstage Software Catalog での識別子）
  name: k1s0-new-tier2-aggregate
  # 表示タイトル
  title: "New Tier2 Aggregate"
  # 説明: tier2 aggregate（domain event / state / ABAC policy）を新規作成する
  description: "tier2 aggregate を scaffolding する。atomic_triple_write の StateChange / TableClass と整合した aggregate 骨格 + ABAC policy を生成する。"
spec:
  # オーナー: プラットフォームチームが管理する
  owner: platform-team
  # テンプレート種別: aggregate 作成
  type: aggregate
  # 申請フォームのパラメータ定義
  parameters:
    # aggregate 詳細セクション
    - title: Aggregate Details
      # 必須フィールド: industry / domain / aggregate_name / table_class
      required: [industry, domain, aggregate_name, table_class]
      properties:
        # 業界区分（pack/ 配下のディレクトリ名と一致させる）
        industry:
          title: Industry
          type: string
          enum: [manufacturing]
          description: "pack/<industry>/ の vocabulary.yaml が存在する業界のみ選択可"
        # ドメイン区分（bounded context と一致させる）
        domain:
          title: Domain (bounded context)
          type: string
          description: "bounded context 名（abac/policies/<industry>/<domain>/ パスと一致させる）"
        # aggregate 名（abac/policies/<industry>/<domain>/<aggregate>.yaml の aggregate_class と一致させる）
        aggregate_name:
          title: Aggregate Name (業界中立語)
          type: string
          description: "業界中立語を使用する（forbidden_industry_terms.yaml の禁則語禁止）"
        # テーブルクラス（10_テナント分離適合仕様.md の 4 class から選択する）
        table_class:
          title: Table Class (10_テナント分離適合仕様.md)
          type: string
          # 4 class: TenantScoped / TenantMaster / PlatformGlobal / PiiSegregated
          enum: [TenantScoped, TenantMaster, PlatformGlobal, PiiSegregated]
          description: "atomic_triple_write の TableClass と一致させる"
        # admin_override が必要かどうか（ABAC policy に admin_override 操作を追加する）
        needs_admin_override:
          title: Requires admin_override operation?
          type: boolean
          default: false
          description: "true の場合、lifecycle/dual_signoff_workflow.yaml との連携が必須になる"
  # workflow ステップ定義
  steps:
    # aggregate スケルトンテンプレートを取得するステップ
    - id: fetch-aggregate-template
      name: Fetch aggregate skeleton
      action: fetch:template
      input:
        # aggregate 骨格テンプレートのパス（Rust / C# / Go / TypeScript 4 言語分）
        url: ./skeleton/aggregate
        values:
          industry: "${{ parameters.industry }}"
          domain: "${{ parameters.domain }}"
          aggregate_name: "${{ parameters.aggregate_name }}"
          table_class: "${{ parameters.table_class }}"
          needs_admin_override: "${{ parameters.needs_admin_override }}"
    # ABAC policy スケルトンを生成するステップ
    - id: generate-abac-policy
      name: Generate ABAC policy
      action: fetch:template
      input:
        # ABAC policy テンプレートのパス（abac/policies/<industry>/<domain>/<aggregate>.yaml）
        url: ./skeleton/abac_policy
        values:
          policy_id: "${{ parameters.industry }}.${{ parameters.domain }}.${{ parameters.aggregate_name }}"
          aggregate_class: "${{ parameters.aggregate_name }}"
          industry: "${{ parameters.industry }}"
          domain: "${{ parameters.domain }}"
          needs_admin_override: "${{ parameters.needs_admin_override }}"
    # PR を作成するステップ（review 経由で merge する）
    - id: create-pr
      name: Create pull request
      action: publish:github:pull-request
      input:
        repoUrl: "github.com?repo=k1s0&owner=k1s0-org"
        title: "feat(tier2): add aggregate ${{ parameters.aggregate_name }} in ${{ parameters.industry }}.${{ parameters.domain }}"
        branchName: "feat/tier2-aggregate-${{ parameters.aggregate_name }}"
