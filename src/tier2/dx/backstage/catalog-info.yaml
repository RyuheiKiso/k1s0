# tier2 Backstage カタログ定義（設計方針 27 / 開発者体験）
# k1s0-tier2 コンポーネントを Backstage Software Catalog に登録する
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  # Backstage コンポーネント名
  name: k1s0-tier2
  # コンポーネントの説明
  description: "k1s0 テナント分離プラットフォーム tier2 — 業界中立マルチテナント API 層"
  # コンポーネントのラベル（Backstage のフィルタリングに使用する）
  labels:
    # 軸ラベル
    k1s0.axis: tier2
    # 実装 Phase ラベル
    k1s0.phase: P10
  # コンポーネントのアノテーション（外部システムとの連携設定）
  annotations:
    # GitHub リポジトリへのリンク
    github.com/project-slug: "RyuheiKiso/k1s0"
    # Backstage の techdocs 生成対象パスを指定する
    backstage.io/techdocs-ref: "dir:."
spec:
  # コンポーネント種別（service: 稼働するサービス）
  type: service
  # ライフサイクルステージ（production / experimental / deprecated のいずれか）
  lifecycle: experimental
  # オーナーチームの参照
  owner: "team:k1s0-core"
  # システムへの所属
  system: "k1s0-platform"
  # tier2 が提供する API の参照リスト
  providesApis:
    # tier2 REST API の Backstage API エントリ名
    - k1s0-tier2-rest-api
  # tier2 が依存するコンポーネントリスト
  dependsOn:
    # tier1 transport 層への依存
    - "component:k1s0-tier1"
    # PostgreSQL データストアへの依存
    - "resource:k1s0-postgresql"
    # Kafka メッセージブローカーへの依存
    - "resource:k1s0-kafka"
