# tier2-api.yaml — tier2 API Deployment + Service (Tiltfile 参照)
# Tiltfile の k8s_yaml(["devcontainer/k8s/tier2-api.yaml"]) から読み込まれる
# Tiltfile の k8s_resource("tier2-api", port_forwards=["8080:8080"]) と整合させる
# src/CLAUDE.md: production / development 区別禁止 — RLS・audit・quota を弱体化しない
apiVersion: apps/v1
kind: Deployment
metadata:
  # Deployment 名（Tiltfile の k8s_resource("tier2-api") で参照される）
  name: tier2-api
  # 開発環境専用 namespace（tier2-dev）
  namespace: tier2-dev
spec:
  # レプリカ数: 開発環境では 1 台で運用する
  replicas: 1
  selector:
    matchLabels:
      # ラベルセレクタ: tier2-api Pod を選択する
      app: tier2-api
  template:
    metadata:
      labels:
        # Pod ラベル（Service セレクタおよびネットワークポリシーで参照される）
        app: tier2-api
    spec:
      containers:
        - name: tier2-api
          # イメージ: Tiltfile の docker_build() で harbor.k1s0.internal/k1s0/tier2 がビルドされる
          image: harbor.k1s0.internal/k1s0/tier2:latest
          env:
            - name: DATABASE_URL
              # PostgreSQL 接続 URL（postgres Service の ClusterIP 経由で接続する）
              value: "postgres://tier2:dev_password_only@postgres:5432/tier2"
            - name: KAFKA_BOOTSTRAP_SERVERS
              # Kafka ブートストラップサーバー（kafka Service の ClusterIP 経由で接続する）
              value: "kafka:9092"
            - name: LISTEN_ADDR
              # API サーバーのリッスンアドレス（Tiltfile の port_forwards と整合させる）
              value: "0.0.0.0:8080"
          ports:
            # tier2 API ポート（Tiltfile の port_forwards=["8080:8080"] と整合させる）
            - containerPort: 8080
          # readinessProbe: postgres / kafka が起動してから tier2-api が ready になる
          readinessProbe:
            httpGet:
              # /healthz エンドポイントで readiness を確認する
              path: /healthz
              port: 8080
            # 起動後 10 秒待ってから probe を開始する（DB マイグレーション完了を待つ）
            initialDelaySeconds: 10
            # 5 秒ごとに probe を実行する
            periodSeconds: 5
---
# tier2-api Service — Deployment Pod への ClusterIP アクセスを提供する
apiVersion: v1
kind: Service
metadata:
  # Service 名（Tiltfile の k8s_resource("tier2-api") と一致させる）
  name: tier2-api
  # 開発環境専用 namespace（tier2-dev）
  namespace: tier2-dev
spec:
  selector:
    # tier2-api Pod を選択する（Deployment テンプレートのラベルと一致させる）
    app: tier2-api
  ports:
    # tier2 API ポートを ClusterIP で公開する（Tiltfile の port_forwards 経由でローカルアクセス可）
    - port: 8080
      targetPort: 8080
