# postgres.yaml — tier2 開発環境用 PostgreSQL (Tiltfile 参照)
# Tiltfile の k8s_yaml(["devcontainer/k8s/postgres.yaml"]) から読み込まれる
# src/CLAUDE.md: production / development 区別禁止 — RLS・audit を弱体化しない設定で起動する
# StatefulSet を使用して PostgreSQL データの永続性を保証する
apiVersion: apps/v1
kind: StatefulSet
metadata:
  # StatefulSet 名（Tiltfile の k8s_resource() で "postgres" として参照される）
  name: postgres
  # 開発環境専用 namespace（tier2-dev）
  namespace: tier2-dev
spec:
  # サービス名（Headless Service と一致させる）
  serviceName: postgres
  # レプリカ数: 開発環境では 1 台で運用する
  replicas: 1
  selector:
    matchLabels:
      # ラベルセレクタ: postgres Pod を選択する
      app: postgres
  template:
    metadata:
      labels:
        # Pod ラベル（Service セレクタおよびネットワークポリシーで参照される）
        app: postgres
    spec:
      containers:
        - name: postgres
          # PostgreSQL 16 を使用する（migrations/0001_initial_schema.sql と整合させる）
          image: postgres:16
          env:
            - name: POSTGRES_DB
              # データベース名: tier2
              value: tier2
            - name: POSTGRES_USER
              # データベースユーザー名: tier2
              value: tier2
            - name: POSTGRES_PASSWORD
              # 開発環境専用パスワード（production では外部 secret から注入する）
              value: dev_password_only
          ports:
            # PostgreSQL 標準ポート
            - containerPort: 5432
---
# postgres Service — StatefulSet Pod への ClusterIP アクセスを提供する
apiVersion: v1
kind: Service
metadata:
  # Service 名（tier2-api から postgres:5432 としてアクセスされる）
  name: postgres
  # 開発環境専用 namespace（tier2-dev）
  namespace: tier2-dev
spec:
  selector:
    # postgres Pod を選択する（StatefulSet テンプレートのラベルと一致させる）
    app: postgres
  ports:
    # PostgreSQL 標準ポートを ClusterIP で公開する
    - port: 5432
      targetPort: 5432
