# noisy_neighbor.yaml — ノイジーネイバー分離検証 LitmusChaos 実験
# docs 参照: docs/03_概要設計/03_tier2設計方針/README.md §信頼性 / テナント分離
# docs 参照: docs/04_詳細設計/01_適合仕様/10_テナント分離適合仕様.md §ノイジーネイバー対策
# LitmusChaos ChaosExperiment でノイジーネイバー分離の有効性を検証する
apiVersion: litmuschaos.io/v1alpha1
# 実験定義リソース種別: ChaosExperiment
kind: ChaosExperiment
metadata:
  # 実験リソース名
  name: tier2-noisy-neighbor-isolation
  # 実験対象の Namespace（tier2 が稼働する namespace）
  namespace: k1s0-tier2
  # 実験メタデータラベル
  labels:
    # 実験種別ラベル
    experiment.type: noisy-neighbor
    # 対象サービスラベル
    app.kubernetes.io/component: tier2
    # テナント分離検証ラベル
    chaos.category: tenant-isolation
spec:
  # 定義するカスタム実験の仕様
  definition:
    # この実験のスコープ（Namespaced: 対象 namespace に限定する）
    scope: Namespaced
    # 実験コンテナの権限設定
    permissions:
      # chaos 実験コンテナが必要とする RBAC 権限
      - apiGroups: [""]
        # pod の取得・一覧・作成・削除を許可する
        resources: ["pods"]
        verbs: ["get", "list", "create", "delete"]
    # 実験イメージ（LitmusChaos の stress-ng を使用してノイジーネイバーを模倣する）
    image: "litmuschaos/go-runner:3.0.0"
    # 実験コマンド
    command:
      # chaos ランナーを実行する
      - /bin/bash
    # 実験スクリプト引数
    args:
      # stress-ng で CPU/Memory 負荷をかけて他テナントへの影響を計測する
      - -c
      - "./experiments/noisy-neighbor"
    # 実験環境変数
    env:
      # ノイジーテナント識別子（負荷をかける対象テナント）
      - name: NOISY_TENANT_ID
        # 環境変数の値は ChaosEngine 側から上書きする
        value: ""
      # 影響確認対象テナント識別子（分離されているべきテナント）
      - name: ISOLATED_TENANT_ID
        value: ""
      # CPU 負荷率（% 単位。80% の CPU を消費してノイジーネイバーを模倣する）
      - name: CPU_LOAD_PERCENTAGE
        value: "80"
      # メモリ負荷量（MiB 単位。256MiB を消費する）
      - name: MEMORY_LOAD_MIB
        value: "256"
      # 実験継続時間（秒単位）
      - name: TOTAL_CHAOS_DURATION
        value: "60"
      # 検証閾値: 隔離テナントのレイテンシ増加率が 5% 以内であること
      - name: LATENCY_DEGRADATION_THRESHOLD_PERCENT
        value: "5"
    # 実験が成功と判定するための条件を定義する
    configMaps:
      # 実験設定ファイルをマウントする
      - name: noisy-neighbor-config
        mountPath: /etc/chaos/config
