# tier2 信頼性運用: Litmus ChaosEngine マニフェスト（設計方針 18）
# pod-delete 実験で tier2 ポッドの耐障害性を検証する
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  # ChaosEngine のリソース名
  name: tier2-pod-delete-engine
  # 実験対象の Namespace（tier2 が稼働する namespace）
  namespace: k1s0-tier2
  # 実験メタデータラベル（監視システムのフィルタリングに使用する）
  labels:
    # 実験種別ラベル
    experiment.type: pod-delete
    # 対象サービスラベル
    app.kubernetes.io/component: tier2
spec:
  # 実験対象アプリケーションの識別情報
  appinfo:
    # 対象ポッドの Namespace
    appns: k1s0-tier2
    # 対象ポッドのラベルセレクタ（tier2-api ポッドを対象とする）
    applabel: "app=tier2-api"
    # 対象ポッドのリソース種別
    appkind: deployment
  # 実験中に Chaos Exporter がイベントを書き込む Chaos Service Account
  chaosServiceAccount: litmus-admin
  # 実験モード（serial: 同時に 1 ポッドのみ削除する）
  engineState: active
  experiments:
    # pod-delete 実験の設定
    - name: pod-delete
      spec:
        # 実験コンポーネントの設定
        components:
          env:
            # 対象ポッド数（一度に削除するポッド数）
            - name: TOTAL_CHAOS_DURATION
              # 混沌実験の継続時間（秒）
              value: "30"
            # 同時削除ポッド数
            - name: CHAOS_INTERVAL
              # 削除インターバル（秒）
              value: "10"
            # 実験実行回数
            - name: PODS_AFFECTED_PERC
              # 削除対象ポッドの割合（%）
              value: "50"
            # 強制削除フラグ（false: グレースフルシャットダウンを確認する）
            - name: FORCE
              value: "false"
