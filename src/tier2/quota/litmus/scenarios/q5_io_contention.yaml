# Litmus ChaosEngine: テナント間 I/O 競合テスト
# 高負荷な I/O を持つテナントが他テナントのストレージ性能を阻害しないことを検証する
apiVersion: litmuschaos.io/v1alpha1
# ChaosEngine リソース宣言
kind: ChaosEngine
metadata:
  # ChaosEngine 名: tier2 I/O 競合テスト
  name: tier2-quota-io-contention
  # 実行名前空間
  namespace: tier2-test
spec:
  appinfo:
    # 対象アプリケーションの名前空間
    appns: tier2-test
    # 全クォータクラスを対象にして I/O 競合を検証するラベルセレクタ
    applabel: "k1s0.io/axis=tier2"
  # Litmus サービスアカウント
  chaosServiceAccount: litmus-admin
  experiments:
    # pod-io-stress: ディスク I/O を高負荷状態にして競合を再現する
    - name: pod-io-stress
      spec:
        components:
          env:
            # カオス実施時間（秒）を指定する
            - name: TOTAL_CHAOS_DURATION
              value: "45"
            # I/O 書き込みサイズ（MB）を指定する
            - name: FILESYSTEM_UTILIZATION_BYTES
              value: "1073741824"
            # 対象 Pod 名を指定する（高 I/O テナントを対象にする）
            - name: TARGET_PODS
              value: "tier2-test-io-heavy-tenant"
        status:
          # テスト結果名を指定する
          - name: ChaosResult
            value: io_contention_isolation_pass
