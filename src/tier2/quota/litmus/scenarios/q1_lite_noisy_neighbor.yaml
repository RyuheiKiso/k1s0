# Litmus ChaosEngine: v1_lite クォータクラスの noisy neighbor テスト
# v1_lite テナントが他テナントの SLO を侵害しないことを検証する
apiVersion: litmuschaos.io/v1alpha1
# ChaosEngine リソース宣言
kind: ChaosEngine
metadata:
  # ChaosEngine 名: tier2 v1_lite noisy neighbor
  name: tier2-quota-lite-noisy-neighbor
  # 実行名前空間
  namespace: tier2-test
spec:
  appinfo:
    # 対象アプリケーションの名前空間
    appns: tier2-test
    # v1_lite クォータクラスのアプリを対象にするラベルセレクタ
    applabel: "quota.class=v1_lite"
  # Litmus サービスアカウント
  chaosServiceAccount: litmus-admin
  experiments:
    # pod-cpu-hog: CPU を過剰消費させて noisy neighbor 状態を再現する
    - name: pod-cpu-hog
      spec:
        components:
          env:
            # カオス実施時間（秒）を指定する
            - name: TOTAL_CHAOS_DURATION
              value: "30"
            # 消費する CPU コア数を指定する
            - name: CPU_CORES
              value: "2"
            # 対象 Pod 名を指定する
            - name: TARGET_PODS
              value: "tier2-test-lite-tenant"
        status:
          # テスト結果名を指定する
          - name: ChaosResult
            value: v1_lite_noisy_neighbor_isolation_pass
