# k1s0 tier2 テナント容量 enforcement_points 定義（手書き input SoT）
# spec 09_テナント容量適合仕様.md §§66-70 に定義する 5 enforcement_layer に完全準拠する
# このファイルを入力として generate_enforcement_points.py が enforcement_points.lock.yaml を生成する

# enforcement_points 定義バージョン
apiVersion: k1s0/v1

# リソース種別: enforcement_point_catalog
kind: EnforcementPointCatalog

# メタデータ
metadata:
  # ファイル名と一致させる
  name: k1s0-tier2-enforcement-points
  # 適合仕様のリファレンス（§単一の真 §enforcement_points.lock.yaml 参照）
  spec_reference: docs/04_詳細設計/01_適合仕様/09_テナント容量適合仕様.md

# 5 階層 enforcement_points 定義（spec §42-48 §66-70 に準拠）
# enforcement_layer enum 値 = spec §dimension の根拠 §58 の 5 種と 1:1 対応
enforcement_points:
  # 階層 1: envoy_local_rate_limit（ingress Envoy Gateway Local Rate Limit）
  # spec §66: 「階層 1: ingress（Envoy Gateway Local Rate Limit）— v1_per_tenant_qps の主担当」
  # spec §44: v1_per_tenant_qps.enforcement_layer = envoy_local_rate_limit
  - id: envoy_local_rate_limit
    # enforcement レイヤー: ingress Envoy で JWT claim から tenant_id を抽出してレート制限する
    layer: ingress
    # enforcement の説明（spec §51 と整合）
    description: Envoy Gateway Local Rate Limit filter による per-tenant QPS 制限（tenant_id を JWT claim から抽出）
    # 動作: sliding window + reject 429（burst 2x まで許容）
    mechanism: envoy_local_rate_limit_filter
    # 対応 quota_class（spec §42-48）
    quota_class: v1_per_tenant_qps
    # 設定パラメータ
    parameters:
      # 上限ソース（quota_class から読み込む）
      limit_source: quota_class.api_requests_per_second
      # 上限超過時のレスポンスコード（spec §51 reject_429）
      response_code: 429
      # Retry-After ヘッダを付与する
      retry_after_header: true
      # burst 許容倍率
      burst_factor: 2.0

  # 階層 2: library_token_bucket（Library 内 in-process token bucket）
  # spec §67: 「階層 2: Library token bucket（in-process）— v1_per_tenant_concurrency の主担当」
  # spec §45: v1_per_tenant_concurrency.enforcement_layer = library_token_bucket
  - id: library_token_bucket
    # enforcement レイヤー: SDK / library 内の token bucket semaphore（in-process）
    layer: client_sdk_in_process
    # enforcement の説明（spec §52 と整合）
    description: Library 内 token bucket semaphore による per-tenant 同時実行上限（Workflow / long-poll 含む）
    # 動作: queue_with_timeout（deadline 超過で打ち切り）
    mechanism: token_bucket_semaphore
    # 対応 quota_class（spec §42-48）
    quota_class: v1_per_tenant_concurrency
    # 設定パラメータ
    parameters:
      # バケット補充レート（quota_class の concurrency_max から算出する）
      limit_source: quota_class.concurrency_max
      # キュー待機許容時間（deadline 超過で打ち切り）
      queue_timeout_ms: 30000
      # 上限超過時の動作（spec §52 queue_with_timeout）
      on_exhaustion: queue_with_timeout

  # 階層 3: oss_native_quota（OSS ネイティブ quota — Temporal / KEDA / pgvector / Superset）
  # spec §68: 「階層 3: OSS native quota — v1_per_tenant_compute の主担当」
  # spec §46: v1_per_tenant_compute.enforcement_layer = oss_native_quota
  - id: oss_native_quota
    # enforcement レイヤー: OSS の namespace / workload / resource quota 機構を活用する
    layer: oss_native
    # enforcement の説明（spec §54 と整合）
    description: Temporal namespace quota / KEDA ScaledObject per-tenant scope / pgvector workload group / Superset row limit による CPU/GPU/Memory 制限
    # 動作: shed_by_priority（優先度付き shed）
    mechanism: oss_namespace_quota
    # 対応 quota_class（spec §42-48）
    quota_class: v1_per_tenant_compute
    # 設定パラメータ
    parameters:
      # 対象 OSS システム（spec §68 の列挙に準拠）
      systems:
        - temporal_namespace_quota
        - keda_scaledobject_per_tenant
        - pgvector_workload_pool_quota
        - superset_row_limit
      # 上限ソース
      limit_source: quota_class.compute_cpu_vcpu
      # 上限超過時の動作（spec §54 shed_by_priority）
      on_exhaustion: shed_by_priority

  # 階層 4: storage_layer_quota（storage layer — Rook+Ceph / CloudNativePG / ClickHouse）
  # spec §69: 「階層 4: storage / broker layer — v1_per_tenant_volume と v1_global_fair_queue の主担当」
  # spec §46: v1_per_tenant_volume.enforcement_layer = storage_layer_quota
  - id: storage_layer_quota
    # enforcement レイヤー: storage レイヤーの namespace / pool / tablespace quota
    layer: storage
    # enforcement の説明（spec §53 と整合）
    description: Rook+Ceph namespace/pool quota / CloudNativePG tablespace metering / ClickHouse retention TTL による per-tenant ストレージ制限
    # 動作: overflow_to_cold（hot SSD → cold Ceph RGW）
    mechanism: storage_namespace_quota
    # 対応 quota_class（spec §42-48）
    quota_class: v1_per_tenant_volume
    # 設定パラメータ
    parameters:
      # 対象 OSS システム（spec §69 の列挙に準拠）
      systems:
        - rook_ceph_namespace_pool_quota
        - cloudnativepg_tablespace_metering
        - clickhouse_tenant_retention_ttl
      # 上限ソース
      limit_source: quota_class.storage_bytes_max
      # 上限超過時の動作（spec §53 overflow_to_cold）
      on_exhaustion: overflow_to_cold

  # 階層 5: broker_layer（broker layer — Kafka per-tenant topic quota + partition fairness）
  # spec §69: 「broker_layer: Kafka per-tenant topic quota + partition fairness」
  # spec §48: v1_global_fair_queue.enforcement_layer = broker_layer
  - id: broker_layer
    # enforcement レイヤー: Kafka broker の per-tenant topic quota と partition rebalance
    layer: broker
    # enforcement の説明（spec §55 と整合）
    description: Kafka per-tenant topic quota / Istio destination rule outlier detection による global I/O fairness 強制
    # 動作: partition_rebalance（Kafka partition rebalance で公平性を回復する）
    mechanism: kafka_per_tenant_quota
    # 対応 quota_class（spec §42-48）
    quota_class: v1_global_fair_queue
    # 設定パラメータ
    parameters:
      # 対象 OSS システム（spec §69 の列挙に準拠）
      systems:
        - kafka_per_tenant_topic_quota
        - istio_destination_rule_outlier_detection
      # 上限ソース
      limit_source: quota_class.partition_count_max
      # 上限超過時の動作（spec §55 partition_rebalance）
      on_exhaustion: partition_rebalance
