# scenarios.yaml — k1s0 tier2 quota シナリオ定義（次元軸）
# docs/04_詳細設計/01_適合仕様/09_テナント容量適合仕様.md §scenarios の SoT
# シナリオは quota_class（次元軸）× Litmus chaos scenario × assertion_id の 3 元で宣言する。
# CI 整合 1: classes.yaml の全 quota_class がこのファイルの Litmus chaos scenario でカバーされること。
# CI 整合 2: noisy neighbor isolation property assertion が green であること。

# シナリオ定義バージョン
apiVersion: k1s0/v1

# リソース種別: quota_scenario_catalog（次元軸シナリオ定義）
kind: QuotaScenarioCatalog

# メタデータ
metadata:
  # ファイル名と一致させる
  name: k1s0-tier2-quota-scenarios
  # 適合仕様のリファレンス
  spec_reference: docs/04_詳細設計/01_適合仕様/09_テナント容量適合仕様.md
  # quota_class 次元軸の参照先
  class_ref: src/tier2/quota/classes.yaml
  # per-action threshold の参照先（サブスクリプション tier）
  tier_ref: src/tier2/quota/quota_tier.yaml

# 6 主要シナリオ（spec §scenarios §製造業 pack stress test に準拠する）
scenarios:

  # シナリオ 1: noisy_neighbor_burst_does_not_break_neighbor_slo
  # spec §1.0.0 ship blocker: 「1 テナントの burst が他テナントの SLO を破らない」
  - id: noisy_neighbor_burst_does_not_break_neighbor_slo
    # 対応する quota_class（QPS burst が隣接テナントに影響を与えないことを検証する）
    quota_class: v1_per_tenant_qps
    # シナリオの説明
    description: "テナント A の QPS burst 中に隣接テナント B の SLO が維持されることを検証する"
    # Litmus chaos scenario の参照先（src/tier2/reliability/litmus/ に定義する）
    litmus_scenario_ref: src/tier2/reliability/litmus/chaos_experiments/noisy_neighbor.yaml
    # Litmus assertion ID（noisy neighbor isolation の機械証跡）
    assertion_id: "qa_noisy_neighbor_slo_isolation_001"
    # 期待する結果
    expected_outcome:
      # テナント A の burst 中にテナント B の P99 レイテンシが SLO 内に収まること
      neighbor_p99_within_slo: true
      # テナント A の burst リクエストが 429 で制限されること
      burst_tenant_throttled: true
    # 製造業 pack stress test §6: 隣接テナント burst 中の自テナント SLO 維持
    pack_stress_test_ref: "manufacturing_pack_stress_6"

  # シナリオ 2: qps_burst_returns_429
  # v1_per_tenant_qps の exhaustion_response: reject_429 を検証する
  - id: qps_burst_returns_429
    # 対応する quota_class
    quota_class: v1_per_tenant_qps
    # シナリオの説明
    description: "v1_per_tenant_qps 上限を超過したリクエストが 429 + Retry-After で拒否されることを検証する"
    # Litmus chaos scenario の参照先
    litmus_scenario_ref: src/tier2/quota/litmus/scenarios/qps_burst.yaml
    # Litmus assertion ID
    assertion_id: "qa_qps_burst_429_001"
    # 期待する結果
    expected_outcome:
      # 上限超過リクエストが HTTP 429 で拒否されること
      http_status_on_excess: 429
      # Retry-After ヘッダが設定されること
      retry_after_header_present: true
    # 製造業 pack stress test §1: 業務担当 SPA の API burst
    pack_stress_test_ref: "manufacturing_pack_stress_1"

  # シナリオ 3: concurrency_queue_drains_under_deadline
  # v1_per_tenant_concurrency の exhaustion_response: queue_with_timeout を検証する
  - id: concurrency_queue_drains_under_deadline
    # 対応する quota_class
    quota_class: v1_per_tenant_concurrency
    # シナリオの説明
    description: "v1_per_tenant_concurrency 上限到達時に queue に積まれたリクエストが deadline 内に処理されることを検証する"
    # Litmus chaos scenario の参照先
    litmus_scenario_ref: src/tier2/quota/litmus/scenarios/concurrency_queue.yaml
    # Litmus assertion ID
    assertion_id: "qa_concurrency_queue_deadline_001"
    # 期待する結果
    expected_outcome:
      # queue 内のリクエストが deadline 内（medium_1m = 60 秒以内）に処理されること
      queue_drain_within_deadline_ms: 60000
      # deadline 超過リクエストが適切なエラーで返却されること
      deadline_exceeded_handled: true
    # 製造業 pack stress test §2: 注文一括投入（concurrency queue）
    pack_stress_test_ref: "manufacturing_pack_stress_2"

  # シナリオ 4: volume_overflow_to_cold_succeeds
  # v1_per_tenant_volume の exhaustion_response: overflow_to_cold を検証する
  - id: volume_overflow_to_cold_succeeds
    # 対応する quota_class
    quota_class: v1_per_tenant_volume
    # シナリオの説明
    description: "v1_per_tenant_volume 上限到達時に hot SSD → cold Ceph RGW へのオーバーフローが正常に動作することを検証する"
    # Litmus chaos scenario の参照先
    litmus_scenario_ref: src/tier2/quota/litmus/scenarios/volume_overflow.yaml
    # Litmus assertion ID
    assertion_id: "qa_volume_overflow_cold_001"
    # 期待する結果
    expected_outcome:
      # hot ストレージ上限到達後に cold へのオーバーフローが発生すること
      cold_overflow_triggered: true
      # オーバーフロー後もデータが正常に読み書きできること
      data_accessible_after_overflow: true
    # 製造業 pack stress test §3: 図面アップロード（volume overflow to cold）
    pack_stress_test_ref: "manufacturing_pack_stress_3"

  # シナリオ 5: compute_priority_shed_correct_order
  # v1_per_tenant_compute の exhaustion_response: shed_by_priority を検証する
  - id: compute_priority_shed_correct_order
    # 対応する quota_class
    quota_class: v1_per_tenant_compute
    # シナリオの説明
    description: "v1_per_tenant_compute 上限到達時に priority_class の低いタスクから正しい順序で shed されることを検証する"
    # Litmus chaos scenario の参照先
    litmus_scenario_ref: src/tier2/quota/litmus/scenarios/compute_shed.yaml
    # Litmus assertion ID
    assertion_id: "qa_compute_shed_priority_001"
    # 期待する結果
    expected_outcome:
      # priority_class の低いタスクが先に shed されること
      shed_order_by_priority: true
      # 高 priority タスクが継続して実行されること
      high_priority_continues: true
    # 製造業 pack stress test §4: 在庫予測 ML inference 集中（shed_by_priority）
    pack_stress_test_ref: "manufacturing_pack_stress_4"

  # シナリオ 6: kafka_partition_rebalance_under_global_share
  # v1_global_fair_queue の exhaustion_response: partition_rebalance を検証する
  - id: kafka_partition_rebalance_under_global_share
    # 対応する quota_class
    quota_class: v1_global_fair_queue
    # シナリオの説明
    description: "全テナント横断 Kafka traffic burst 時に partition rebalance が公平に実施されることを検証する"
    # Litmus chaos scenario の参照先
    litmus_scenario_ref: src/tier2/reliability/litmus/chaos_experiments/partition_rebalance.yaml
    # Litmus assertion ID
    assertion_id: "qa_kafka_global_fair_queue_001"
    # 期待する結果
    expected_outcome:
      # partition rebalance 後に全テナントの throughput が均等に分配されること
      global_fair_distribution: true
      # rebalance 中の message loss がゼロであること
      no_message_loss_during_rebalance: true
    # 製造業 pack stress test §5: Domain Event burst（global_fair_queue partition_rebalance）
    pack_stress_test_ref: "manufacturing_pack_stress_5"
