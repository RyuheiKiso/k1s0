# local_rate_limit_filter.yaml — Envoy Gateway Local Rate Limit filter
# テナント容量適合仕様 09: v1_per_tenant_qps enforcement 層1
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: k1s0-per-tenant-rate-limit
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tier2-api
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - headers:
                - name: X-K1s0-Tenant-Id
                  type: Distinct
          limit:
            requests: 1000
            unit: Second
