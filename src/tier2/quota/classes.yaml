# k1s0 tier2 テナント容量クラス定義
# テナント容量適合仕様 09 の quota_class を物理化する
# 5 つの quota_class でテナントの利用上限を階層的に定義する

# quota_class 定義バージョン
apiVersion: k1s0/v1

# リソース種別: quota_class_catalog
kind: QuotaClassCatalog

# メタデータ
metadata:
  # ファイル名と一致させる
  name: k1s0-tier2-quota-classes
  # 適合仕様のリファレンス
  spec_reference: docs/04_詳細設計/01_適合仕様/09_テナント容量適合仕様.md

# quota_class 一覧（5 クラス）
quota_classes:
  # v1_lite: 最小構成クラス（試用・開発用途）
  - id: v1_lite
    # 表示名（業界固有語禁止: vocabulary.yaml の翻訳を使う）
    display_name: Lite
    # クラスの説明
    description: 試用・小規模開発向けの最小構成クラス
    # API リクエスト上限（1 時間あたり）
    api_requests_per_hour: 1000
    # 同時接続 DB コネクション数の上限
    db_connections_max: 5
    # ストレージ上限（GB）
    storage_gb_max: 10
    # Kafka メッセージ上限（1 日あたり）
    kafka_messages_per_day: 10000
    # テナント数の上限（プラットフォーム全体）
    tenant_count_max: 100

  # v1_standard: 標準クラス（一般的な業務用途）
  - id: v1_standard
    # 表示名
    display_name: Standard
    # クラスの説明
    description: 一般的な業務用途向けの標準クラス
    # API リクエスト上限（1 時間あたり）
    api_requests_per_hour: 10000
    # 同時接続 DB コネクション数の上限
    db_connections_max: 20
    # ストレージ上限（GB）
    storage_gb_max: 100
    # Kafka メッセージ上限（1 日あたり）
    kafka_messages_per_day: 100000
    # テナント数の上限
    tenant_count_max: 1000

  # v1_professional: プロフェッショナルクラス（大規模業務用途）
  - id: v1_professional
    # 表示名
    display_name: Professional
    # クラスの説明
    description: 大規模業務用途向けのプロフェッショナルクラス
    # API リクエスト上限（1 時間あたり）
    api_requests_per_hour: 100000
    # 同時接続 DB コネクション数の上限
    db_connections_max: 50
    # ストレージ上限（GB）
    storage_gb_max: 1000
    # Kafka メッセージ上限（1 日あたり）
    kafka_messages_per_day: 1000000
    # テナント数の上限
    tenant_count_max: 500

  # v1_enterprise: エンタープライズクラス（大企業・高負荷用途）
  - id: v1_enterprise
    # 表示名
    display_name: Enterprise
    # クラスの説明
    description: 大企業・高負荷業務向けのエンタープライズクラス
    # API リクエスト上限（1 時間あたり）
    api_requests_per_hour: 1000000
    # 同時接続 DB コネクション数の上限
    db_connections_max: 200
    # ストレージ上限（GB）
    storage_gb_max: 10000
    # Kafka メッセージ上限（1 日あたり）
    kafka_messages_per_day: 10000000
    # テナント数の上限
    tenant_count_max: 100

  # v1_dedicated: 専有クラス（物理分離・最高性能）
  - id: v1_dedicated
    # 表示名
    display_name: Dedicated
    # クラスの説明
    description: 物理分離・最高性能の専有クラス（テナント専用インスタンス）
    # API リクエスト上限（制限なし: null で表現する）
    api_requests_per_hour: null
    # 同時接続 DB コネクション数の上限（テナント専用インスタンスのため専有）
    db_connections_max: null
    # ストレージ上限（null = 専用インスタンスで上限なし）
    storage_gb_max: null
    # Kafka メッセージ上限（null = 専用インスタンスで上限なし）
    kafka_messages_per_day: null
    # テナント数の上限（1 テナント専有）
    tenant_count_max: 1
