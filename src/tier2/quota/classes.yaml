# classes.yaml — k1s0 tier2 quota_class 定義（次元軸）
# docs/04_詳細設計/01_適合仕様/09_テナント容量適合仕様.md §v1 quota_class セット の SoT
# quota_class は bundle: class 1 値が enforcement_layer / fairness_model / burst_window /
# exhaustion_response の 4 dimension を一意に導出する。dimension override 禁止。
# サブスクリプション tier の閾値定義（per-action threshold）は quota_tier.yaml を参照すること。

# quota_class 定義バージョン
apiVersion: k1s0/v1

# リソース種別: quota_class_catalog（次元軸定義）
kind: QuotaClassCatalog

# メタデータ
metadata:
  # ファイル名と一致させる
  name: k1s0-tier2-quota-classes
  # 適合仕様のリファレンス
  spec_reference: docs/04_詳細設計/01_適合仕様/09_テナント容量適合仕様.md
  # サブスクリプション tier の閾値定義は quota_tier.yaml で管理する
  tier_ref: src/tier2/quota/quota_tier.yaml

# quota_class 一覧（5 クラス、次元軸定義）
# class 1 値が 4 dimension を一意に導出する bundle 設計（spec §設計原則 §quota_class は bundle）
quota_classes:

  # v1_per_tenant_qps: per-tenant API QPS 制限
  # enforcement: Envoy Gateway Local Rate Limit フィルタ（ingress 層）
  - id: v1_per_tenant_qps
    # 人間可読な説明
    description: "per-tenant 単位の API QPS を Envoy ingress で制限する"
    # 4 dimension の bundle 定義（spec §dimension の根拠 に準拠する）
    # enforcement_layer: 物理 enforcement の所在（ingress）
    enforcement_layer: envoy_local_rate_limit
    # fairness_model: per_tenant（テナント単位の公平制御）
    fairness_model: per_tenant
    # burst_window: 1 秒（短期バースト許容）
    burst_window: short_1s
    # exhaustion_response: 429 即時返却 + Retry-After ヘッダ
    exhaustion_response: reject_429
    # 典型用途: per-tenant API QPS、ingress ゲートウェイの rate limiter
    typical_use_cases:
      - "per-tenant API QPS enforcement（Envoy Gateway Local Rate Limit）"
      - "burst 倍率 2x まで許容した上で 429 返却"
    # enforcement の設定参照
    enforcement_config_ref: src/tier2/quota/envoy/

  # v1_per_tenant_concurrency: per-tenant 同時実行上限
  # enforcement: Library token bucket（in-process）
  - id: v1_per_tenant_concurrency
    # 人間可読な説明
    description: "per-tenant 同時実行上限を Library token bucket で制限する"
    # enforcement_layer: Library 内の semaphore / token bucket（in-process 層）
    enforcement_layer: library_token_bucket
    # fairness_model: per_tenant_per_action（アクション単位のテナント制御）
    fairness_model: per_tenant_per_action
    # burst_window: 1 分（中期バースト許容）
    burst_window: medium_1m
    # exhaustion_response: queue に積んで deadline 超過で打ち切り
    exhaustion_response: queue_with_timeout
    # 典型用途: Workflow 同時実行数、long-poll 保持数、DB コネクション数
    typical_use_cases:
      - "per-tenant Workflow concurrent execution 上限"
      - "long-poll 同時保持数の上限（Library semaphore）"
      - "DB コネクション pool サイズ制限"

  # v1_per_tenant_volume: per-tenant ストレージ volume 制限
  # enforcement: storage / broker layer（Rook+Ceph / CloudNativePG / Kafka 等）
  - id: v1_per_tenant_volume
    # 人間可読な説明
    description: "per-tenant ストレージ byte / event count を storage layer で制限する"
    # enforcement_layer: storage layer（Rook+Ceph / CloudNativePG tablespace metering）
    enforcement_layer: storage_layer_quota
    # fairness_model: per_tenant（テナント単位のストレージ公平制御）
    fairness_model: per_tenant
    # burst_window: 1 時間（長期バースト許容）
    burst_window: long_1h
    # exhaustion_response: hot SSD → cold S3=Ceph RGW へのオーバーフロー
    exhaustion_response: overflow_to_cold
    # 典型用途: ストレージ byte 上限、event count 上限、row count 上限
    typical_use_cases:
      - "Rook+Ceph namespace / pool quota（ストレージ byte 上限）"
      - "CloudNativePG tablespace metering（row count 上限）"
      - "ClickHouse テナント別 retention TTL"
      - "Kafka per-tenant topic quota"

  # v1_per_tenant_compute: per-tenant CPU / GPU / memory 制限
  # enforcement: OSS native quota（Temporal / KEDA / pgvector 等）
  - id: v1_per_tenant_compute
    # 人間可読な説明
    description: "per-tenant CPU / GPU / memory を OSS native quota で制限する"
    # enforcement_layer: 各 OSS の native quota（Temporal namespace quota / KEDA ScaledObject）
    enforcement_layer: oss_native_quota
    # fairness_model: per_tenant_per_action（アクション単位のテナント制御）
    fairness_model: per_tenant_per_action
    # burst_window: 1 分（中期バースト許容）
    burst_window: medium_1m
    # exhaustion_response: 優先度に応じた shed（priority_class の低いものから切り捨て）
    exhaustion_response: shed_by_priority
    # 典型用途: Workflow 実行時間、vector search QPS、ML inference 時間
    typical_use_cases:
      - "Temporal namespace 別 concurrent execution quota"
      - "KEDA ScaledObject の per-tenant scope"
      - "pgvector workload pool / connection pool quota"
      - "Apache Superset row limit（per-tenant）"

  # v1_global_fair_queue: 全テナント横断の公平 share
  # enforcement: broker layer（Kafka / Istio destination rule 等）
  - id: v1_global_fair_queue
    # 人間可読な説明
    description: "全テナント横断の公平 share を broker layer で制御する"
    # enforcement_layer: broker layer（Kafka partition fairness / Istio destination rule）
    enforcement_layer: broker_layer
    # fairness_model: global_share（全テナント横断の公平分配）
    fairness_model: global_share
    # burst_window: continuous（連続的な監視・制御）
    burst_window: continuous
    # exhaustion_response: Kafka partition rebalance による自動再分配
    exhaustion_response: partition_rebalance
    # 典型用途: Kafka partition fairness、全テナント横断の global I/O fairness
    typical_use_cases:
      - "Kafka partition rebalance（全テナント横断公平分配）"
      - "Istio destination rule outlier detection"
      - "broker layer global I/O fairness"
    # enforcement の設定参照
    enforcement_config_ref: src/tier2/quota/kafka/
