# per_tenant_quota.yaml — Kafka per-tenant topic quota
# テナント容量適合仕様 09: v1_global_fair_queue 階層4
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: k1s0-quota-template
  annotations:
    k1s0.dev/quota-class: "v1_global_fair_queue"
spec:
  authentication:
    type: scram-sha-512
  quotas:
    producerByteRate: 10485760    # 10 MB/s per tenant
    consumerByteRate: 20971520    # 20 MB/s per tenant
    requestPercentage: 25         # 25% of CPU per tenant
