# threat_model_bindings.yaml — tier2 脅威モデルバインディング（5⁴=625 cell）
# docs/03_概要設計/03_tier2設計方針/19_セキュリティアーキテクチャ.md §脅威モデル の SoT
# 5 actor_class × 5 capability × 5 surface × 5 asset = 625 cell の cross-product を宣言する。
# 各 cell に reachable mitigation pointer ≥ 1 を保証する（textual cap 5%、boundary cap 0%）。

# バインディングスキーマバージョン
schema_version: "2.0"
# 対象軸
axis: tier2
# 設計方針参照
design_policy: "19"
# 適合仕様参照
spec_reference: "docs/04_詳細設計/01_適合仕様/15_脅威モデル適合仕様.md"

# ────────────────────────────────────────────────
# 4 軸の値セット（各 5 値）
# ────────────────────────────────────────────────
axes:
  # actor_class: 脅威主体（誰が）
  actor_classes:
    - id: EU   # external_user: 認証済み外部利用者（テナント業務担当）
    - id: TO   # tenant_operator: テナント管理者
    - id: SE   # support_engineer: プラットフォームサポートエンジニア
    - id: PO   # platform_operator: プラットフォーム運用者
    - id: TA   # threat_actor: 悪意ある外部攻撃者

  # capability: 攻撃能力（どの手段で）
  capabilities:
    - id: NW   # network_access: ネットワークアクセス（HTTP/gRPC/WebSocket）
    - id: AU   # auth_bypass: 認証・認可バイパス
    - id: CD   # code_injection: コード・クエリ注入（SQLi / XSS / prototype pollution）
    - id: DM   # data_manipulation: データ直接操作（DB / ストレージ直叩き）
    - id: IC   # infra_control: インフラ制御（K8s API / Kyverno / OPA 操作）

  # surface: 攻撃面（どこから）
  surfaces:
    - id: NS   # north_south_api: 外部向け API（Envoy Gateway 経由）
    - id: EW   # east_west_api: 内部サービス間 API（mTLS）
    - id: PS   # persistence_layer: DB / ストレージ直接アクセス
    - id: AT   # audit_trail: 監査ログ改ざん
    - id: SS   # secret_store: シークレットストア（OpenBao / K8s Secret）

  # asset: 保護対象（何を守るか）
  assets:
    - id: BD   # business_data: 業務データ（purchase_order / inspection_result 等）
    - id: PI   # pii_data: 個人情報（PII クラスタ）
    - id: AL   # audit_log: 監査ログ
    - id: KE   # kek_material: KEK マテリアル（OpenBao Transit）
    - id: TC   # tenant_config: テナント設定・ABAC ポリシー

# ────────────────────────────────────────────────
# 軽減グループライブラリ（各 cell から参照する）
# ────────────────────────────────────────────────
mitigation_groups:
  # mg_rls: PostgreSQL RLS FORCE + atomic 三表書込
  - id: mg_rls
    controls:
      - impl_ref: "src/data/rls_policies/"
        control_type: preventive
        status: verified
      - impl_ref: "src/tier2/rust/src/atomic_triple_write.rs"
        control_type: preventive
        status: verified

  # mg_abac: Keycloak ABAC + OPA policy evaluation
  - id: mg_abac
    controls:
      - impl_ref: "src/tier2/abac/keycloak_policies.yaml"
        control_type: preventive
        status: verified
      - impl_ref: "src/tier2/abac/opa/bundle/policies/"
        control_type: preventive
        status: verified

  # mg_audit: pgaudit + hash_chain + RFC3161 + WORM
  - id: mg_audit
    controls:
      - impl_ref: "src/data/pgaudit_config/"
        control_type: detective
        status: verified
      - impl_ref: "src/tier2/audit/hash_chain.rs"
        control_type: preventive
        status: verified
      - impl_ref: "src/tier2/security/notary/rfc3161_config.yaml"
        control_type: preventive
        status: verified

  # mg_pii: PII 分離 + envelope encryption + crypto-shred
  - id: mg_pii
    controls:
      - impl_ref: "src/tier2/migrations/0006_pii_segregation.sql"
        control_type: preventive
        status: verified
      - impl_ref: "src/tier2/attachment/src/envelope_encryption.rs"
        control_type: preventive
        status: verified
      - impl_ref: "src/tier2/security/kek_shamir_config.yaml"
        control_type: preventive
        status: verified

  # mg_kek: OpenBao Transit + Shamir M-of-N + rotation policy
  - id: mg_kek
    controls:
      - impl_ref: "src/tier2/security/secret_rotation_policy.yaml"
        control_type: preventive
        status: verified
      - impl_ref: "src/tier2/security/kek_shamir_config.yaml"
        control_type: preventive
        status: verified

  # mg_auth: DPoP + BFF cookie-only + step-up auth
  - id: mg_auth
    controls:
      - impl_ref: "src/tier1/server/gateway/src/key_handle.rs"
        control_type: preventive
        status: verified
      - impl_ref: "src/tier2/admin/src/admin_boundary.rs"
        control_type: detective
        status: verified

  # mg_tls: TLS enforcement + mTLS (east-west)
  - id: mg_tls
    controls:
      - impl_ref: "src/infra/cluster/istio_mtls_policy.yaml"
        control_type: preventive
        status: verified

  # mg_kyverno: Kyverno admission + OPA + cosign
  - id: mg_kyverno
    controls:
      - impl_ref: "src/tier2/kyverno/policies/"
        control_type: preventive
        status: verified
      - impl_ref: "src/tier2/security/crypto_agility.yaml"
        control_type: preventive
        status: verified

  # mg_supply: cargo-deny + cosign + SBOM + SLSA
  - id: mg_supply
    controls:
      - impl_ref: "src/tier2/rust/deny.toml"
        control_type: preventive
        status: verified
      - impl_ref: "src/tier2/security/notary/sigstore_transparency.yaml"
        control_type: preventive
        status: verified

  # mg_dual: dual sign-off workflow
  - id: mg_dual
    controls:
      - impl_ref: "src/tier2/lifecycle/dual_signoff_workflow.yaml"
        control_type: preventive
        status: verified

