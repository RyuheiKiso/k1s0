# tier2 シークレットローテーションポリシー（設計方針 19 / セキュリティアーキテクチャ）
# OpenBao Transit を使用したシークレットのローテーションスケジュールを定義する
# 注意: wall clock TTL 禁止規約により、期間は HLC に基づく相対値で管理する

# ポリシースキーマバージョン
schema_version: "1.0"
# 対象軸
axis: tier2

# シークレットローテーションスケジュール
rotation_schedules:

  # データ暗号化キーハンドル（OpenBao Transit KEK）
  - secret_name: key_handle
    # ローテーション周期（90 日）
    rotation_period_days: 90
    # 旧鍵の保持期間（ローテーション後も旧データの復号に使用する）
    retention_period_days: 180
    # ローテーション方式
    rotation_method: openBao_transit_rewrap
    # ローテーション失敗時のフォールバック: 旧鍵での復号を継続する
    fallback_on_failure: use_previous_version
    # ローテーション通知先
    notification_channel: "#k1s0-security-alerts"

  # セッションキー（Keycloak JWT 署名用）
  - secret_name: session_key
    # ローテーション周期（8 時間）
    rotation_period_hours: 8
    # 旧鍵の保持期間（セッション有効期限内のトークン検証に使用する）
    retention_period_hours: 16
    # ローテーション方式
    rotation_method: keycloak_realm_key_rotation
    # ローテーション失敗時のフォールバック: 旧セッションキーでの検証を継続する
    fallback_on_failure: use_previous_version
    # ローテーション通知先
    notification_channel: "#k1s0-security-alerts"

  # バックアップ暗号化キー（Barman バックアップの暗号化に使用する）
  - secret_name: backup_key
    # ローテーション周期（365 日）
    rotation_period_days: 365
    # 旧鍵の保持期間（過去バックアップの復号に使用する）
    retention_period_days: 730
    # ローテーション方式
    rotation_method: openBao_transit_rewrap
    # ローテーション失敗時のフォールバック: 旧バックアップキーでの復号を継続する
    fallback_on_failure: use_previous_version
    # ローテーション通知先
    notification_channel: "#k1s0-security-alerts"
