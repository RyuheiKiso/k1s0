# secret_rotation_policy.yaml — tier2 シークレットローテーションポリシー（設計方針 19）
# docs/03_概要設計/03_tier2設計方針/19_セキュリティアーキテクチャ.md §Secret rotation の SoT
# 8 secret class × cadence × OpenBao Transit lease + Argo Workflow + cert-manager + ESO を宣言する。
# 注意: wall clock TTL 禁止規約により、期間は HLC に基づく相対値で管理する。

# ポリシースキーマバージョン
schema_version: "2.0"
# 対象軸
axis: tier2
# 適合仕様参照
spec_reference: "docs/03_概要設計/03_tier2設計方針/19_セキュリティアーキテクチャ.md"

# 8 secret class × rotation_schedule（spec §Secret rotation に準拠する）
rotation_schedules:

  # ────── 1. authn_token: 認証トークン（Keycloak JWT 署名用セッションキー）──────
  - secret_class: authn_token
    # secret の説明
    description: "Keycloak JWT / OIDC アクセストークン署名キー（per-realm per-client）"
    # ローテーション周期（8 時間: アクセストークン有効期限と同期する）
    rotation_cadence:
      period_hours: 8
    # 旧鍵の保持期間（有効なセッションが残る間は旧鍵で検証を継続する）
    retention_after_rotation_hours: 16
    # OpenBao Transit で管理する（Keycloak realm key rotation API を経由する）
    enforcement:
      # OpenBao Transit でのキー管理
      openbao_transit: true
      # Keycloak Realm Key Provider との連携
      keycloak_realm_key_rotation: true
      # Argo Workflow による自動ローテーション Workflow
      argo_workflow_ref: "src/tier2/lifecycle/argo/key_rotation_workflow.yaml"
    # ローテーション失敗時のフォールバック
    fallback_on_failure: use_previous_version
    # アラート通知先
    notification_channel: "#k1s0-security-alerts"

  # ────── 2. api_key: API キー（外部システム統合用静的キー）──────
  - secret_class: api_key
    # secret の説明
    description: "外部システム統合用 API キー（webhook / ERP 連携 / 外部 SaaS 統合）"
    # ローテーション周期（90 日: 業務サイクルと整合する）
    rotation_cadence:
      period_days: 90
    # 旧鍵の保持期間（移行猶予期間 + バッファ）
    retention_after_rotation_days: 14
    # External Secrets Operator（ESO）で K8s Secret に注入する
    enforcement:
      # OpenBao の Secret Engine で管理する
      openbao_transit: false
      openbao_kv: true
      # External Secrets Operator で K8s Secret に同期する
      external_secrets_operator: true
      # cert-manager 不使用（API キーは証明書ではない）
      cert_manager: false
      # Argo Workflow による自動ローテーション
      argo_workflow_ref: "src/tier2/lifecycle/argo/api_key_rotation_workflow.yaml"
    # ローテーション失敗時のフォールバック
    fallback_on_failure: use_previous_version
    # アラート通知先
    notification_channel: "#k1s0-security-alerts"

  # ────── 3. db_password: DB パスワード（PostgreSQL 接続認証）──────
  - secret_class: db_password
    # secret の説明
    description: "PostgreSQL 接続認証パスワード（application user per tenant cluster）"
    # ローテーション周期（30 日: DB アクセス権限審査周期）
    rotation_cadence:
      period_days: 30
    # 旧パスワードの保持期間（接続プール再接続の猶予）
    retention_after_rotation_days: 1
    # OpenBao の Database Secret Engine で自動生成・ローテーションする
    enforcement:
      # OpenBao Database Secret Engine（動的 credential 発行）
      openbao_database_engine: true
      # OpenBao Transit は不使用（Database Engine が直接 PostgreSQL ローテーションを担う）
      openbao_transit: false
      # External Secrets Operator で K8s Secret に注入する
      external_secrets_operator: true
      # Argo Workflow での手動介入ガードレール
      argo_workflow_ref: "src/tier2/lifecycle/argo/db_credential_rotation_workflow.yaml"
    # ローテーション失敗時のフォールバック
    fallback_on_failure: use_previous_version
    # アラート通知先
    notification_channel: "#k1s0-security-alerts"

  # ────── 4. kek: Key Encryption Key（OpenBao Transit マスター KEK）──────
  - secret_class: kek
    # secret の説明
    description: "OpenBao Transit の KEK（データ暗号化鍵の親鍵、Shamir M=3/N=5 分散管理）"
    # ローテーション周期（90 日: NIST SP 800-57 推奨周期）
    rotation_cadence:
      period_days: 90
    # 旧 KEK の保持期間（既存 DEK の rewrap が完了するまで保持する）
    retention_after_rotation_days: 180
    # OpenBao Transit rewrap + Shamir M-of-N 解封が必須
    enforcement:
      # OpenBao Transit Key Rotation（rewrap old DEK）
      openbao_transit: true
      openbao_transit_rewrap: true
      # Shamir M=3/N=5 解封セレモニーが必須（自動ローテーション禁止）
      shamir_mof_n_required: true
      shamir_threshold: 3
      shamir_shares: 5
      # Argo Workflow による dual sign-off ローテーション Workflow
      argo_workflow_ref: "src/tier2/lifecycle/argo/kek_rotation_workflow.yaml"
    # KEK のローテーション失敗時は旧 KEK での復号を継続する
    fallback_on_failure: use_previous_version
    # KEK ローテーションはセキュリティアラートに加え緊急チームにも通知する
    notification_channel: "#k1s0-security-critical"

  # ────── 5. dek: Data Encryption Key（エンベロープ暗号化の DEK）──────
  - secret_class: dek
    # secret の説明
    description: "エンベロープ暗号化の DEK（添付ファイル / PII クラスタの対称暗号化鍵）"
    # DEK は保存データごとに一意生成（ローテーション = KEK rewrap で対応する）
    rotation_cadence:
      trigger: kek_rotation
    # 旧 DEK の保持期間（KEK ローテーション完了まで旧 DEK で復号可能にする）
    retention_after_rotation_days: 30
    # DEK 自体は OpenBao Transit の data key derive で生成する
    enforcement:
      # OpenBao Transit の datakey derive で DEK を生成する
      openbao_transit_datakey: true
      # KEK ローテーション時に DEK を自動 rewrap する
      openbao_transit_rewrap: true
      # Argo Workflow による定期 rewrap drill
      argo_workflow_ref: "src/tier2/lifecycle/argo/dek_rewrap_workflow.yaml"
    # ローテーション失敗時のフォールバック
    fallback_on_failure: use_previous_version
    # アラート通知先
    notification_channel: "#k1s0-security-alerts"

  # ────── 6. tls: TLS 証明書（サービス間 mTLS / ingress TLS）──────
  - secret_class: tls
    # secret の説明
    description: "サービス間 mTLS 証明書 + Ingress TLS 証明書（cert-manager で管理する）"
    # ローテーション周期（90 日: Let's Encrypt 推奨 + 安全マージン）
    rotation_cadence:
      period_days: 90
      # 有効期限の 2/3 を過ぎたら自動更新する（cert-manager renewBefore）
      renew_before_days: 30
    # 旧証明書の保持期間（接続の自然な termination を待つ）
    retention_after_rotation_days: 1
    # cert-manager による自動管理
    enforcement:
      # cert-manager で証明書を管理する（ClusterIssuer / Certificate CRD）
      cert_manager: true
      # Istio Service Mesh の mTLS: cert-manager が Istio CA に証明書を提供する
      istio_mtls: true
      # OpenBao Transit 不使用（cert-manager が PKI を担う）
      openbao_transit: false
    # ローテーション失敗時のフォールバック
    fallback_on_failure: use_previous_version
    # アラート通知先
    notification_channel: "#k1s0-security-alerts"

  # ────── 7. signing: 署名キー（Cosign / SLSA provenance / RFC 3161 TSA）──────
  - secret_class: signing
    # secret の説明
    description: "Cosign コンテナ署名キー + SLSA provenance 署名 + RFC 3161 TSA 署名"
    # ローテーション周期（365 日: 年次キーリタイア + 後継鍵発行）
    rotation_cadence:
      period_days: 365
    # 旧署名キーの保持期間（過去の署名を検証可能に保つ）
    retention_after_rotation_days: 730
    # OpenBao Transit + Cosign keyless Sigstore
    enforcement:
      # Cosign keyless（Fulcio / Rekor による keyless 署名）を優先する
      cosign_keyless: true
      # フォールバック: OpenBao Transit で ECDSA 署名鍵を管理する
      openbao_transit: true
      # Argo Workflow による年次キーリタイアセレモニー
      argo_workflow_ref: "src/tier2/lifecycle/argo/signing_key_rotation_workflow.yaml"
      # dual sign-off が必須（Cosign keyless は Sigstore transparency log で公証）
      dual_signoff_required: true
    # ローテーション失敗時のフォールバック
    fallback_on_failure: use_previous_version
    # アラート通知先
    notification_channel: "#k1s0-security-critical"

  # ────── 8. ssh: SSH キー（オペレーター SSH / GitHub Actions deployment key）──────
  - secret_class: ssh
    # secret の説明
    description: "オペレーター SSH キー + GitHub Actions deployment key + bastion host 認証"
    # ローテーション周期（180 日: 人事異動サイクルに合わせた半年次ローテーション）
    rotation_cadence:
      period_days: 180
    # 旧 SSH キーの保持期間（アクセス切替猶予）
    retention_after_rotation_days: 7
    # OpenBao SSH Secret Engine + External Secrets Operator
    enforcement:
      # OpenBao SSH Secret Engine（動的 SSH certificate 発行）
      openbao_ssh_engine: true
      # External Secrets Operator で K8s Secret に注入する
      external_secrets_operator: true
      # Argo Workflow による定期ローテーション + 失効確認
      argo_workflow_ref: "src/tier2/lifecycle/argo/ssh_key_rotation_workflow.yaml"
      # 退職者対応: HR Workflow との連携で即時失効を可能にする
      immediate_revocation_supported: true
    # ローテーション失敗時のフォールバック
    fallback_on_failure: alert_and_manual
    # SSH キーローテーション失敗は即時アラート
    notification_channel: "#k1s0-security-critical"
