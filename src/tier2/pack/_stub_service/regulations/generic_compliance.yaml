# k1s0 tier2 _stub_service pack 汎用コンプライアンス要件定義
# 業界固有の規制（ISO 9001 / GMP / HACCP 等）を参照せず、業界横断的な汎用規制要件を定義する
# manufacturing pack の iso9001.yaml とは意図的に異なる語彙・構造を使用する

regulation:
  # 規制種別の識別子（業界横断の汎用識別子を使用する）
  regulation_id: generic_compliance_v1
  # 規制名称（業界中立な汎用コンプライアンス名称）
  name: "Generic Compliance Framework v1 — 業界横断汎用コンプライアンス"
  # 適用する k1s0 テーブルクラス
  applicable_table_classes:
    # 汎用リソース記録は tenant_scoped で管理する
    - tenant_scoped
    # 汎用マスタデータは tenant_master で管理する
    - tenant_master
  # 適用する tier2 制約
  constraints:
    # 記録の不変性: audit_event を append-only で保存する（削除禁止）
    - constraint_id: record_immutability
      # 説明（業界中立語を使用する）
      description: "汎用記録（GenericRecord）は不変とし、変更は新規バージョン追加のみ許容する"
      # 強制機構
      enforcement: "atomic_triple_write の audit_event は INSERT のみ（UPDATE/DELETE 禁止）"
    # トレーサビリティ: 各バッチを aggregate_id で追跡する
    - constraint_id: traceability
      # 説明（業界中立語を使用する）
      description: "汎用バッチ（GenericBatch）の全状態変化を domain_event で追跡する"
      # 強制機構
      enforcement: "tenant_scoped + outbox 必須（atomic_triple_write 経由）"
    # テナント分離: 全データ操作は RLS FORCE で保護する
    - constraint_id: tenant_isolation
      # 説明（業界中立語を使用する）
      description: "全リソース操作はテナント境界（RLS FORCE）で強制分離する"
      # 強制機構
      enforcement: "SET LOCAL row_security = FORCE は全 DML に対して必須"
