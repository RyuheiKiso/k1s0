# k1s0 tier2 _stub_service pack 汎用帳票テンプレート定義
# 業界固有の帳票（FA 日次集計 / 品質検査報告等）を参照せず、業界横断的な汎用帳票を定義する
# manufacturing pack の fa_daily_summary.yaml とは意図的に異なる語彙・構造を使用する

# テンプレートを一意に識別する ID（tier2 ReportService が管理する）
template_id: stub_service_generic_report_v1

# テンプレートの表示名（i18n キー）
display_name_key: report.stub_service.generic_report.displayName

# バージョン（セマンティックバージョニング）
version: "1.0.0"

# 対象 pack（このテンプレートが属する pack）
pack_id: stub_service

# 帳票の列定義（出力 PDF / Excel の列構成）
columns:
  # 集計期間開始日列
  - column_id: period_start
    # 列の表示名（i18n キー）
    label_key: report.col.period_start
    # データ型（ISO 8601 日付文字列 YYYY-MM-DD）
    data_type: date
    # 列幅（ポイント単位）
    width_pt: 100
    # null 許容
    nullable: false

  # 集計期間終了日列
  - column_id: period_end
    # 列の表示名（i18n キー）
    label_key: report.col.period_end
    # データ型（ISO 8601 日付文字列 YYYY-MM-DD）
    data_type: date
    # 列幅（ポイント単位）
    width_pt: 100
    # null 許容
    nullable: false

  # リソース識別子列
  - column_id: resource_id
    # 列の表示名（i18n キー）
    label_key: report.col.resource_id
    # データ型（UUID 文字列）
    data_type: string
    # 列幅（ポイント単位）
    width_pt: 120
    # null 許容
    nullable: false

  # リソース種別列
  - column_id: domain_type
    # 列の表示名（i18n キー）
    label_key: report.col.domain_type
    # データ型（文字列）
    data_type: string
    # 列幅（ポイント単位）
    width_pt: 100
    # null 許容
    nullable: false

  # 処理済みバッチ数列
  - column_id: completed_batches
    # 列の表示名（i18n キー）
    label_key: report.col.completed_batches
    # データ型（整数）
    data_type: integer
    # 列幅（ポイント単位）
    width_pt: 100
    # null 許容
    nullable: false

  # 中断バッチ数列
  - column_id: aborted_batches
    # 列の表示名（i18n キー）
    label_key: report.col.aborted_batches
    # データ型（整数）
    data_type: integer
    # 列幅（ポイント単位）
    width_pt: 100
    # null 許容
    nullable: false

  # 適合評価件数列
  - column_id: conforming_evaluations
    # 列の表示名（i18n キー）
    label_key: report.col.conforming_evaluations
    # データ型（整数）
    data_type: integer
    # 列幅（ポイント単位）
    width_pt: 100
    # null 許容
    nullable: false

  # 不適合評価件数列
  - column_id: nonconforming_evaluations
    # 列の表示名（i18n キー）
    label_key: report.col.nonconforming_evaluations
    # データ型（整数）
    data_type: integer
    # 列幅（ポイント単位）
    width_pt: 100
    # null 許容
    nullable: false

  # 適合率列（0.0 〜 1.0 の小数）
  - column_id: conformance_rate
    # 列の表示名（i18n キー）
    label_key: report.col.conformance_rate
    # データ型（小数 / パーセント表示）
    data_type: decimal
    # 小数点以下桁数
    decimal_places: 4
    # 列幅（ポイント単位）
    width_pt: 80
    # null 許容
    nullable: false

# フィルター定義
filters:
  # 集計期間フィルター（from）
  - filter_id: period_from
    # フィルターの表示名（i18n キー）
    label_key: report.filter.period_from
    # データ型（YYYY-MM-DD）
    data_type: date
    # 必須かどうか
    required: true

  # 集計期間フィルター（to）
  - filter_id: period_to
    # フィルターの表示名（i18n キー）
    label_key: report.filter.period_to
    # データ型（YYYY-MM-DD）
    data_type: date
    # 必須かどうか
    required: true

  # リソース種別フィルター（複数選択可）
  - filter_id: domain_types
    # フィルターの表示名（i18n キー）
    label_key: report.filter.domain_types
    # データ型（配列）
    data_type: string_array
    # 必須かどうか（省略時は全種別を対象にする）
    required: false

# 出力フォーマット定義
output_format:
  # PDF 出力のサポート
  - format: pdf
    # PDF 出力が有効かどうか
    enabled: true
    # 用紙サイズ（A4 横）
    page_size: A4
    # 向き（横）
    orientation: landscape

  # Excel 出力のサポート
  - format: xlsx
    # Excel 出力が有効かどうか
    enabled: true
    # シート名（業界中立語を使用する）
    sheet_name: GenericReport
