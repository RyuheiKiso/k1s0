# k1s0 tier2 manufacturing pack 規制要件定義
# ISO 9001:2015 品質マネジメントシステムに関連する k1s0 tier2 制約を記述する

regulation:
  # 規制種別の識別子
  regulation_id: iso9001_2015
  # 規制名称
  name: "ISO 9001:2015 品質マネジメントシステム"
  # 適用する k1s0 テーブルクラス
  applicable_table_classes:
    # 品質記録は tenant_scoped で管理する
    - tenant_scoped
    # 製品仕様は tenant_master で管理する
    - tenant_master
  # 適用する tier2 制約
  constraints:
    # 品質記録の不変性: audit_event を append-only で保存する（削除禁止）
    - constraint_id: audit_immutability
      description: "品質記録（QualityRecord）は不変とし、変更は新規バージョン追加のみ許容する"
      enforcement: "atomic_triple_write の audit_event は INSERT のみ（UPDATE/DELETE 禁止）"
    # トレーサビリティ: 各生産バッチを aggregate_id で追跡する
    - constraint_id: traceability
      description: "生産バッチ（ProductionBatch）の全状態変化を domain_event で追跡する"
      enforcement: "tenant_scoped + outbox 必須（atomic_triple_write 経由）"
