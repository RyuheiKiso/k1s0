# k1s0 tier2 manufacturing pack HACCP 規制要件定義
# HACCP (Hazard Analysis Critical Control Point / Codex) に関連する k1s0 tier2 制約を記述する

regulation:
  # 規制種別の識別子
  regulation_id: haccp_codex
  # 規制名称
  name: "HACCP (Codex Alimentarius)"
  # 適用する k1s0 テーブルクラス
  applicable_table_classes:
    # CCP 監視記録は tenant_scoped で管理する
    - tenant_scoped
  # 適用する tier2 制約
  constraints:
    # CCP 監視間隔: センサー失敗時は SLO burn_rate alert + Companion sidecar OTel で通知する
    - constraint_id: ccp_monitoring_interval
      description: "CCP（Critical Control Point）監視は定期 interval 必須。センサー失敗時に alert を発火する"
      enforcement: "cross_slo.protection_layers_4tier の SLO burn_rate alert + Companion sidecar OTel"
    # 逸脱時是正処置: 逸脱検出時に corrective action workflow を発火する
    - constraint_id: deviation_corrective_action
      description: "逸脱検出時に corrective action Temporal Workflow を起動し Saga 補償を保証する"
      enforcement: "Temporal Workflow + Saga compensation + Outbox emit"
    # 記録保存期間 2 年: HACCP 記録は最低 2 年間 retention する
    - constraint_id: record_retention_2years
      description: "HACCP 監視記録は最低 2 年間 retention し preservation_substrates.lock.yaml の retention_policy に bind する"
      enforcement: "preservation_substrates.lock.yaml の retention_policy bind"
