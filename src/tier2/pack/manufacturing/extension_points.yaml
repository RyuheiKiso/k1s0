# extension_points.yaml — k1s0 tier2 manufacturing pack 拡張点宣言
# docs/03_概要設計/03_tier2設計方針/06_業務資産所有権.md §拡張点カタログ に準拠する。
# tier2 業界中立層が業界 pack に対して公開する extension_point の完全一覧。
# 各拡張点は signature / lv / invariants の 3 要素で宣言する。
# signature: tier2 が宣言するインターフェース（型シグネチャ）
# lv: L1+ / L2* / L3 の実装レベル強度
# invariants: pack 実装が満たさなければならない不変条件

extension_points:
  # ResourceLifecycle: リソース（設備相当）のライフサイクル hook
  - id: ep_resource_lifecycle
    signature: "fn on_resource_status_changed(ctx: &TenantCtx, resource_id: Uuid, from: ResourceStatus, to: ResourceStatus) -> Result<()>"
    lv: L3
    invariants:
      - "on_resource_status_changed は同一テナント内のリソースのみ操作する"
      - "from != to でなければ呼び出し不可（冪等性保証）"
    category: fa
    doc_ref: "docs/03_概要設計/03_tier2設計方針/06_業務資産所有権.md"

  # BatchLifecycle: 生産バッチ（ロット相当）のライフサイクル hook
  - id: ep_batch_lifecycle
    signature: "fn on_batch_status_changed(ctx: &TenantCtx, batch_id: Uuid, from: BatchStatus, to: BatchStatus) -> Result<()>"
    lv: L3
    invariants:
      - "on_batch_status_changed は同一テナント内のバッチのみ操作する"
      - "BatchStatus の遷移グラフ（FSM）に反する遷移は呼び出し不可"
    category: fa
    doc_ref: "docs/03_概要設計/03_tier2設計方針/13_状態遷移パターン.md"

  # InspectionResultPolicy: 検査結果判定ポリシー（合否ロジックの差し込み）
  - id: ep_inspection_result_policy
    signature: "fn evaluate_inspection(ctx: &TenantCtx, spec: &ItemSpecification, measurements: &[Measurement]) -> InspectionVerdict"
    lv: L2*
    invariants:
      - "evaluate_inspection は副作用を持たない（pure function）"
      - "InspectionVerdict は Pass / Fail / RequiresReview の 3 値のみ"
      - "measurements が空の場合は RequiresReview を返す"
    category: inspection
    doc_ref: "docs/03_概要設計/03_tier2設計方針/06_業務資産所有権.md"

  # ProcurementApprovalPolicy: 調達承認ポリシー（承認フロー差し込み）
  - id: ep_procurement_approval_policy
    signature: "fn requires_approval(ctx: &TenantCtx, order: &ProcurementOrder) -> ApprovalRequirement"
    lv: L2*
    invariants:
      - "requires_approval は副作用を持たない（pure function）"
      - "ApprovalRequirement は None / SingleApprover / MultiApprover の 3 値のみ"
      - "order.amount が閾値以上の場合は MultiApprover を返す（tenant の threshold 設定による）"
    category: procurement
    doc_ref: "docs/03_概要設計/03_tier2設計方針/09_権限モデル.md"

  # AuditEventEnricher: 監査イベントへの pack 固有フィールド追加 hook
  - id: ep_audit_event_enricher
    signature: "fn enrich_audit_event(ctx: &TenantCtx, event: &mut AuditEvent) -> Result<()>"
    lv: L1+
    invariants:
      - "enrich_audit_event は PII フィールドを追加禁止（AuditEvent.pii_fields は layer E が管理）"
      - "追加フィールドは pack_fields namespace に限定（他 namespace は上書き禁止）"
      - "enrich_audit_event は同一テナントのイベントのみ操作する"
    category: common
    doc_ref: "docs/03_概要設計/03_tier2設計方針/08_業務エラー監査コンプライアンス.md"

  # ItemSpecificationValidator: 品目仕様バリデーション hook
  - id: ep_item_specification_validator
    signature: "fn validate_item_spec(ctx: &TenantCtx, spec: &ItemSpecification) -> Vec<ValidationError>"
    lv: L2*
    invariants:
      - "validate_item_spec は副作用を持たない（pure function）"
      - "ValidationError は human-readable message と machine-readable code を持つ"
      - "返すリストが空の場合は合格とみなす"
    category: inspection
    doc_ref: "docs/03_概要設計/03_tier2設計方針/06_業務資産所有権.md"

  # CapacityConstraintProvider: リソース容量制約の差し込み
  - id: ep_capacity_constraint_provider
    signature: "fn get_capacity_constraints(ctx: &TenantCtx, resource_id: Uuid) -> Vec<CapacityConstraint>"
    lv: L1+
    invariants:
      - "返す CapacityConstraint のリソース ID は呼び出し時の resource_id と一致する"
      - "CapacityConstraint の validity_period は HLC タイムスタンプで表現する（wall-clock 禁止）"
    category: fa
    doc_ref: "docs/04_詳細設計/01_適合仕様/09_テナント容量適合仕様.md"

  # ScheduledJobHook: バッチ・スケジューラ job の前後 hook
  - id: ep_scheduled_job_hook
    signature: "fn on_job_start(ctx: &TenantCtx, job_id: Uuid) -> Result<()>; fn on_job_end(ctx: &TenantCtx, job_id: Uuid, result: &JobResult) -> Result<()>"
    lv: L2*
    invariants:
      - "on_job_start / on_job_end は同一 DB トランザクション内で呼び出す"
      - "on_job_start が Err を返した場合は job を開始しない"
    category: common
    doc_ref: "docs/03_概要設計/03_tier2設計方針/25_スケジューラ・バッチ.md"

  # ExportDataTransformer: バルクエクスポート時のデータ変換 hook
  - id: ep_export_data_transformer
    signature: "fn transform_for_export(ctx: &TenantCtx, record: &DomainRecord) -> ExportRecord"
    lv: L2*
    invariants:
      - "transform_for_export は副作用を持たない（pure function）"
      - "ExportRecord に PII フィールドが残る場合は redact_pii: true を設定する"
    category: common
    doc_ref: "docs/03_概要設計/03_tier2設計方針/20_データライフサイクル.md"

  # RetentionPolicyOverride: テナント固有 retention 上書き hook
  - id: ep_retention_policy_override
    signature: "fn get_retention_days(ctx: &TenantCtx, category: DataCategory) -> Option<u32>"
    lv: L1+
    invariants:
      - "None を返した場合はデフォルト retention_policy.yaml の値を使用する"
      - "返す日数はデフォルト値以上（テナントが retention を短縮禁止）"
    category: common
    doc_ref: "docs/03_概要設計/03_tier2設計方針/17_データ保持.md"
