# k1s0 tier2 manufacturing pack 品質検査帳票テンプレート定義
# tier3 ReportClient から tier2 ReportService BFF に対してテンプレート ID を指定してリクエストする
# columns / filters / output_format を宣言する（実装は tier2 側で行う）

# テンプレートを一意に識別する ID（tier2 ReportService が管理する）
template_id: manufacturing_quality_inspection_report_v1

# テンプレートの表示名（i18n キー）
display_name_key: report.manufacturing.quality_inspection.displayName

# バージョン（セマンティックバージョニング）
version: "1.0.0"

# 対象 pack（このテンプレートが属する pack）
pack_id: manufacturing

# 帳票の列定義（出力 PDF / Excel の列構成）
columns:
  # 検査 ID 列
  - column_id: inspection_id
    # 列の表示名（i18n キー）
    label_key: report.col.inspection_id
    # データ型
    data_type: string
    # 列幅（ポイント単位）
    width_pt: 80
    # null 許容
    nullable: false

  # 検査日時列
  - column_id: inspected_at
    # 列の表示名（i18n キー）
    label_key: report.col.inspected_at
    # データ型（ISO 8601 日時文字列）
    data_type: datetime
    # 列幅（ポイント単位）
    width_pt: 120
    # null 許容
    nullable: false

  # 工場 ID 列
  - column_id: plant_id
    # 列の表示名（i18n キー）
    label_key: report.col.plant_id
    # データ型
    data_type: string
    # 列幅（ポイント単位）
    width_pt: 80
    # null 許容
    nullable: false

  # 工場名列
  - column_id: plant_name
    # 列の表示名（i18n キー）
    label_key: report.col.plant_name
    # データ型
    data_type: string
    # 列幅（ポイント単位）
    width_pt: 160
    # null 許容
    nullable: false

  # 検査対象品目列
  - column_id: item_code
    # 列の表示名（i18n キー）
    label_key: report.col.item_code
    # データ型
    data_type: string
    # 列幅（ポイント単位）
    width_pt: 100
    # null 許容
    nullable: false

  # 検査結果列（合格 / 不合格）
  - column_id: result
    # 列の表示名（i18n キー）
    label_key: report.col.inspection_result
    # データ型（enum 値: pass / fail）
    data_type: enum
    # 有効な列挙値
    enum_values: [pass, fail]
    # 列幅（ポイント単位）
    width_pt: 80
    # null 許容
    nullable: false

  # 検査担当者 ID 列
  - column_id: inspector_id
    # 列の表示名（i18n キー）
    label_key: report.col.inspector_id
    # データ型
    data_type: string
    # 列幅（ポイント単位）
    width_pt: 100
    # null 許容
    nullable: false

  # 備考列
  - column_id: remarks
    # 列の表示名（i18n キー）
    label_key: report.col.remarks
    # データ型
    data_type: string
    # 列幅（ポイント単位）
    width_pt: 200
    # null 許容（備考は省略可能）
    nullable: true

# フィルター定義（帳票生成リクエスト時に渡せるフィルター条件）
filters:
  # 検査日時範囲フィルター（from）
  - filter_id: inspected_at_from
    # フィルターの表示名（i18n キー）
    label_key: report.filter.inspected_at_from
    # データ型
    data_type: datetime
    # 必須かどうか
    required: true

  # 検査日時範囲フィルター（to）
  - filter_id: inspected_at_to
    # フィルターの表示名（i18n キー）
    label_key: report.filter.inspected_at_to
    # データ型
    data_type: datetime
    # 必須かどうか
    required: true

  # 工場 ID フィルター（複数選択可）
  - filter_id: plant_ids
    # フィルターの表示名（i18n キー）
    label_key: report.filter.plant_ids
    # データ型（配列）
    data_type: string_array
    # 必須かどうか（省略時は全工場を対象にする）
    required: false

  # 検査結果フィルター（pass / fail）
  - filter_id: result
    # フィルターの表示名（i18n キー）
    label_key: report.filter.inspection_result
    # データ型（enum）
    data_type: enum
    # 有効な列挙値
    enum_values: [pass, fail]
    # 必須かどうか（省略時は全結果を対象にする）
    required: false

# 出力フォーマット定義（サポートする出力形式）
output_format:
  # PDF 出力のサポート
  - format: pdf
    # PDF 出力が有効かどうか
    enabled: true
    # 用紙サイズ（A4）
    page_size: A4
    # 向き（縦）
    orientation: portrait

  # Excel 出力のサポート
  - format: xlsx
    # Excel 出力が有効かどうか
    enabled: true
    # シート名
    sheet_name: 品質検査帳票
