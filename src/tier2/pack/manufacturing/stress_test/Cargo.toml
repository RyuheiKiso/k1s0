# Cargo.toml — 製造業 pack stress test クレート
# テナント容量適合仕様 09 §製造業 pack stress test 8 シナリオを定義する
# kind クラスタ + Testcontainers での統合テスト実行に使用する
[package]
# パッケージ名: tier2-manufacturing-stress-test
name = "tier2-manufacturing-stress-test"
# バージョン: 0.1.0
version = "0.1.0"
# Rust エディション: 2021 を使用する
edition = "2021"

[lib]
# lib.rs をライブラリクレートのエントリポイントとして指定する
path = "lib.rs"

[dependencies]
# uuid: テスト用テナント ID / aggregate ID に使用する
uuid = { version = "1", features = ["v4", "serde"] }
# serde: フィクスチャデータのシリアライズに使用する
serde = { version = "1", features = ["derive"] }
# serde_json: JSON フィクスチャの生成に使用する
serde_json = "1"
# tokio: 非同期テスト実行ランタイムに使用する
tokio = { version = "1", features = ["full"] }
# reqwest: Envoy / API への HTTP リクエスト送信に使用する
reqwest = { version = "0.12", features = ["json"] }
# tracing: テスト実行時の構造化ログに使用する
tracing = "0.1"
# anyhow: エラーハンドリングに使用する
anyhow = "1"

[dev-dependencies]
# tokio: 非同期テストランタイム (#[tokio::test] アトリビュートに使用する)
tokio = { version = "1", features = ["full"] }
