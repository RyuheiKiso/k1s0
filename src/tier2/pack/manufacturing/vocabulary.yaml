# k1s0 tier2 manufacturing pack 業界語彙 SoT
# 業界固有語（設備/ロット/品目/拠点/BOM 等）を内部識別子として管理する
# 公開 API は業界中立語（entity/resource/unit/location/specification）を使用する
# 命名禁則 CI lint がこのファイルを参照して公開 API の業界語混入を検出する

vocabulary:
  # ============================================================
  # 内部業界語 → 公開 API 業界中立語 のマッピング
  # 公開 API / 公開型名に左辺（業界語）を使うと CI fail になる
  # ============================================================

  # 設備 → ResourceUnit（製造機械・設備を表す中立語）
  - industry_term: "設備"
    neutral_term: "ResourceUnit"
    prohibited_in_public_api: true
    description: "製造ラインの機械・設備を表す集約エンティティ"

  # ロット → ProductionBatch（生産バッチを表す中立語）
  - industry_term: "ロット"
    neutral_term: "ProductionBatch"
    prohibited_in_public_api: true
    description: "一定数量の同一製品を同一条件で生産する単位"

  # 品目 → ItemSpecification（品目仕様を表す中立語）
  - industry_term: "品目"
    neutral_term: "ItemSpecification"
    prohibited_in_public_api: true
    description: "製品・材料・サービスの仕様記述"

  # 拠点 → OperationSite（操業拠点を表す中立語）
  - industry_term: "拠点"
    neutral_term: "OperationSite"
    prohibited_in_public_api: true
    description: "製造・物流・販売の操業拠点"

  # BOM → SpecificationTree（部品構成表を表す中立語）
  - industry_term: "BOM"
    neutral_term: "SpecificationTree"
    prohibited_in_public_api: true
    description: "製品を構成する部品・材料の階層リスト"

  # 検査結果 → QualityRecord（品質記録を表す中立語）
  - industry_term: "検査結果"
    neutral_term: "QualityRecord"
    prohibited_in_public_api: true
    description: "品質検査の結果記録（測定値・合否判定）"

  # 不良票 → NonconformanceReport（不適合報告を表す中立語）
  - industry_term: "不良票"
    neutral_term: "NonconformanceReport"
    prohibited_in_public_api: true
    description: "品質基準不適合の記録・処置管理"
