# k1s0-tier2-admin: 管理境界クレート（設計方針 14）
# AdminBoundaryGuard トレイトと AdminOperation 列挙型を提供する
[package]
# パッケージ名: k1s0-tier2-admin
name = "k1s0-tier2-admin"
# バージョン: 0.1.0
version = "0.1.0"
# Rust エディション: 2021 を使用する
edition = "2021"

[dependencies]
# uuid: テナント識別子型および操作 ID に使用する
uuid = { version = "1", features = ["v4", "serde"] }
# serde: 管理リクエスト / レスポンスのシリアライズに使用する
serde = { version = "1", features = ["derive"] }
# serde_json: JSON ライブラリ（AdminRequest ペイロードに使用する）
serde_json = "1"
# anyhow: エラーハンドリング
anyhow = "1"
# thiserror: 管理境界違反エラー型の定義に使用する
thiserror = "1"
