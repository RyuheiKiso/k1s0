# k1s0-tier2-integration: 外部システム統合クレート（設計方針 16）
# Webhook 配信および OAuth Token Exchange を提供する
[package]
# パッケージ名: k1s0-tier2-integration
name = "k1s0-tier2-integration"
# バージョン: 0.1.0
version = "0.1.0"
# Rust エディション: 2021 を使用する
edition = "2021"

[dependencies]
# uuid: リクエスト識別子型に使用する
uuid = { version = "1", features = ["v4", "serde"] }
# serde: Webhook ペイロードのシリアライズに使用する
serde = { version = "1", features = ["derive"] }
# serde_json: JSON ライブラリ（Webhook ペイロードの JSON 直列化に使用する）
serde_json = "1"
# anyhow: エラーハンドリング
anyhow = "1"
# hmac: HMAC-SHA256 署名計算に使用する
hmac = "0.12"
# sha2: SHA-256 ハッシュ計算に使用する（hmac と組み合わせる）
sha2 = "0.10"
# hex: HMAC バイト列を hex 文字列に変換する
hex = "0.4"
# tracing: 構造化ロギング（Webhook 配信および Token Exchange の debug ログに使用する）
tracing = "0.1"
# reqwest: HTTP クライアント（Webhook HTTP POST および Token Exchange HTTP POST に使用する）
reqwest = { version = "0.12", features = ["json"] }
# tokio: 非同期ランタイム（reqwest の async HTTP 実行に使用する）
tokio = { version = "1", features = ["full"] }
