# serviceaccount.yaml — k1s0-tier2 Helm チャート: ServiceAccount テンプレート
# k1s0-tier2 Pod が使用する Kubernetes ServiceAccount リソースの定義
# values.yaml の serviceAccount セクションから設定値を取得する
{{- if .Values.serviceAccount.create }}
apiVersion: v1
# Kubernetes ServiceAccount リソース種別
kind: ServiceAccount
metadata:
  # ServiceAccount 名（_helpers.tpl の k1s0-tier2.serviceAccountName から取得する）
  name: {{ include "k1s0-tier2.serviceAccountName" . }}
  # デプロイ先 Namespace（helm install の --namespace で指定する）
  namespace: {{ .Release.Namespace }}
  # ServiceAccount ラベル（Helm が管理するラベルセット）
  labels:
    {{- include "k1s0-tier2.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  # ServiceAccount アノテーション（values.yaml の serviceAccount.annotations から取得する）
  # IAM Roles for Service Accounts (IRSA) や Workload Identity の設定に使用する
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# ServiceAccount が自動マウントする API トークンを無効にする
# 必要な場合のみ明示的にマウントする（最小権限原則に従う）
automountServiceAccountToken: false
{{- end }}
