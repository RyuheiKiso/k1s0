# hpa.yaml — k1s0-tier2 Helm チャート: HorizontalPodAutoscaler テンプレート
# CPU 使用率 70% をターゲットとして Pod 数を自動スケールする HPA リソースの定義
# values.yaml の replicaCount を最小レプリカ数として使用する
apiVersion: autoscaling/v2
# Kubernetes HorizontalPodAutoscaler リソース種別
kind: HorizontalPodAutoscaler
metadata:
  # HPA 名（フルネームに -hpa サフィックスを付けて識別する）
  name: {{ include "k1s0-tier2.fullname" . }}-hpa
  # デプロイ先 Namespace（helm install の --namespace で指定する）
  namespace: {{ .Release.Namespace }}
  # HPA ラベル（Helm が管理するラベルセット）
  labels:
    {{- include "k1s0-tier2.labels" . | nindent 4 }}
spec:
  # スケール対象の Deployment を指定する
  scaleTargetRef:
    # スケール対象の API バージョンを設定する
    apiVersion: apps/v1
    # スケール対象の Kind を設定する
    kind: Deployment
    # スケール対象の Deployment 名（同一チャートの Deployment 名と一致させる）
    name: {{ include "k1s0-tier2.fullname" . }}
  # 最小レプリカ数（values.yaml の replicaCount から取得する）
  minReplicas: {{ .Values.replicaCount }}
  # 最大レプリカ数（最小レプリカ数の 5 倍を上限とする）
  maxReplicas: {{ mul .Values.replicaCount 5 }}
  # スケーリングメトリクス定義
  metrics:
    # CPU 使用率メトリクスによるスケーリング設定
    - type: Resource
      resource:
        # CPU メトリクスを指定する
        name: cpu
        target:
          # Utilization タイプ（Pod の CPU 使用率の平均を参照する）
          type: Utilization
          # CPU 使用率 70% を超えたらスケールアウトする
          averageUtilization: 70
