# ingress.yaml — k1s0-tier2 Helm チャート: Ingress テンプレート
# values.yaml の ingress セクションが有効な場合のみ作成する
# TLS を有効にして安全なエンドポイントを公開する
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
# Kubernetes Ingress リソース種別
kind: Ingress
metadata:
  # Ingress 名（フルネームに -ingress サフィックスを付けて識別する）
  name: {{ include "k1s0-tier2.fullname" . }}-ingress
  # デプロイ先 Namespace（helm install の --namespace で指定する）
  namespace: {{ .Release.Namespace }}
  # Ingress ラベル（Helm が管理するラベルセット）
  labels:
    {{- include "k1s0-tier2.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  # Ingress アノテーション（values.yaml の ingress.annotations から取得する）
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  # IngressClass 名（values.yaml の ingress.className から取得する）
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  # TLS 設定（values.yaml の ingress.tls から取得する）
  tls:
    {{- range .Values.ingress.tls }}
    # TLS エントリ（ホスト名と Secret 名のペア）
    - hosts:
        {{- range .hosts }}
        # TLS 対象ホスト名
        - {{ . | quote }}
        {{- end }}
      # TLS 証明書を保持する Secret 名
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  # ルーティングルール定義
  rules:
    {{- range .Values.ingress.hosts }}
    # ホスト別ルーティングルール
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          # パス別バックエンド定義
          - path: {{ .path }}
            # パスマッチタイプ（Prefix / Exact / ImplementationSpecific から選択する）
            pathType: {{ .pathType }}
            backend:
              service:
                # バックエンド Service 名（同一チャートの Service 名と一致させる）
                name: {{ include "k1s0-tier2.fullname" $ }}
                port:
                  # バックエンド Service のポート番号（values.yaml の service.port から取得する）
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
