# tier2 Helm チャートメタデータ（設計方針 22 / 配布形態）
# k1s0-tier2 の Helm チャートパッケージ定義
apiVersion: v2
# チャート名
name: k1s0-tier2
# チャートの説明
description: "k1s0 テナント分離プラットフォーム tier2 の Helm チャート（設計方針 22 / 配布形態）"
# チャートの種別（application: 実行可能なアプリケーション）
type: application
# チャートバージョン（SemVer 2.0 準拠）
version: "0.1.0"
# アプリケーションバージョン（OCI イメージのタグと対応する）
appVersion: "1.0.0"
# チャートのキーワード（Helm Hub での検索に使用する）
keywords:
  # マルチテナントプラットフォームキーワード
  - multitenant
  # Kubernetes 対応プラットフォームキーワード
  - kubernetes
  # k1s0 プロジェクト識別キーワード
  - k1s0
# チャートのメンテナー情報
maintainers:
  # チャートメンテナー名
  - name: k1s0-core-team
    # メンテナーの GitHub URL
    url: https://github.com/RyuheiKiso/k1s0
# Helm チャートが依存するチャートリスト（依存なし / 直接管理する）
dependencies: []
