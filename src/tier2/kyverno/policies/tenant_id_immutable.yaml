# tenant_id_immutable.yaml — Kyverno admission policy: tenant_id 不変保証
# tier2 適合仕様 10 テナント分離: tenant_id は CREATE 後に変更不可（物理 enforcement）
# spec: docs/04_詳細設計/01_適合仕様/10_テナント分離適合仕様.md §tenant_id 不変保証
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  # ポリシー名（k1s0 プレフィックスで名前衝突を防止する）
  name: k1s0-tenant-id-immutable
  annotations:
    # k1s0 spec 参照: tier2 テナント分離適合仕様と紐付ける
    k1s0.dev/spec: "detail.tier2.tenant_isolation_conformance"
spec:
  # Enforce モード: 違反した場合は admission を拒否する（Audit モードより強い物理保証）
  validationFailureAction: Enforce
  # background モード無効: UPDATE 操作のみ対象にするため false にする
  background: false
  rules:
    # テナント ID 変更拒否ルール
    - name: deny-tenant-id-change
      match:
        any:
          - resources:
              # Pod リソースを対象にする（tier2-* namespace 配下の全 Pod）
              kinds: [Pod]
              # tier2-* namespace パターンに一致する全 namespace を対象にする
              namespaces: ["tier2-*"]
      validate:
        # 違反メッセージ: tenant_id が変更された場合に表示するエラーメッセージ
        message: "tenant_id is immutable after creation (tier2 tenant isolation conformance)"
        deny:
          conditions:
            all:
              # UPDATE 操作のみ対象にする（CREATE は tenant_id の初期設定を許可する）
              - key: "{{ request.operation }}"
                operator: Equals
                value: UPDATE
              # UPDATE 後の tenant_id ラベルが UPDATE 前と異なる場合に拒否する
              - key: "{{ request.object.metadata.labels.\"app.tenant-id\" }}"
                operator: NotEquals
                value: "{{ request.oldObject.metadata.labels.\"app.tenant-id\" }}"
