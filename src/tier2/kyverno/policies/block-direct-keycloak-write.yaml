# block-direct-keycloak-write.yaml — Kyverno policy: Keycloak 管理 API への直接書き込み物理拒否
# tier2 適合仕様 10 テナント分離: keycloak-operator 以外の ServiceAccount から Keycloak 管理 API への書き込みを拒否する
# spec: docs/04_詳細設計/01_適合仕様/10_テナント分離適合仕様.md §keycloak-write-isolation
# Ingress / NetworkPolicy のうち keycloak admin ポート (8443) を参照するものを対象にする
apiVersion: kyverno.io/v1
# ClusterPolicy: クラスター全体に適用するポリシー種別
kind: ClusterPolicy
metadata:
  # ポリシー名（k1s0 プレフィックスで名前衝突を防止する）
  name: k1s0-block-direct-keycloak-write
  annotations:
    # k1s0 spec 参照: tier2 テナント分離適合仕様 Keycloak 書き込み分離と紐付ける
    k1s0.dev/spec: "detail.tier2.tenant_isolation_conformance.keycloak_write"
    # ポリシーの概要説明を記録する
    policies.kyverno.io/title: "Block Direct Keycloak Admin Write"
    # 違反カテゴリを分類する
    policies.kyverno.io/category: "Security"
    # ポリシーの詳細説明を記録する
    policies.kyverno.io/description: >-
      keycloak-operator ServiceAccount 以外からの Keycloak 管理 API (port 8443, path /auth/admin/*)
      への直接アクセスを許可する Ingress / NetworkPolicy の admission を拒否する。
spec:
  # Enforce モード: 違反リソースの admission request を即時拒否する
  validationFailureAction: Enforce
  # background モード有効: 既存リソースに対しても継続的にポリシーを適用する
  background: true
  rules:
    # ルール 1: Ingress リソースで Keycloak admin ポートへのルーティングを拒否する
    - name: deny-ingress-keycloak-admin-port
      match:
        any:
          - resources:
              # Ingress リソースを対象にする
              kinds: [Ingress]
              # tier2-* namespace パターンに一致する全 namespace を対象にする
              namespaces: ["tier2-*"]
      # サービスアカウントが keycloak-operator である場合はルールを除外する
      exclude:
        any:
          - subjects:
              # keycloak-operator ServiceAccount からのリクエストを許可する
              - kind: ServiceAccount
                # keycloak-operator が配置される namespace
                namespace: keycloak
                # keycloak-operator ServiceAccount 名
                name: keycloak-operator
      validate:
        # 違反メッセージ: keycloak-operator 以外からの Keycloak admin ポートへのルーティングを検出した場合のエラーメッセージ
        message: >-
          keycloak-operator ServiceAccount 以外から Keycloak 管理 API (port 8443)
          へルーティングする Ingress は作成できません (tier2 テナント分離適合仕様)
        # 拒否条件: backend.service.port.number が 8443 のルールが含まれる場合に拒否する
        deny:
          conditions:
            any:
              # Ingress spec.rules 内にポート 8443 を参照するバックエンドが存在する場合を拒否する
              - key: "{{ request.object.spec.rules[].http.paths[].backend.service.port.number }}"
                operator: AnyIn
                # Keycloak admin ポート番号を指定する
                value: [8443]

    # ルール 2: NetworkPolicy リソースで Keycloak admin ポートへのイングレスを拒否する
    - name: deny-networkpolicy-keycloak-admin-port
      match:
        any:
          - resources:
              # NetworkPolicy リソースを対象にする
              kinds: [NetworkPolicy]
              # tier2-* namespace パターンに一致する全 namespace を対象にする
              namespaces: ["tier2-*"]
      # サービスアカウントが keycloak-operator である場合はルールを除外する
      exclude:
        any:
          - subjects:
              # keycloak-operator ServiceAccount からのリクエストを許可する
              - kind: ServiceAccount
                # keycloak-operator が配置される namespace
                namespace: keycloak
                # keycloak-operator ServiceAccount 名
                name: keycloak-operator
      validate:
        # 違反メッセージ: keycloak admin ポートを許可する NetworkPolicy を検出した場合のエラーメッセージ
        message: >-
          keycloak-operator ServiceAccount 以外から Keycloak 管理 API (port 8443)
          へのイングレスを許可する NetworkPolicy は作成できません (tier2 テナント分離適合仕様)
        # 拒否条件: ingress.ports に 8443 が含まれる場合に拒否する
        deny:
          conditions:
            any:
              # NetworkPolicy spec.ingress[].ports[].port が 8443 のエントリが存在する場合を拒否する
              - key: "{{ request.object.spec.ingress[].ports[].port }}"
                operator: AnyIn
                # Keycloak admin ポート番号を指定する
                value: [8443]

    # ルール 3: Ingress で /auth/admin/* パスへのルーティングを拒否する
    - name: deny-ingress-keycloak-admin-path
      match:
        any:
          - resources:
              # Ingress リソースを対象にする
              kinds: [Ingress]
              # tier2-* namespace パターンに一致する全 namespace を対象にする
              namespaces: ["tier2-*"]
      # keycloak-operator ServiceAccount からのリクエストはスキップする
      exclude:
        any:
          - subjects:
              # keycloak-operator ServiceAccount を除外する
              - kind: ServiceAccount
                # keycloak-operator が配置される namespace
                namespace: keycloak
                # keycloak-operator ServiceAccount 名
                name: keycloak-operator
      validate:
        # 違反メッセージ: /auth/admin/* パスへのルーティングを検出した場合のエラーメッセージ
        message: >-
          keycloak-operator ServiceAccount 以外から Keycloak 管理 API パス (/auth/admin/*)
          へルーティングする Ingress は作成できません (tier2 テナント分離適合仕様)
        # JMESPath で全ルールのパスを収集し /auth/admin/ プレフィックスを持つものを拒否する
        deny:
          conditions:
            any:
              # Ingress spec.rules 内に /auth/admin/ で始まるパスが存在する場合を拒否する
              - key: "{{ request.object.spec.rules[].http.paths[].path | [? starts_with(@, '/auth/admin/')] | length(@) }}"
                operator: GreaterThan
                # 1 件以上ヒットした場合に拒否する
                value: "0"
