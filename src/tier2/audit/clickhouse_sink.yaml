# k1s0 tier2 ClickHouse audit sink 設定
# audit_event を ClickHouse に長期保存するための設定ファイル
# 業務エラー監査 08 の hash chain を ClickHouse で永続化する

# 設定バージョン
apiVersion: k1s0/v1

# リソース種別: clickhouse_sink_config
kind: ClickHouseSinkConfig

# メタデータ
metadata:
  # 設定名
  name: k1s0-tier2-audit-clickhouse-sink
  # 業務エラー監査適合仕様のリファレンス
  spec_reference: docs/04_詳細設計/01_適合仕様/08_業務エラー監査適合仕様.md

# ClickHouse 接続設定
clickhouse:
  # ClickHouse ホスト（開発環境: localhost、本番: clickhouse.k1s0.svc.cluster.local）
  host: "${CLICKHOUSE_HOST:-localhost}"
  # ClickHouse HTTP インターフェースのポート
  port: "${CLICKHOUSE_PORT:-8123}"
  # audit_event を格納するデータベース名
  database: k1s0_audit
  # 接続ユーザー名
  user: "${CLICKHOUSE_USER:-default}"
  # 接続パスワード
  password: "${CLICKHOUSE_PASSWORD:-}"

# Kafka to ClickHouse sink 設定（Debezium + Kafka Connect 経由で ingestion する）
kafka_source:
  # Kafka ブローカーの接続先
  bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}"
  # 購読する Kafka トピック（audit_event の Debezium CDC トピック）
  topic: k1s0.k1s0.audit_event
  # コンシューマーグループ ID
  consumer_group_id: k1s0-clickhouse-audit-sink

# ClickHouse テーブルマッピング設定
table_mapping:
  # 書込先テーブル名
  table_name: audit_events
  # データの書込バッチサイズ（100 件でフラッシュする）
  batch_size: 100
  # フラッシュ間隔（秒）
  flush_interval_seconds: 5
  # カラムマッピング（Kafka CDC メッセージのフィールドを ClickHouse カラムにマップする）
  columns:
    # エントリの主キー（UUID）
    - source_field: id
      target_column: id
      type: UUID
    # aggregate の ID
    - source_field: aggregate_id
      target_column: aggregate_id
      type: UUID
    # テナント ID（テナント別パーティショニングに使用する）
    - source_field: tenant_id
      target_column: tenant_id
      type: UUID
    # アクター識別子
    - source_field: actor_id
      target_column: actor_id
      type: String
    # セッション目的
    - source_field: purpose
      target_column: purpose
      type: String
    # テーブルクラス
    - source_field: table_class
      target_column: table_class
      type: String
    # ペイロード（JSON 文字列として格納する）
    - source_field: payload
      target_column: payload
      type: String
    # 書込日時（タイムゾーン付き）
    - source_field: created_at
      target_column: created_at
      type: DateTime64(3, 'UTC')
    # hash chain: このエントリの SHA-256 ダイジェスト
    - source_field: hash_digest
      target_column: hash_digest
      type: Nullable(String)
    # hash chain: 直前のエントリの hash_digest
    - source_field: prev_digest
      target_column: prev_digest
      type: Nullable(String)
    # hash chain: テナント内での連番
    - source_field: chain_sequence
      target_column: chain_sequence
      type: Nullable(Int64)

# データ保持ポリシー
retention:
  # audit_event の保持期間（7 年）
  retention_days: 2555
  # TTL カラム（created_at を基準に TTL を計算する）
  ttl_column: created_at
