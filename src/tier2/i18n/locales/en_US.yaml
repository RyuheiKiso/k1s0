# tier2 i18n: English locale definitions (design policy 26 / en_US)
# Industry-neutral terminology only (industry-specific terms are prohibited)
locale: en_US
# Locale display name
display_name: "English (US)"

# Message definitions
messages:

  # Error messages
  errors:
    # Tenant isolation violation error
    tenant_isolation_violation: "Tenant boundary violation: access to resources of another tenant is not permitted"
    # Invalid authentication token error
    invalid_auth_token: "Authentication token is invalid or expired. Please log in again"
    # Quota exceeded error
    quota_exceeded: "Quota limit has been reached. Please contact your administrator"
    # Resource not found error
    resource_not_found: "The specified resource could not be found"
    # Insufficient permission error
    insufficient_permission: "You do not have permission to perform this operation"
    # Internal server error
    internal_server_error: "An internal server error occurred. Please try again later"
    # Input validation error
    validation_failed: "Invalid input: please check {field}"

  # Status labels
  status:
    # Processing status
    processing: "Processing"
    # Completed status
    completed: "Completed"
    # Failed status
    failed: "Failed"
    # Pending status
    pending: "Pending"
    # Awaiting approval status
    awaiting_approval: "Awaiting Approval"
    # Approved status
    approved: "Approved"
    # Rejected status
    rejected: "Rejected"
    # Suspended status
    suspended: "Suspended"
