# k1s0 tier2 開発環境 docker-compose
# docs/05_環境構築/02_tier2 の検収コマンド実行に必要なサービスを定義する
# PostgreSQL（RLS FORCE / pgaudit）+ Kafka（Debezium CDC 用）+ ClickHouse（audit sink）を起動する
#
# 使用方法:
#   docker compose -f src/tier2/docker-compose.dev.yml up -d
#   docker compose -f src/tier2/docker-compose.dev.yml down --volumes

# compose の spec バージョン
version: "3.8"

services:
  # PostgreSQL: tier2 の主 DB（RLS FORCE / pgaudit 有効）
  postgres:
    # PostgreSQL 16 Alpine イメージを使用する（軽量版）
    image: postgres:16-alpine
    # コンテナ名を固定する
    container_name: k1s0-tier2-postgres
    environment:
      # データベースのスーパーユーザー名
      POSTGRES_USER: k1s0
      # データベースのスーパーユーザーパスワード（開発環境専用）
      POSTGRES_PASSWORD: k1s0dev
      # 作成するデフォルトデータベース名
      POSTGRES_DB: tier2_dev
    ports:
      # ホストの 5432 ポートをコンテナの 5432 ポートにマップする
      - "5432:5432"
    volumes:
      # PostgreSQL データを永続化するための名前付きボリューム
      - tier2_postgres_data:/var/lib/postgresql/data
    command:
      # pgaudit 拡張を有効にするための設定を追加する
      - postgres
      # shared_preload_libraries: pgaudit をプリロードする
      - -c
      - shared_preload_libraries=pgaudit
      # pgaudit のログ先を csvlog に設定する（ClickHouse sink が読み込む）
      - -c
      - pgaudit.log=all
    healthcheck:
      # PostgreSQL の起動確認コマンド
      test: ["CMD-SHELL", "pg_isready -U k1s0 -d tier2_dev"]
      # 10 秒間隔でヘルスチェックを実施する
      interval: 10s
      # 5 秒でタイムアウトする
      timeout: 5s
      # 5 回失敗したら unhealthy とする
      retries: 5

  # Zookeeper: Kafka のコーディネーターサービス（Debezium CDC が必要とする）
  zookeeper:
    # Confluent Platform の Zookeeper イメージを使用する
    image: confluentinc/cp-zookeeper:7.7.0
    # コンテナ名を固定する
    container_name: k1s0-tier2-zookeeper
    environment:
      # Zookeeper クライアントポートを設定する
      ZOOKEEPER_CLIENT_PORT: 2181
      # Zookeeper の tick time（ミリ秒）を設定する
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      # Zookeeper の起動確認コマンド
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      # 10 秒間隔でヘルスチェックを実施する
      interval: 10s
      # 5 秒でタイムアウトする
      timeout: 5s
      # 5 回失敗したら unhealthy とする
      retries: 5

  # Kafka: Debezium CDC が Outbox メッセージを転送するブローカー
  kafka:
    # Confluent Platform の Kafka イメージを使用する
    image: confluentinc/cp-kafka:7.7.0
    # コンテナ名を固定する
    container_name: k1s0-tier2-kafka
    # Zookeeper が起動してから Kafka を起動する
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # ホストの 9092 ポートをコンテナの 9092 ポートにマップする（クライアント接続用）
      - "9092:9092"
    environment:
      # Kafka のブローカー ID を設定する
      KAFKA_BROKER_ID: 1
      # Zookeeper の接続先を設定する
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # アドバタイズされるリスナーを設定する（外部接続: localhost:9092）
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      # リスナーのセキュリティプロトコルマップを設定する
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      # ブローカー間通信のリスナーを設定する
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      # デフォルトのレプリケーション係数を 1 に設定する（開発環境専用）
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # トランザクション状態のレプリケーション係数を 1 に設定する（開発環境専用）
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # トランザクション状態の最小 ISR を 1 に設定する（開発環境専用）
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      # Kafka の起動確認コマンド
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      # 15 秒間隔でヘルスチェックを実施する
      interval: 15s
      # 10 秒でタイムアウトする
      timeout: 10s
      # 10 回失敗したら unhealthy とする
      retries: 10

  # Debezium Connect: PostgreSQL outbox の CDC を Kafka に転送するコネクター
  debezium:
    # Debezium Connect イメージを使用する
    image: debezium/connect:2.7
    # コンテナ名を固定する
    container_name: k1s0-tier2-debezium
    # PostgreSQL と Kafka が起動してから Debezium を起動する
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      # Debezium Connect REST API のポートをマップする
      - "8083:8083"
    environment:
      # Kafka ブローカーの接続先を設定する
      BOOTSTRAP_SERVERS: kafka:29092
      # Debezium Connect のグループ ID を設定する
      GROUP_ID: k1s0-tier2-debezium
      # Kafka へのコンフィグトピック名を設定する
      CONFIG_STORAGE_TOPIC: k1s0_debezium_configs
      # Kafka へのオフセットトピック名を設定する
      OFFSET_STORAGE_TOPIC: k1s0_debezium_offsets
      # Kafka へのステータストピック名を設定する
      STATUS_STORAGE_TOPIC: k1s0_debezium_statuses
    healthcheck:
      # Debezium Connect の起動確認コマンド
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      # 15 秒間隔でヘルスチェックを実施する
      interval: 15s
      # 10 秒でタイムアウトする
      timeout: 10s
      # 10 回失敗したら unhealthy とする
      retries: 10

  # ClickHouse: audit sink（audit_event を長期保存するカラム指向 DB）
  clickhouse:
    # ClickHouse の公式イメージを使用する
    image: clickhouse/clickhouse-server:24.9-alpine
    # コンテナ名を固定する
    container_name: k1s0-tier2-clickhouse
    ports:
      # ClickHouse HTTP インターフェースのポートをマップする
      - "8123:8123"
      # ClickHouse Native プロトコルのポートをマップする
      - "9000:9000"
    volumes:
      # ClickHouse データを永続化するための名前付きボリューム
      - tier2_clickhouse_data:/var/lib/clickhouse
    environment:
      # ClickHouse のデフォルトパスワードを設定する（開発環境専用）
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      # ClickHouse の起動確認コマンド（HTTP ping エンドポイント）
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      # 10 秒間隔でヘルスチェックを実施する
      interval: 10s
      # 5 秒でタイムアウトする
      timeout: 5s
      # 5 回失敗したら unhealthy とする
      retries: 5


  # Apicurio Registry: Schema Registry（Avro / JSON Schema / Protobuf 互換性チェック）
  # docs/05_環境構築/02_tier2/07_テスト検証環境.md §検収コマンドに対応する
  apicurio:
    # Apicurio Registry メモリ版（開発環境用インメモリ実装）を使用する
    image: apicurio/apicurio-registry-mem:3.0.6
    # コンテナ名を固定する
    container_name: k1s0-tier2-apicurio
    ports:
      # REST API: ホストの 8080 ポートをコンテナの 8080 ポートにマップする
      - "8080:8080"
    environment:
      # Quarkus HTTP ポートをコンテナ側 8080 に設定する（デフォルトと同一だが明示する）
      QUARKUS_HTTP_PORT: "8080"
    healthcheck:
      # Apicurio の起動確認コマンド（system/info エンドポイントへの HTTP チェック）
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/apis/registry/v2/system/info > /dev/null || exit 1"]
      # 10 秒間隔でヘルスチェックを実施する
      interval: 10s
      # 5 秒でタイムアウトする
      timeout: 5s
      # 10 回失敗したら unhealthy とする（起動に 30-60 秒かかる場合があるため多め）
      retries: 10

# 名前付きボリューム定義
volumes:
  # PostgreSQL データボリューム（tier2_dev データベースを永続化する）
  tier2_postgres_data:
    # ドライバはデフォルト（local）を使用する
    driver: local
  # ClickHouse データボリューム（audit_event を長期保存する）
  tier2_clickhouse_data:
    # ドライバはデフォルト（local）を使用する
    driver: local
  # （Apicurio はインメモリ実装のためデータボリューム不要）
