# tier2 ABAC: Keycloak 認可ポリシー定義（設計方針 09 / 権限モデル）
# Keycloak Authorization Services の ポリシー定義を管理する
schema_version: "1.0"
# 対象レルム
realm: k1s0
# 対象クライアント
client_id: k1s0-tier2

# ポリシー定義リスト（3 ポリシー）
policies:

  # ポリシー 1: リソースオーナーポリシー（自分のリソースのみ操作を許可する）
  - policy_name: resource-owner
    # ポリシーの説明
    description: "リソースオーナー（テナント内のリソース作成者）のみが自分のリソースを操作できる"
    # ポリシータイプ（JavaScript ポリシー）
    type: js
    # ポリシーロジック（許可優先）
    logic: POSITIVE
    # 評価時のデシジョン戦略
    decisionStrategy: UNANIMOUS
    # JavaScript ポリシーコード
    code: |
      // リクエストのサブジェクト（JWT sub クレーム）と
      // リソースのオーナー属性を比較する
      var identity = $evaluation.context.identity;
      // リソースのオーナー ID を取得する
      var resource = $evaluation.object;
      // サブジェクトがリソースオーナーと一致するか検証する
      if (identity.id === resource.owner) {
        $evaluation.grant();
      } else {
        $evaluation.deny();
      }

  # ポリシー 2: 管理者委譲ポリシー（管理者が他ユーザーに権限を委譲できる）
  - policy_name: admin-delegation
    # ポリシーの説明
    description: "テナント管理者が特定ユーザーに一時的な権限委譲を行えるポリシー"
    # ポリシータイプ（ロールポリシー）
    type: role
    # ポリシーロジック
    logic: POSITIVE
    # デシジョン戦略
    decisionStrategy: UNANIMOUS
    # 委譲を実行できるロール
    roles:
      # テナント管理者ロール（realm レベル）
      - id: tenant-admin
        required: true
    # 委譲の上限設定（delegation_policy.yaml と連動する）
    attributes:
      # 委譲の最大有効時間（時間）
      max_duration_hours: "8"
      # デュアル承認必須フラグ
      requires_dual_approval: "true"

  # ポリシー 3: 緊急アクセス上書きポリシー（インシデント対応時の緊急アクセス）
  - policy_name: emergency-override
    # ポリシーの説明
    description: "インシデント対応時に限り EmergencyAccess AdminOperation でテナントリソースにアクセスできる"
    # ポリシータイプ（複合ポリシー）
    type: aggregate
    # デシジョン戦略（全ポリシーが許可する場合のみ許可する）
    decisionStrategy: UNANIMOUS
    # ポリシーロジック
    logic: POSITIVE
    # 必要な構成ポリシー（両方が許可する場合のみ緊急アクセスを許可する）
    policies:
      # インシデント管理者ロールポリシー
      - incident-manager-role
      # デュアル承認済みポリシー
      - dual-approval-confirmed
