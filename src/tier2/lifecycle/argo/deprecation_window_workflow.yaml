# tier2 データライフサイクル: API バージョン廃止ウィンドウ管理ワークフロー（設計方針 20）
# 24 ヶ月 deprecation clock を管理し、廃止スケジュールの通知 → 移行支援 → 廃止実行 を順次行う
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  # WorkflowTemplate リソース名（CronWorkflow から参照する名前）
  name: tier2-deprecation-window
  # 実行 Namespace
  namespace: k1s0-tier2
  # WorkflowTemplate ラベル
  labels:
    # ワークフロー種別ラベル
    workflow.type: api-deprecation-window
    # 対象軸ラベル
    app.kubernetes.io/component: tier2
spec:
  # ワークフローのエントリポイント
  entrypoint: deprecation-window-steps
  # ワークフロー全体のタイムアウト（2 時間以内に完了しなければ失敗とする）
  activeDeadlineSeconds: 7200
  # ワークフロー引数（廃止対象 API バージョンとスケジュール情報を渡す）
  arguments:
    parameters:
      # 廃止対象 API バージョン識別子（例: "v1alpha1"）
      - name: api_version
        description: "廃止対象 API バージョンの識別子（例: v1alpha1）"
      # 廃止予定日時（ISO 8601 形式 / HLC epoch ms で管理するが通知用に人間可読形式も渡す）
      - name: deprecation_date_iso
        description: "廃止予定日時（ISO 8601 形式 / 例: 2026-06-01T00:00:00Z）"
      # 廃止クロック開始からの経過フェーズ（announce / migrate / enforce の 3 段階）
      - name: phase
        description: "deprecation clock フェーズ（announce | migrate | enforce）"
        value: "announce"
      # 廃止対象 API を使用しているクライアント数（通知先数算出に使用する）
      - name: affected_client_count
        description: "廃止対象 API を使用しているクライアント数（監査ログに記録する）"
        value: "0"
  templates:
    # 廃止ウィンドウ管理ステップ定義
    - name: deprecation-window-steps
      steps:
        # ステップ 1: 廃止対象 API 使用状況のスキャン（全テナントの API 利用状況を収集する）
        - - name: scan-api-usage
            template: scan-api-usage-tpl
            arguments:
              parameters:
                - name: api_version
                  value: "{{workflow.parameters.api_version}}"
                - name: phase
                  value: "{{workflow.parameters.phase}}"
        # ステップ 2: フェーズ別アクション実行（announce / migrate / enforce で処理を分岐する）
        - - name: execute-phase-action
            template: execute-phase-action-tpl
            arguments:
              parameters:
                - name: api_version
                  value: "{{workflow.parameters.api_version}}"
                - name: deprecation_date_iso
                  value: "{{workflow.parameters.deprecation_date_iso}}"
                - name: phase
                  value: "{{workflow.parameters.phase}}"
                - name: affected_client_count
                  value: "{{workflow.parameters.affected_client_count}}"
        # ステップ 3: 廃止ウィンドウ状態を監査ログに記録する（Outbox 経由で emit する）
        - - name: record-audit-event
            template: record-audit-event-tpl
            arguments:
              parameters:
                - name: api_version
                  value: "{{workflow.parameters.api_version}}"
                - name: phase
                  value: "{{workflow.parameters.phase}}"
                - name: deprecation_date_iso
                  value: "{{workflow.parameters.deprecation_date_iso}}"

    # API 利用状況スキャンテンプレート
    - name: scan-api-usage-tpl
      inputs:
        parameters:
          # 廃止対象 API バージョン
          - name: api_version
          # 現在の deprecation clock フェーズ
          - name: phase
      container:
        # ライフサイクルワーカーイメージ
        image: harbor.k1s0.internal/k1s0/lifecycle-worker:latest
        # API 利用スキャンコマンド（全テナントの API 利用状況を ClickHouse から収集する）
        command:
          - /app/lifecycle-worker
          - scan-api-usage
          - --api-version
          - "{{inputs.parameters.api_version}}"
          - --phase
          - "{{inputs.parameters.phase}}"
        resources:
          requests:
            # CPU 要求量（スキャン処理は軽量なため 100m で足りる）
            cpu: "100m"
            # メモリ要求量
            memory: "128Mi"
          limits:
            # CPU 上限
            cpu: "300m"
            # メモリ上限
            memory: "256Mi"

    # フェーズ別アクション実行テンプレート
    - name: execute-phase-action-tpl
      inputs:
        parameters:
          # 廃止対象 API バージョン
          - name: api_version
          # 廃止予定日時（ISO 8601 形式）
          - name: deprecation_date_iso
          # 現在の deprecation clock フェーズ（announce | migrate | enforce）
          - name: phase
          # 廃止対象 API を使用しているクライアント数
          - name: affected_client_count
      container:
        # ライフサイクルワーカーイメージ
        image: harbor.k1s0.internal/k1s0/lifecycle-worker:latest
        # フェーズ別アクションコマンド
        # announce: 全テナント管理者への廃止通知メール送信（24 ヶ月前から開始する）
        # migrate: 移行ガイドと移行ツールの配布（廃止 6 ヶ月前から開始する）
        # enforce: API ゲートウェイに廃止バージョンの拒否ポリシーを適用する（廃止当日）
        command:
          - /app/lifecycle-worker
          - execute-deprecation-phase
          - --api-version
          - "{{inputs.parameters.api_version}}"
          - --deprecation-date
          - "{{inputs.parameters.deprecation_date_iso}}"
          - --phase
          - "{{inputs.parameters.phase}}"
          - --affected-clients
          - "{{inputs.parameters.affected_client_count}}"
        resources:
          requests:
            # CPU 要求量（フェーズにより負荷が異なるが 200m を基準とする）
            cpu: "200m"
            # メモリ要求量
            memory: "256Mi"
          limits:
            # CPU 上限（enforce フェーズは API GW 書込のため多少余裕を持たせる）
            cpu: "500m"
            # メモリ上限
            memory: "512Mi"

    # 監査イベント記録テンプレート
    - name: record-audit-event-tpl
      inputs:
        parameters:
          # 廃止対象 API バージョン
          - name: api_version
          # 実行したフェーズ
          - name: phase
          # 廃止予定日時（ISO 8601 形式）
          - name: deprecation_date_iso
      container:
        # ライフサイクルワーカーイメージ
        image: harbor.k1s0.internal/k1s0/lifecycle-worker:latest
        # 監査イベント記録コマンド（Outbox 経由で ClickHouse Audit Sink へ emit する）
        # atomic 三表書込規約に従い、状態変更 / Outbox / Audit を同一 TX で記録する
        command:
          - /app/lifecycle-worker
          - record-deprecation-audit
          - --api-version
          - "{{inputs.parameters.api_version}}"
          - --phase
          - "{{inputs.parameters.phase}}"
          - --deprecation-date
          - "{{inputs.parameters.deprecation_date_iso}}"
        resources:
          requests:
            # CPU 要求量（監査ログ書込は軽量なため 100m で足りる）
            cpu: "100m"
            # メモリ要求量
            memory: "128Mi"
          limits:
            # CPU 上限
            cpu: "200m"
            # メモリ上限
            memory: "256Mi"
