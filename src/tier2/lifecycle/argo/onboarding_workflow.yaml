# tier2 データライフサイクル: テナントオンボーディングワークフロー（設計方針 20）
# 新規テナントのプロビジョニングを 3 ステップで実行する
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  # ワークフローリソース名のプレフィックス（実行時に UUID サフィックスが付与される）
  generateName: tier2-tenant-onboarding-
  # 実行 Namespace
  namespace: k1s0-tier2
  # ワークフローラベル
  labels:
    # ワークフロー種別ラベル
    workflow.type: tenant-onboarding
    # 対象軸ラベル
    app.kubernetes.io/component: tier2
spec:
  # ワークフローのエントリポイント
  entrypoint: onboarding-steps
  # ワークフロー全体のタイムアウト（30 分以内に完了しなければ失敗とする）
  activeDeadlineSeconds: 1800
  # ワークフロー引数（テナント識別子とクォータクラスを渡す）
  arguments:
    parameters:
      # プロビジョニング対象テナント識別子
      - name: tenant_id
        description: "プロビジョニング対象テナントの UUID"
      # 割り当てるクォータクラス
      - name: quota_class
        value: "standard"
  templates:
    # オンボーディングステップ定義
    - name: onboarding-steps
      steps:
        # ステップ 1: データベーススキーマのプロビジョニング
        - - name: provision-db
            template: provision-db-tpl
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{workflow.parameters.tenant_id}}"
        # ステップ 2: クォータの割り当て
        - - name: create-quota
            template: create-quota-tpl
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{workflow.parameters.tenant_id}}"
                - name: quota_class
                  value: "{{workflow.parameters.quota_class}}"
        # ステップ 3: オンボーディング完了通知
        - - name: notify
            template: notify-tpl
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{workflow.parameters.tenant_id}}"

    # DB プロビジョニングテンプレート
    - name: provision-db-tpl
      inputs:
        parameters:
          # テナント識別子パラメータ
          - name: tenant_id
      container:
        # オンボーディングワーカーイメージ
        image: harbor.k1s0.internal/k1s0/lifecycle-worker:latest
        # DB プロビジョニングコマンド（テナント専用スキーマを作成する）
        command: ["/app/lifecycle-worker", "provision-db", "--tenant-id", "{{inputs.parameters.tenant_id}}"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

    # クォータ作成テンプレート
    - name: create-quota-tpl
      inputs:
        parameters:
          # テナント識別子パラメータ
          - name: tenant_id
          # クォータクラスパラメータ
          - name: quota_class
      container:
        # オンボーディングワーカーイメージ
        image: harbor.k1s0.internal/k1s0/lifecycle-worker:latest
        # クォータ作成コマンド
        command: ["/app/lifecycle-worker", "create-quota", "--tenant-id", "{{inputs.parameters.tenant_id}}", "--quota-class", "{{inputs.parameters.quota_class}}"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

    # 通知テンプレート
    - name: notify-tpl
      inputs:
        parameters:
          # テナント識別子パラメータ
          - name: tenant_id
      container:
        # オンボーディングワーカーイメージ
        image: harbor.k1s0.internal/k1s0/lifecycle-worker:latest
        # オンボーディング完了通知コマンド（Outbox 経由でイベントを emit する）
        command: ["/app/lifecycle-worker", "notify-onboarding-complete", "--tenant-id", "{{inputs.parameters.tenant_id}}"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
