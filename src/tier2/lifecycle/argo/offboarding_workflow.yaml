# tier2 データライフサイクル: テナントオフボーディングワークフロー（設計方針 20）
# テナント退会時のデータ処理を 3 ステップで実行する（export → anonymize → delete）
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  # ワークフロー名プレフィックス（実行時に UUID サフィックスが付与される）
  generateName: tier2-tenant-offboarding-
  # 実行 Namespace
  namespace: k1s0-tier2
  # ワークフローラベル
  labels:
    # ワークフロー種別ラベル
    workflow.type: tenant-offboarding
    # 対象軸ラベル
    app.kubernetes.io/component: tier2
spec:
  # ワークフローのエントリポイント
  entrypoint: offboarding-steps
  # ワークフロー全体のタイムアウト（4 時間以内に完了しなければ失敗とする）
  activeDeadlineSeconds: 14400
  # ワークフロー引数
  arguments:
    parameters:
      # オフボーディング対象テナント識別子
      - name: tenant_id
        description: "オフボーディング対象テナントの UUID"
  templates:
    # オフボーディングステップ定義
    - name: offboarding-steps
      steps:
        # ステップ 1: テナントデータのエクスポート（顧客への最終データ提供）
        - - name: export-data
            template: export-data-tpl
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{workflow.parameters.tenant_id}}"
        # ステップ 2: PII データの匿名化（個人情報保護法準拠）
        - - name: anonymize-pii
            template: anonymize-pii-tpl
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{workflow.parameters.tenant_id}}"
        # ステップ 3: テナントデータの削除（匿名化完了後に実行する）
        - - name: delete-tenant
            template: delete-tenant-tpl
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{workflow.parameters.tenant_id}}"

    # データエクスポートテンプレート
    - name: export-data-tpl
      inputs:
        parameters:
          # テナント識別子パラメータ
          - name: tenant_id
      container:
        # ライフサイクルワーカーイメージ
        image: harbor.k1s0.internal/k1s0/lifecycle-worker:latest
        # データエクスポートコマンド（全テナントデータを暗号化 ZIP に梱包する）
        command: ["/app/lifecycle-worker", "export-data", "--tenant-id", "{{inputs.parameters.tenant_id}}"]
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

    # PII 匿名化テンプレート
    - name: anonymize-pii-tpl
      inputs:
        parameters:
          # テナント識別子パラメータ
          - name: tenant_id
      container:
        # ライフサイクルワーカーイメージ
        image: harbor.k1s0.internal/k1s0/lifecycle-worker:latest
        # PII 匿名化コマンド（field_pii annotation 付きフィールドを対象とする）
        command: ["/app/lifecycle-worker", "anonymize-pii", "--tenant-id", "{{inputs.parameters.tenant_id}}"]
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

    # テナント削除テンプレート
    - name: delete-tenant-tpl
      inputs:
        parameters:
          # テナント識別子パラメータ
          - name: tenant_id
      container:
        # ライフサイクルワーカーイメージ
        image: harbor.k1s0.internal/k1s0/lifecycle-worker:latest
        # テナント削除コマンド（スキーマ / クォータ / オブジェクトストレージを削除する）
        command: ["/app/lifecycle-worker", "delete-tenant", "--tenant-id", "{{inputs.parameters.tenant_id}}"]
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
