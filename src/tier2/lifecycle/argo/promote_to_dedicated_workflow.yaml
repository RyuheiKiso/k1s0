# tier2 SLO 自動昇格ワークフロー（SLO protection layers §自動昇格）
# 共有サービスが SLO v1_gold 以上を 7 日間連続維持した場合に専用インフラへ自動昇格する
# 参照仕様: docs/04_詳細設計/03_クロスカッティング適合仕様/05_SLO_protection_layers.md §自動昇格
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  # ワークフロー名プレフィックス（実行時に UUID サフィックスが付与される）
  generateName: tier2-slo-promote-to-dedicated-
  # 実行 Namespace
  namespace: k1s0-tier2
  # ワークフローラベル
  labels:
    # ワークフロー種別ラベル
    workflow.type: slo-promotion
    # 対象軸ラベル
    app.kubernetes.io/component: tier2
spec:
  # ワークフローのエントリポイント
  entrypoint: promote-to-dedicated-steps
  # ワークフロー全体のタイムアウト（24 時間以内に完了しなければ失敗とする）
  activeDeadlineSeconds: 86400
  # ワークフロー引数（テナント識別子・SLO クラス・hysteresis 期間を受け取る）
  arguments:
    parameters:
      # 昇格対象テナント識別子
      - name: tenant_id
        description: "昇格対象テナントの UUID"
      # 維持が確認された SLO クラス（v1_gold 以上が対象）
      - name: slo_class
        value: "v1_gold"
      # hysteresis 期間（日数）: この期間 SLO を維持した場合に昇格する
      - name: hysteresis_days
        value: "7"
  templates:
    # 昇格ステップ定義（verify → provision → switch → wait → audit の順で実行する）
    - name: promote-to-dedicated-steps
      steps:
        # ステップ 1: SLO compliance を確認する（hysteresis_days 間の維持確認）
        - - name: verify-slo-compliance
            template: verify-slo-compliance-tpl
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{workflow.parameters.tenant_id}}"
                - name: slo_class
                  value: "{{workflow.parameters.slo_class}}"
                - name: hysteresis_days
                  value: "{{workflow.parameters.hysteresis_days}}"
        # ステップ 2: CNPG Cluster CR を専用インフラ用にプロビジョニングする
        - - name: provision-cnpg-cluster
            template: provision-cnpg-cluster-tpl
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{workflow.parameters.tenant_id}}"
        # ステップ 3: Envoy ルーティングを専用クラスタへ切り替える
        - - name: switch-envoy-routing
            template: switch-envoy-routing-tpl
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{workflow.parameters.tenant_id}}"
        # ステップ 4: 昇格後安定性確認のため hysteresis 待機する（300 秒）
        - - name: wait-hysteresis
            template: wait-hysteresis-tpl
        # ステップ 5: 昇格完了を audit ログに記録する（atomic_triple_write 経由）
        - - name: record-promotion-audit
            template: record-promotion-audit-tpl
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{workflow.parameters.tenant_id}}"
                - name: slo_class
                  value: "{{workflow.parameters.slo_class}}"

    # SLO compliance 検証テンプレート
    # Prometheus API を呼び出して hysteresis_days 間の SLO breach 率を確認する
    - name: verify-slo-compliance-tpl
      inputs:
        parameters:
          # テナント識別子パラメータ
          - name: tenant_id
          # SLO クラスパラメータ
          - name: slo_class
          # hysteresis 期間（日数）パラメータ
          - name: hysteresis_days
      container:
        # ライフサイクルワーカーイメージ（Prometheus クライアントを内包する）
        image: harbor.k1s0.internal/k1s0/lifecycle-worker:latest
        # SLO compliance 確認コマンド（breach 率が 0.1% 以下であることを検証する）
        command:
          - /app/lifecycle-worker
          - verify-slo-compliance
          - --tenant-id
          - "{{inputs.parameters.tenant_id}}"
          - --slo-class
          - "{{inputs.parameters.slo_class}}"
          - --hysteresis-days
          - "{{inputs.parameters.hysteresis_days}}"
          # SLO breach 率の許容上限: 0.001 (0.1%) — SLO protection layers §v1_gold 閾値に準拠する
          - --breach-rate-threshold
          - "0.001"
        resources:
          requests:
            # SLO 検証は軽量なため CPU / メモリを最小構成にする
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

    # CNPG Cluster プロビジョニングテンプレート
    # kubectl apply で CloudNativePG Cluster CR を専用 PostgreSQL クラスタとして作成する
    - name: provision-cnpg-cluster-tpl
      inputs:
        parameters:
          # テナント識別子パラメータ
          - name: tenant_id
      container:
        # ライフサイクルワーカーイメージ（kubectl / CNPG CLI を内包する）
        image: harbor.k1s0.internal/k1s0/lifecycle-worker:latest
        # CNPG Cluster プロビジョニングコマンド（専用 3 ノード PostgreSQL クラスタを作成する）
        command:
          - /app/lifecycle-worker
          - provision-cnpg-cluster
          - --tenant-id
          - "{{inputs.parameters.tenant_id}}"
          # 専用クラスタのストレージサイズ（50 GiB — SLO protection layers §dedicated_infra に準拠する）
          - --storage-size
          - "50Gi"
          # 専用クラスタのインスタンス数（3 — HA 構成を維持する）
          - --instances
          - "3"
        resources:
          requests:
            # クラスタ作成は kubectl apply のみのため軽量にする
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

    # Envoy ルーティング切り替えテンプレート
    # Envoy ConfigMap を更新してテナントのトラフィックを専用クラスタへルーティングする
    - name: switch-envoy-routing-tpl
      inputs:
        parameters:
          # テナント識別子パラメータ
          - name: tenant_id
      container:
        # ライフサイクルワーカーイメージ（kubectl を内包する）
        image: harbor.k1s0.internal/k1s0/lifecycle-worker:latest
        # Envoy ルーティング切り替えコマンド（k1s0-envoy-routing ConfigMap をパッチする）
        command:
          - /app/lifecycle-worker
          - switch-envoy-routing
          - --tenant-id
          - "{{inputs.parameters.tenant_id}}"
          # ルーティング先を dedicated に切り替える（shared から専用クラスタへ移行する）
          - --backend-class
          - "dedicated"
        resources:
          requests:
            # ルーティング切り替えは ConfigMap パッチのみのため軽量にする
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

    # hysteresis 待機テンプレート
    # 昇格後の安定性確認のため 300 秒間待機する（suspend で Argo が管理する）
    - name: wait-hysteresis-tpl
      # suspend: Argo Workflow の一時停止機能（duration 後に自動再開する）
      suspend:
        # 昇格後安定性確認の待機時間: 300 秒（SLO protection layers §switch_stabilization に準拠する）
        duration: "300s"

    # 昇格完了 audit 記録テンプレート
    # 昇格完了を lifecycle-worker 経由で PostgreSQL audit_event に記録する（atomic_triple_write 経由）
    - name: record-promotion-audit-tpl
      inputs:
        parameters:
          # テナント識別子パラメータ
          - name: tenant_id
          # SLO クラスパラメータ
          - name: slo_class
      container:
        # ライフサイクルワーカーイメージ（atomic_triple_write を内包する）
        image: harbor.k1s0.internal/k1s0/lifecycle-worker:latest
        # 昇格完了 audit 記録コマンド（atomic_triple_write 経由で audit_event に INSERT する）
        command:
          - /app/lifecycle-worker
          - record-promotion-audit
          - --tenant-id
          - "{{inputs.parameters.tenant_id}}"
          - --slo-class
          - "{{inputs.parameters.slo_class}}"
          # audit event 種別: SLO 昇格完了イベントを明示する
          - --event-kind
          - "SloPromotionCompleted"
        resources:
          requests:
            # audit 記録は 1 INSERT のみのため軽量にする
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
