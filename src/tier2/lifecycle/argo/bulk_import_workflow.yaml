# tier2 データライフサイクル: 業務マスタ CSV 一括インポートワークフロー
# 10_テナント分離適合仕様.md §admin_operation + RLS FORCE 対応（テナント境界を保証しながら CSV 一括投入）
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  # ワークフロー名プレフィックス（実行時に UUID サフィックスが付与される）
  generateName: tier2-bulk-import-
  # 実行 Namespace
  namespace: k1s0-tier2
  # ワークフローラベル
  labels:
    # ワークフロー種別ラベル
    workflow.type: bulk-import
    # 対象軸ラベル
    app.kubernetes.io/component: tier2
spec:
  # ワークフローのエントリポイント
  entrypoint: bulk-import-pipeline
  # ワークフロー全体のタイムアウト（4 時間以内に完了しなければ失敗とする）
  activeDeadlineSeconds: 14400
  # ワークフロー引数
  arguments:
    parameters:
      # インポート対象テナント識別子（AuthContext から受け取る。API 引数での tenant_id 受け渡し禁止規約に準拠）
      - name: tenant_id
        description: "インポート先テナントの UUID（Keycloak JWT AuthContext から抽出済み）"
      # インポート対象 CSV の URL（オブジェクトストレージ上の署名付き URL）
      - name: csv_url
        description: "インポート対象 CSV の署名付き URL"
      # 業務マスタ種別（通貨レート / 製品カタログ等の種別識別子）
      - name: master_type
        description: "インポート対象の業務マスタ種別（業界中立語のみ使用）"
  templates:
    # 一括インポートパイプライン: validate → insert → audit → notify の順に実行する
    - name: bulk-import-pipeline
      steps:
        # ステップ 1: CSV スキーマ検証（master_type に応じたスキーマで検証する）
        - - name: validate-schema
            template: validate-schema-tpl
            arguments:
              parameters:
                - name: csv_url
                  value: "{{workflow.parameters.csv_url}}"
                - name: master_type
                  value: "{{workflow.parameters.master_type}}"
        # ステップ 2: RLS FORCE 付き atomic 一括 INSERT（テナント境界を強制する）
        - - name: atomic-bulk-insert
            template: atomic-bulk-insert-tpl
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{workflow.parameters.tenant_id}}"
                - name: csv_url
                  value: "{{workflow.parameters.csv_url}}"
                - name: master_type
                  value: "{{workflow.parameters.master_type}}"
        # ステップ 3: 監査イベントを audit_local 経由で emit する
        - - name: audit-emit
            template: audit-emit-tpl
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{workflow.parameters.tenant_id}}"
                - name: master_type
                  value: "{{workflow.parameters.master_type}}"
        # ステップ 4: 完了通知を送信する
        - - name: notify
            template: notify-tpl
            arguments:
              parameters:
                - name: tenant_id
                  value: "{{workflow.parameters.tenant_id}}"

    # CSV スキーマ検証テンプレート
    - name: validate-schema-tpl
      inputs:
        parameters:
          # インポート対象 CSV の URL
          - name: csv_url
          # 業務マスタ種別（スキーマ選択に使用する）
          - name: master_type
      container:
        # 管理ワーカーイメージ（tier2-admin クレートをパッケージしたコンテナ）
        image: harbor.k1s0.internal/k1s0/tier2-admin:latest
        # CSV スキーマ検証コマンド（master_type ごとの検証ロジックに委譲する）
        command: ["/app/tier2-admin", "bulk-import", "validate"]
        args:
          - "--csv-url"
          - "{{inputs.parameters.csv_url}}"
          - "--master-type"
          - "{{inputs.parameters.master_type}}"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

    # RLS FORCE 付き atomic 一括 INSERT テンプレート
    - name: atomic-bulk-insert-tpl
      inputs:
        parameters:
          # インポート先テナント識別子（RLS FORCE で境界を強制する）
          - name: tenant_id
          # インポート対象 CSV の URL
          - name: csv_url
          # 業務マスタ種別
          - name: master_type
      container:
        # 管理ワーカーイメージ（tier2-admin クレートをパッケージしたコンテナ）
        image: harbor.k1s0.internal/k1s0/tier2-admin:latest
        # RLS FORCE 付き INSERT コマンド（テナント分離を DB 層で強制する）
        command: ["/app/tier2-admin", "bulk-import", "insert"]
        args:
          - "--tenant-id"
          - "{{inputs.parameters.tenant_id}}"
          - "--csv-url"
          - "{{inputs.parameters.csv_url}}"
          - "--master-type"
          - "{{inputs.parameters.master_type}}"
          # RLS FORCE フラグ（テナント境界を強制する / 省略禁止）
          - "--rls-force"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"

    # 監査イベント emit テンプレート
    - name: audit-emit-tpl
      inputs:
        parameters:
          # 監査対象テナント識別子
          - name: tenant_id
          # 業務マスタ種別（監査ログのイベント種別フィールドに記録する）
          - name: master_type
      container:
        # 管理ワーカーイメージ
        image: harbor.k1s0.internal/k1s0/tier2-admin:latest
        # 監査イベント emit コマンド（audit_local テーブル経由で Relay に投入する）
        command: ["/app/tier2-admin", "bulk-import", "audit-emit"]
        args:
          - "--tenant-id"
          - "{{inputs.parameters.tenant_id}}"
          - "--master-type"
          - "{{inputs.parameters.master_type}}"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

    # 完了通知テンプレート
    - name: notify-tpl
      inputs:
        parameters:
          # 通知対象テナント識別子
          - name: tenant_id
      container:
        # 管理ワーカーイメージ
        image: harbor.k1s0.internal/k1s0/tier2-admin:latest
        # 完了通知コマンド（テナントの担当者に通知チャネル経由で送信する）
        command: ["/app/tier2-admin", "bulk-import", "notify"]
        args:
          - "--tenant-id"
          - "{{inputs.parameters.tenant_id}}"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
