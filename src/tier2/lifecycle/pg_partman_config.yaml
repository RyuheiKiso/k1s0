# pg_partman_config.yaml — pg_partman 宣言的 partition lifecycle 設定
# 17_データ保持: partition lifecycle declarative config
# docs/03_概要設計/03_tier2設計方針/17_データ保持.md §partition lifecycle 設定の SoT
version: "1.0.0"
partitioned_tables:
  # domain_event テーブル: ドメインイベントを monthly partition で管理する
  - table: public.domain_event
    partition_type: range
    # created_at カラムを partition key として月次分割する
    partition_key: created_at
    interval: "monthly"
    # ドメインイベントは 13 ヶ月保持（1 年 + 1 ヶ月の猶予）
    retention_months: 13
    # 3 ヶ月分を事前作成して partition 不在による挿入失敗を防ぐ
    premake: 3
  # outbox_event テーブル: Outbox リレーメッセージを weekly partition で管理する
  - table: public.outbox_event
    partition_type: range
    # created_at カラムを partition key として週次分割する
    partition_key: created_at
    interval: "weekly"
    # Outbox は 1 ヶ月保持（Kafka consumer lag + 重複排除ウィンドウ）
    retention_months: 1
    # 2 週分を事前作成して partition 不在による挿入失敗を防ぐ
    premake: 2
  # audit_local テーブル: 監査ログを monthly partition で管理する（10 年保持）
  # docs/03_概要設計/03_tier2設計方針/08_業務エラー監査コンプライアンス.md §audit_local schema
  - table: audit_local.audit_event
    partition_type: range
    # created_at カラムを partition key として月次分割する
    partition_key: created_at
    interval: "monthly"
    # audit_local は 10 年保持（retention_policy.yaml §audit: 3650 日と整合する）
    retention_months: 120
    # 3 ヶ月分を事前作成して partition 不在による挿入失敗を防ぐ
    premake: 3
    # immutable: true の場合は retention を超えた partition も削除しない（物理アーカイブへ移動後に手動削除）
    immutable: true
  # pii_segregated テーブル: PII クラスタデータを monthly partition で管理する
  # docs/03_概要設計/03_tier2設計方針/17_データ保持.md §pii: 30 日（忘れられる権利）
  - table: public.pii_segregated_data
    partition_type: range
    # created_at カラムを partition key として月次分割する
    partition_key: created_at
    interval: "monthly"
    # PII は 30 日保持（GDPR Art.17 Right to erasure）
    retention_months: 1
    # 2 ヶ月分を事前作成して partition 不在による挿入失敗を防ぐ
    premake: 2
    # crypto-shred: partition drop 前に KEK を破棄して暗号的消去を実施する
    crypto_shred_before_drop: true
