# retention_policy.yaml — k1s0 tier2 データ保持ポリシー宣言
# docs/03_概要設計/03_tier2設計方針/17_データ保持.md §デフォルト retention に準拠する。
# カテゴリ別のデフォルト保持日数を宣言する。テナント固有の override は extension_points.yaml の
# ep_retention_policy_override で差し込む。
# 本ファイルが tier2 retention の Single Source of Truth（SoT）である。

# カテゴリ別デフォルト保持日数（日単位）
categories:
  # audit: 監査ログ — GDPR Article 5(2) 説明責任要件 + 業務監査 7 年
  - category: audit
    retention_days: 2555
    legal_basis: "GDPR Art.5(2), 会社法 419 条（業務帳簿 7 年保存）"
    immutable: true
    doc_ref: "docs/03_概要設計/03_tier2設計方針/08_業務エラー監査コンプライアンス.md"

  # business_event: ドメインイベント — 業務ログ 1 年
  - category: business_event
    retention_days: 365
    legal_basis: "業務運用基準（障害調査・会計監査対応）"
    immutable: false
    doc_ref: "docs/03_概要設計/03_tier2設計方針/17_データ保持.md"

  # projection: Read Model 射影 — 再生可能なため 90 日
  - category: projection
    retention_days: 90
    legal_basis: "Outbox から再生可能（cost 最適化）"
    immutable: false
    doc_ref: "docs/03_概要設計/03_tier2設計方針/15_読み取りモデル方針.md"

  # outbox: Outbox relay メッセージ — Kafka duplication window 30 日
  - category: outbox
    retention_days: 30
    legal_basis: "Kafka consumer lag 上限 + 重複排除ウィンドウ"
    immutable: false
    doc_ref: "docs/03_概要設計/03_tier2設計方針/17_データ保持.md"

  # attachment: 添付ファイル — 業務保存 3 年（製造業法令）
  - category: attachment
    retention_days: 1095
    legal_basis: "製造業：製品品質記録 3 年（JIS Q 9001:2015 §7.5.3）"
    immutable: false
    doc_ref: "docs/03_概要設計/03_tier2設計方針/28_業務添付帳票資産.md"

  # pii: PII クラスタ — GDPR deletion obligation 30 日（忘れられる権利）
  - category: pii
    retention_days: 30
    legal_basis: "GDPR Art.17 (Right to erasure) — 削除要求から 30 日以内"
    immutable: false
    doc_ref: "docs/04_詳細設計/01_適合仕様/10_テナント分離適合仕様.md"

  # import_staging: 外部データ取込ステージング — 処理完了後 7 日
  - category: import_staging
    retention_days: 7
    legal_basis: "処理完了後 cleanup（cost 最適化）"
    immutable: false
    doc_ref: "docs/03_概要設計/03_tier2設計方針/16_外部システム統合.md"

  # pack_config: 業界 pack 設定スナップショット — 変更追跡 1 年
  - category: pack_config
    retention_days: 365
    legal_basis: "設定変更履歴の監査トレーサビリティ"
    immutable: false
    doc_ref: "docs/03_概要設計/03_tier2設計方針/02_業界拡張モデル.md"

# 保持ポリシー適用フロー
enforcement:
  # archiver: Argo Workflow による自動アーカイブ（lifecycle/argo/ に定義）
  archiver: argo
  # archive_dest: アーカイブ先（Ceph Object Storage の glacier-tier bucket）
  archive_dest: "rook-ceph/lifecycle-archive"
  # purge_after_archive: アーカイブ後に元テーブルから削除するか
  purge_after_archive: true
  # purge_grace_period_days: アーカイブ完了から削除までの猶予期間
  purge_grace_period_days: 3
  # dry_run: true の場合は削除をスキップして行数のみ記録する（本番は false）
  dry_run: false
