# dual_signoff_workflow.yaml — dual sign-off workflow 定義
# EmergencyAccess / QuotaOverride 操作には human × AI evidence の二重承認が必須
# spec: /CLAUDE.md §dual sign-off 規約 / wire_convention.yaml §admin_convention.dual_approval_required
# admin proto の approval_token フィールドに渡すトークンをこの workflow が発行する
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  # テンプレート名（Backstage Software Catalog での識別子）
  name: k1s0-dual-signoff
  # 表示タイトル
  title: "K1s0 Dual Sign-Off Request"
  # 説明: admin EmergencyAccess / QuotaOverride の dual sign-off 申請に使用する
  description: "admin EmergencyAccess / QuotaOverride の dual sign-off 申請。human author × AI evidence の二重承認が必須（/CLAUDE.md dual sign-off 規約に準拠）"
spec:
  # オーナー: プラットフォームチームが管理する
  owner: platform-team
  # テンプレート種別: admin 操作 workflow
  type: admin-workflow
  # 申請フォームのパラメータ定義
  parameters:
    # 操作詳細セクション
    - title: Operation Details
      # 必須フィールド: operation_type / reason / tenant_id
      required: [operation_type, reason, tenant_id]
      properties:
        # 操作種別: EmergencyAccess または QuotaOverride のいずれか
        operation_type:
          # フォームラベル
          title: Operation Type
          type: string
          # admin proto の操作種別と整合させる（fa/admin.proto / procurement/admin.proto / inspection/admin.proto）
          enum: [EmergencyAccess, QuotaOverride, EmergencyStop, CancelOrder, VoidResult, OverrideVerdict]
        # 操作理由: audit log に必ず記録される（20 文字以上を強制する）
        reason:
          # フォームラベル
          title: Reason (audit log 必須記録)
          type: string
          # 20 文字以上の理由を要求する（形式的な理由記述を防止する）
          minLength: 20
        # 対象テナント ID: 管理者が明示指定する（admin proto の tenant_id フィールドに渡す）
        tenant_id:
          # フォームラベル
          title: Target Tenant ID
          type: string
    # dual sign-off 承認者セクション
    - title: Approvers
      # 必須フィールド: primary_approver (1 名は必須)
      required: [primary_approver]
      properties:
        # 1 人目の承認者（human author 承認、dual sign-off の human 側）
        primary_approver:
          title: Primary Approver (human sign-off)
          type: string
        # AI static analysis evidence（dual sign-off の AI evidence 側）
        ai_evidence_ref:
          # フォームラベル
          title: AI Static Analysis Evidence Reference
          type: string
          # AI evidence の参照 URL（cosign_history / ai_static_analysis）
          description: "cosign_history または ai_static_analysis の evidence URL を指定する"
  # workflow ステップ定義
  steps:
    # 承認 PR を作成するステップ
    - id: create-pr
      name: Create approval PR
      # GitHub PR を作成して承認プロセスを開始する
      action: publish:github:pull-request
    # dual 承認待機ステップ（human × AI evidence の両方が必要）
    - id: await-review
      name: Await dual approval (human × AI evidence)
      # GitHub PR の承認を待機する
      action: github:await-approval
      input:
        # 最低 2 名の承認が必要（human 1 名 + AI evidence reviewer 1 名）
        minimumApprovals: 2
    # approval_token を発行するステップ（admin proto の approval_token フィールドに渡す）
    - id: issue-token
      name: Issue approval_token for admin proto
      # 承認完了後に approval_token を発行する
      action: k1s0:issue-approval-token
      input:
        # 操作種別（admin proto の RPC と対応させる）
        operation_type: "${{ parameters.operation_type }}"
        # 対象テナント ID（admin proto の tenant_id フィールドに渡す）
        tenant_id: "${{ parameters.tenant_id }}"
        # 操作理由（audit_event に記録される）
        reason: "${{ parameters.reason }}"
