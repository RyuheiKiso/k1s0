# tier2 Operator: RBAC 定義（設計方針 07 / Service 運用方針）
# tier2 Operator が Kubernetes リソースを操作するための ClusterRole と ClusterRoleBinding
---
# tier2 Operator 用 ClusterRole 定義
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # ClusterRole 名
  name: k1s0-tier2-operator-role
  # ラベル
  labels:
    # 対象コンポーネントラベル
    app.kubernetes.io/component: tier2-operator
rules:
  # K1s0Service カスタムリソースの操作権限
  - apiGroups:
      # k1s0.io API グループ
      - "k1s0.io"
    resources:
      # K1s0Service リソースの操作を許可する
      - k1s0services
      # status サブリソースの更新を許可する
      - k1s0services/status
    verbs:
      # 一覧取得
      - get
      - list
      # 変更監視（watcher に必要）
      - watch
      # 更新（status 更新に使用する）
      - update
      # パッチ適用
      - patch
  # ConfigMap の操作権限（Operator の設定情報を保持する）
  - apiGroups:
      # core API グループ
      - ""
    resources:
      # ConfigMap リソース
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  # Event の作成権限（Operator の処理イベントを記録する）
  - apiGroups:
      # core API グループ
      - ""
    resources:
      # Event リソース（Operator の動作ログをクラスターイベントとして記録する）
      - events
    verbs:
      # イベント作成を許可する
      - create
      - patch
---
# tier2 Operator 用 ClusterRoleBinding 定義
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # ClusterRoleBinding 名
  name: k1s0-tier2-operator-rolebinding
  # ラベル
  labels:
    # 対象コンポーネントラベル
    app.kubernetes.io/component: tier2-operator
# バインドする ClusterRole の参照
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # 上で定義した ClusterRole 名を参照する
  name: k1s0-tier2-operator-role
# バインド対象のサービスアカウント
subjects:
  - kind: ServiceAccount
    # tier2 Operator が使用するサービスアカウント名
    name: k1s0-tier2-operator
    # サービスアカウントの Namespace
    namespace: k1s0-tier2
