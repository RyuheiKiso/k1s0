# tier2 Operator: K1s0Service CRD 定義（設計方針 07 / Service 運用方針）
# テナントサービスのライフサイクルを管理するカスタムリソース定義
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # CRD のリソース名（<plural>.<group> の形式）
  name: k1s0services.k1s0.io
  # CRD のラベル
  labels:
    # 対象コンポーネントラベル
    app.kubernetes.io/component: tier2-operator
spec:
  # CRD の API グループ名
  group: k1s0.io
  # スコープ（Namespaced: 特定 Namespace に属する）
  scope: Namespaced
  # CRD の名前定義
  names:
    # リソースの複数形名
    plural: k1s0services
    # リソースの単数形名
    singular: k1s0service
    # Kind 名（kubectl で使用する）
    kind: K1s0Service
    # 短縮名（kubectl get k1ssvc 等で使用する）
    shortNames:
      - k1ssvc
  # バージョン定義
  versions:
    # v1alpha1 バージョン（実験的実装）
    - name: v1alpha1
      # このバージョンを提供するか
      served: true
      # ストレージに使用するバージョンか（1 バージョンのみ true にする）
      storage: true
      # スキーマ定義
      schema:
        openAPIV3Schema:
          # CRD のルートスキーマ型
          type: object
          properties:
            # spec フィールドの定義
            spec:
              type: object
              # 必須フィールドの一覧
              required:
                - tenantId
                - quotaClass
              properties:
                # テナント識別子フィールド（UUID v4 形式）
                tenantId:
                  type: string
                  # UUID v4 フォーマットを強制する（Kyverno でも追加検証する）
                  format: uuid
                  description: "テナント識別子（UUID v4 / Keycloak テナント ID と一致する）"
                # クォータクラスフィールド（standard / enterprise / unlimited）
                quotaClass:
                  type: string
                  # 許可するクォータクラスの列挙値
                  enum:
                    - standard
                    - enterprise
                    - unlimited
                  description: "割り当てるクォータクラス名"
                # フィーチャーフラグフィールド（テナントごとに有効化する機能を制御する）
                featureFlags:
                  type: object
                  # フィーチャーフラグの追加プロパティ（boolean 型のみ許可する）
                  additionalProperties:
                    type: boolean
                  description: "テナントごとのフィーチャーフラグマップ（key: フラグ名 / value: 有効無効）"
            # status フィールドの定義
            status:
              type: object
              properties:
                # Operator の処理フェーズ
                phase:
                  type: string
                  description: "Operator の処理フェーズ（Provisioning / Active / Suspended / Terminating）"
                # 最終処理時刻（HLC タイムスタンプを文字列で保持する）
                lastProcessedHlc:
                  type: string
                  description: "最終処理 HLC タイムスタンプ（wall clock TTL 禁止規約により HLC を使用する）"
      # status サブリソースを有効化する（kubectl get で PHASE 列を表示するために使用する）
      subresources:
        status: {}
