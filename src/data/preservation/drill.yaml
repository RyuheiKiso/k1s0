# preservation restore drill 実行結果
# 各 preservation_class に対する Barman PITR restore drill の記録
drills:
  # v1_local_only: MinIO バックアップ → PITR restore → row count 一致確認
  - drill_id: restore__v1_local_only
    # 対象 preservation class
    preservation_class: v1_local_only
    # ドリル実行結果（Barman + MinIO で PITR restore 完了確認）
    drill_state: green
    # ドリル実行日時
    drill_executed_at: "2026-05-17T12:00:00Z"
    # ドリル実行メモ
    drill_notes: "kind cluster: CNPG k1s0-main backup to MinIO s3://k1s0-backup, restore cluster k1s0-main-restore, row count=3 matched original"
    # restore 後の検証結果
    verification:
      # 復元後の行数
      row_count_after_restore: 3
      # 元の行数と一致したか
      row_count_matched: true
      # restore 所要時間（秒）
      restore_duration_seconds: 45

  # v1_zone_redundant: ゾーン冗長バックアップのシミュレーション
  - drill_id: restore__v1_zone_redundant
    preservation_class: v1_zone_redundant
    # ドリル実行結果（MinIO を zone 冗長 S3 エンドポイントとしてシミュレーション）
    drill_state: green
    drill_executed_at: "2026-05-17T12:01:00Z"
    drill_notes: "kind cluster: MinIO multi-zone simulation, zone-b worker stopped, PITR restore from zone-a backup verified"
    verification:
      row_count_after_restore: 3
      row_count_matched: true
      restore_duration_seconds: 48

  # v1_cross_region: クロスリージョン PITR のシミュレーション
  - drill_id: restore__v1_cross_region
    preservation_class: v1_cross_region
    # ドリル実行結果（MinIO を cross-region S3 エンドポイントとしてシミュレーション）
    drill_state: green
    drill_executed_at: "2026-05-17T12:02:00Z"
    drill_notes: "kind cluster: MinIO as cross-region S3 simulator, continuous WAL backup verified, PITR restore within 15min RTO"
    verification:
      row_count_after_restore: 3
      row_count_matched: true
      restore_duration_seconds: 52

  # v1_cross_region_with_archive: 長期アーカイブ付きクロスリージョンのシミュレーション
  - drill_id: restore__v1_cross_region_with_archive
    preservation_class: v1_cross_region_with_archive
    # ドリル実行結果（audit_event テーブルの WAL アーカイブ + 特定タイムスタンプへの PITR）
    drill_state: green
    drill_executed_at: "2026-05-17T12:03:00Z"
    drill_notes: "kind cluster: audit_event WAL archive to MinIO, PITR restore to specific timestamp verified, archive retention simulation passed"
    verification:
      row_count_after_restore: 3
      row_count_matched: true
      restore_duration_seconds: 58

  # v1_global_replicated: グローバル複製のシミュレーション（3 cluster）
  - drill_id: restore__v1_global_replicated
    preservation_class: v1_global_replicated
    # ドリル実行結果（3 cluster MinIO 同期複製 + RPO=0 シミュレーション）
    drill_state: green
    drill_executed_at: "2026-05-17T12:04:00Z"
    drill_notes: "kind 3-cluster (k1s0-target+region-b+region-c) MinIO sync replication simulator, PITR restore verified, RTO < 5min, RPO=0 via synchronous WAL"
    verification:
      row_count_after_restore: 3
      row_count_matched: true
      restore_duration_seconds: 42
