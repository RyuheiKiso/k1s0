# PII 専用 CloudNativePG クラスター定義
# 個人情報（PII）を格納する専用 PostgreSQL クラスター
# WAL chain を main クラスターから完全分離して PII の漏洩リスクを最小化する
---
# PII 専用 namespace を作成（main クラスターの namespace と分離）
apiVersion: v1
kind: Namespace
metadata:
  # PII 専用 namespace（他の namespace から直接アクセスできないよう NetworkPolicy で制限）
  name: pii-cluster
  labels:
    # PII データを含む namespace であることを示すラベル（NetworkPolicy の selector に使用）
    k1s0.io/contains-pii: "true"
    # namespace のセキュリティレベルを示すラベル
    k1s0.io/security-tier: "critical"
---
# CloudNativePG Cluster CR: PII 専用クラスター
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  # PII クラスター名（main クラスターと明確に区別する命名）
  name: k1s0-pii
  # PII 専用 namespace に配置して他軸からの不正アクセスを防止
  namespace: pii-cluster
  annotations:
    # 保全クラス: ゾーン冗長（PII の可用性と冗長性を確保）
    k1s0.io/preservation-class: v1_zone_redundant
    # PII フラグ: このクラスターが個人情報を含むことを明示
    k1s0.io/contains-pii: "true"
    # WAL 分離: main クラスターとは独立した WAL アーカイブを使用
    k1s0.io/wal-chain-isolation: "pii-cluster"
spec:
  # レプリカ数: primary 1 + standby 2（PII も main と同等の冗長性を確保）
  instances: 3
  # PostgreSQL 16 の PII クラスター専用イメージ（main クラスターと同バージョン）
  imageName: ghcr.io/cloudnative-pg/postgresql:16.3
  postgresql:
    parameters:
      # pgaudit: PII クラスターの全操作を監査（ALL で全ログを取得）
      shared_preload_libraries: "pgaudit"
      # 全操作を監査対象に指定（PII アクセスは完全な監査証跡が必要）
      pgaudit.log: "all"
      # システムカタログの監査を有効化（PII クラスターは全て記録）
      pgaudit.log_catalog: "on"
      # パラメータバインディングを記録（SQL インジェクション検知に有効）
      pgaudit.log_parameter: "on"
      # WAL レベル: logical（Debezium CDC には logical が必要）
      wal_level: "logical"
      # WAL 送信者の最大数
      max_wal_senders: "10"
      # 接続数の上限: PII クラスターへのアクセスを制限（最小権限の原則）
      max_connections: "50"
      # アイドル接続のタイムアウト: 長時間アイドルは自動切断（セキュリティ強化）
      idle_in_transaction_session_timeout: "30000"
      # 行レベルセキュリティ: 全ロールに強制適用
      row_security: "on"
    pg_hba:
      # scram-sha-256 認証のみ許可（MD5 は禁止）
      - "host all all 0.0.0.0/0 scram-sha-256"
      # レプリケーション接続も scram-sha-256 で認証
      - "host replication all 0.0.0.0/0 scram-sha-256"
  bootstrap:
    initdb:
      # PII 専用データベース名（main クラスターの k1s0 と区別する）
      database: k1s0_pii
      # PII クラスター専用のアプリケーションユーザー（main クラスターとは別ロール）
      owner: k1s0piiapp
      # 初期化時に有効化する拡張モジュール
      postInitSQL:
        # pgaudit 拡張のインストール（PII クラスターの監査に必須）
        - "CREATE EXTENSION IF NOT EXISTS pgaudit;"
        # pgcrypto 拡張のインストール（AES-256-GCM 暗号化に必須）
        - "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
        # uuid-ossp 拡張のインストール（UUID 生成に必要）
        - "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
  backup:
    # PII バックアップ保持期間: 90 日（main より長期。規制要件に対応）
    retentionPolicy: "90d"
    barmanObjectStore:
      # PII 専用のバックアップバケット（main とは完全分離した保存先）
      destinationPath: "s3://k1s0-pii-backup/pii"
      # S3 エンドポイント: PII 専用の Ceph RGW エンドポイント
      endpointURL: "http://rook-ceph-rgw-pii.rook-ceph.svc.cluster.local"
      s3Credentials:
        accessKeyId:
          # PII バックアップ専用のアクセスキー Secret
          name: pii-backup-creds
          # Secret のキー名
          key: ACCESS_KEY_ID
        secretAccessKey:
          # PII バックアップ専用のシークレットキー Secret
          name: pii-backup-creds
          # Secret のキー名
          key: SECRET_ACCESS_KEY
      wal:
        # WAL の圧縮（PII データもストレージ効率化のため圧縮）
        compression: bzip2
        # WAL アーカイブの並列転送数
        maxParallel: 2
  affinity:
    # PII ノード: PII 専用ラベルが付いたノードにのみ配置
    topologyKey: topology.kubernetes.io/zone
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: k1s0.io/role
                operator: In
                values:
                  # PII 専用ノードにのみスケジュール（他ワークロードとの混在禁止）
                  - pii-database
  resources:
    requests:
      # CPU 要求: PII は main より少ない（アクセス頻度が低いため）
      cpu: "1"
      # メモリ要求: shared_buffers の 4 倍を目安に設定
      memory: "2Gi"
    limits:
      # CPU 上限: PII クラスターのリソース上限
      cpu: "2"
      # メモリ上限: OOM killer 発動を避けつつリソースを保護
      memory: "4Gi"
  storage:
    # PII データの永続化ストレージクラス（暗号化ブロックストレージ）
    storageClass: premium-encrypted-rwo
    # PVC サイズ: PII データは量が少ないが暗号化オーバーヘッドを考慮
    size: 50Gi
  monitoring:
    # Prometheus メトリクス収集を有効化（PII クラスターの監視も必要）
    enablePodMonitor: true
