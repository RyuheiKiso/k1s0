# Kafka トピック定義: Strimzi KafkaTopic CR
# k1s0 で使用する全 Kafka トピックをコードとして管理する（GitOps）
---
# ドメインイベントトピック: 全集約のドメインイベントを配信する
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  # トピック名（Kafka ブローカー上の実際のトピック名と一致する）
  name: domain-events
  # KafkaConnect が配置された namespace（TopicOperator が監視する）
  namespace: kafka-system
  labels:
    # このトピックが属する Kafka クラスターを指定するラベル
    strimzi.io/cluster: k1s0-kafka
spec:
  # パーティション数: テナント数を考慮した並列度
  partitions: 12
  # レプリケーション係数: broker 数と同じ（全 broker に replica を配置）
  replicas: 3
  config:
    # メッセージ保持期間（7 日間）: 長期分析のためのバッファー
    retention.ms: "604800000"
    # 最小同期レプリカ数（書き込み成功のための最低条件）
    min.insync.replicas: "2"
    # クリーンアップポリシー: delete（古いメッセージを削除する）
    cleanup.policy: delete
    # 最大メッセージサイズ（バイト）: Avro ペイロードの上限
    max.message.bytes: "1048576"
    # 圧縮アルゴリズム: ZSTD（高圧縮率）
    compression.type: zstd
---
# 監査イベントトピック: 全テナントの監査ログを集約する
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  # 監査イベント専用トピック名
  name: audit-events
  # KafkaConnect が配置された namespace
  namespace: kafka-system
  labels:
    # このトピックが属する Kafka クラスターを指定するラベル
    strimzi.io/cluster: k1s0-kafka
spec:
  # パーティション数: 監査ログは順序重視なので控えめに設定
  partitions: 6
  # レプリケーション係数: 監査ログは全 broker に配置（可用性最優先）
  replicas: 3
  config:
    # 監査ログの保持期間（90 日間): コンプライアンス要件に対応
    retention.ms: "7776000000"
    # 最小同期レプリカ数（全 broker での同期を要求）
    min.insync.replicas: "2"
    # クリーンアップポリシー: delete（保持期間外は削除）
    cleanup.policy: delete
    # 監査ログの最大サイズ制限（保存期間制御のため）
    max.message.bytes: "1048576"
    # 圧縮: 監査ログは長期保存を見越して圧縮率重視
    compression.type: zstd
---
# Outbox メッセージトピック: Transactional Outbox パターンのリレーに使用
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  # Outbox メッセージ専用トピック名
  name: outbox-messages
  # KafkaConnect が配置された namespace
  namespace: kafka-system
  labels:
    # このトピックが属する Kafka クラスターを指定するラベル
    strimzi.io/cluster: k1s0-kafka
spec:
  # パーティション数: ドメインイベントと同じ並列度に合わせる
  partitions: 12
  # レプリケーション係数: 配信保証のため全 broker に配置
  replicas: 3
  config:
    # Outbox メッセージの保持期間（1 時間）: 処理後に不要なため短め
    retention.ms: "3600000"
    # 最小同期レプリカ数
    min.insync.replicas: "2"
    # クリーンアップポリシー: delete
    cleanup.policy: delete
    # 最大メッセージサイズ
    max.message.bytes: "1048576"
    # 圧縮: Outbox は処理速度重視でスナッピー圧縮
    compression.type: snappy
---
# スキーマ変更トピック: DDL 変更・スキーマ進化イベントを記録する
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  # スキーマ変更専用トピック名
  name: schema-changes
  # KafkaConnect が配置された namespace
  namespace: kafka-system
  labels:
    # このトピックが属する Kafka クラスターを指定するラベル
    strimzi.io/cluster: k1s0-kafka
spec:
  # パーティション数: スキーマ変更は頻度が低いので 1 パーティション（順序保証）
  partitions: 1
  # レプリケーション係数: スキーマ変更履歴は重要なので全 broker に配置
  replicas: 3
  config:
    # スキーマ変更履歴の無期限保持（コンパクション使用）
    retention.ms: "-1"
    # 最小同期レプリカ数
    min.insync.replicas: "2"
    # クリーンアップポリシー: compact（スキーマ ID をキーにして最新版を保持）
    cleanup.policy: compact
    # コンパクション遅延（ミリ秒）: 最小保持時間を 1 時間に設定
    min.compaction.lag.ms: "3600000"
    # 最大メッセージサイズ
    max.message.bytes: "1048576"
