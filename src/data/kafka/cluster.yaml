# Strimzi Kafka Cluster CR: k1s0 メッセージングインフラ
# 3 broker 構成で高可用性と順序保証を実現する Kafka クラスタ定義
---
# Strimzi が提供する Kafka カスタムリソース種別
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  # Kafka クラスタ名（Strimzi が管理する一意の識別子）
  name: k1s0-kafka
  # Kafka 専用 namespace に配置してデータプレーンを分離する
  namespace: kafka-system
  labels:
    # プロジェクトラベル（全 k1s0 リソースに共通のラベル）
    k1s0.io/component: messaging
    # 管理者ラベル（Strimzi Operator が検出するラベル）
    strimzi.io/cluster: k1s0-kafka
spec:
  kafka:
    # broker 数: 3 ノード構成で過半数 quorum を実現（1 ノード障害を許容）
    replicas: 3
    # Kafka バージョン: 3.8.0（KRaft モードに対応した最新安定版）
    version: 3.8.0
    # KRaft モード: ZooKeeper を不要にしてメタデータ管理を Kafka 内部で完結
    metadataVersion: 3.8-IV0
    listeners:
      - # 内部通信用プレーンリスナー（クラスタ内 Pod 間通信）
        name: plain
        port: 9092
        type: internal
        # 内部通信は TLS なし（mTLS は Istio が担保するため）
        tls: false
      - # 内部通信用 TLS リスナー（機密データ送受信用）
        name: tls
        port: 9093
        type: internal
        # TLS を有効化してチャネル暗号化を確保
        tls: true
        authentication:
          # mTLS による双方向認証（クライアント証明書を必須とする）
          type: tls
    config:
      # オフセット管理トピックのレプリケーション係数（broker 数と同一）
      offsets.topic.replication.factor: 3
      # トランザクションログのレプリケーション係数（EXACTLY_ONCE に必要）
      transaction.state.log.replication.factor: 3
      # 最小同期レプリカ数（この数を下回ると書き込みを拒否する）
      min.insync.replicas: 2
      # トランザクションログの最小同期レプリカ数
      transaction.state.log.min.isr: 2
      # デフォルトのリテンション期間（7 日間）
      log.retention.hours: 168
      # デフォルトのパーティション数（スループットのスケールアウト基準）
      num.partitions: 12
      # 圧縮アルゴリズム: ZSTD（高圧縮率と高速展開のバランス）
      compression.type: zstd
      # 自動トピック作成を無効化（意図しないトピックの生成を防止）
      auto.create.topics.enable: false
      # 削除保護: トピックの誤削除を防ぐ（明示的な設定が必要）
      delete.topic.enable: true
      # グループ初期リバランス待機時間（起動時の不要なリバランスを削減）
      group.initial.rebalance.delay.ms: 3000
      # 最大メッセージサイズ（バイト）: Avro + メタデータを含む上限
      message.max.bytes: 1048576
    storage:
      # Kafka ログの永続化ストレージタイプ
      type: persistent-claim
      # ストレージサイズ（broker 1 台あたり）
      size: 200Gi
      # ストレージクラス: ゾーン冗長の高速ブロックストレージ
      class: premium-rwo
      # PVC の削除ポリシー: クラスタ削除時にデータを保持する
      deleteClaim: false
    resources:
      requests:
        # CPU 要求: 高スループット処理のための十分なコア数
        cpu: "2"
        # メモリ要求: JVM ヒープ + ページキャッシュを考慮した値
        memory: "4Gi"
      limits:
        # CPU 上限: スパイク時も他ワークロードへの影響を抑制
        cpu: "4"
        # メモリ上限: JVM が OOM にならない安全マージンを確保
        memory: "8Gi"
    jvmOptions:
      # JVM 初期ヒープサイズ（メモリ要求の 50%）
      -Xms: "2g"
      # JVM 最大ヒープサイズ（メモリ制限の 50%）
      -Xmx: "4g"
    rack:
      # ゾーン awareness: broker をゾーン間に分散して可用性を確保
      topologyKey: topology.kubernetes.io/zone
    metricsConfig:
      # JMX Exporter による Prometheus メトリクス収集を有効化
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          # Kafka JMX メトリクス設定を格納した ConfigMap
          name: kafka-metrics-config
          # ConfigMap 内のキー名
          key: kafka-metrics-config.yml
  zookeeper:
    # ZooKeeper 数（KRaft 移行完了まで維持）
    replicas: 3
    storage:
      # ZooKeeper データの永続化ストレージタイプ
      type: persistent-claim
      # ZooKeeper ストレージサイズ（メタデータのみなので小さくて良い）
      size: 10Gi
      # ストレージクラス: 標準ブロックストレージ（SSD でなくても良い）
      class: standard-rwo
      # PVC の削除ポリシー: クラスタ削除時にデータを保持する
      deleteClaim: false
    resources:
      requests:
        # CPU 要求: ZooKeeper は軽量なので少なめで良い
        cpu: "500m"
        # メモリ要求: メタデータのみなのでコンパクト
        memory: "1Gi"
      limits:
        # CPU 上限: ZooKeeper が broker のリソースを奪わないよう制限
        cpu: "1"
        # メモリ上限: ZooKeeper の適切な上限値
        memory: "2Gi"
  entityOperator:
    # トピック管理オペレーター（KafkaTopic CR を監視して自動作成・更新）
    topicOperator: {}
    # ユーザー管理オペレーター（KafkaUser CR を監視して証明書・ACL を管理）
    userOperator: {}
