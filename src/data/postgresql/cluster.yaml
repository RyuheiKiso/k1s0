# CloudNativePG Cluster CR: k1s0 メイン PostgreSQL クラスタ定義
# 3 レプリカ + WAL ストリーミング + pgaudit 拡張を備える本番クラスタ
apiVersion: postgresql.cnpg.io/v1
# CloudNativePG が提供する Cluster カスタムリソース種別
kind: Cluster
metadata:
  # クラスタ名: プロジェクト全体で一意の識別子
  name: k1s0-main
  # data 専用 namespace に配置しデータプレーンを他軸から分離
  namespace: k1s0-data
  annotations:
    # 保全クラス: ゾーン冗長（az 障害でもデータ損失なし）
    k1s0.io/preservation-class: v1_zone_redundant
    # トポロジクラス: マルチゾーン配置（レプリカをゾーン間に分散）
    k1s0.io/topology-class: v1_multi_zone_per_cluster
spec:
  # レプリカ数: primary 1 + standby 2 の合計 3 インスタンス
  instances: 3
  # PostgreSQL バージョン 16 を指定（本プロジェクトの標準バージョン）
  imageName: ghcr.io/cloudnative-pg/postgresql:16.3
  postgresql:
    parameters:
      # pgaudit を共有プリロードライブラリに追加して監査を有効化
      shared_preload_libraries: "pgaudit"
      # 書き込み・DDL・ロール変更を監査対象に指定
      pgaudit.log: "write,ddl,role"
      # システムカタログへのアクセスは監査対象外（ノイズ削減）
      pgaudit.log_catalog: "off"
      # 監査ログの詳細レベル: 関係する全オブジェクトを記録
      pgaudit.log_relation: "on"
      # クライアント接続ごとのセッション監査を有効化
      pgaudit.log_client: "on"
      # WAL ログレベル: レプリケーションに必要な最低レベル
      wal_level: "logical"
      # WAL 受信者の最大接続数（レプリカ 2 + Debezium 1 の計 3）
      max_wal_senders: "10"
      # レプリケーションスロットの最大数（Debezium CDC 用に余裕を持たせる）
      max_replication_slots: "10"
      # 接続タイムアウト: 長時間アイドルの接続を自動切断（秒）
      tcp_keepalives_idle: "60"
      # ログ出力先: stderr に統一して Fluentd が収集できるようにする
      log_destination: "stderr"
      # JSON 形式でログを出力して構造化ログ収集を容易にする
      log_line_prefix: "%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "
      # 実行時間がこの閾値を超えるクエリをログに記録（ミリ秒）
      log_min_duration_statement: "1000"
      # チェックポイント警告: 超過時にログ出力（秒）
      checkpoint_warning: "30"
    pg_hba:
      # scram-sha-256 認証: MD5 より強固なパスワードハッシュ方式
      - "host all all 0.0.0.0/0 scram-sha-256"
      # レプリケーション接続も scram-sha-256 で認証
      - "host replication all 0.0.0.0/0 scram-sha-256"
  bootstrap:
    initdb:
      # 初期データベース名: アプリケーション専用スキーマを格納
      database: k1s0
      # データベースオーナー: アプリケーションサービスアカウント
      owner: k1s0app
      # 初期化時に有効化する拡張モジュール一覧
      postInitSQL:
        # pgaudit 拡張をインストール（監査ログに必須）
        - "CREATE EXTENSION IF NOT EXISTS pgaudit;"
        # pgcrypto 拡張をインストール（AES 暗号化関数に必須）
        - "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
        # uuid-ossp 拡張をインストール（UUID 生成関数に必須）
        - "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
  backup:
    # バックアップ保持期間: 30 日間（RTO/RPO 要件を満たす最低ライン）
    retentionPolicy: "30d"
    barmanObjectStore:
      # バックアップ格納先: S3 互換オブジェクトストレージ
      destinationPath: "s3://k1s0-backup/main"
      # S3 エンドポイント: Rook/Ceph RGW を使用（クラスタ内完結）
      endpointURL: "http://rook-ceph-rgw-default.rook-ceph.svc.cluster.local"
      s3Credentials:
        accessKeyId:
          # アクセスキー ID は Kubernetes Secret から参照
          name: backup-creds
          # Secret のキー名
          key: ACCESS_KEY_ID
        secretAccessKey:
          # シークレットアクセスキーも Secret から参照
          name: backup-creds
          # Secret のキー名
          key: SECRET_ACCESS_KEY
      wal:
        # WAL セグメントの最大圧縮レベル（bzip2 使用）
        compression: bzip2
        # WAL アーカイブの最大並列転送数
        maxParallel: 4
  affinity:
    # ゾーン間分散: 同一 az にレプリカが集中することを防ぐ
    topologyKey: topology.kubernetes.io/zone
    # ノードアフィニティ: PostgreSQL 専用ラベルが付いたノードに配置
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: k1s0.io/role
                operator: In
                values:
                  # データベース専用ノールにのみスケジュール
                  - database
  resources:
    requests:
      # CPU 要求: ベースロードを処理できる最低限のリソース
      cpu: "2"
      # メモリ要求: shared_buffers の 4 倍を目安に設定
      memory: "4Gi"
    limits:
      # CPU 上限: スパイク時も他のワークロードへの影響を抑制
      cpu: "4"
      # メモリ上限: OOM killer 発動を避けつつリソースを保護
      memory: "8Gi"
  storage:
    # PVC ストレージクラス: ゾーン冗長の高速ブロックストレージ
    storageClass: premium-rwo
    # PVC サイズ: データ増加を見越した初期サイズ
    size: 100Gi
  monitoring:
    # Prometheus メトリクス収集を有効化
    enablePodMonitor: true
  # プライマリ昇格戦略: 最も遅延の少ないレプリカを優先
  primaryUpdateStrategy: unsupervised
