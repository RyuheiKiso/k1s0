# Ceph Object Store: WORM Object Lock Compliance mode 設定
# 一度書き込まれたオブジェクトを指定期間内に変更・削除できないようにする
---
# CephObjectStore: S3 互換オブジェクトストレージの定義
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  # Object Store の名前（バックアップ保存先として使用）
  name: k1s0-worm-store
  # rook-ceph 専用 namespace に配置する
  namespace: rook-ceph
spec:
  # メタデータプール設定（バケットメタデータの保存場所）
  metadataPool:
    failureDomain: zone
    replicated:
      # メタデータのレプリカ数: 3 ゾーンに配置して耐障害性を確保
      size: 3
      # ゾーン間の要求を満たさない場合はエラーを返す
      requireSafeReplicaSize: true
  # データプール設定（オブジェクトデータの保存場所）
  dataPool:
    failureDomain: zone
    # イレイジャーコーディング: 4データ+2パリティ（HDD 効率化）
    erasureCoded:
      # データチャンク数
      dataChunks: 4
      # パリティチャンク数（2 ノード障害まで許容）
      codingChunks: 2
  # S3 ゲートウェイ（RGW）の設定
  gateway:
    # RGW の HTTP ポート番号（S3 クライアントが接続するポート）
    port: 80
    # RGW のレプリカ数（高可用性のため 2 以上）
    instances: 2
    resources:
      requests:
        # CPU 要求: S3 API 処理のための最低限のリソース
        cpu: "500m"
        # メモリ要求: キャッシュを含めた適切なメモリ量
        memory: "1Gi"
      limits:
        # CPU 上限: スパイク時の制限
        cpu: "2"
        # メモリ上限: RGW の安全な上限値
        memory: "2Gi"
---
# Object Lock Compliance mode: バックアップ用バケットの WORM 設定
# AWS S3 Object Lock API 互換の設定を CephObjectStore に適用する
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  # WORM バックアップバケットの Claim 名
  name: k1s0-backup-bucket
  # アプリケーション namespace に配置（バックアップサービスからアクセス）
  namespace: k1s0-data
spec:
  # バケット名（S3 API でアクセスする際のバケット名）
  bucketName: k1s0-backup
  # 接続先の Object Store（上記で定義した CephObjectStore を参照）
  storageClassName: rook-ceph-bucket
  additionalConfig:
    # Object Lock を有効化（バケット作成時に設定が必要）
    objectLockEnabled: "true"
    # デフォルトの Object Lock 保持モード: COMPLIANCE（削除不可の最強モード）
    # GOVERNANCE モードは管理者が削除できるため、COMPLIANCE を選択する
    objectLockDefaultMode: "COMPLIANCE"
    # デフォルトの保持期間（日数）: 30 日間は削除・変更を禁止
    objectLockDefaultRetentionDays: "30"
