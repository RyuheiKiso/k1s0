# Backstage software template: tier2 サービスの scaffold テンプレートを定義する
# tier2 は k1s0 アーキテクチャの中間層（テナント分離 SDK・facade を提供する層）
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  # テンプレートの一意識別子
  name: k1s0-tier2-service
  # Backstage UI に表示されるタイトル
  title: k1s0 Tier2 Service (SDK Facade)
  # テンプレートの用途説明（Backstage UI に表示される）
  description: >
    k1s0 tier2 サービスの scaffold テンプレート。
    テナント分離 SDK・facade を Rust/C#/Go/TypeScript で実装する。
    tier1 OSS の public API を直接露出せず facade 経由で公開する制約を含む。
  # テンプレートのタグ（検索・フィルタリング用）
  tags:
    - tier2
    - sdk
    - facade
    - tenant-isolation
    - k1s0
spec:
  # テンプレートのオーナー
  owner: k1s0-infra-team
  # テンプレートのタイプ
  type: library
  # ============================================================
  # ユーザ入力パラメータ: テンプレート適用時に入力が必要な項目
  # ============================================================
  parameters:
    # 基本情報グループ: SDK の識別情報を入力する
    - title: 基本情報
      required:
        - component_name
        - owner
        - language
        - tenant_isolation_model
      properties:
        # コンポーネント名（kebab-case で入力する）
        component_name:
          title: コンポーネント名
          type: string
          description: SDK/facade の名前（kebab-case、例 transport-sdk）
          pattern: "^[a-z][a-z0-9-]*$"
          ui:autofocus: true
        # オーナーチーム
        owner:
          title: オーナー
          type: string
          description: この SDK を管理するチーム名
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        # 実装言語の選択（4 言語等価強度）
        language:
          title: 実装言語
          type: string
          description: tier2 SDK の実装言語を選択する（4 言語等価強度）
          enum:
            - rust
            - csharp
            - go
            - typescript
          enumNames:
            - Rust
            - C# (.NET 8+)
            - Go 1.22+
            - TypeScript
        # テナント分離モデルの選択
        tenant_isolation_model:
          title: テナント分離モデル
          type: string
          description: テナント分離の実装方式を選択する
          enum:
            - row_level_security
            - namespace_isolation
            - schema_isolation
          enumNames:
            - Row Level Security (PostgreSQL RLS)
            - Kubernetes Namespace 分離
            - スキーマ分離
    # 依存設定グループ: tier1 との接続設定を入力する
    - title: 依存設定
      properties:
        # 依存する tier1 コンポーネント名
        tier1_dependency:
          title: tier1 依存コンポーネント
          type: string
          description: このSDKが facade を提供する tier1 コンポーネント名
        # tier1 API を直接露出しないことを確認するチェック
        facade_only:
          title: facade のみ公開する
          type: boolean
          description: tier1 OSS の public API を直接公開しないことを確認する（必須）
          default: true
  # ============================================================
  # scaffold ステップ: テンプレートファイルを生成する処理
  # ============================================================
  steps:
    # リポジトリテンプレートから新しい SDK を生成する
    - id: fetch-base
      name: テンプレートファイルを取得する
      action: fetch:template
      input:
        # tier2 SDK のベーステンプレートを参照する
        url: https://github.com/k1s0/templates/tree/main/tier2/${{ parameters.language }}
        values:
          # テンプレート変数にユーザ入力を渡す
          name: ${{ parameters.component_name }}
          owner: ${{ parameters.owner }}
          tenant_isolation_model: ${{ parameters.tenant_isolation_model }}
          tier1_dependency: ${{ parameters.tier1_dependency }}
          facade_only: ${{ parameters.facade_only }}

    # GitHub に新しいリポジトリを作成してコードをプッシュする
    - id: publish
      name: GitHub リポジトリを作成してコードを公開する
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.component_name }}&owner=k1s0
        description: k1s0 tier2 SDK facade - ${{ parameters.component_name }}
        defaultBranch: main
        repoVisibility: private

    # Backstage カタログに新しいコンポーネントを登録する
    - id: register
      name: Backstage カタログに登録する
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # ============================================================
  # 出力: scaffold 完了後にユーザに表示するリンク
  # ============================================================
  output:
    links:
      - title: リポジトリを開く
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Backstage カタログで確認する
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
