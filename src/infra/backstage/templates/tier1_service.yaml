# Backstage software template: tier1 サービスの scaffold テンプレートを定義する
# tier1 は k1s0 アーキテクチャの最下層（Rust/Go で実装するサーバ・operator 層）
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  # テンプレートの一意識別子
  name: k1s0-tier1-service
  # Backstage UI に表示されるタイトル
  title: k1s0 Tier1 Service (Rust/Go)
  # テンプレートの用途説明（Backstage UI に表示される）
  description: >
    k1s0 tier1 サービスの scaffold テンプレート。
    Rust (axum) または Go (net/http) で実装する低レイヤサーバ・operator を生成する。
    HLC 必須 / RLS 強制 / cosign 署名フローを含む。
  # テンプレートのタグ（検索・フィルタリング用）
  tags:
    - tier1
    - rust
    - go
    - k1s0
    - operator
spec:
  # テンプレートのオーナー（レビュー責任者）
  owner: k1s0-infra-team
  # テンプレートのタイプ
  type: service
  # ============================================================
  # ユーザ入力パラメータ: テンプレート適用時に入力が必要な項目
  # ============================================================
  parameters:
    # 基本情報グループ: サービスの識別情報を入力する
    - title: 基本情報
      required:
        - component_name
        - owner
        - language
      properties:
        # コンポーネント名（kebab-case で入力する）
        component_name:
          title: コンポーネント名
          type: string
          description: サービスの名前（kebab-case、例 transport-server）
          pattern: "^[a-z][a-z0-9-]*$"
          ui:autofocus: true
        # オーナーチーム
        owner:
          title: オーナー
          type: string
          description: このサービスを管理するチーム名
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        # 実装言語の選択
        language:
          title: 実装言語
          type: string
          description: tier1 サービスの実装言語を選択する
          enum:
            - rust
            - go
          enumNames:
            - Rust (axum + tokio)
            - Go (net/http + cobra)
    # インフラ設定グループ: Kubernetes リソースの設定を入力する
    - title: インフラ設定
      properties:
        # デプロイ先 Namespace
        namespace:
          title: Namespace
          type: string
          description: デプロイ先の Kubernetes Namespace
          default: tier1
        # レプリカ数
        replica_count:
          title: レプリカ数
          type: integer
          description: デプロイ時のレプリカ数（HPA が上書きする）
          default: 3
          minimum: 1
          maximum: 10
        # HLC 統合を有効化するか
        hlc_enabled:
          title: HLC 統合
          type: boolean
          description: Hybrid Logical Clock を有効化するか（tier1 は必須）
          default: true
  # ============================================================
  # scaffold ステップ: テンプレートファイルを生成する処理
  # ============================================================
  steps:
    # リポジトリテンプレートから新しいサービスを生成する
    - id: fetch-base
      name: テンプレートファイルを取得する
      action: fetch:template
      input:
        # tier1 サービスのベーステンプレートを参照する
        url: https://github.com/k1s0/templates/tree/main/tier1/${{ parameters.language }}
        values:
          # テンプレート変数にユーザ入力を渡す
          name: ${{ parameters.component_name }}
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.namespace }}
          replica_count: ${{ parameters.replica_count }}
          hlc_enabled: ${{ parameters.hlc_enabled }}

    # GitHub に新しいリポジトリを作成してコードをプッシュする
    - id: publish
      name: GitHub リポジトリを作成してコードを公開する
      action: publish:github
      input:
        # リポジトリの完全パスを指定する
        repoUrl: github.com?repo=${{ parameters.component_name }}&owner=k1s0
        # リポジトリの説明文
        description: k1s0 tier1 service - ${{ parameters.component_name }}
        # デフォルトブランチ名
        defaultBranch: main
        # リポジトリの可視性（private を推奨する）
        repoVisibility: private

    # Backstage カタログに新しいコンポーネントを登録する
    - id: register
      name: Backstage カタログに登録する
      action: catalog:register
      input:
        # 登録する catalog-info.yaml のパスを指定する
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # ============================================================
  # 出力: scaffold 完了後にユーザに表示するリンク
  # ============================================================
  output:
    links:
      # 生成されたリポジトリへのリンク
      - title: リポジトリを開く
        url: ${{ steps.publish.output.remoteUrl }}
      # Backstage カタログのコンポーネントページへのリンク
      - title: Backstage カタログで確認する
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
