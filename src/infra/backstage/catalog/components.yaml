# Backstage catalog-info.yaml: k1s0 全 19 軸の ComponentEntity を定義する
# Backstage Software Catalog に登録してサービスカタログとして可視化する
---
# ============================================================
# tier1: 低レイヤサーバ・operator 層（Rust/Go で実装する）
# ============================================================
# tier1 コンポーネントエンティティを定義する
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  # コンポーネントの一意識別子（k1s0 軸 ID と一致させる）
  name: k1s0-tier1
  # Backstage UI に表示されるタイトル
  title: k1s0 Tier1 - Transport Server & Operators
  description: >
    k1s0 最下層。Rust axum による HTTP/2 transport server と
    Kubernetes operator（Go）を含む。HLC 必須 / cosign 署名済み image のみ。
  # 検索・フィルタリング用のアノテーション
  annotations:
    backstage.io/techdocs-ref: dir:.
    k1s0.io/axis-id: "tier1"
    k1s0.io/layer: "application"
  tags:
    - tier1
    - rust
    - go
    - operator
spec:
  # コンポーネントのタイプ（service / library / website）
  type: service
  # ライフサイクル状態
  lifecycle: experimental
  # オーナーチーム
  owner: k1s0-infra-team
  # 依存する他のコンポーネント
  dependsOn:
    - component:k1s0-infra
    - component:k1s0-formal
---
