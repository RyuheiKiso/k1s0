# cert-manager TLS 証明書自動管理の HelmRelease を定義する
# ClusterIssuer + Certificate CRD で証明書ライフサイクルを自動化する
{{- if .Values.certManager.enabled }}
---
# cert-manager 公式 Helm リポジトリ参照を定義する
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  # cert-manager Helm リポジトリの参照名
  name: cert-manager
  # Flux GitOps 管理 Namespace に配置する
  namespace: flux-system
  labels:
    {{- include "k1s0.labels" . | nindent 4 }}
spec:
  # cert-manager 公式 Helm リポジトリ URL
  url: https://charts.jetstack.io
  # リポジトリキャッシュ更新間隔
  interval: 1h
---
# cert-manager の HelmRelease を定義する
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # HelmRelease リソースの名前
  name: cert-manager
  # cert-manager をデプロイする専用 Namespace
  namespace: {{ .Values.certManager.namespace }}
  labels:
    {{- include "k1s0.labels" . | nindent 4 }}
spec:
  # Helm chart をポーリングする間隔
  interval: 5m
  chart:
    spec:
      # 使用する chart 名
      chart: cert-manager
      # デプロイするバージョン
      version: {{ .Values.certManager.version | quote }}
      # 参照する HelmRepository
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  # Helm values で詳細設定を上書きする
  values:
    # CRD（CustomResourceDefinition）を Helm で管理するか
    installCRDs: {{ .Values.certManager.installCRDs }}
    # Prometheus メトリクスを有効化する
    prometheus:
      enabled: true
    # webhook の設定（admission を担当するコンポーネント）
    webhook:
      # webhook のタイムアウト秒数
      timeoutSeconds: 30
---
# k1s0 ローカル開発用 self-signed ClusterIssuer を定義する
{{- if eq .Values.certManager.issuerType "selfsigned" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  # 開発環境用 self-signed 発行者名
  name: k1s0-selfsigned-issuer
  labels:
    {{- include "k1s0.labels" . | nindent 4 }}
spec:
  # self-signed 発行者設定（CA 証明書を自己署名で生成する）
  selfSigned: {}
{{- end }}
{{- end }}
