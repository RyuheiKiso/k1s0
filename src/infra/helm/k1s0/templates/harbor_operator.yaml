# Harbor コンテナレジストリの HelmRelease を定義する
# cosign による image 署名検証を admission 層で強制する
{{- if .Values.harbor.enabled }}
---
# Harbor 公式 Helm リポジトリ参照を定義する
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  # Harbor Helm リポジトリの参照名
  name: harbor
  # Flux GitOps 管理 Namespace に配置する
  namespace: flux-system
  labels:
    {{- include "k1s0.labels" . | nindent 4 }}
spec:
  # Harbor 公式 Helm リポジトリ URL
  url: https://helm.goharbor.io
  # リポジトリキャッシュ更新間隔
  interval: 1h
---
# Harbor の HelmRelease を定義する
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # HelmRelease リソースの名前
  name: harbor
  # Harbor をデプロイする専用 Namespace
  namespace: {{ .Values.harbor.namespace }}
  labels:
    {{- include "k1s0.labels" . | nindent 4 }}
spec:
  # Helm chart をポーリングする間隔
  interval: 5m
  chart:
    spec:
      # 使用する chart 名
      chart: harbor
      # デプロイするバージョン
      version: {{ .Values.harbor.version | quote }}
      # 参照する HelmRepository
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  # Helm values で詳細設定を上書きする
  values:
    # Harbor の外部アクセス URL（kind ローカル環境）
    externalURL: {{ .Values.harbor.externalURL | quote }}
    # Notary による image 署名検証の有効化
    notary:
      enabled: {{ .Values.harbor.notary.enabled }}
    # Harbor core コンポーネントの設定
    core:
      # TLS を強制する
      tls:
        enabled: true
    # レジストリコンポーネントの設定
    registry:
      # image の push/pull に認証を必須にする
      credentials:
        enabled: true
    # Trivy による脆弱性スキャンを有効化する
    trivy:
      enabled: true
      # 自動スキャンを有効化する
      automatedScan: true
{{- end }}
