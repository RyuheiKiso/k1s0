# OpenBao シークレット管理の HelmRelease を定義する
# HashiCorp Vault フォーク: Transit secrets engine で cosign 署名を提供する
{{- if .Values.openbao.enabled }}
---
# OpenBao Helm リポジトリ参照を定義する
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  # OpenBao Helm リポジトリの参照名
  name: openbao
  # Flux GitOps 管理 Namespace に配置する
  namespace: flux-system
  labels:
    {{- include "k1s0.labels" . | nindent 4 }}
spec:
  # OpenBao 公式 Helm リポジトリ URL
  url: https://openbao.github.io/openbao
  # リポジトリキャッシュ更新間隔
  interval: 1h
---
# OpenBao の HelmRelease を定義する
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # HelmRelease リソースの名前
  name: openbao
  # OpenBao をデプロイする専用 Namespace
  namespace: {{ .Values.openbao.namespace }}
  labels:
    {{- include "k1s0.labels" . | nindent 4 }}
spec:
  # Helm chart をポーリングする間隔
  interval: 5m
  chart:
    spec:
      # 使用する chart 名
      chart: openbao
      # デプロイするバージョン
      version: {{ .Values.openbao.version | quote }}
      # 参照する HelmRepository
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
  # Helm values で詳細設定を上書きする
  values:
    # HA モード設定
    ha:
      # HA を有効化するか
      enabled: {{ .Values.openbao.ha.enabled }}
      # HA レプリカ数（3 以上を推奨）
      replicas: {{ .Values.openbao.ha.replicas }}
      # Raft ストレージバックエンドを使用する
      raft:
        enabled: true
    # Transit secrets engine の設定（cosign sign-on-demand 用）
    server:
      # Pod のセキュリティコンテキスト
      securityContext:
        # non-root ユーザで動作させる
        runAsNonRoot: true
      # 自動 unseal を有効化（Kubernetes auth backend 使用）
      extraEnvironmentVars:
        BAO_SKIP_VERIFY: "true"
    # injector（サイドカー）の有効化設定
    injector:
      # Agent Injector を有効化する
      enabled: true
{{- end }}
