# k1s0 Helm chart のデフォルト値定義ファイル
# 各 operator の有効/無効スイッチと image tag を一元管理する

# ============================================================
# Kyverno: Kubernetes admission policy エンジン
# ============================================================
kyverno:
  # Kyverno operator を有効化するか
  enabled: true
  # デプロイ先 namespace
  namespace: kyverno
  # デプロイするバージョン
  version: "3.3.0"
  # 高可用性レプリカ数（admission controller）
  replicaCount: 3
  # リソース制限値
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ============================================================
# CloudNativePG: PostgreSQL クラスタ operator
# ============================================================
cloudnativePg:
  # CloudNativePG operator を有効化するか
  enabled: true
  # デプロイ先 namespace
  namespace: cnpg-system
  # デプロイするバージョン
  version: "1.24.0"
  # operator レプリカ数（1 が推奨）
  replicaCount: 1
  # operator の image リポジトリ
  image:
    repository: ghcr.io/cloudnative-pg/cloudnative-pg
    pullPolicy: IfNotPresent

# ============================================================
# Strimzi: Kafka operator（Kafka クラスタ管理）
# ============================================================
strimzi:
  # Strimzi operator を有効化するか
  enabled: true
  # デプロイ先 namespace
  namespace: kafka-system
  # デプロイするバージョン
  version: "0.43.0"
  # Kafka クラスタのデフォルトレプリカ数
  kafkaReplicas: 3
  # ZooKeeper レプリカ数（KRaft 移行まで必要）
  zookeeperReplicas: 3

# ============================================================
# Apicurio Registry: API スキーマレジストリ
# ============================================================
apicurio:
  # Apicurio を有効化するか
  enabled: true
  # デプロイ先 namespace
  namespace: apicurio
  # デプロイするバージョン
  version: "2.6.8.Final"
  # ストレージバックエンド（kafka / sql）
  storageType: sql

# ============================================================
# OpenBao: HashiCorp Vault フォーク（シークレット管理）
# ============================================================
openbao:
  # OpenBao を有効化するか
  enabled: true
  # デプロイ先 namespace
  namespace: openbao
  # デプロイするバージョン
  version: "2.0.0"
  # HA モードを有効にするか
  ha:
    enabled: true
    replicas: 3
  # Transit secrets engine を有効化（cosign sign-on-demand 用）
  transit:
    enabled: true

# ============================================================
# Harbor: コンテナイメージレジストリ（cosign 検証付き）
# ============================================================
harbor:
  # Harbor を有効化するか
  enabled: true
  # デプロイ先 namespace
  namespace: harbor
  # デプロイするバージョン
  version: "1.14.0"
  # 外部 URL（ローカル kind 環境）
  externalURL: https://harbor.k1s0.local
  # notary による image 署名検証を有効化するか
  notary:
    enabled: true

# ============================================================
# ClickHouse: 分析用列指向データベース
# ============================================================
clickhouse:
  # 大量リソースのため CI 環境では無効化
  enabled: false
  # デプロイ先 namespace
  namespace: clickhouse
  # デプロイするバージョン
  version: "24.8.0"
  # シャード数（本番向け設定）
  shards: 2
  # レプリカ数（シャードあたり）
  replicas: 2

# ============================================================
# Cilium: eBPF ベース CNI プラグイン
# ============================================================
cilium:
  # Cilium CNI を有効化するか
  enabled: true
  # デプロイするバージョン
  version: "1.16.0"
  # Hubble 可観測性を有効化するか
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true
  # k1s0 eBPF probe との競合を避けるための設定
  bpf:
    masquerade: true

# ============================================================
# MetalLB: ベアメタル向け LoadBalancer
# ============================================================
metallb:
  # MetalLB を有効化するか
  enabled: true
  # デプロイ先 namespace
  namespace: metallb-system
  # デプロイするバージョン
  version: "0.14.0"
  # IPAddressPool の割り当て範囲（kind 環境向け）
  ipPool:
    addresses:
      - "172.18.255.200-172.18.255.250"

# ============================================================
# cert-manager: TLS 証明書自動発行・管理
# ============================================================
certManager:
  # cert-manager を有効化するか
  enabled: true
  # デプロイ先 namespace
  namespace: cert-manager
  # デプロイするバージョン
  version: "1.16.0"
  # ClusterIssuer の種類（selfsigned / letsencrypt）
  issuerType: selfsigned
  # インストール時に CRD も一緒にインストールするか
  installCRDs: true

# ============================================================
# グローバル設定（全 operator 共通）
# ============================================================
global:
  # イメージプルシークレット名（Harbor 認証用）
  imagePullSecrets: []
  # k1s0 環境識別子
  environment: development
  # cosign による image 検証を強制するか
  cosignVerification: true
