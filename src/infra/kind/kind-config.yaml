# k1s0-target クラスタ設定（3ノード: control-plane + worker×2）
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k1s0-target
nodes:
  # コントロールプレーン（zone-a）
  - role: control-plane
    image: kindest/node:v1.31.4
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/zone=zone-a"
    extraPortMappings:
      # HTTP トラフィック
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      # HTTPS トラフィック
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  # ワーカー（zone-b）
  - role: worker
    image: kindest/node:v1.31.4
    labels:
      topology.kubernetes.io/zone: zone-b
  # ワーカー（zone-c）
  - role: worker
    image: kindest/node:v1.31.4
    labels:
      topology.kubernetes.io/zone: zone-c
networking:
  # CNI は Cilium を別途インストールするため無効化
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
