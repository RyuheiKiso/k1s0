# Chrony DaemonSet 設定: multi-stratum1 GPS 参照による NTP 同期を提供する
# clock_integrity_class v1_dc_chrony_stratum1 の物理実装となる
---
# Chrony 設定を格納する ConfigMap を定義する
apiVersion: v1
kind: ConfigMap
metadata:
  # ConfigMap の名前（chrony DaemonSet が参照する）
  name: chrony-config
  # kube-system Namespace に配置して全ノードからアクセス可能にする
  namespace: kube-system
  labels:
    # k1s0 infra 軸の管理下に属することを示すラベル
    k1s0.io/axis: infra
    k1s0.io/component: clock-integrity
data:
  # chrony.conf の内容をインラインで定義する
  chrony.conf: |
    # stratum1 GPS 参照サーバを複数指定して冗長性を確保する
    # iburst オプションで初回同期を高速化する
    server 0.pool.ntp.org iburst minpoll 4 maxpoll 8
    # 第二の stratum1 参照サーバ（冗長性のため 2 つ以上指定する）
    server 1.pool.ntp.org iburst minpoll 4 maxpoll 8
    # ローカル GPS 参照（PPS デバイスがある場合に有効化する）
    # server 127.127.1.0 iburst prefer
    # 最大許容ずれ（seconds）を超えた場合に強制ステップ調整する
    makestep 0.001 3
    # 時刻追跡精度をカーネルに通知する（精度 1ms を設定する）
    maxdistance 1.0
    # RTCFile で RTC との同期を記録する
    rtcsync
    # ログ出力設定（測定値・統計・追跡情報を記録する）
    logdir /var/log/chrony
    log measurements statistics tracking
---
# Chrony を全ノードで稼働させる DaemonSet を定義する
apiVersion: apps/v1
kind: DaemonSet
metadata:
  # DaemonSet の名前
  name: chrony
  # kube-system Namespace に配置する
  namespace: kube-system
  labels:
    k1s0.io/axis: infra
    k1s0.io/component: clock-integrity
    k1s0.io/clock-class: v1_dc_chrony_stratum1
spec:
  # 全ノードに 1 Pod ずつデプロイするセレクタ
  selector:
    matchLabels:
      app: chrony
  template:
    metadata:
      labels:
        app: chrony
        k1s0.io/component: clock-integrity
    spec:
      # ホストネットワークを使用して NTP ポート（123/UDP）にアクセスする
      hostNetwork: true
      containers:
        - name: chrony
          # Chrony 公式イメージを使用する
          image: ghcr.io/k1s0/chrony:3.5
          # privileged モードで NTP 時刻調整の権限を取得する
          securityContext:
            privileged: true
          # chrony.conf を ConfigMap からマウントする
          volumeMounts:
            - name: chrony-config
              mountPath: /etc/chrony
      volumes:
        # chrony 設定 ConfigMap をボリュームとしてマウントする
        - name: chrony-config
          configMap:
            name: chrony-config
