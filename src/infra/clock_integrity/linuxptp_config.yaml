# linuxPTP 設定: PTP IEEE 1588v2 boundary clock を DaemonSet として deploy する
# clock_integrity_class v1_intra_rack_ptp の物理実装となる
---
# PTP4L 設定を格納する ConfigMap を定義する
apiVersion: v1
kind: ConfigMap
metadata:
  # ConfigMap の名前（ptp4l DaemonSet が参照する）
  name: ptp4l-config
  # kube-system Namespace に配置する
  namespace: kube-system
  labels:
    k1s0.io/axis: infra
    k1s0.io/component: clock-integrity
    k1s0.io/clock-class: v1_intra_rack_ptp
data:
  # ptp4l.conf の内容をインラインで定義する
  ptp4l.conf: |
    # PTP ドメイン番号（デフォルトは 0、ネットワーク内で一意にする）
    [global]
    domainNumber 0
    # boundary clock として動作する設定
    clockType BC
    # ネットワークトランスポート（L2 Ethernet を使用する）
    network_transport L2
    # delay メカニズム（end-to-end delay measurement を使用する）
    delay_mechanism E2E
    # hardware タイムスタンプを使用する（sub-microsecond 精度に必要）
    time_stamping hardware
    # 時刻ずれ閾値（nanoseconds）を超えたら警告ログを出力する
    step_threshold 2000000000
    # 最大オフセット許容値（nanoseconds）
    max_frequency 900000000
    # ログ出力レベル（7=DEBUG, 6=INFO, 5=NOTICE）
    logLevel 6
    # eth0 インターフェースで PTP を有効化する
    [eth0]
    logAnnounceInterval -3
    logSyncInterval -4
    logMinDelayReqInterval -4
---
# PTP4L を全ノードで稼働させる DaemonSet を定義する
apiVersion: apps/v1
kind: DaemonSet
metadata:
  # DaemonSet の名前
  name: ptp4l
  # kube-system Namespace に配置する
  namespace: kube-system
  labels:
    k1s0.io/axis: infra
    k1s0.io/component: clock-integrity
    k1s0.io/clock-class: v1_intra_rack_ptp
spec:
  # 全ノードに 1 Pod ずつデプロイするセレクタ
  selector:
    matchLabels:
      app: ptp4l
  template:
    metadata:
      labels:
        app: ptp4l
        k1s0.io/component: clock-integrity
    spec:
      # ホストネットワークを使用して PTP パケットにアクセスする
      hostNetwork: true
      containers:
        - name: ptp4l
          # linuxptp 公式イメージを使用する
          image: ghcr.io/k1s0/linuxptp:4.1
          # hardware タイムスタンプのためにネットワーク権限が必要
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_TIME
          # ptp4l 設定ファイルを参照して起動する
          command: ["/usr/sbin/ptp4l", "-f", "/etc/ptp4l/ptp4l.conf", "-i", "eth0"]
          volumeMounts:
            # ptp4l 設定を ConfigMap からマウントする
            - name: ptp4l-config
              mountPath: /etc/ptp4l
      volumes:
        # ptp4l 設定 ConfigMap をボリュームとしてマウントする
        - name: ptp4l-config
          configMap:
            name: ptp4l-config
