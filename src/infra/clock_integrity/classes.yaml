# 5 つの clock_integrity_class 定義（クラスタの時刻整合クラスを宣言する）
# 各クラスは clock_causality_proof.lock.yaml と chrony/ptp 設定で参照される
clock_integrity_classes:
  # ラック内 PTP（IEEE 1588v2）による高精度時刻同期クラス
  - class_id: v1_intra_rack_ptp
    # クラスの説明文（人間が読む用途）
    description: ラック内 PTP IEEE 1588v2 による高精度時刻同期（sub-microsecond 精度）
    # 時刻同期プロトコル種別
    sync_protocol: ptp_ieee1588v2
    # 許容する最大時刻ずれ（マイクロ秒）
    max_skew_us: 1
    # eBPF clock_skew_probe による監視を必須とするか
    ebpf_monitoring_required: true
    # 適合する物理環境の条件
    environment_constraint: same_rack_hardware

  # データセンター内 Chrony stratum1 GPS 参照クラス
  - class_id: v1_dc_chrony_stratum1
    description: データセンター内 Chrony stratum1 GPS 参照（millisecond 精度）
    sync_protocol: ntp_chrony_stratum1
    # 許容する最大時刻ずれ（マイクロ秒）
    max_skew_us: 1000
    ebpf_monitoring_required: true
    environment_constraint: same_datacenter

  # マルチリージョン NTP 同期クラス（広域 WAN 経由）
  - class_id: v1_multi_region_ntp
    description: マルチリージョン NTP 同期（WAN 経由、10ms 精度）
    sync_protocol: ntp_pool
    # 許容する最大時刻ずれ（マイクロ秒）
    max_skew_us: 10000
    ebpf_monitoring_required: true
    environment_constraint: multi_region_wan

  # レガシー環境の時刻ずれ許容クラス（移行期間中に適用する）
  - class_id: v1_legacy_skew_tolerant
    description: レガシー環境の時刻ずれ許容（HLC で補正する）
    sync_protocol: ntp_best_effort
    # レガシーのため最大 100ms の時刻ずれを許容する
    max_skew_us: 100000
    # HLC による論理時刻補正を必須とする
    hlc_correction_required: true
    ebpf_monitoring_required: false
    environment_constraint: legacy_systems

  # エアギャップ環境用の自律時刻管理クラス（外部 NTP 不可）
  - class_id: v1_air_gapped_legacy
    description: エアギャップ環境の自律時刻管理（外部 NTP 参照なし）
    sync_protocol: local_rtc_only
    # エアギャップのため外部参照なし（最大ずれは環境依存）
    max_skew_us: 1000000
    # エアギャップ環境では HLC 補正が必須
    hlc_correction_required: true
    ebpf_monitoring_required: false
    environment_constraint: air_gapped_network
