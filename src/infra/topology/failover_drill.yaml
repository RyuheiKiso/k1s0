# failover drill シナリオ定義: 各 topology_class の障害演習シナリオを宣言する
# drill.sh がこのファイルを読み込んでシナリオを実行し、結果を lock.yaml に書き込む
drills:
  # ================================================================
  # drill 1: v1_single_zone の手動マイグレーション検証
  # ================================================================
  - drill_id: failover__v1_single_zone
    # このドリルが対象とする topology_class
    topology_class: v1_single_zone
    # ドリルのシナリオ概要（何を確認するかを記述する）
    scenario: >
      単一ゾーン構成クラスタにおいてワーカーノード 1 台を停止し、
      Pod が残存ノードに再スケジュールされることを確認する。
      失敗した場合は手動マイグレーション手順を起動する。
    # ドリルで実行するステップリスト
    steps:
      # 停止対象ノードを特定する
      - step: identify_target_node
        description: k1s0-target-worker ノードを停止対象として選択する
      # docker stop でノードを停止する（kind コンテナを直接停止する）
      - step: stop_worker_node
        description: docker stop k1s0-target-worker を実行してノードを停止する
        command: "docker stop k1s0-target-worker"
        timeout_seconds: 30
      # Pod の再スケジューリングを待機する
      - step: wait_for_reschedule
        description: kubectl wait で全 Pod が Running になるまで待機する
        timeout_seconds: 120
      # サービスエンドポイントの疎通確認を実施する
      - step: verify_endpoints
        description: 全 Service のエンドポイントが応答することを確認する
      # ノードを復旧する
      - step: restore_node
        description: docker start k1s0-target-worker でノードを復旧する
        command: "docker start k1s0-target-worker"
    # ドリル成功の期待結果
    expected_behavior:
      # Pod が 120 秒以内に再スケジュールされること
      pod_reschedule_within_seconds: 120
      # サービスへの疎通が復旧すること
      service_reachable: true
      # データ損失がないこと（Persistent Volume は保持される）
      data_loss: false

  # ================================================================
  # drill 2: v1_multi_zone_per_cluster の自動ゾーン再バランス検証
  # ================================================================
  - drill_id: failover__v1_multi_zone_per_cluster
    topology_class: v1_multi_zone_per_cluster
    scenario: >
      複数ゾーンクラスタにおいて zone-b のワーカーノードを停止し、
      残存ゾーン（zone-a / zone-c）に自動的に再バランスされることを確認する。
    steps:
      # zone-b のノードを特定する
      - step: identify_zone_b_nodes
        description: zone-b ラベルを持つノードを kubectl で列挙する
      # zone-b の全ワーカーを停止する
      - step: stop_zone_b_workers
        description: zone-b の docker コンテナを停止してゾーン障害を模擬する
        command: "docker stop k1s0-target-worker2"
        timeout_seconds: 30
      # PodDisruptionBudget が維持されているか確認する
      - step: check_pdb_compliance
        description: PodDisruptionBudget の違反がないことを確認する
        timeout_seconds: 60
      # 自動再バランスの完了を待機する
      - step: wait_for_rebalance
        description: zone-a / zone-c に Pod が分散配置されるまで待機する
        timeout_seconds: 180
      # zone-b ノードを復旧する
      - step: restore_zone_b
        description: docker start k1s0-target-worker2 でノードを復旧する
        command: "docker start k1s0-target-worker2"
    expected_behavior:
      pod_reschedule_within_seconds: 180
      # PDB 違反がゼロであること
      pdb_violations: 0
      service_reachable: true
      data_loss: false

  # ================================================================
  # drill 3: v1_active_passive_dr の手動 DR 起動検証
  # ================================================================
  - drill_id: failover__v1_active_passive_dr
    topology_class: v1_active_passive_dr
    scenario: >
      アクティブ/パッシブ DR 構成においてプライマリクラスタを完全停止し、
      15 分以内にパッシブクラスタに切り替えが完了することを確認する。
    steps:
      # プライマリクラスタの全ノードを停止する
      - step: stop_primary_cluster
        description: k1s0-target クラスタのコントロールプレーンを停止する
        command: "docker stop k1s0-target-control-plane"
        timeout_seconds: 30
      # DR 切り替え手順を手動起動する
      - step: initiate_dr_activation
        description: ops-edge クラスタで DR 手順スクリプトを実行する
        timeout_seconds: 600
      # RTO 目標（15 分）以内に切り替えが完了することを確認する
      - step: verify_rto
        description: 切り替え完了時刻が停止から 900 秒以内であることを確認する
        timeout_seconds: 900
      # プライマリクラスタを復旧する
      - step: restore_primary
        description: docker start k1s0-target-control-plane でクラスタを復旧する
        command: "docker start k1s0-target-control-plane"
    expected_behavior:
      # RTO 目標値（秒）
      rto_seconds: 900
      service_reachable: true
      data_loss: false

  # ================================================================
  # drill 4: v1_multi_region_active_passive の自動リージョン切り替え検証
  # ================================================================
  - drill_id: failover__v1_multi_region_active_passive
    topology_class: v1_multi_region_active_passive
    scenario: >
      マルチリージョン構成においてプライマリリージョンを停止し、
      5 分以内に自動的にセカンダリリージョンに切り替えることを確認する。
    steps:
      # プライマリリージョンのすべてのノードを停止する
      - step: stop_primary_region
        description: プライマリリージョンの全 docker コンテナを停止する
        timeout_seconds: 60
      # DNS フェイルオーバーが自動発動することを確認する
      - step: verify_dns_failover
        description: DNS レコードがセカンダリに向いていることを確認する
        timeout_seconds: 300
      # RTO 目標（5 分）以内の切り替えを確認する
      - step: verify_rto
        description: 切り替え完了時刻が停止から 300 秒以内であることを確認する
        timeout_seconds: 300
      # プライマリリージョンを復旧する
      - step: restore_primary_region
        description: プライマリリージョンの docker コンテナを再起動する
        timeout_seconds: 120
    expected_behavior:
      rto_seconds: 300
      service_reachable: true
      data_loss: false

  # ================================================================
  # drill 5: v1_multi_region_active_active のゼロダウンタイム検証
  # ================================================================
  - drill_id: failover__v1_multi_region_active_active
    topology_class: v1_multi_region_active_active
    scenario: >
      マルチリージョン アクティブ/アクティブ構成においてリージョン 1 を停止し、
      トラフィックが自動的にリージョン 2 にルーティングされ続けることを確認する。
    steps:
      # リージョン 1 のノードを停止する（リージョン 2 は継続稼働する）
      - step: stop_region_one
        description: リージョン 1 の全 docker コンテナを停止する
        timeout_seconds: 30
      # ロードバランサが自動的に切り替わることを確認する
      - step: verify_traffic_routing
        description: トラフィックがリージョン 2 にルーティングされていることを確認する
        timeout_seconds: 30
      # サービス継続性を確認する（エラー率が SLO 以内か検証する）
      - step: verify_zero_downtime
        description: リクエストのエラー率が 0.01% 以下であることを確認する
        timeout_seconds: 60
      # リージョン 1 を復旧する
      - step: restore_region_one
        description: リージョン 1 の docker コンテナを再起動する
        timeout_seconds: 120
    expected_behavior:
      # ダウンタイムがゼロであること
      downtime_seconds: 0
      # エラー率が 0.01% 以下であること
      max_error_rate_percent: 0.01
      service_reachable: true
      data_loss: false
