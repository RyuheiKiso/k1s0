# .golangci.yml — golangci-lint 設定（tier3 Go module）
# 強制機構: docs/04_詳細設計/02_強制機構/03_tier3強制機構.md 層 1 + 層 2
# tier3 Go は tier2 SDK module 経由のみ tier1 / OSS 直接 module にアクセス可能

run:
  # lint 実行タイムアウトを 5 分に設定する
  timeout: 5m

linters:
  # デフォルト linter を無効化し、明示許可リストのみ有効にする
  disable-all: true
  enable:
    # tier1 / admin 直接 import を禁止する（層 1 + 層 2）
    - depguard
    # 未使用 import を検出する（dead spec 検出規律との整合）
    - goimports
    # エラーハンドリング漏れを検出する
    - errcheck
    # 静的解析による一般的なバグを検出する
    - govet
    # ineffectual assignment を検出する
    - ineffassign
    # 型変換の問題を検出する
    - staticcheck

linters-settings:
  depguard:
    rules:
      # ---- 層 1: tier1 直接 import 禁止ルール ----
      tier1-direct-import-ban:
        # tier1 直接 import を禁止する理由
        deny:
          # k1s0 tier1 transport module を禁止する（tier2 SDK facade 経由必須）
          - pkg: "github.com/k1s0/tier1/..."
            desc: "tier3 は tier1 module を直接 import 禁止。tier2 SDK 経由必須（強制機構 層 1）"
          # k1s0 tier1 gRPC / Connect 生成コードを禁止する
          - pkg: "github.com/k1s0/tier1/gen/..."
            desc: "tier3 は tier1 generated code を直接 import 禁止。tier2 生成型のみ使用可（強制機構 層 8）"
          # OSS gRPC クライアントを禁止する（tier1 transport 直接利用禁止）
          - pkg: "google.golang.org/grpc"
            desc: "tier3 は gRPC client を直接利用禁止。tier2 SDK 経由必須（強制機構 層 1）"
          # OSS protobuf ランタイムを禁止する（proto 型直接生成禁止）
          - pkg: "google.golang.org/protobuf/..."
            desc: "tier3 は protobuf 型を直接生成禁止。tier2 生成型のみ使用可（強制機構 層 8）"
          # OSS pgx を禁止する（DB 直接接続禁止）
          - pkg: "github.com/jackc/pgx/..."
            desc: "tier3 は DB に直接接続禁止。tier2 Repository abstraction 経由必須（強制機構 層 1）"
      # ---- 層 2: 業務管理 API (admin) 直接 import 禁止ルール ----
      tier2-admin-import-ban:
        # tier2 admin module を禁止する理由
        deny:
          # tier2 admin module を禁止する（業務管理 API を tier3 業務 UI から直接 import 禁止）
          - pkg: "github.com/k1s0/tier2/admin/..."
            desc: "tier3 業務 UI は tier2 admin module を直接 import 禁止（強制機構 層 2）"

issues:
  # 全 issue を報告する（max 上限を撤廃）
  max-issues-per-linter: 0
  # 同一 linter から同一行に複数 issue が出る場合も全件報告する
  max-same-issues: 0
