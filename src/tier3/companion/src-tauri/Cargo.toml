# k1s0 tier3 Tauri companion frontend glue crate
# tier1 Cargo workspace member にしない（tier3/CLAUDE.md に明記）
# sidecar exe の実装は src/_crosscutting/07_tauri_companion_sidecar/sidecar/ が primary
# ここは Tauri framework が要求する frontend glue（window.invoke() 経由の IPC 層）

# standalone workspace 宣言（tier1 workspace とは独立）
[workspace]
members = ["."]
resolver = "2"

[package]
# crate 名（Tauri が要求する命名）
name = "k1s0-tier3-companion"
# バージョン
version = "0.1.0"
# Rust edition
edition = "2021"
# 説明
description = "k1s0 tier3 Tauri companion frontend glue（IPC bridge）"

[dependencies]
# k1s0-hlc: wall-clock TTL 禁止規律（src/CLAUDE.md §wall-clock TTL 禁止）に従い HLC を使用する
# SystemTime::now() は k1s0-hlc 内部のみ許可されるため、companion は本 crate を経由する
k1s0-hlc = { path = "../../../client/hlc_lib/rust" }
# Tauri framework v2（IPC コマンド・イベント・plugin 機構を提供する）
# Tauri CLI が管理するため、バージョン指定は Tauri CLI に従う
tauri = { version = "2", features = [] }
# serde: シリアライズ/デシリアライズフレームワーク（derive マクロを有効化する）
serde = { version = "1", features = ["derive"] }
# serde_json: JSON 値の動的操作（state_read / state_write の Value 型に使用する）
serde_json = "1"
# ring: DPoP ES256 鍵ペア生成・署名 / PSK HMAC-SHA256 に使用する
ring = { version = "0.17", features = [] }
# base64: DPoP JWK / JWT のエンコードに使用する
base64 = "0.22"
# tokio-tungstenite: WebSocket クライアント（sidecar ws://127.0.0.1:{port}/sync 接続）
tokio-tungstenite = { version = "0.24", features = [] }
# tokio: 非同期ランタイム（Tauri v2 は tokio を内部で使用するため features = [] で依存する）
tokio = { version = "1", features = ["full"] }
# futures-util: WebSocket ストリームの SinkExt / StreamExt に使用する
futures-util = "0.3"
# OS keystore 統合: Linux(GNOME Keyring/KWallet secret-service) / macOS(Keychain) / Windows(DPAPI) を統一する
# R3-3: PSK を OS keystore に格納して default fallback を物理排除する
keyring = "3"
# hex: OS keystore から取得した PSK hex 文字列をバイト列に変換する
hex = "0.4"

[lib]
# Tauri が要求するクレートタイプ
crate-type = ["staticlib", "cdylib", "rlib"]
