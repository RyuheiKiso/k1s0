# companion_local_mock Deployment
# Bun で tier3 companion ローカルモック WebSocket サーバーを k8s 上で動かす
# lib.rs プロトコル形式 {command, layer, entry, psk_hmac, hlc_timestamp} に準拠する
# 開発・テスト環境専用（本番では使用しない）
apiVersion: apps/v1
kind: Deployment
metadata:
  # Deployment 名を指定する
  name: companion-local-mock
  # tier3 namespace に配置する
  namespace: tier3-dev
  labels:
    # アプリ識別ラベルを設定する
    app: companion-local-mock
    # コンポーネント種別を設定する（開発用モック）
    component: companion-mock
    # 環境を示すラベル（本番では使用しない）
    env: development
spec:
  # レプリカ数は 1（開発用シングルトン）
  replicas: 1
  selector:
    matchLabels:
      # Deployment とレプリカのマッチングラベルを設定する
      app: companion-local-mock
  template:
    metadata:
      labels:
        # Pod のラベルを設定する
        app: companion-local-mock
    spec:
      containers:
        - # コンテナ名を設定する
          name: companion-mock
          # companion_local_mock の Docker イメージを指定する
          image: companion-local-mock:latest
          # イメージのプル方針（ローカルビルドのため Never を使用する）
          imagePullPolicy: Never
          ports:
            - # companion mock が待ち受けるポートを公開する
              containerPort: 9999
              # プロトコルを TCP に設定する
              protocol: TCP
          env:
            - # PSK 環境変数を configmap から取得する
              name: MOCK_PSK
              valueFrom:
                configMapKeyRef:
                  # configmap 名を指定する
                  name: companion-mock-config
                  # PSK キーを指定する
                  key: psk
          # readiness probe で /health エンドポイントを監視する
          readinessProbe:
            httpGet:
              # ヘルスチェックパスを設定する
              path: /health
              # ヘルスチェックポートを設定する
              port: 9999
            # 起動後の初期待機時間（秒）
            initialDelaySeconds: 3
            # チェック間隔（秒）
            periodSeconds: 10
          # liveness probe でプロセスの生存を確認する
          livenessProbe:
            httpGet:
              # liveness チェックパスを設定する
              path: /health
              # liveness チェックポートを設定する
              port: 9999
            # 起動後の初期待機時間（秒）
            initialDelaySeconds: 5
            # チェック間隔（秒）
            periodSeconds: 15
          resources:
            requests:
              # CPU リクエストを設定する（開発用のため小さく設定する）
              cpu: "50m"
              # メモリリクエストを設定する
              memory: "64Mi"
            limits:
              # CPU リミットを設定する
              cpu: "200m"
              # メモリリミットを設定する
              memory: "128Mi"
