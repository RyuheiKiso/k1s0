# companion_local_mock ConfigMap
# companion mock サーバーの設定を管理する
# lib.rs の PSK "k1s0-default-psk" と一致させる必要がある
# 開発・テスト環境専用（本番では使用しない）
apiVersion: v1
kind: ConfigMap
metadata:
  # ConfigMap 名を指定する
  name: companion-mock-config
  # tier3 namespace に配置する
  namespace: tier3-dev
  labels:
    # アプリ識別ラベルを設定する
    app: companion-local-mock
    # コンポーネント種別を設定する
    component: companion-mock
data:
  # モック PSK（lib.rs の "k1s0-default-psk" に対応するデフォルト値）
  # 本番環境では Kubernetes Secret を使用すること
  psk: "k1s0-default-psk"
  # companion mock が待ち受けるポート番号（lib.rs のデフォルトポートと一致させる）
  port: "9999"
  # companion mock のログレベル設定
  log_level: "info"
