# slash_commands.yaml — tier3 固有の Mattermost スラッシュコマンド定義
# tier3 の ChatOps を実現するためのスラッシュコマンド設定ファイル
# Mattermost のカスタムスラッシュコマンドとして登録する
# 設計方針 30_運用 UI: ChatOps 統合
apiVersion: k1s0.io/v1 # k1s0 カスタムリソースの API バージョン
kind: MattermostSlashCommands # ChatOps スラッシュコマンド設定リソース
metadata:
  name: k1s0-tier3-slash-commands # スラッシュコマンド設定の識別名
  labels:
    # tier3 ドメインのコマンドであることを示すラベル
    k1s0.io/domain: tier3
    # ChatOps カテゴリラベル
    k1s0.io/category: chatops
spec:
  # Mattermost Incoming Webhook の URL（CI から注入する）
  incomingWebhookUrl: "${MATTERMOST_WEBHOOK_URL}"
  # Mattermost サーバーの URL
  mattermostUrl: "${MATTERMOST_URL}"
  # コマンドを受付けるチャンネル名
  defaultChannel: "k1s0-deployments"
  # Bot ユーザー名（通知送信時の表示名）
  botUsername: "k1s0-deploy-bot"
  # Bot のアイコン URL
  botIconUrl: "${MATTERMOST_BOT_ICON_URL}"

  # --- スラッシュコマンド一覧 ---
  commands:
    # ========================
    # コマンド 1: /k1s0 feature-flag
    # ========================
    # tier3 フィーチャーフラグの状態確認・切り替えを ChatOps で行う
    - trigger: "feature-flag" # スラッシュコマンドのサブコマンド名
      # コマンドの説明文（Mattermost の autocomplete に表示される）
      description: "tier3 フィーチャーフラグの状態確認・有効化・無効化を行う"
      # 使用例（autocomplete のヒントとして表示される）
      hint: "[list | enable <flag-name> | disable <flag-name>]"
      # コマンドの詳細説明
      helpText: |
        tier3 フィーチャーフラグを ChatOps から管理する。
        - list: 全フィーチャーフラグの現在状態を一覧表示する
        - enable <flag-name>: 指定フラグを有効化する（Kyverno policy で承認が必要）
        - disable <flag-name>: 指定フラグを無効化する（即時反映）
      # 自動補完候補（サブコマンド）
      autocompleteHint: "[list | enable | disable]"
      # コマンド実行を許可するロール（Mattermost のユーザーロール）
      allowedRoles:
        - "tier3-developer" # tier3 開発者は list のみ実行可能
        - "platform-engineer" # プラットフォームエンジニアは全操作可能
      # コマンドハンドラー設定
      handler:
        # ハンドラーを呼び出す HTTP エンドポイント（notification_handler.ts が処理する）
        url: "${CHATOPS_HANDLER_URL}/feature-flag"
        # リクエストメソッド
        method: POST
        # レスポンス種別（in_channel = 全員に表示, ephemeral = 実行者のみ）
        responseType: in_channel

    # ========================
    # コマンド 2: /k1s0 canary-rollback
    # ========================
    # Argo Rollouts のカナリアリリースを ChatOps から即時 rollback する
    - trigger: "canary-rollback" # スラッシュコマンドのサブコマンド名
      # コマンドの説明文
      description: "tier3 カナリアリリースを即時 rollback する（Argo Rollouts abort）"
      # 使用例
      hint: "[<rollout-name>]"
      # コマンドの詳細説明
      helpText: |
        k1s0-tier3-spa のカナリアリリースを即時 rollback する。
        引数なしの場合は k1s0-tier3-spa を対象とする。
        Argo Rollouts の abort API を呼び出してカナリアを safe 側に切り戻す。
        実行者と操作内容は audit log に記録される。
      # コマンド実行を許可するロール（本番への影響が大きいため厳格に制限する）
      allowedRoles:
        - "platform-engineer" # プラットフォームエンジニアのみ rollback を実行可能
        - "sre" # SRE チームは緊急対応のため実行可能
      # コマンドハンドラー設定
      handler:
        # ハンドラーを呼び出す HTTP エンドポイント
        url: "${CHATOPS_HANDLER_URL}/canary-rollback"
        # リクエストメソッド
        method: POST
        # レスポンス種別（全員に表示して rollback の実行を周知する）
        responseType: in_channel

    # ========================
    # コマンド 3: /k1s0 companion-status
    # ========================
    # tier3 Companion アプリのデプロイ状態・バージョン情報を ChatOps で確認する
    - trigger: "companion-status" # スラッシュコマンドのサブコマンド名
      # コマンドの説明文
      description: "tier3 Companion アプリのデプロイ状態・バージョン・ヘルスチェック結果を表示する"
      # 使用例
      hint: "[<platform>]"
      # コマンドの詳細説明
      helpText: |
        tier3 Companion のデプロイ状態を確認する。
        - platform なし: 全プラットフォーム（macOS/Linux/Windows）の状態を表示する
        - platform = macos: macOS DMG の最新バージョンと配布状態を表示する
        - platform = linux: Linux AppImage の最新バージョンと配布状態を表示する
        - platform = windows: Windows MSIX/MSI の最新バージョンと配布状態を表示する
      # コマンド実行を許可するロール（読み取りのみなので広めに許可する）
      allowedRoles:
        - "tier3-developer" # tier3 開発者は状態確認可能
        - "platform-engineer" # プラットフォームエンジニアは状態確認可能
        - "sre" # SRE は状態確認可能
        - "product-manager" # プロダクトマネージャーも読み取りのみ許可する
      # コマンドハンドラー設定
      handler:
        # ハンドラーを呼び出す HTTP エンドポイント
        url: "${CHATOPS_HANDLER_URL}/companion-status"
        # リクエストメソッド
        method: POST
        # レスポンス種別（実行者のみに表示する）
        responseType: ephemeral
