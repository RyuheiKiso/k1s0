# new_tier3_fa.yaml — Backstage SoftwareTemplate: FA tier3 screen 追加
# 設計方針 32_開発者体験: Backstage Software Template
# FA tier3 SPA（FA ドメイン UI）に新しい screen を scaffold するテンプレート
apiVersion: scaffolder.backstage.io/v1beta3
# Backstage テンプレートリソース種別
kind: Template
metadata:
  # テンプレート識別子
  name: k1s0-new-tier3-fa-screen
  # 表示タイトル
  title: "新 FA tier3 Screen 追加"
  # テンプレートの説明
  description: "FA tier3 SPA（FA ドメイン UI）に新しい業務 screen を scaffold する"
spec:
  # テンプレートオーナー（platform-team が管理する）
  owner: platform-team
  # テンプレートの種類
  type: screen
  # パラメータ定義
  parameters:
    # Step 1: Screen の基本情報
    - title: Screen 基本情報
      # 必須フィールド定義
      required: [screen_name, scenario_id]
      properties:
        # screen 名（PascalCase 必須）
        screen_name:
          title: Screen 名（PascalCase）
          type: string
          description: "追加する screen のコンポーネント名（例: NewFaScreen）"
        # 対応業務シナリオ ID
        scenario_id:
          title: 業務シナリオ ID
          type: string
          # FA ドメインのシナリオに限定する
          enum:
            - scenario_1_equipment_remote
            - scenario_2_line_monitoring
            - scenario_3_production_schedule
            - scenario_4_scada
            - scenario_5_gauge
          # シナリオ ID の日本語説明
          enumNames:
            - "scenario 1: 設備リモート操作（v1_interactive）"
            - "scenario 2: ライン稼働監視 live tile（v1_live_snapshot）"
            - "scenario 3: 生産指示 / 進捗実績（v1_event_feed）"
            - "scenario 4: SCADA テレメトリ収集（v1_bulk_upload）"
            - "scenario 5: 計量装置連続データ（v1_bulk_upload）"
        # screen の説明（日本語コメント用）
        description_ja:
          title: Screen の説明（日本語）
          type: string
          description: "コメントに使用する日本語説明"
  # scaffold ステップ定義
  steps:
    # テンプレートを fetch する
    - id: fetch-template
      # テンプレートアクション
      action: fetch:template
      input:
        # skeleton テンプレートのパスを指定する
        url: ./skeleton/screen
        # テンプレート変数を渡す
        values:
          screen_name: ${{ parameters.screen_name }}
          scenario_id: ${{ parameters.scenario_id }}
          description_ja: ${{ parameters.description_ja }}
          # 配置先ディレクトリを fa に固定する
          deployment: fa
    # GitHub Pull Request を作成する
    - id: create-pr
      # PR 作成アクション
      action: publish:github:pull-request
      input:
        # PR タイトルを設定する
        title: "feat(tier3-fa): ${{ parameters.screen_name }} screen 追加"
        # PR 説明を設定する
        description: |
          ## 概要
          FA tier3 SPA に ${{ parameters.screen_name }} screen を追加する。

          ## 対応シナリオ
          ${{ parameters.scenario_id }}

          ## 説明
          ${{ parameters.description_ja }}
