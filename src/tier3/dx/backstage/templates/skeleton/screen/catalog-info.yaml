# catalog-info.yaml — Backstage エンティティ定義（scaffold 生成ファイル）
# Backstage SoftwareTemplate が生成する screen コンポーネントの Catalog エンティティ
# Software Catalog に登録することで discoverability とオーナーシップを明確にする
apiVersion: backstage.io/v1alpha1 # Backstage API バージョン
kind: Component # Backstage Component エンティティとして宣言する
metadata:
  # scaffold 時に screen_name で置き換えられるコンポーネント名
  name: "${{values.screen_name | lower | replace(' ', '-')}}-screen"
  # Catalog 検索時に表示されるタイトル
  title: "${{values.screen_name}} Screen"
  # コンポーネントの説明文（ドメインと用途を記載する）
  description: "tier3 SPA screen for ${{values.domain}} domain — generated by k1s0-new-tier3-screen template"
  # Backstage Catalog のタグ（フィルタリング・検索に使用する）
  tags:
    - tier3 # tier3 軸のコンポーネントであることを示すタグ
    - spa # SPA フロントエンドコンポーネントであることを示すタグ
    - screen # screen レベルのコンポーネントであることを示すタグ
    - ${{values.domain}} # ビジネスドメインタグ（fa / procurement / inspection / quality）
  # アノテーション（GitHub リポジトリ情報・Argo CD リンク等）
  annotations:
    # GitHub リポジトリの slug（Backstage が PR / issue 情報を表示するために使用する）
    github.com/project-slug: "k1s0-io/k1s0"
    # Backstage で表示するソースコードのパス
    backstage.io/source-location: "url:https://github.com/k1s0-io/k1s0/tree/main/src/tier3/typescript/spa/src/screens/${{values.domain}}/"

spec:
  # コンポーネントの種別（Backstage の定義: website はフロントエンドコンポーネント）
  type: website
  # ライフサイクル（production / experimental / deprecated）
  lifecycle: production
  # コンポーネントのオーナー（Backstage Group エンティティを参照する）
  owner: "group:tier3-frontend-team"
  # 所属するシステム（k1s0 SPA システムに属する）
  system: "k1s0-spa"
  # 依存する API（tier2 SDK 経由で使用する API を宣言する）
  consumesApis:
    # tier2 SDK が公開する BFF API を消費する（直接 tier1 消費は禁止）
    - "k1s0-bff-${{values.domain}}-api"
