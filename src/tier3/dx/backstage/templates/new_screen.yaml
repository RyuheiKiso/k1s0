# new_screen.yaml — Backstage SoftwareTemplate: 新 tier3 screen 作成
# 設計方針 32_開発者体験: Backstage Software Template
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: k1s0-new-tier3-screen
  title: "New Tier3 Screen"
  description: "tier3 SPA の新 screen を scaffold する"
spec:
  owner: platform-team
  type: screen
  parameters:
    - title: Screen Details
      required: [screen_name, domain]
      properties:
        screen_name:
          title: Screen Name (PascalCase)
          type: string
        domain:
          title: Business Domain
          type: string
          enum: [fa, procurement, inspection, quality]
  steps:
    - id: fetch-template
      action: fetch:template
      input:
        url: ./skeleton/screen
    - id: create-pr
      action: publish:github:pull-request
