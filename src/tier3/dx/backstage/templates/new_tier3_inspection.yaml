# new_tier3_inspection.yaml — Backstage SoftwareTemplate: 検査 tier3 screen 追加
# 設計方針 32_開発者体験: Backstage Software Template
# 検査 tier3 SPA（検査ドメイン UI）に新しい screen を scaffold するテンプレート
apiVersion: scaffolder.backstage.io/v1beta3
# Backstage テンプレートリソース種別
kind: Template
metadata:
  # テンプレート識別子
  name: k1s0-new-tier3-inspection-screen
  # 表示タイトル
  title: "新 検査 tier3 Screen 追加"
  # テンプレートの説明
  description: "検査 tier3 SPA（検査ドメイン UI）に新しい業務 screen を scaffold する"
spec:
  # テンプレートオーナー（platform-team が管理する）
  owner: platform-team
  # テンプレートの種類
  type: screen
  # パラメータ定義
  parameters:
    # Step 1: Screen の基本情報
    - title: Screen 基本情報
      # 必須フィールド定義
      required: [screen_name, scenario_id]
      properties:
        # screen 名（PascalCase 必須）
        screen_name:
          title: Screen 名（PascalCase）
          type: string
          description: "追加する screen のコンポーネント名（例: NewInspectionScreen）"
        # 対応業務シナリオ ID
        scenario_id:
          title: 業務シナリオ ID
          type: string
          # 検査ドメインのシナリオに限定する
          enum:
            - scenario_9_quality_inspection
            - scenario_10_defect_alert
            - scenario_11_drawing_review
            - scenario_12_inventory
          # シナリオ ID の日本語説明
          enumNames:
            - "scenario 9: 品質検査結果配信"
            - "scenario 10: 不良票 / 警報配信"
            - "scenario 11: 図面 collaborative review"
            - "scenario 12: 在庫最新値表示"
        # screen の説明（日本語コメント用）
        description_ja:
          title: Screen の説明（日本語）
          type: string
          description: "コメントに使用する日本語説明"
  # scaffold ステップ定義
  steps:
    # テンプレートを fetch する
    - id: fetch-template
      # テンプレートアクション
      action: fetch:template
      input:
        # skeleton テンプレートのパスを指定する
        url: ./skeleton/screen
        # テンプレート変数を渡す
        values:
          screen_name: ${{ parameters.screen_name }}
          scenario_id: ${{ parameters.scenario_id }}
          description_ja: ${{ parameters.description_ja }}
          # 配置先ディレクトリを inspection に固定する
          deployment: inspection
    # GitHub Pull Request を作成する
    - id: create-pr
      # PR 作成アクション
      action: publish:github:pull-request
      input:
        # PR タイトルを設定する
        title: "feat(tier3-inspection): ${{ parameters.screen_name }} screen 追加"
        # PR 説明を設定する
        description: |
          ## 概要
          検査 tier3 SPA に ${{ parameters.screen_name }} screen を追加する。

          ## 対応シナリオ
          ${{ parameters.scenario_id }}

          ## 説明
          ${{ parameters.description_ja }}
