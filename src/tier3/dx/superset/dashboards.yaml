# k1s0 tier3 Apache Superset ダッシュボード設定 manifest
# docs/03_概要設計/04_tier3設計方針/30_運用UI.md §Apache Superset 参照
# tier3 運用 UI の分析ダッシュボードを Superset で提供する

# manifest バージョン
version: "1.0.0"
# Superset 接続設定（環境変数で上書き可能）
superset_url: "${SUPERSET_URL:-http://localhost:8088}"

# ダッシュボード定義
dashboards:
  # 発注業務ダッシュボード: FA ライン別の発注状況を可視化する
  - id: tier3_order_dashboard
    # ダッシュボード名
    title: "発注業務概況"
    # チャート一覧
    charts:
      # 日次発注件数チャート
      - id: daily_order_count
        # チャート種別: 折れ線グラフ
        chart_type: line
        # データソース: tier2 read model（CQRS projection）から取得する
        datasource: "tier2_read_model.order_projections"
      # テナント別発注ステータス
      - id: tenant_order_status
        # チャート種別: 円グラフ
        chart_type: pie
        # データソース
        datasource: "tier2_read_model.order_projections"

  # 運用 KPI ダッシュボード: tier3 の SLO 状態を表示する
  - id: tier3_ops_kpi_dashboard
    # ダッシュボード名
    title: "運用 KPI"
    # チャート一覧
    charts:
      # 週次エラーレートチャート
      - id: weekly_error_rate
        # チャート種別: 棒グラフ
        chart_type: bar
        # データソース: tier1 SLO metrics から取得する
        datasource: "tier1_metrics.error_budget"

# 配備設定
deployment:
  # docker-compose サービス名（dx/ 配下の compose file に追加する予定）
  compose_service: superset
  # Superset ポート
  port: 8088
