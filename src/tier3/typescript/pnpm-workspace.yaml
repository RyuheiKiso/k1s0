# k1s0 tier3 pnpm workspace 定義
# tier3 TypeScript パッケージを管理する
packages:
  # 4 layer state reducer（primary 実装）
  - "packages/state"
  # CRDT 型（tier3 内部閉込め）
  - "packages/crdt"
  # IndexedDB + WebCrypto AES-GCM encrypted outbox
  - "packages/outbox"
  # SSE/WS subscription manager
  - "packages/realtime"
  # BFF cookie auth（access_token getter 不在）
  - "packages/auth"
  # locale JSON loader
  - "packages/i18n"
  # Web SPA skeleton
  - "spa"
  # フォームフィールド型 + ESLint tenant_id 禁止ルール
  - "packages/forms"
  # 通知管理 (Toast / Snackbar / Dialog + idempotency)
  - "packages/notifications"
  # WCAG AA デザイントークン + コントラスト比検証
  - "packages/design-tokens"
  # 業種別 pack 動的ロード (manufacturing / retail / logistics)
  - "packages/pack"
  # SPA 共通 UI コンポーネント（WCAG 2.1 AA 準拠 / 10 component）
  - "packages/ui-components"
  # 添付ファイル管理クライアント（チャンクアップロード / MIME 検査 / ハッシュチェーン）
  - "packages/attachments"
  # 帳票テンプレートラッパー（PDF / Excel 生成 / ダウンロード管理）
  - "packages/reports"
  # 発注 tier3 SPA（調達ドメイン UI: 発注 / 検収 / 受注 / 出荷指示）
  - "apps/procurement"
  # 検査 tier3 SPA（検査ドメイン UI: 品質検査 / 不良票 / 図面 review / 在庫）
  - "apps/inspection"
  # FA tier3 SPA（FA ドメイン UI: 設備リモート操作 / ライン監視 / 生産指示 / SCADA / 計量）
  - "apps/fa"
  # Legacy 連携 tier3 SPA（ERP 並行運用: レガシー .NET Framework 連携 entry point）
  - "apps/legacy_integration"
