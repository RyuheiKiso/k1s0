# k1s0 FA tier3 SPA — Argo Rollouts canary 設定
# FA ドメイン UI の 4 step canary デプロイ設定（5/25/50/100%）を定義する
# 設計方針 31_配布デプロイ運用: Argo Rollouts canary を使用する
apiVersion: argoproj.io/v1alpha1
# Rollout リソース種別
kind: Rollout
metadata:
  # Rollout 名
  name: tier3-fa
  # Namespace（tier3 専用 namespace に配置する）
  namespace: tier3-fa
  # ラベル（オブザーバビリティ用）
  labels:
    # tier3 deployment 識別子
    app: tier3-fa
    # 対象ドメイン
    domain: fa
    # k1s0 コンポーネント識別子
    component: tier3
spec:
  # レプリカ数
  replicas: 2
  # セレクター（Pod を選択するラベル）
  selector:
    matchLabels:
      # tier3 deployment 識別子でマッチする
      app: tier3-fa
  # Pod テンプレート
  template:
    metadata:
      labels:
        # tier3 deployment 識別子
        app: tier3-fa
        # 対象ドメイン
        domain: fa
    spec:
      # コンテナ定義
      containers:
        # SPA コンテナ
        - name: tier3-fa
          # イメージ（CI で上書きする）
          image: harbor.k1s0.internal/tier3/fa:0.1.0
          # コンテナポート
          ports:
            # SPA 配信ポート
            - containerPort: 80
          # リソース設定（FA は SCADA テレメトリ表示のためやや大きめに設定する）
          resources:
            # リソース上限
            limits:
              cpu: 200m
              memory: 256Mi
            # リソース要求
            requests:
              cpu: 100m
              memory: 128Mi
  # canary deployment 戦略
  strategy:
    # canary 戦略を選択する
    canary:
      # canary 4 step（5% → 25% → 50% → 100%）
      steps:
        # step 1: 5% のトラフィックを canary に送る
        - setWeight: 5
        # step 1 完了後に 60 秒間の検証期間を設ける
        - pause:
            duration: 60s
        # step 2: 25% のトラフィックを canary に送る
        - setWeight: 25
        # step 2 完了後に 120 秒間の検証期間を設ける
        - pause:
            duration: 120s
        # step 3: 50% のトラフィックを canary に送る
        - setWeight: 50
        # step 3 完了後に 120 秒間の検証期間を設ける
        - pause:
            duration: 120s
        # step 4: 100% のトラフィックを canary に送る（完全切り替え）
        - setWeight: 100
