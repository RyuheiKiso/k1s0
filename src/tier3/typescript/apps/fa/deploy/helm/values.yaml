# k1s0 FA tier3 SPA — Helm values（fa 固有設定）
# FA ドメイン UI 専用の deployment 設定を定義する
# cookie scope: __Host-fa-access-token（deployment 間の認証 cookie を物理分離する）

# レプリカ数（初期デプロイ設定）
replicaCount: 2

# コンテナイメージ設定
image:
  # レジストリ（Harbor 内部レジストリを使用する）
  repository: harbor.k1s0.internal/tier3/fa
  # プルポリシー（CI/CD でタグを更新するため Always を設定する）
  pullPolicy: Always
  # イメージタグ（CI で上書きする）
  tag: "0.1.0"

# Service 設定
service:
  # Service タイプ（クラスター内部通信のみ）
  type: ClusterIP
  # SPA 向けポート
  port: 80

# Ingress 設定
ingress:
  # Ingress を有効化する
  enabled: true
  # Ingress クラス（nginx を使用する）
  className: nginx
  # アノテーション設定
  annotations:
    # CSP ヘッダーを設定する（unsafe-inline / unsafe-eval を禁止する）
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
  # ホスト設定
  hosts:
    # FA tier3 専用ホスト
    - host: fa.tier3.k1s0.internal
      # パス設定
      paths:
        # ルートパスをすべて SPA に委譲する
        - path: /
          pathType: Prefix

# リソース制限（FA リアルタイム UI の最小要件）
resources:
  # リソース上限（FA は SCADA テレメトリ表示のためやや大きめに設定する）
  limits:
    # CPU 上限
    cpu: 200m
    # メモリ上限（テレメトリデータの保持用に多めに確保する）
    memory: 256Mi
  # リソース要求
  requests:
    # CPU 要求
    cpu: 100m
    # メモリ要求
    memory: 128Mi

# cookie 設定（deployment 固有の cookie scope 分離）
cookie:
  # FA tier3 専用の __Host-プレフィックス付き cookie 名
  accessTokenCookieName: "__Host-fa-access-token"
  # SameSite=Strict で CSRF を防ぐ
  sameSite: "Strict"
  # HttpOnly を有効化して XSS からの cookie 盗取を防ぐ
  httpOnly: true
  # Secure フラグを有効化する（HTTPS 必須）
  secure: true

# BFF 設定（FA 専用 BFF エンドポイント）
bff:
  # BFF サービス名（kubernetes Service 名）
  serviceName: "tier3-fa-bff"
  # BFF ポート
  port: 8083

# 環境変数設定
env:
  # tier3 deployment 識別子（オブザーバビリティのラベル付けに使用する）
  TIER3_DEPLOYMENT: "fa"
  # BFF エンドポイント URL
  BFF_URL: "http://tier3-fa-bff:8083"
