# tauri_bundle.msix.yaml — Tauri Windows MSIX バンドル設定
# Windows 向けの MSIX パッケージ形式でアプリケーションをパッケージングする
# WiX MSI（wix/Product.wxs）と並列して提供する Windows Store 互換インストーラー
# MSIX は Windows 10 1709 以降で動作し、自動更新・クリーンアンインストールをサポートする
apiVersion: k1s0.io/v1 # k1s0 カスタムリソースの API バージョン
kind: TauriBundleConfig # Tauri バンドル設定リソースとして宣言する
metadata:
  name: k1s0-companion-msix # バンドル設定の識別名
  labels:
    # プラットフォーム識別ラベル（CI が Windows ジョブを選択するために使用する）
    k1s0.io/platform: windows
    # バンドル形式ラベル（WiX MSI と区別するためのラベル）
    k1s0.io/bundle-format: msix
spec:
  # --- アプリケーション基本情報 ---
  appName: "k1s0 Companion" # Windows スタートメニューの表示名
  appVersion: "1.0.0.0" # MSIX は 4 桁バージョン（Major.Minor.Build.Revision）が必要
  # アプリパッケージ識別子（Windows Store 登録名と一致させる）
  packageIdentityName: "k1s0Inc.k1s0Companion"
  # パッケージ発行者（Windows コード署名証明書の Subject と一致させる必要がある）
  packageIdentityPublisher: "CN=k1s0 Inc, O=k1s0 Inc, C=JP"

  # --- MSIX 固有設定 ---
  msix:
    # アプリケーションの説明（MSIX マニフェストの Description フィールド）
    description: "k1s0 Companion Application for tier3 desktop state management"
    # 発行者の表示名（Windows インストーラーに表示される）
    publisherDisplayName: "k1s0 Inc"
    # ロゴ画像のパス（StoreLogo.png として使用される 50x50 PNG）
    logoPath: "icons/StoreLogo.png"
    # Square44x44Logo のパス（タスクバー・スタートメニュー用 44x44 PNG）
    square44x44Logo: "icons/Square44x44Logo.png"
    # Square150x150Logo のパス（スタートメニュータイル用 150x150 PNG）
    square150x150Logo: "icons/Square150x150Logo.png"
    # アプリ起動の拡張機能宣言
    capabilities:
      # インターネット接続（tier2 SDK との通信に必要）
      - internetClient
      # ローカルネットワーク接続（Companion IPC に必要）
      - privateNetworkClientServer

  # --- Windows コード署名設定 ---
  codesign:
    # 署名に使用する証明書の Subject (CN)
    # CI では WINDOWS_SIGNING_CERT_SUBJECT 環境変数から注入する（ハードコード禁止）
    certificateSubject: "CN=k1s0 Inc"
    # タイムスタンプサーバー URL（署名の有効期限延長に必要）
    timestampUrl: "http://timestamp.digicert.com"
    # 署名アルゴリズム（SHA-256 を使用する）
    digestAlgorithm: sha256

  # --- アイコン設定 ---
  icons:
    # Windows ICO ファイル（複数サイズを一つのファイルに内包する）
    - "icons/icon.ico"
    # MSIX 用 PNG アイコン（各サイズを個別に指定する）
    - "icons/Square44x44Logo.png"
    - "icons/Square150x150Logo.png"
    - "icons/StoreLogo.png"

  # --- インストール先設定 ---
  installationFolder: "k1s0Companion" # %ProgramFiles% 配下のインストールフォルダ名

  # --- ビルド成果物の配置 ---
  outputDir: "target/release/bundle/msix" # MSIX ファイルの出力先ディレクトリ
