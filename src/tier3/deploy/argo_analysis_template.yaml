# argo_analysis_template.yaml — Argo Rollouts AnalysisTemplate 設定
# カナリアリリース中のエラーレートと P99 レイテンシを Prometheus で監視する
# AnalysisTemplate は argo_rollouts.yaml の analysis ステップから参照される
apiVersion: argoproj.io/v1alpha1 # Argo Rollouts の API バージョンを指定する
kind: AnalysisTemplate # AnalysisTemplate リソースとして宣言する
metadata:
  name: k1s0-canary-analysis # argo_rollouts.yaml の templateName で参照される名前
  namespace: tier3 # tier3 名前空間に配置する
spec:
  # analysis に渡す引数定義（rollout の steps.analysis.args で値を注入する）
  args:
    - name: service-name # カナリアサービス名を引数として受け取る
  metrics:
    # --- メトリクス 1: error_rate ---
    # HTTP エラーレートを監視してカナリアの品質を判定する
    - name: error_rate # メトリクス識別子（Argo Rollouts の UI にも表示される）
      # 測定間隔（Rollout の pause 期間に合わせて 1 分ごとに評価する）
      interval: 1m
      # 連続して何回 failureCondition を満たしたら Fail とするか
      consecutiveErrorLimit: 3
      # 判定に使用する成功サンプル数の下限（データ不足の場合は Inconclusive）
      count: 5
      # Prometheus プロバイダー設定（tier1 Prometheus に問い合わせる）
      provider:
        prometheus:
          # Prometheus サーバーのアドレス（cluster 内 service を使用する）
          address: http://prometheus.monitoring.svc.cluster.local:9090
          # k1s0_http_errors_total と k1s0_http_requests_total からエラーレートを計算する
          # 5 分の rate ウィンドウで直近のエラー傾向を捉える
          query: |
            sum(rate(k1s0_http_errors_total[5m]))
            /
            sum(rate(k1s0_http_requests_total[5m]))
      # failureCondition: エラーレートが 1%（0.01）を超えたら Fail とする
      # wall-clock TTL は使用しない（rate 関数の window はスクレイプカウント基準）
      failureCondition: "result > 0.01"

    # --- メトリクス 2: p99_latency ---
    # P99 レイテンシ（ミリ秒）を監視してカナリアのパフォーマンスを判定する
    - name: p99_latency # メトリクス識別子
      # 測定間隔（エラーレートと同じ 1 分ごとに評価する）
      interval: 1m
      # 連続して何回 failureCondition を満たしたら Fail とするか
      consecutiveErrorLimit: 3
      # 判定に使用する成功サンプル数の下限
      count: 5
      # Prometheus プロバイダー設定
      provider:
        prometheus:
          # Prometheus サーバーのアドレス（cluster 内 service を使用する）
          address: http://prometheus.monitoring.svc.cluster.local:9090
          # k1s0_http_request_duration_ms のヒストグラムから P99 を計算する
          # 5 分の rate ウィンドウで直近のレイテンシ傾向を捉える
          query: |
            histogram_quantile(
              0.99,
              sum(rate(k1s0_http_request_duration_ms_bucket{service="{{args.service-name}}"}[5m])) by (le)
            )
      # failureCondition: P99 レイテンシが 500ms を超えたら Fail とする
      failureCondition: "result > 500"
