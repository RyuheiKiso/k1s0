# tauri_bundle.rpm.yaml — Tauri Linux RPM パッケージバンドル設定
# Linux（RHEL / Fedora / openSUSE）向けの .rpm パッケージ形式でアプリケーションをパッケージングする
# rpmbuild を使って配布可能なバイナリ RPM を生成する
apiVersion: k1s0.io/v1 # k1s0 カスタムリソースの API バージョン
kind: TauriBundleConfig # Tauri バンドル設定リソースとして宣言する
metadata:
  name: k1s0-companion-rpm # バンドル設定の識別名
  labels:
    # プラットフォーム識別ラベル（CI が Linux rpm ジョブを選択するために使用する）
    k1s0.io/platform: linux
    # バンドル形式ラベル（AppImage / deb と区別するためのラベル）
    k1s0.io/bundle-format: rpm
spec:
  # --- アプリケーション基本情報 ---
  appName: "k1s0-companion" # RPM パッケージ名（スペース禁止）
  appVersion: "1.0.0" # RPM パッケージバージョン
  # RPM リリース番号（パッチ更新時に増加させる）
  release: "1"
  # アプリ概要（rpm -qi に表示される短い説明）
  summary: "k1s0 Companion Application for tier3 desktop"
  # 長い説明文（rpm -qi の Description フィールド）
  description: |
    k1s0 Companion は tier3 クライアント状態管理を担う Tauri デスクトップアプリケーションです。
    USB / BLE / Serial / OPC-UA / Modbus デバイスアダプターを内蔵し、
    OpenTelemetry によるトレーシングと DPoP/PSK 認証をサポートします。
    RHEL 9 / Fedora 40 以降で動作します。

  # --- RPM パッケージ固有設定 ---
  rpm:
    # パッケージグループ（RPM グループ分類）
    group: "Applications/Engineering"
    # ライセンス識別子（SPDX 形式）
    license: "Proprietary"
    # RPM パッケージ URL
    url: "https://k1s0.io"
    # パッケージ作成者
    vendor: "k1s0 Inc"
    # 対象アーキテクチャ
    arch: "x86_64"
    # RPM 依存関係宣言（Requires）
    requires:
      # WebKit2GTK: Tauri の WebView エンジン（webkit2gtk4.1 のパッケージ名は RHEL 9 基準）
      - "webkit2gtk4.1 >= 2.36.0"
      # GTK3: UI フレームワーク
      - "gtk3 >= 3.24"
      # GLib: GNOME 基盤ライブラリ
      - "glib2 >= 2.72"
      # libsecret: GNOME/KDE Keyring アクセスに使用する（PSK の OS keystore 格納）
      - "libsecret >= 0.20"
      # OpenSSL: TLS/HTTPS 通信に必要
      - "openssl-libs >= 3.0"
    # 推奨パッケージ（Recommends: RPM 4.13+ が対応）
    recommends:
      # gnome-keyring: GNOME Keyring デーモン（PSK 格納先）
      - "gnome-keyring"
      # kwallet: KDE Wallet（KDE 環境での PSK 格納先）
      - "kwalletd5"
    # scriptlets（RPM インストール/アンインストール前後に実行するスクリプト）
    scriptlets:
      # %post: インストール後スクリプト（デスクトップエントリ更新）
      post: |
        # デスクトップデータベースを更新する
        if command -v update-desktop-database > /dev/null 2>&1; then
          update-desktop-database /usr/share/applications
        fi
        # アイコンキャッシュを更新する
        if command -v gtk-update-icon-cache > /dev/null 2>&1; then
          gtk-update-icon-cache /usr/share/icons/hicolor
        fi
      # %preun: アンインストール前スクリプト
      preun: |
        # k1s0-companion プロセスが起動中の場合は終了する
        pkill -f k1s0-companion || true

  # --- アイコン設定 ---
  icons:
    # SVG アイコン（スケーラブル形式）
    - "icons/icon.svg"
    # 32x32 PNG アイコン
    - "icons/32x32.png"
    # 128x128 PNG アイコン
    - "icons/128x128.png"
    # 256x256 PNG アイコン（高解像度用）
    - "icons/256x256@2x.png"

  # --- Linux デスクトップ統合設定 ---
  linuxDesktopIntegration:
    # .desktop ファイルの Name フィールド
    name: "k1s0 Companion"
    # .desktop ファイルの Comment フィールド
    comment: "tier3 state management companion for k1s0"
    # MIME タイプ関連付け
    mimeType: "x-scheme-handler/k1s0"
    # アプリカテゴリ（XDG メニュー統合に使用する）
    categories:
      - Utility
      - Development

  # --- インストール先設定 ---
  # RPM パッケージのファイル配置先（FHS / RPM Packaging Guidelines に準拠する）
  installationPaths:
    # 実行ファイルの配置先
    binary: "/usr/bin/k1s0-companion"
    # .desktop ファイルの配置先
    desktopEntry: "/usr/share/applications/k1s0-companion.desktop"
    # アイコンの配置先（hicolor テーマを使用する）
    icons: "/usr/share/icons/hicolor"

  # --- ビルド成果物の配置 ---
  outputDir: "target/release/bundle/rpm" # .rpm ファイルの出力先ディレクトリ
