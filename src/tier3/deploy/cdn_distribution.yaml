# cdn_distribution.yaml — CDN 配布 manifest（デュアルプロバイダー設定）
# Cloudflare Pages と AWS CloudFront の両方で k1s0 SPA を配信する
# 設計方針 31_配布デプロイ運用: CDN + Argo Rollouts + WiX MSI
# 可用性向上のため二重化し、DNS フェールオーバーで切り替える
apiVersion: k1s0.io/v1 # k1s0 カスタムリソースの API バージョン
kind: CdnDistribution # CdnDistribution リソースとして宣言する
metadata:
  name: k1s0-spa # CDN 配布設定の識別名
  labels:
    # 環境ラベル（production / staging を区別する）
    k1s0.io/environment: production
    # SPA ラベル（tier3 フロントエンドを識別する）
    k1s0.io/app: tier3-spa
spec:
  # --- デュアルプロバイダー設定 ---
  providers:
    # ========================
    # Provider 1: Cloudflare Pages
    # ========================
    cloudflare:
      # Cloudflare Pages プロジェクト名（CF ダッシュボードで作成したプロジェクト）
      projectName: k1s0-spa
      # デプロイ先ブランチ（main ブランチのみ production にデプロイする）
      productionBranch: main
      # カスタムドメイン設定（Cloudflare DNS で管理する）
      customDomain: "app.k1s0.io"
      # 互換性フラグ（Workers/Pages のランタイム機能を有効にする）
      compatibilityFlags:
        - nodejs_compat # Node.js 互換 API を有効にする

      # --- Cloudflare Origins ---
      # Pages でのオリジン設定（Pages は自動的に CF Edge で配信される）
      origin:
        # ビルド成果物のソースバケット（CI が dist/ を upload する）
        bucketName: "k1s0-spa-dist"
        # S3 互換ストレージへのアクセス設定（CF R2 を使用する）
        r2Bucket: "k1s0-spa-assets"

      # --- Cloudflare Cache ルール ---
      cacheRules:
        # ハッシュ付き静的アセット（index.js → index.abc123.js 形式）
        # ビルドごとにファイル名が変わるため長期キャッシュを適用する
        - match: "/assets/*"
          cacheControl: "public, max-age=31536000, immutable" # 1 年間キャッシュ + immutable
          compress: true # Brotli/gzip 圧縮を有効にする
          sri: required # Subresource Integrity チェックを必須にする

        # JS/CSS ファイル（ビルドハッシュ付き）
        - match: "*.js"
          cacheControl: "public, max-age=31536000, immutable" # 1 年間キャッシュ + immutable
          compress: true # 圧縮を有効にする

        # CSS ファイル（ビルドハッシュ付き）
        - match: "*.css"
          cacheControl: "public, max-age=31536000, immutable" # 1 年間キャッシュ + immutable
          compress: true # 圧縮を有効にする

        # SPA のエントリーポイント（キャッシュ禁止で常に最新バージョンを提供する）
        - match: "/index.html"
          cacheControl: "no-store, no-cache, must-revalidate" # キャッシュを完全に無効化する
          compress: true # 圧縮を有効にする（サイズは小さいが一貫性のため適用）

        # service worker は毎回再検証する（バージョン更新の即時反映のため）
        - match: "/sw.js"
          cacheControl: "no-store, no-cache, must-revalidate" # キャッシュを完全に無効化する

      # --- Cloudflare セキュリティヘッダー ---
      securityHeaders:
        # Content-Security-Policy（unsafe-inline / unsafe-eval は禁止）
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'nonce-{NONCE}';
          img-src 'self' data: blob:;
          connect-src 'self' https://api.k1s0.io wss://ws.k1s0.io;
          font-src 'self';
          object-src 'none';
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          upgrade-insecure-requests
        # HSTS: HTTPS を強制する（1 年間 + includeSubDomains + preload）
        strictTransportSecurity: "max-age=31536000; includeSubDomains; preload"
        # X-Frame-Options: clickjacking を防止する
        xFrameOptions: "DENY"
        # X-Content-Type-Options: MIME スニッフィングを防止する
        xContentTypeOptions: "nosniff"
        # Referrer-Policy: 外部サイトへのリファラー漏洩を防止する
        referrerPolicy: "strict-origin-when-cross-origin"
        # Permissions-Policy: 不要なブラウザ機能を無効化する
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
        # Cross-Origin-Opener-Policy: Spectre 攻撃対策
        crossOriginOpenerPolicy: "same-origin"
        # Cross-Origin-Resource-Policy: CORS 制約を厳格化する
        crossOriginResourcePolicy: "same-origin"

    # ========================
    # Provider 2: AWS CloudFront
    # ========================
    cloudfront:
      # CloudFormation / Terraform で管理するリソース ID
      distributionId: "${CLOUDFRONT_DISTRIBUTION_ID}"
      # CloudFront の代替ドメイン（CNAME として設定する）
      aliases:
        - "cdn.k1s0.io" # フェールオーバー用のサブドメイン（CF が落ちたときに向ける）
      # ACM 証明書 ARN（us-east-1 リージョン必須）
      acmCertificateArn: "arn:aws:acm:us-east-1:${AWS_ACCOUNT_ID}:certificate/${CERT_ID}"
      # 最低限の TLS バージョン（TLS 1.2 以上を強制する）
      minimumTlsVersion: TLSv1.2_2021
      # HTTP/2 と HTTP/3 を有効にする
      httpVersion: http2and3
      # IPv6 サポートを有効にする
      ipv6Enabled: true

      # --- S3 オリジン設定 ---
      origins:
        - id: "k1s0-spa-s3-origin" # オリジン識別子
          # SPA の静的ファイルを格納する S3 バケット（OAI でアクセス制限する）
          domainName: "k1s0-spa-dist.s3.ap-northeast-1.amazonaws.com"
          # Origin Access Identity を使用してバケットへの直接アクセスを禁止する
          originAccessIdentity: "${CLOUDFRONT_OAI_ID}"
          # オリジンのプロトコルポリシー（S3 は HTTPS のみ）
          protocolPolicy: https-only

      # --- キャッシュビヘイビア設定 ---
      cacheBehaviors:
        # デフォルトビヘイビア（index.html / SPA ルート用）
        - pathPattern: "DEFAULT" # デフォルトルール（全パスにマッチする）
          # キャッシュポリシー: SPA エントリーポイントはキャッシュしない
          cachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad" # Managed-CachingDisabled
          # オリジンリクエストポリシー: ヘッダーをそのままオリジンに転送する
          originRequestPolicyId: "b689b0a8-53d0-40ab-baf2-68738e2966ac" # Managed-AllViewer
          # 圧縮を有効にする
          compress: true
          # ビュワープロトコルポリシー: HTTP を HTTPS にリダイレクトする
          viewerProtocolPolicy: redirect-to-https
          # レスポンスヘッダーポリシー（セキュリティヘッダーを注入する）
          responseHeadersPolicyId: "${SECURITY_HEADERS_POLICY_ID}"

        # 静的アセットビヘイビア（ハッシュ付きファイル用）
        - pathPattern: "/assets/*" # assets ディレクトリにマッチする
          # キャッシュポリシー: 1 年間キャッシュする（CachingOptimized）
          cachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6" # Managed-CachingOptimized
          # 圧縮を有効にする
          compress: true
          # ビュワープロトコルポリシー: HTTP を HTTPS にリダイレクトする
          viewerProtocolPolicy: redirect-to-https

        # JS/CSS ファイルビヘイビア（ビルドハッシュ付きファイル用）
        - pathPattern: "*.js" # JS ファイルにマッチする
          # キャッシュポリシー: 1 年間キャッシュする
          cachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6" # Managed-CachingOptimized
          # 圧縮を有効にする
          compress: true
          # ビュワープロトコルポリシー: HTTP を HTTPS にリダイレクトする
          viewerProtocolPolicy: redirect-to-https

      # --- CloudFront セキュリティヘッダーポリシー ---
      # AWS マネージドコンソールでポリシー ID を取得し ${SECURITY_HEADERS_POLICY_ID} に設定する
      securityHeadersPolicy:
        # Content-Security-Policy（CloudFlare と同一ポリシーを適用する）
        contentSecurityPolicy:
          override: true # オリジンのヘッダーを上書きする
          contentSecurityPolicy: >-
            default-src 'self';
            script-src 'self';
            style-src 'self';
            img-src 'self' data: blob:;
            connect-src 'self' https://api.k1s0.io wss://ws.k1s0.io;
            font-src 'self';
            object-src 'none';
            frame-ancestors 'none';
            base-uri 'self';
            form-action 'self';
            upgrade-insecure-requests
        # HSTS ヘッダー（CloudFront で HTTPS を強制する）
        strictTransportSecurity:
          override: true # オリジンのヘッダーを上書きする
          accessControlMaxAgeSec: 31536000 # 1 年間
          includeSubdomains: true # サブドメインにも適用する
          preload: true # HSTS Preload リストへの追加を許可する
        # X-Content-Type-Options
        contentTypeOptions:
          override: true # オリジンのヘッダーを上書きする
        # X-Frame-Options
        frameOptions:
          override: true # オリジンのヘッダーを上書きする
          frameOption: DENY # iframe 埋め込みを禁止する
        # Referrer-Policy
        referrerPolicy:
          override: true # オリジンのヘッダーを上書きする
          referrerPolicy: strict-origin-when-cross-origin # 外部へのリファラー漏洩を防止する
