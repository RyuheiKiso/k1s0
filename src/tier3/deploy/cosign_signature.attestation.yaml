# cosign_signature.attestation.yaml — cosign attestation 仕様
# Tauri バンドルアーティファクトの provenance attestation を cosign で発行する
# supply chain security: SLSA Build Level 3 に準拠した attestation フローを定義する
apiVersion: k1s0.io/v1 # k1s0 カスタムリソースの API バージョン
kind: CosignAttestation # CosignAttestation リソースとして宣言する
metadata:
  name: k1s0-tauri-bundle-attestation # attestation 設定の識別名
  labels:
    # セキュリティカテゴリラベル（supply chain 関連リソースを識別する）
    k1s0.io/security-category: supply-chain
    # SLSA レベルラベル（attestation が準拠する SLSA Build Level）
    k1s0.io/slsa-level: "3"
spec:
  # --- 署名対象アーティファクト ---
  # cosign が署名・attestation を付与するアーティファクトの一覧
  artifacts:
    # macOS DMG バンドル
    - name: k1s0-companion.dmg # アーティファクト識別名
      type: tauri-bundle # アーティファクト種別
      platform: macos # 対象プラットフォーム
      # Harbor OCI レジストリへの publish 先（DMG を OCI artifact として格納する）
      ociRef: "harbor.k1s0.internal/k1s0/tauri-bundles/dmg:${VERSION}"
    # Linux AppImage バンドル
    - name: k1s0-companion.AppImage # アーティファクト識別名
      type: tauri-bundle # アーティファクト種別
      platform: linux # 対象プラットフォーム
      # Harbor OCI レジストリへの publish 先（AppImage を OCI artifact として格納する）
      ociRef: "harbor.k1s0.internal/k1s0/tauri-bundles/appimage:${VERSION}"
    # Windows MSIX バンドル
    - name: k1s0-companion.msix # アーティファクト識別名
      type: tauri-bundle # アーティファクト種別
      platform: windows # 対象プラットフォーム
      # Harbor OCI レジストリへの publish 先（MSIX を OCI artifact として格納する）
      ociRef: "harbor.k1s0.internal/k1s0/tauri-bundles/msix:${VERSION}"
    # Windows WiX MSI バンドル（既存の wix/Product.wxs と対応する）
    - name: k1s0-companion.msi # アーティファクト識別名
      type: tauri-bundle # アーティファクト種別
      platform: windows # 対象プラットフォーム
      # Harbor OCI レジストリへの publish 先（MSI を OCI artifact として格納する）
      ociRef: "harbor.k1s0.internal/k1s0/tauri-bundles/msi:${VERSION}"

  # --- cosign 署名設定 ---
  signing:
    # keyless 署名を使用する（Sigstore Fulcio + Rekor による透明性ログ）
    keyless: true
    # OIDC プロバイダー（GitHub Actions OIDC を使用する）
    oidcProvider: "https://token.actions.githubusercontent.com"
    # Rekor 透明性ログサーバー（公開 Sigstore インスタンスを使用する）
    rekorUrl: "https://rekor.sigstore.dev"
    # Fulcio CA（public good Fulcio を使用する）
    fulcioUrl: "https://fulcio.sigstore.dev"

  # --- provenance attestation 設定 ---
  provenance:
    # SLSA Provenance v1.0 format で attestation を生成する
    predicateType: "https://slsa.dev/provenance/v1"
    # buildType: Tauri バンドルビルドプロセスを識別する URI
    buildType: "https://k1s0.io/build-types/tauri-bundle/v1"
    # ビルダー識別子（GitHub Actions runner を使用する）
    builder:
      # GitHub Actions の OIDC subject から動的に設定される（ハードコード禁止）
      id: "https://github.com/k1s0-io/k1s0/.github/workflows/release.yml"
    # 含める material（ビルドに使用したソースを記録する）
    buildMaterials:
      # ソースリポジトリへの参照
      - uri: "git+https://github.com/k1s0-io/k1s0@refs/heads/main"
        # commit SHA は CI が動的に設定する（ハードコード禁止）
        digest:
          sha1: "${GIT_COMMIT_SHA}"

  # --- 検証ポリシー設定 ---
  verificationPolicy:
    # Harbor admission webhook が検証する際に要求する条件
    # 署名者が GitHub Actions OIDC であり、refs/heads/main または refs/tags/v* から発行されている必要がある
    # refs/tags/v* を追加することで semver タグによるリリースビルドの attestation も許容する
    requiredSignerIdentity:
      # main ブランチからのビルドを許容する（CI/CD の通常ビルド）
      - "https://github.com/k1s0-io/k1s0/.github/workflows/release.yml@refs/heads/main"
      # semver タグからのビルドを許容する（正式リリースビルド: refs/tags/v* に対応する）
      - "https://github.com/k1s0-io/k1s0/.github/workflows/release.yml@refs/tags/v*"
    # SLSA Build Level 3 以上を要求する
    minimumSlsaLevel: 3
    # 透明性ログへの記録を必須とする（Rekor lookup 必須）
    requireTransparencyLog: true
