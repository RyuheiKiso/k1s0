# argo_rollouts.yaml — Argo Rollouts canary deploy 設定
# 設計方針 31_配布デプロイ運用: CDN + Argo Rollouts + WiX MSI
# カナリアリリースを 5%/25%/50%/100% の 4 ステップで段階的に展開する
apiVersion: argoproj.io/v1alpha1 # Argo Rollouts の API バージョンを指定する
kind: Rollout # Rollout リソースとして宣言する
metadata:
  name: k1s0-tier3-spa # Rollout リソースの名前を指定する
  namespace: tier3 # tier3 名前空間にデプロイする
spec:
  replicas: 3 # 本番 Pod のレプリカ数（canary/stable 合算ではなくベース数）
  strategy:
    canary: # カナリアリリース戦略を使用する
      canaryService: tier3-spa-canary # カナリアトラフィックを受けるサービス名
      stableService: tier3-spa-stable # 安定版トラフィックを受けるサービス名
      steps:
        # --- Step 1: 5% カナリア展開 ---
        # 全トラフィックの 5% をカナリアに切り替える（最小リスク検証）
        - setWeight: 5
        # k1s0-canary-analysis を実行してエラーレートと P99 レイテンシを検証する
        - analysis:
            templates:
              # AnalysisTemplate の名前を参照する
              - templateName: k1s0-canary-analysis
            args:
              # カナリアサービス名を analysis に渡す
              - name: service-name
                value: tier3-spa-canary
        # 5 分間一時停止して指標が安定することを確認する
        - pause:
            duration: 5m

        # --- Step 2: 25% カナリア展開 ---
        # 全トラフィックの 25% に拡大する（中規模検証）
        - setWeight: 25
        # 25% 展開後に再度 analysis を実行してエラーレートと P99 レイテンシを検証する
        - analysis:
            templates:
              # AnalysisTemplate の名前を参照する
              - templateName: k1s0-canary-analysis
            args:
              # カナリアサービス名を analysis に渡す
              - name: service-name
                value: tier3-spa-canary
        # 5 分間一時停止して指標が安定することを確認する
        - pause:
            duration: 5m

        # --- Step 3: 50% カナリア展開 ---
        # 全トラフィックの 50% に拡大する（大規模検証）
        - setWeight: 50
        # 50% 展開後に再度 analysis を実行してエラーレートと P99 レイテンシを検証する
        - analysis:
            templates:
              # AnalysisTemplate の名前を参照する
              - templateName: k1s0-canary-analysis
            args:
              # カナリアサービス名を analysis に渡す
              - name: service-name
                value: tier3-spa-canary
        # 5 分間一時停止して指標が安定することを確認する
        - pause:
            duration: 5m

        # --- Step 4: 100% カナリア展開（完全移行）---
        # 全トラフィックをカナリア（新バージョン）に切り替えて promotion を完了する
        - setWeight: 100

  selector:
    matchLabels:
      app: tier3-spa # tier3-spa ラベルを持つ Pod を対象とする
  template:
    metadata:
      labels:
        app: tier3-spa # Pod に tier3-spa ラベルを付与する
    spec:
      containers:
        - name: spa # SPA コンテナ名
          image: harbor.k1s0.internal/k1s0/tier3-spa:latest # Harbor 内部レジストリからイメージを取得する
          ports:
            - containerPort: 80 # SPA が HTTP を listen するポート番号
