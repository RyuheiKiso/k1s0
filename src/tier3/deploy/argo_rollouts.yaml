# argo_rollouts.yaml — Argo Rollouts canary deploy 設定
# 設計方針 31_配布デプロイ運用: CDN + Argo Rollouts + WiX MSI
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: k1s0-tier3-spa
  namespace: tier3
spec:
  replicas: 3
  strategy:
    canary:
      steps:
        # 10% にカナリアリリース
        - setWeight: 10
        # 5 分待機して安定性確認
        - pause: { duration: 5m }
        # 50% に拡大
        - setWeight: 50
        # 10 分待機
        - pause: { duration: 10m }
        # 100% に完全移行
        - setWeight: 100
      canaryService: tier3-spa-canary
      stableService: tier3-spa-stable
  selector:
    matchLabels:
      app: tier3-spa
  template:
    metadata:
      labels:
        app: tier3-spa
    spec:
      containers:
        - name: spa
          image: harbor.k1s0.internal/k1s0/tier3-spa:latest
          ports:
            - containerPort: 80
