# k1s0 tier3 cosign keyless 署名証跡 manifest — SoT input YAML
# generate_cosign_attestations.py の入力として使用する手書き可能な宣言ファイル
# spec: docs/04_詳細設計/01_適合仕様/16_build_provenance適合仕様.md
# Y-tier3-5: cosign keyless 署名 manifest 追加（SLSA L3 以上要求への対応）
attestations:
  - artifact_id: tier3_tauri_sidecar
    # Tauri sidecar バイナリの cosign keyless 署名設定
    signing_method: keyless
    # GitHub Actions OIDC issuer で keyless 署名を行う（長期秘密鍵不要）
    oidc_issuer: "https://token.actions.githubusercontent.com"
    # Fulcio のエンドポイント（keyless 署名に使用する）
    fulcio_url: "https://fulcio.sigstore.dev"
    # Rekor のエンドポイント（transparency log に使用する）
    rekor_url: "https://rekor.sigstore.dev"
    # SLSA L3: ephemeral build environment + hermetic build + non-falsifiable provenance
    slsa_level: L3
    # 現状宣言済み（CI pipeline 実装で verified に昇格する）
    status: declared
    # 署名対象のアーティファクトパス（CI ビルド時に決定する）
    artifact_path: "dist/tier3/tauri/k1s0-companion-sidecar"
    # cosign sign-blob コマンドテンプレート（GitHub Actions ワークフローで使用する）
    sign_command_template: |
      # Tauri sidecar の cosign keyless 署名を実行する
      cosign sign-blob \
        --yes \
        --oidc-issuer=${OIDC_ISSUER} \
        --fulcio-url=${FULCIO_URL} \
        --rekor-url=${REKOR_URL} \
        --bundle=tier3-tauri-sidecar.bundle \
        dist/tier3/tauri/k1s0-companion-sidecar
    note: "cosign keyless で Tauri sidecar を署名する（CI pipeline で実装）"

  - artifact_id: tier3_wpf_installer
    # WPF installer の cosign keyless 署名設定
    signing_method: keyless
    # GitHub Actions OIDC issuer で keyless 署名を行う（長期秘密鍵不要）
    oidc_issuer: "https://token.actions.githubusercontent.com"
    # Fulcio のエンドポイント
    fulcio_url: "https://fulcio.sigstore.dev"
    # Rekor のエンドポイント
    rekor_url: "https://rekor.sigstore.dev"
    # SLSA L3: ephemeral build environment + hermetic build + non-falsifiable provenance
    slsa_level: L3
    # 現状宣言済み（CI pipeline 実装で verified に昇格する）
    status: declared
    # 署名対象のアーティファクトパス（Windows CI ビルド時に決定する）
    artifact_path: "dist/tier3/wpf/k1s0-wpf-installer.exe"
    # cosign sign-blob コマンドテンプレート
    sign_command_template: |
      # WPF installer の cosign keyless 署名を実行する
      cosign sign-blob \
        --yes \
        --oidc-issuer=${OIDC_ISSUER} \
        --fulcio-url=${FULCIO_URL} \
        --rekor-url=${REKOR_URL} \
        --bundle=tier3-wpf-installer.bundle \
        dist/tier3/wpf/k1s0-wpf-installer.exe
    note: "cosign keyless で WPF installer を署名する"

  - artifact_id: tier3_msix_bundle
    # MSIX bundle の cosign keyless 署名設定
    signing_method: keyless
    # GitHub Actions OIDC issuer で keyless 署名を行う（長期秘密鍵不要）
    oidc_issuer: "https://token.actions.githubusercontent.com"
    # Fulcio のエンドポイント
    fulcio_url: "https://fulcio.sigstore.dev"
    # Rekor のエンドポイント
    rekor_url: "https://rekor.sigstore.dev"
    # SLSA L3: ephemeral build environment + hermetic build + non-falsifiable provenance
    slsa_level: L3
    # 現状宣言済み（CI pipeline 実装で verified に昇格する）
    status: declared
    # 署名対象のアーティファクトパス（Windows CI ビルド時に決定する）
    artifact_path: "dist/tier3/msix/k1s0-bundle.msix"
    # cosign sign-blob コマンドテンプレート
    sign_command_template: |
      # MSIX bundle の cosign keyless 署名を実行する
      cosign sign-blob \
        --yes \
        --oidc-issuer=${OIDC_ISSUER} \
        --fulcio-url=${FULCIO_URL} \
        --rekor-url=${REKOR_URL} \
        --bundle=tier3-msix-bundle.bundle \
        dist/tier3/msix/k1s0-bundle.msix
    note: "cosign keyless で MSIX bundle を署名する"

# 検証コマンドテンプレート（CI の verify ステップで使用する）
verification_template:
  # 証明書 identity の正規表現（GitHub Actions OIDC の subject claim に合わせる）
  certificate_identity_regexp: "https://github.com/k1s0-io/k1s0/.*"
  # OIDC issuer（GitHub Actions）
  certificate_oidc_issuer: "https://token.actions.githubusercontent.com"
  # Rekor のエンドポイント
  rekor_url: "https://rekor.sigstore.dev"

# dual_signoff 要件（CLAUDE.md の dual sign-off 規約に従う）
# human author（実装者本人の cosign signature）× 1 + ai_static_analysis evidence × 1
dual_signoff_required: true
