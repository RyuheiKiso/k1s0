# k1s0 tier3 Rust crate（Tauri sidecar 用 standalone workspace）
# tier1 Cargo workspace member にしない（tier3/CLAUDE.md L48 に明記）

# standalone workspace 宣言
[workspace]
members = ["."]
resolver = "2"

[package]
# crate 名
name = "k1s0-tier3"
# バージョン
version = "0.1.0"
# Rust edition
edition = "2021"
# 説明
description = "k1s0 tier3 4 layer client state（Rust 等価強度実装）"

[dependencies]
# シリアライズ / デシリアライズ
serde = { version = "1", features = ["derive"] }
# JSON 値の動的操作（outbox の PII strip に使用する）
serde_json = "1"
# UUID v4（Idempotency-Key 生成に使用する）
uuid = { version = "1", features = ["v4"] }
# k1s0-hlc: wall-clock TTL 禁止規律に従い HLC（Hybrid Logical Clock）を使用する（path 依存）
# src/CLAUDE.md §wall-clock TTL 禁止: deadline 計算は HLC ベース必須
k1s0-hlc = { path = "../../client/hlc_lib/rust" }
# OpenTelemetry: client_purge_event を span event として audit emit する（R3-5）
opentelemetry = { version = "0.27", features = ["trace"] }

[dev-dependencies]
# Pact consumer contract test で pact broker への HTTP リクエストに使用する（層 9 強制機構）
ureq = "2"
