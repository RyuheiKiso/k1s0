# k1s0 tier3 Rust crate（Tauri sidecar 用 standalone workspace）
# tier1 Cargo workspace member にしない（tier3/CLAUDE.md L48 に明記）

# standalone workspace 宣言
[workspace]
members = ["."]
resolver = "2"

[package]
# crate 名
name = "k1s0-tier3"
# バージョン
version = "0.1.0"
# Rust edition
edition = "2021"
# 説明
description = "k1s0 tier3 4 layer client state（Rust 等価強度実装）"

[dependencies]
# シリアライズ / デシリアライズ
serde = { version = "1", features = ["derive"] }
# UUID v4
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# テストで使用する追加クレートなし
