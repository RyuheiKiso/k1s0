# src/formal/lock/assumption_input.yaml — assumption エントリの入力 SoT
# generate_assumption.py が読み込んで assumption.lock.yaml を生成する
# 各 assumption_id は capabilities.lock.yaml / formal 証明の accepted_with_assumption セルと一致させる

# エントリ一覧
# bidi_web_transport_unavailable_v1_assumption は 2026-05-21 に解決済み。
# web_transport.rs コードレベル assertion（bidi_capabilities テストクレート）により
# 5 cell が green に昇格したため、assumption エントリを削除する。
entries:
  # profiles_ebpf_wsl2_unavailable_assumption: WSL2 dev 環境での eBPF probe 不可の受容
  - assumption_id: profiles_ebpf_wsl2_unavailable_assumption
    # 説明: WSL2 dev 環境では eBPF probe 不可。signals.lock.yaml profiles は accepted_with_assumption。
    # 年次 linux bare-metal drill を ops_loop で代替検証。non-WSL2 drill schedule は ops_loop.lock.yaml に記録。
    description: "WSL2 dev 環境では eBPF probe 不可。signals.lock.yaml profiles は accepted_with_assumption。年次 linux bare-metal drill を ops_loop で代替検証。non-WSL2 drill schedule は ops_loop.lock.yaml に記録。"
    # ステータス: accepted（WSL2 制約、代替検証スケジュール記録済み）
    status: accepted
    # 対象軸
    axis_name: tier1_observability
  # formal_temporal_safety_v1_pending_assumption は 2026-05-23 に解決済み。
  # 5 tier1 TSP: Apalache v0.45.4 で NoError verified。
  # 18 axis/cross-cutting TSP: 専用 TLA spec を作成して Apalache v0.45.4 で NoError verified。
  # 合計 23 TSP cell が v1_baseline_verified に昇格したため assumption を削除する。
  #
  # formal_property_axiom_v1_pending_assumption は 2026-05-23 に解決済み。
  # 19 axiom cell: Kani 0.67.0 で 38 harness が VERIFICATION_SUCCESSFUL を達成。
  # 全 19 axiom cell が v1_baseline_verified に昇格したため assumption を削除する。
  #
  # formal_refinement_v1_pending_assumption: 19 refinement cell は v2.0.0 roadmap として継続。
  # assumption.lock.yaml の cap=20 以内に収まっている（19/20）。
  - assumption_id: formal_refinement_v1_pending_assumption
    description: "v1.0.0 では TLA+/Stainless による refinement proof の完全 verify を v2.0.0 roadmap に延期し、Rust 型システム + API snapshot + strict mode を代替証跡として受容する。19 cell（全 axis の v1_refinement_proof）が対象。TSP(23 cell) / axiom(19 cell) は v1 で actual verify 済み。"
    status: accepted
    axis_name: all_axes
  # wsl2_chaos_unavailable_assumption: WSL2 環境での chaos test 実行不可の受容
  - assumption_id: wsl2_chaos_unavailable_assumption
    # 説明: WSL2 では eBPF / network namespace 操作が制限されるため一部 chaos scenario が実行不可。
    # 対象 cell: tier1.v1_fault_chaos および tier3.v1_fault_chaos の chaos 部分。
    # 緩和策: GitHub Actions ubuntu-22.04 (Linux native runner) での CI 実行時に verified に昇格。
    description: "WSL2 dev 環境では eBPF / network namespace 操作制限のため一部 chaos scenario が実行不可。tier1.v1_fault_chaos / tier3.v1_fault_chaos に対し file pointer + accepted_with_assumption を適用。GitHub Actions ubuntu-22.04 runner で再実行時に verified に昇格する。"
    # ステータス: accepted（WSL2 物理制約、CI native runner での代替検証を計画済み）
    status: accepted
    # 対象軸
    axis_name: tier1_test_tier3_test
