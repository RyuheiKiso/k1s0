# 5 proof_class の定義（proof_inventory の行定義）
# 各 proof_class は異なるツールチェーンと検証手法に対応する
proof_classes:
  # TLA+/Apalache による時相安全性検証クラス
  - class_id: v1_temporal_safety_proof
    description: TLA+/Apalache による temporal safety property の検証
    tool_kind: tla_apalache
    certificate_extension: .cert.json
  # Stainless/Dafny/Lean 4 によるプログラム正確性検証クラス
  - class_id: v1_program_correctness_proof
    description: Stainless/Dafny/Lean 4 による program correctness の検証
    tool_kind: stainless
    certificate_extension: .cert.json
  # TLA+ + Stainless による精錬ペア検証クラス（35 pair）
  - class_id: v1_refinement_proof
    description: TLA+ + Stainless による refinement pair の検証（35 pair）
    tool_kind: tla_stainless
    certificate_extension: .cert.json
  # Kani/CBMC による実行時モデル検査クラス
  - class_id: v1_runtime_model_check
    description: Kani/CBMC による runtime model check
    tool_kind: kani_cbmc
    certificate_extension: .cert.json
  # property-based axiom 検証クラス（QuickCheck / fast-check）
  - class_id: v1_property_axiom
    description: property-based axiom verification（QuickCheck / fast-check）
    tool_kind: cbmc
    certificate_extension: .cert.json
