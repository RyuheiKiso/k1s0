# Phase E: 最初の Lean 4 lemma (HLC 単調性) の物理化

pins:
  # --- HLC 単調性 lemma (Lean 4.29.1, Mathlib なし) ---
  - lemma_id: tier1_hlc_monotone_001
    # 対応 obligation_id
    obligation_id: formal_correctness_045
    # Lean 4 ツールチェーンのバージョン（lean-toolchain ファイルと一致させる）
    lean_version: "leanprover/lean4:v4.29.1"
    # Mathlib は今回使用しないため null とする
    mathlib_commit: null
    # 証明ファイルのパス
    spec_file: "src/formal/lean4/Tier1/HLC/Monotone.lean"
    # 定理名
    theorem_name: "K1s0Formal.Tier1.HLC.hlc_advance_monotone"
    # 証明日時
    verified_at: "2026-05-23T00:00:00Z"
    # 使用した tactic（omega は Lean 4 組み込み）
    tactics_used:
      - rcases
      - simp only
      - exact
      - Nat.le_add_right
    # Mathlib 依存なし（標準ライブラリの omega のみ使用）
    mathlib_dependencies: []
    # 証明の概要
    statement: >
      HLC (Hybrid Logical Clock) の advance 操作が単調増加することを形式証明する。
      ∀ h : HLC, ∀ now : Nat, h ≤ h.advance now
      （client/hlc_lib/rust の Rust 実装の正当性を Lean 4 で形式保証する）
