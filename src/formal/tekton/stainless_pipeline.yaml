apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: stainless-verification
  namespace: formal-verification
  labels:
    app.kubernetes.io/component: formal-verification
    app.kubernetes.io/part-of: k1s0
spec:
  params:
    - name: spec-file
      type: string
      description: Stainless 検証対象の Scala ファイルのパス（リポジトリルートからの相対パス）
    - name: obligation-id
      type: string
      description: proof obligation の識別子（proof_inventory/inventory.yaml の obligation_id）
    - name: scala-version
      type: string
      description: 使用する Scala バージョン
      default: "3.3.3"
    - name: stainless-version
      type: string
      description: 使用する Stainless バージョン
      default: "0.9.8"
  tasks:
    - name: run-stainless
      taskRef:
        name: stainless-verify
      params:
        - name: spec-file
          value: $(params.spec-file)
        - name: scala-version
          value: $(params.scala-version)
        - name: stainless-version
          value: $(params.stainless-version)
    - name: record-certificate
      runAfter: [run-stainless]
      taskRef:
        name: record-proof-result
      params:
        - name: obligation-id
          value: $(params.obligation-id)
        - name: result-status
          value: $(tasks.run-stainless.results.verify-status)
        - name: certificate-uri
          value: $(tasks.run-stainless.results.certificate-uri)
    - name: update-dual-review
      runAfter: [record-certificate]
      taskRef:
        name: update-dual-review-record
      params:
        - name: obligation-id
          value: $(params.obligation-id)
        - name: ai-evidence-uri
          value: $(tasks.run-stainless.results.certificate-uri)
  results:
    - name: obligation-id
      description: 検証した obligation の ID
      value: $(params.obligation-id)
    - name: verify-status
      description: Stainless 検証結果（PASS / FAIL）
      value: $(tasks.run-stainless.results.verify-status)
    - name: certificate-uri
      description: 生成された proof certificate の URI
      value: $(tasks.run-stainless.results.certificate-uri)
