# 脅威モデルカタログ: cells.yaml
# 5^4 = 625 cell の脅威モデルマトリクスを定義する
# 各 cell は 4 次元（脅威クラス × 3 次元）のクロス積で識別される
# 最初の 50 cell を手書きし、残り 575 cell は生成器で生成する
#
# 生成コマンド（残り 575 cells を生成する）:
# python3 tools/lock_yaml_generator/generate_threat_model.py
#
# cell_id 体系: threat_{3桁の通番}
# threat_class: STRIDE の 6 カテゴリ（spoofing/tampering/repudiation/information_disclosure/denial_of_service/elevation_of_privilege）
# threat_dimension_1: 攻撃主体（external_actor/internal_actor/supply_chain/automated_system/hardware_fault）
# threat_dimension_2: 攻撃対象（api_endpoint/data_store/network_transport/key_material/identity_provider）
# threat_dimension_3: 対抗手段カテゴリ（authentication/authorization/encryption/audit/availability）
# threat_dimension_4: 対象軸（tier1/tier2/tier3/security/ops/client/infra/data/formal/test）
# mitigation_status: explicit_unreachable / mitigated / accepted_with_assumption / open
# mitigation_reason: 緩和理由の説明（クロスカッティング仕様への参照を含む）

threat_model_cells:
  # --- Spoofing (なりすまし) 脅威 ---

  # cell_001: 外部攻撃者による API エンドポイントへの認証バイパス（tier1 軸）
  - cell_id: "threat_001"
    threat_class: spoofing
    threat_dimension_1: external_actor
    threat_dimension_2: api_endpoint
    threat_dimension_3: authentication
    threat_dimension_4: tier1
    mitigation_status: explicit_unreachable
    mitigation_reason: "全通信は mTLS 必須 (cross_http2 enforcement)。PeerAuthentication STRICT モードで Istio が全 workload 間通信を検証する"

  # cell_002: 外部攻撃者による API エンドポイントへの認証バイパス（security 軸）
  - cell_id: "threat_002"
    threat_class: spoofing
    threat_dimension_1: external_actor
    threat_dimension_2: api_endpoint
    threat_dimension_3: authentication
    threat_dimension_4: security
    mitigation_status: explicit_unreachable
    mitigation_reason: "Kyverno require-istio-strict-mtls ポリシーが全 workload に STRICT mTLS を強制する"

  # cell_003: 外部攻撃者によるデータストアへのなりすましアクセス
  - cell_id: "threat_003"
    threat_class: spoofing
    threat_dimension_1: external_actor
    threat_dimension_2: data_store
    threat_dimension_3: authentication
    threat_dimension_4: data
    mitigation_status: explicit_unreachable
    mitigation_reason: "PostgreSQL RLS により行レベルでアクセス制御する。OpenBao Transit で認証情報を管理し平文保存を禁止する"

  # cell_004: 内部攻撃者による鍵素材へのなりすましアクセス
  - cell_id: "threat_004"
    threat_class: spoofing
    threat_dimension_1: internal_actor
    threat_dimension_2: key_material
    threat_dimension_3: authentication
    threat_dimension_4: security
    mitigation_status: mitigated
    mitigation_reason: "OpenBao の RBAC policy (4 ロール) で鍵へのアクセスを最小権限に制限する。全操作は audit log に記録する"

  # cell_005: サプライチェーン攻撃による identity provider のなりすまし
  - cell_id: "threat_005"
    threat_class: spoofing
    threat_dimension_1: supply_chain
    threat_dimension_2: identity_provider
    threat_dimension_3: authentication
    threat_dimension_4: security
    mitigation_status: mitigated
    mitigation_reason: "Fulcio OIDC keyless signing + Rekor transparency log で署名の追跡可能性を保証する。Harbor admission で未署名 image を reject する"

  # --- Tampering (改ざん) 脅威 ---

  # cell_006: 外部攻撃者によるネットワーク転送データの改ざん
  - cell_id: "threat_006"
    threat_class: tampering
    threat_dimension_1: external_actor
    threat_dimension_2: network_transport
    threat_dimension_3: encryption
    threat_dimension_4: tier1
    mitigation_status: explicit_unreachable
    mitigation_reason: "全通信は TLS 1.3 + mTLS で保護される。HTTP/2 enforcement により平文通信は不可能"

  # cell_007: 内部攻撃者によるデータストアの改ざん
  - cell_id: "threat_007"
    threat_class: tampering
    threat_dimension_1: internal_actor
    threat_dimension_2: data_store
    threat_dimension_3: encryption
    threat_dimension_4: data
    mitigation_status: mitigated
    mitigation_reason: "pgaudit で全 DDL/DML を記録する。RLS により不正な行レベルアクセスを防止する。OpenBao Transit で保存時暗号化を実施する"

  # cell_008: サプライチェーン攻撃による API エンドポイントの改ざん
  - cell_id: "threat_008"
    threat_class: tampering
    threat_dimension_1: supply_chain
    threat_dimension_2: api_endpoint
    threat_dimension_3: authorization
    threat_dimension_4: tier1
    mitigation_status: mitigated
    mitigation_reason: "cosign image signature で全コンテナの integrity を検証する。Harbor で SBOM を管理し依存関係の追跡可能性を確保する"

  # cell_009: 自動化システムによる鍵素材の改ざん
  - cell_id: "threat_009"
    threat_class: tampering
    threat_dimension_1: automated_system
    threat_dimension_2: key_material
    threat_dimension_3: authorization
    threat_dimension_4: security
    mitigation_status: explicit_unreachable
    mitigation_reason: "OpenBao の allow_plaintext_backup=false で鍵のエクスポートを禁止する。鍵の変更は security ロールのみ許可する"

  # cell_010: ハードウェア障害による identity provider の改ざん
  - cell_id: "threat_010"
    threat_class: tampering
    threat_dimension_1: hardware_fault
    threat_dimension_2: identity_provider
    threat_dimension_3: availability
    threat_dimension_4: infra
    mitigation_status: accepted_with_assumption
    mitigation_reason: "HA 構成 (3 レプリカ) で single point of failure を排除する。ラック障害時は topology_class による自動 failover で対応する"

  # --- Repudiation (否認) 脅威 ---

  # cell_011: 外部攻撃者による API 操作の否認
  - cell_id: "threat_011"
    threat_class: repudiation
    threat_dimension_1: external_actor
    threat_dimension_2: api_endpoint
    threat_dimension_3: audit
    threat_dimension_4: tier1
    mitigation_status: explicit_unreachable
    mitigation_reason: "全 API 呼び出しは structured audit log に記録する。audit_event hash chain により改ざんを検知可能にする"

  # cell_012: 内部攻撃者によるデータ操作の否認
  - cell_id: "threat_012"
    threat_class: repudiation
    threat_dimension_1: internal_actor
    threat_dimension_2: data_store
    threat_dimension_3: audit
    threat_dimension_4: data
    mitigation_status: mitigated
    mitigation_reason: "pgaudit で全操作を記録する。audit_chain の hash 検証で否認攻撃に対応する。Rekor transparency log で公開証跡を残す"

  # cell_013: サプライチェーン攻撃によるネットワーク操作の否認
  - cell_id: "threat_013"
    threat_class: repudiation
    threat_dimension_1: supply_chain
    threat_dimension_2: network_transport
    threat_dimension_3: audit
    threat_dimension_4: security
    mitigation_status: mitigated
    mitigation_reason: "cosign に Rekor transparency log を使用し、全署名操作の追跡可能性を保証する"

  # cell_014: 自動化システムによる鍵操作の否認
  - cell_id: "threat_014"
    threat_class: repudiation
    threat_dimension_1: automated_system
    threat_dimension_2: key_material
    threat_dimension_3: audit
    threat_dimension_4: security
    mitigation_status: mitigated
    mitigation_reason: "OpenBao の audit backend で全 Transit 操作を記録する。audit_key (10年保持) で長期保存する"

  # cell_015: ハードウェア障害による操作ログの欠損（否認リスク）
  - cell_id: "threat_015"
    threat_class: repudiation
    threat_dimension_1: hardware_fault
    threat_dimension_2: data_store
    threat_dimension_3: audit
    threat_dimension_4: infra
    mitigation_status: accepted_with_assumption
    mitigation_reason: "Barman による PostgreSQL ポイントインタイムリカバリで audit log の保全を保証する。WAL アーカイブを別ストレージに保存する"

  # --- Information Disclosure (情報漏洩) 脅威 ---

  # cell_016: 外部攻撃者による API からの情報漏洩
  - cell_id: "threat_016"
    threat_class: information_disclosure
    threat_dimension_1: external_actor
    threat_dimension_2: api_endpoint
    threat_dimension_3: encryption
    threat_dimension_4: tier1
    mitigation_status: explicit_unreachable
    mitigation_reason: "全 API レスポンスは TLS 1.3 で暗号化される。エラーレスポンスからの情報漏洩は structured error handling で防止する"

  # cell_017: 内部攻撃者によるデータストアからの PII 漏洩
  - cell_id: "threat_017"
    threat_class: information_disclosure
    threat_dimension_1: internal_actor
    threat_dimension_2: data_store
    threat_dimension_3: encryption
    threat_dimension_4: data
    mitigation_status: mitigated
    mitigation_reason: "PostgreSQL RLS で行レベルアクセス制御する。PII データは pii_kek (90日ローテーション) で column-level 暗号化する"

  # cell_018: サプライチェーン攻撃による鍵素材の漏洩
  - cell_id: "threat_018"
    threat_class: information_disclosure
    threat_dimension_1: supply_chain
    threat_dimension_2: key_material
    threat_dimension_3: encryption
    threat_dimension_4: security
    mitigation_status: explicit_unreachable
    mitigation_reason: "OpenBao Transit は鍵の平文エクスポートを禁止する (exportable=false)。鍵素材は HSM 内にのみ存在する"

  # cell_019: 自動化システムによるネットワーク転送データの傍受
  - cell_id: "threat_019"
    threat_class: information_disclosure
    threat_dimension_1: automated_system
    threat_dimension_2: network_transport
    threat_dimension_3: encryption
    threat_dimension_4: tier1
    mitigation_status: explicit_unreachable
    mitigation_reason: "全通信は mTLS + TLS 1.3 で保護される。eBPF による network 監視で異常通信を検知する"

  # cell_020: ハードウェア障害による identity provider からの情報漏洩
  - cell_id: "threat_020"
    threat_class: information_disclosure
    threat_dimension_1: hardware_fault
    threat_dimension_2: identity_provider
    threat_dimension_3: encryption
    threat_dimension_4: security
    mitigation_status: accepted_with_assumption
    mitigation_reason: "Fulcio は OIDC token を保持しない (stateless)。hardware fault による情報漏洩リスクは Fulcio のアーキテクチャが軽減する"

  # --- Denial of Service (サービス妨害) 脅威 ---

  # cell_021: 外部攻撃者による API エンドポイントへの DDoS
  - cell_id: "threat_021"
    threat_class: denial_of_service
    threat_dimension_1: external_actor
    threat_dimension_2: api_endpoint
    threat_dimension_3: availability
    threat_dimension_4: tier1
    mitigation_status: mitigated
    mitigation_reason: "Istio rate limiting + topology_class による自動スケーリングで DDoS に対応する。PDB で最小レプリカ数を保証する"

  # cell_022: 内部攻撃者によるデータストアへのリソース枯渇攻撃
  - cell_id: "threat_022"
    threat_class: denial_of_service
    threat_dimension_1: internal_actor
    threat_dimension_2: data_store
    threat_dimension_3: availability
    threat_dimension_4: data
    mitigation_status: mitigated
    mitigation_reason: "PostgreSQL connection pooling (PgBouncer) でコネクション数を制限する。ResourceQuota で namespace レベルのリソース上限を設定する"

  # cell_023: サプライチェーン攻撃によるネットワーク転送への妨害
  - cell_id: "threat_023"
    threat_class: denial_of_service
    threat_dimension_1: supply_chain
    threat_dimension_2: network_transport
    threat_dimension_3: availability
    threat_dimension_4: infra
    mitigation_status: mitigated
    mitigation_reason: "cosign による image integrity 検証でマルウェア混入を防止する。NetworkPolicy で通信経路を制限する"

  # cell_024: 自動化システムによる鍵素材へのアクセス妨害
  - cell_id: "threat_024"
    threat_class: denial_of_service
    threat_dimension_1: automated_system
    threat_dimension_2: key_material
    threat_dimension_3: availability
    threat_dimension_4: security
    mitigation_status: mitigated
    mitigation_reason: "OpenBao HA (3 レプリカ + Raft) で鍵サービスの可用性を保証する。Transit キーは ephemeral から archive まで独立したバックアップで管理する"

  # cell_025: ハードウェア障害による identity provider の停止
  - cell_id: "threat_025"
    threat_class: denial_of_service
    threat_dimension_1: hardware_fault
    threat_dimension_2: identity_provider
    threat_dimension_3: availability
    threat_dimension_4: infra
    mitigation_status: accepted_with_assumption
    mitigation_reason: "Fulcio は Sigstore の managed service を使用する。SLA は Sigstore の公開 SLA に依存する。代替として self-hosted Fulcio を検討中"

  # --- Elevation of Privilege (特権昇格) 脅威 ---

  # cell_026: 外部攻撃者による API エンドポイントからの特権昇格
  - cell_id: "threat_026"
    threat_class: elevation_of_privilege
    threat_dimension_1: external_actor
    threat_dimension_2: api_endpoint
    threat_dimension_3: authorization
    threat_dimension_4: tier1
    mitigation_status: explicit_unreachable
    mitigation_reason: "Kyverno require-non-root-user で root での実行を禁止する。readOnlyRootFilesystem で container からの脱出を困難にする"

  # cell_027: 内部攻撃者による鍵素材からの特権昇格
  - cell_id: "threat_027"
    threat_class: elevation_of_privilege
    threat_dimension_1: internal_actor
    threat_dimension_2: key_material
    threat_dimension_3: authorization
    threat_dimension_4: security
    mitigation_status: mitigated
    mitigation_reason: "OpenBao の最小権限 RBAC ポリシー (4 ロール) で鍵へのアクセスを制限する。block-manual-secret-creation ポリシーで不正な Secret 作成を防止する"

  # cell_028: サプライチェーン攻撃による identity provider からの特権昇格
  - cell_id: "threat_028"
    threat_class: elevation_of_privilege
    threat_dimension_1: supply_chain
    threat_dimension_2: identity_provider
    threat_dimension_3: authorization
    threat_dimension_4: security
    mitigation_status: mitigated
    mitigation_reason: "Sigstore keyless signing で人間の鍵管理を排除する。SBOM + cosign で supply chain の追跡可能性を保証する"

  # cell_029: 自動化システムによるデータストアからの特権昇格
  - cell_id: "threat_029"
    threat_class: elevation_of_privilege
    threat_dimension_1: automated_system
    threat_dimension_2: data_store
    threat_dimension_3: authorization
    threat_dimension_4: data
    mitigation_status: mitigated
    mitigation_reason: "PostgreSQL RLS + pgaudit で行レベルアクセス制御と操作記録を実施する。ClickHouse は read-only replica を経由してのみアクセスする"

  # cell_030: ハードウェア障害によるネットワーク転送経由の特権昇格
  - cell_id: "threat_030"
    threat_class: elevation_of_privilege
    threat_dimension_1: hardware_fault
    threat_dimension_2: network_transport
    threat_dimension_3: authorization
    threat_dimension_4: infra
    mitigation_status: accepted_with_assumption
    mitigation_reason: "NIC ファームウェアの integrity は定期的な cosign 検証で確認する。ハードウェア障害による L2 攻撃は物理セキュリティで対応する"

  # cell_031: 外部攻撃者による tier2 API へのなりすまし
  - cell_id: "threat_031"
    threat_class: spoofing
    threat_dimension_1: external_actor
    threat_dimension_2: api_endpoint
    threat_dimension_3: authentication
    threat_dimension_4: tier2
    mitigation_status: explicit_unreachable
    mitigation_reason: "tier2 は tier1 SDK を経由してのみアクセス可能。mTLS は tier1 で強制される"

  # cell_032: 外部攻撃者による tier3 SPA へのなりすまし
  - cell_id: "threat_032"
    threat_class: spoofing
    threat_dimension_1: external_actor
    threat_dimension_2: api_endpoint
    threat_dimension_3: authentication
    threat_dimension_4: tier3
    mitigation_status: mitigated
    mitigation_reason: "tier3 SPA は OIDC/OAuth2 による認証を使用する。PKCE フローで CSRF 攻撃を防止する"

  # cell_033: 内部攻撃者による ops 軸監視システムへのなりすまし
  - cell_id: "threat_033"
    threat_class: spoofing
    threat_dimension_1: internal_actor
    threat_dimension_2: api_endpoint
    threat_dimension_3: authentication
    threat_dimension_4: ops
    mitigation_status: mitigated
    mitigation_reason: "Grafana / Alertmanager は mTLS + RBAC で保護する。ops ロール以上のみ alert rule を変更可能とする"

  # cell_034: 自動化システムによる formal 検証結果の改ざん
  - cell_id: "threat_034"
    threat_class: tampering
    threat_dimension_1: automated_system
    threat_dimension_2: data_store
    threat_dimension_3: authorization
    threat_dimension_4: formal
    mitigation_status: explicit_unreachable
    mitigation_reason: "formal proof は content-addressed (SHA-256 hash) で管理する。hash が一致しない proof は CI が reject する"

  # cell_035: 外部攻撃者による client SDK への改ざん
  - cell_id: "threat_035"
    threat_class: tampering
    threat_dimension_1: external_actor
    threat_dimension_2: network_transport
    threat_dimension_3: encryption
    threat_dimension_4: client
    mitigation_status: mitigated
    mitigation_reason: "SDK パッケージは cosign で署名する。配布は Harbor 経由で行い、未署名 SDK の使用を Kyverno が reject する"

  # cell_036: サプライチェーン攻撃による test framework の改ざん
  - cell_id: "threat_036"
    threat_class: tampering
    threat_dimension_1: supply_chain
    threat_dimension_2: api_endpoint
    threat_dimension_3: authorization
    threat_dimension_4: test
    mitigation_status: accepted_with_assumption
    mitigation_reason: "test framework の OSS 依存は SBOM で管理する。test 環境は production と完全に分離する。依存関係の更新は PR review で承認する"

  # cell_037: 外部攻撃者による tier1 データ転送の盗聴
  - cell_id: "threat_037"
    threat_class: information_disclosure
    threat_dimension_1: external_actor
    threat_dimension_2: network_transport
    threat_dimension_3: encryption
    threat_dimension_4: tier1
    mitigation_status: explicit_unreachable
    mitigation_reason: "全通信は TLS 1.3 で暗号化する。古い TLS バージョンは Istio で拒否する"

  # cell_038: 内部攻撃者による ops 軸メトリクスからの情報漏洩
  - cell_id: "threat_038"
    threat_class: information_disclosure
    threat_dimension_1: internal_actor
    threat_dimension_2: api_endpoint
    threat_dimension_3: authorization
    threat_dimension_4: ops
    mitigation_status: mitigated
    mitigation_reason: "Prometheus metrics は dev ロール以上の認証が必要。機密 label は metrics から除外する。NetworkPolicy で Prometheus へのアクセスを制限する"

  # cell_039: ハードウェア障害による client SDK データの漏洩
  - cell_id: "threat_039"
    threat_class: information_disclosure
    threat_dimension_1: hardware_fault
    threat_dimension_2: data_store
    threat_dimension_3: encryption
    threat_dimension_4: client
    mitigation_status: accepted_with_assumption
    mitigation_reason: "client デバイス上のデータは OS 提供の disk 暗号化で保護する。k1s0 SDK はデバイス固有の暗号化を追加で実施する"

  # cell_040: 自動化システムによる formal 証明データの盗取
  - cell_id: "threat_040"
    threat_class: information_disclosure
    threat_dimension_1: automated_system
    threat_dimension_2: data_store
    threat_dimension_3: encryption
    threat_dimension_4: formal
    mitigation_status: accepted_with_assumption
    mitigation_reason: "formal proof は公開リポジトリで管理する（機密情報を含まない）。proof の完全性は hash chain で保証する"

  # cell_041: 外部攻撃者による tier2 サービスへの DoS
  - cell_id: "threat_041"
    threat_class: denial_of_service
    threat_dimension_1: external_actor
    threat_dimension_2: api_endpoint
    threat_dimension_3: availability
    threat_dimension_4: tier2
    mitigation_status: mitigated
    mitigation_reason: "tier2 は tier1 の rate limiting で保護される。tier2 は直接外部に公開されない"

  # cell_042: 内部攻撃者による ops 軸アラートの抑制
  - cell_id: "threat_042"
    threat_class: denial_of_service
    threat_dimension_1: internal_actor
    threat_dimension_2: api_endpoint
    threat_dimension_3: availability
    threat_dimension_4: ops
    mitigation_status: mitigated
    mitigation_reason: "Alertmanager の設定変更は PR review + cosign sign を必須とする。alert ルールの削除は security ロールのみ許可する"

  # cell_043: サプライチェーン攻撃による infra コンポーネントへの DoS
  - cell_id: "threat_043"
    threat_class: denial_of_service
    threat_dimension_1: supply_chain
    threat_dimension_2: network_transport
    threat_dimension_3: availability
    threat_dimension_4: infra
    mitigation_status: mitigated
    mitigation_reason: "全インフラコンポーネントの image は Harbor + cosign で検証する。BGP/OSPF の topology は eBPF で監視する"

  # cell_044: ハードウェア障害による data 軸サービスの停止
  - cell_id: "threat_044"
    threat_class: denial_of_service
    threat_dimension_1: hardware_fault
    threat_dimension_2: data_store
    threat_dimension_3: availability
    threat_dimension_4: data
    mitigation_status: mitigated
    mitigation_reason: "PostgreSQL HA (Patroni) + Barman で自動フェイルオーバーと PITR を実装する。topology_class v1_multi_zone_per_cluster 以上を要求する"

  # cell_045: 自動化システムによる tier3 SPA への特権昇格
