# readOnlyRootFilesystem 必須化ポリシーのテストファイル
# kyverno test コマンドで実行する: kyverno test .
apiVersion: cli.kyverno.io/v1alpha1
# Kyverno CLI テストリソース定義
kind: Test
metadata:
  # テスト名称: readOnlyRootFilesystem 必須化の検証テスト
  name: readonly-root-fs-test
spec:
  # テスト対象のポリシーファイルパス
  policies:
    # readOnlyRootFilesystem ポリシーを参照する
    - ../policies/require-readonly-root-fs.yaml
  # テスト対象のリソースファイルパス
  resources:
    # テスト用リソースファイルを参照する
    - resources/readonly_root_fs_resources.yaml
  # テストケース定義
  results:
    # pass ケース: readOnlyRootFilesystem: true が設定されたコンテナを持つ Pod
    - policy: require-readonly-root-fs
      # readOnlyRootFilesystem 確認ルールを指定する
      rule: check-readonly-root-filesystem
      # テスト対象リソース名
      resource: pod-with-readonly-root-fs
      # 合格すること（この Pod は許可されるべき）
      result: pass
    # fail ケース: readOnlyRootFilesystem: false が設定されたコンテナを持つ Pod
    - policy: require-readonly-root-fs
      # readOnlyRootFilesystem 確認ルールを指定する
      rule: check-readonly-root-filesystem
      # テスト対象リソース名
      resource: pod-with-writable-root-fs
      # 失敗すること（この Pod は拒否されるべき）
      result: fail
    # fail ケース: readOnlyRootFilesystem が未設定のコンテナを持つ Pod
    - policy: require-readonly-root-fs
      # readOnlyRootFilesystem 確認ルールを指定する
      rule: check-readonly-root-filesystem
      # テスト対象リソース名
      resource: pod-without-readonly-setting
      # 失敗すること（この Pod は拒否されるべき）
      result: fail
