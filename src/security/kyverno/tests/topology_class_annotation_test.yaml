# topology-class annotation ポリシーのテストファイル
# kyverno test コマンドで実行する: kyverno test .
# pass/fail の両方のケースを含む
apiVersion: cli.kyverno.io/v1alpha1
# Kyverno CLI テストリソース定義
kind: Test
metadata:
  # テスト名称: topology-class annotation の検証テスト
  name: topology-class-annotation-test
spec:
  # テスト対象のポリシーファイルパス
  policies:
    # topology-class annotation ポリシーを参照する
    - ../policies/require-topology-class-annotation.yaml
  # テスト対象のリソースファイルパス
  resources:
    # テスト用リソースファイルを参照する
    - resources/topology_class_annotation_resources.yaml
  # テストケース定義
  results:
    # pass ケース 1: valid な topology-class annotation を持つ Pod
    - policy: require-topology-class-annotation
      # ルール名称を指定する
      rule: check-topology-class
      # テスト対象リソース名
      resource: pod-with-valid-topology-class
      # 合格すること（この Pod は許可されるべき）
      result: pass
    # pass ケース 2: v1_multi_zone_per_cluster annotation を持つ Pod
    - policy: require-topology-class-annotation
      # ルール名称を指定する
      rule: check-topology-class
      # テスト対象リソース名
      resource: pod-with-multi-zone-topology-class
      # 合格すること（この Pod は許可されるべき）
      result: pass
    # fail ケース 1: topology-class annotation がない Pod
    - policy: require-topology-class-annotation
      # ルール名称を指定する
      rule: check-topology-class
      # テスト対象リソース名
      resource: pod-without-topology-class
      # 失敗すること（この Pod は拒否されるべき）
      result: fail
    # fail ケース 2: 無効な topology-class 値を持つ Pod
    - policy: require-topology-class-annotation
      # ルール名称を指定する
      rule: check-topology-class
      # テスト対象リソース名
      resource: pod-with-invalid-topology-class
      # 失敗すること（この Pod は拒否されるべき）
      result: fail
