# Harbor レジストリからの image 取得必須化ポリシーのテストファイル
# kyverno test コマンドで実行する: kyverno test .
apiVersion: cli.kyverno.io/v1alpha1
# Kyverno CLI テストリソース定義
kind: Test
metadata:
  # テスト名称: Harbor image 取得必須化の検証テスト
  name: image-from-harbor-test
spec:
  # テスト対象のポリシーファイルパス
  policies:
    # Harbor image 必須化ポリシーを参照する
    - ../policies/require-image-from-harbor.yaml
  # テスト対象のリソースファイルパス
  resources:
    # テスト用リソースファイルを参照する
    - resources/image_from_harbor_resources.yaml
  # テストケース定義
  results:
    # pass ケース: harbor.k1s0.internal/ から取得する image を持つ Pod
    - policy: require-image-from-harbor
      # image レジストリ確認ルールを指定する
      rule: check-image-registry
      # テスト対象リソース名
      resource: pod-with-harbor-image
      # 合格すること（この Pod は許可されるべき）
      result: pass
    # fail ケース: Docker Hub から取得する image を持つ Pod
    - policy: require-image-from-harbor
      # image レジストリ確認ルールを指定する
      rule: check-image-registry
      # テスト対象リソース名
      resource: pod-with-dockerhub-image
      # 失敗すること（この Pod は拒否されるべき）
      result: fail
    # fail ケース: gcr.io から取得する image を持つ Pod
    - policy: require-image-from-harbor
      # image レジストリ確認ルールを指定する
      rule: check-image-registry
      # テスト対象リソース名
      resource: pod-with-gcr-image
      # 失敗すること（この Pod は拒否されるべき）
      result: fail
