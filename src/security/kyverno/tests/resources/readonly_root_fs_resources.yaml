# readOnlyRootFilesystem テスト用リソース定義ファイル
---
# テストリソース 1: readOnlyRootFilesystem: true が設定された Pod（pass ケース）
apiVersion: v1
# Pod リソース定義
kind: Pod
metadata:
  # Pod 名称: readOnly root FS を持つ pass ケース
  name: pod-with-readonly-root-fs
  # テスト用 namespace に配置する
  namespace: default
spec:
  containers:
    - name: test-container
      # テスト用 image を指定する
      image: harbor.k1s0.internal/k1s0/test:latest
      securityContext:
        # readOnlyRootFilesystem を true に設定する（pass ケース）
        readOnlyRootFilesystem: true
---
# テストリソース 2: readOnlyRootFilesystem: false が設定された Pod（fail ケース）
apiVersion: v1
# Pod リソース定義
kind: Pod
metadata:
  # Pod 名称: 書き込み可能な root FS を持つ fail ケース
  name: pod-with-writable-root-fs
  # テスト用 namespace に配置する
  namespace: default
spec:
  containers:
    - name: test-container
      # テスト用 image を指定する
      image: harbor.k1s0.internal/k1s0/test:latest
      securityContext:
        # readOnlyRootFilesystem を false に設定する（fail ケース、違反）
        readOnlyRootFilesystem: false
---
# テストリソース 3: readOnlyRootFilesystem が未設定の Pod（fail ケース）
apiVersion: v1
# Pod リソース定義
kind: Pod
metadata:
  # Pod 名称: readOnlyRootFilesystem 未設定の fail ケース
  name: pod-without-readonly-setting
  # テスト用 namespace に配置する
  namespace: default
spec:
  containers:
    - name: test-container
      # テスト用 image を指定する
      image: harbor.k1s0.internal/k1s0/test:latest
      # securityContext に readOnlyRootFilesystem を設定しない（違反ケース）
      securityContext:
        runAsNonRoot: true
