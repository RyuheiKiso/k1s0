# topology-class annotation テスト用リソース定義ファイル
# kyverno test コマンドで使用されるテスト用リソースを定義する
---
# テストリソース 1: 有効な topology-class annotation を持つ Pod（pass ケース）
apiVersion: v1
# Pod リソース定義
kind: Pod
metadata:
  # Pod 名称: single zone annotation を持つ pass ケース
  name: pod-with-valid-topology-class
  # テスト用 namespace に配置する
  namespace: default
  annotations:
    # 有効な topology-class annotation を設定する
    k1s0.io/topology-class: "v1_single_zone"
    # clock-integrity-class annotation も設定する（他ポリシー用）
    k1s0.io/clock-integrity-class: "v1_dc_chrony_stratum1"
spec:
  # テスト用コンテナ定義
  containers:
    - name: test-container
      # テスト用 image を指定する
      image: harbor.k1s0.internal/k1s0/test:latest
---
# テストリソース 2: multi-zone topology-class annotation を持つ Pod（pass ケース）
apiVersion: v1
# Pod リソース定義
kind: Pod
metadata:
  # Pod 名称: multi-zone annotation を持つ pass ケース
  name: pod-with-multi-zone-topology-class
  # テスト用 namespace に配置する
  namespace: default
  annotations:
    # 有効な topology-class annotation を設定する（multi-zone）
    k1s0.io/topology-class: "v1_multi_zone_per_cluster"
    # clock-integrity-class annotation も設定する
    k1s0.io/clock-integrity-class: "v1_intra_rack_ptp"
spec:
  # テスト用コンテナ定義
  containers:
    - name: test-container
      # テスト用 image を指定する
      image: harbor.k1s0.internal/k1s0/test:latest
---
# テストリソース 3: topology-class annotation がない Pod（fail ケース）
apiVersion: v1
# Pod リソース定義
kind: Pod
metadata:
  # Pod 名称: annotation なしの fail ケース
  name: pod-without-topology-class
  # テスト用 namespace に配置する
  namespace: default
  annotations:
    # topology-class annotation を意図的に省略する（違反ケース）
    k1s0.io/clock-integrity-class: "v1_dc_chrony_stratum1"
spec:
  # テスト用コンテナ定義
  containers:
    - name: test-container
      # テスト用 image を指定する
      image: harbor.k1s0.internal/k1s0/test:latest
---
# テストリソース 4: 無効な topology-class 値を持つ Pod（fail ケース）
apiVersion: v1
# Pod リソース定義
kind: Pod
metadata:
  # Pod 名称: 無効な annotation 値を持つ fail ケース
  name: pod-with-invalid-topology-class
  # テスト用 namespace に配置する
  namespace: default
  annotations:
    # 無効な topology-class 値を設定する（違反ケース）
    k1s0.io/topology-class: "v1_invalid_class"
    # clock-integrity-class annotation は設定する
    k1s0.io/clock-integrity-class: "v1_dc_chrony_stratum1"
spec:
  # テスト用コンテナ定義
  containers:
    - name: test-container
      # テスト用 image を指定する
      image: harbor.k1s0.internal/k1s0/test:latest
