# Harbor image テスト用リソース定義ファイル
---
# テストリソース 1: harbor.k1s0.internal/ image を持つ Pod（pass ケース）
apiVersion: v1
# Pod リソース定義
kind: Pod
metadata:
  # Pod 名称: Harbor image を持つ pass ケース
  name: pod-with-harbor-image
  # テスト用 namespace に配置する
  namespace: default
spec:
  containers:
    - name: test-container
      # Harbor レジストリからの image を指定する（pass ケース）
      image: harbor.k1s0.internal/k1s0-platform/app:v1.0.0
---
# テストリソース 2: Docker Hub image を持つ Pod（fail ケース）
apiVersion: v1
# Pod リソース定義
kind: Pod
metadata:
  # Pod 名称: Docker Hub image を持つ fail ケース
  name: pod-with-dockerhub-image
  # テスト用 namespace に配置する
  namespace: default
spec:
  containers:
    - name: test-container
      # Docker Hub からの image を指定する（fail ケース、違反）
      image: nginx:latest
---
# テストリソース 3: GCR image を持つ Pod（fail ケース）
apiVersion: v1
# Pod リソース定義
kind: Pod
metadata:
  # Pod 名称: GCR image を持つ fail ケース
  name: pod-with-gcr-image
  # テスト用 namespace に配置する
  namespace: default
spec:
  containers:
    - name: test-container
      # GCR からの image を指定する（fail ケース、違反）
      image: gcr.io/google-containers/pause:3.6
