# Pod Security Standards restricted ポリシーのテストファイル
# kyverno test コマンドで実行する: kyverno test .
apiVersion: cli.kyverno.io/v1alpha1
# Kyverno CLI テストリソース定義
kind: Test
metadata:
  # テスト名称: Pod Security Standards restricted の検証テスト
  name: pod-security-restricted-test
spec:
  # テスト対象のポリシーファイルパス
  policies:
    # Pod セキュリティ制限ポリシーを参照する
    - ../policies/require-pod-security-restricted.yaml
  # テスト対象のリソースファイルパス
  resources:
    # テスト用リソースファイルを参照する
    - resources/pod_security_resources.yaml
  # テストケース定義
  results:
    # pass ケース: runAsNonRoot: true が設定された Pod
    - policy: require-pod-security-restricted
      # 非 root ユーザー確認ルールを指定する
      rule: check-run-as-non-root
      # テスト対象リソース名
      resource: pod-with-non-root
      # 合格すること（この Pod は許可されるべき）
      result: pass
    # fail ケース: runAsNonRoot が設定されていない Pod
    - policy: require-pod-security-restricted
      # 非 root ユーザー確認ルールを指定する
      rule: check-run-as-non-root
      # テスト対象リソース名
      resource: pod-without-non-root
      # 失敗すること（この Pod は拒否されるべき）
      result: fail
    # fail ケース: privileged コンテナを持つ Pod
    - policy: require-pod-security-restricted
      # privileged コンテナ禁止ルールを指定する
      rule: block-privileged-containers
      # テスト対象リソース名
      resource: pod-with-privileged-container
      # 失敗すること（この Pod は拒否されるべき）
      result: fail
