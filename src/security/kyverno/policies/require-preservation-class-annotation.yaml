# Policy 10: PVC preservation-class annotation 必須化ポリシー
# PVC に k1s0.io/preservation-class annotation が設定されていない場合を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: preservation-class annotation の要求
  name: require-preservation-class-annotation
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.data.preservation_class_conformance
    # ポリシーの説明
    policies.kyverno.io/description: "PVC に k1s0.io/preservation-class annotation を必須化する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを有効化して既存リソースも検証する
  background: true
  rules:
    # ルール名称: preservation-class annotation の確認
    - name: check-preservation-class-annotation
      # 適用対象: PersistentVolumeClaim リソース
      match:
        any:
          - resources:
              kinds:
                # PVC リソースに適用する
                - PersistentVolumeClaim
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # Kubernetes システム namespace を除外
                - kube-system
                # cert-manager namespace を除外
                - cert-manager
      # preservation-class annotation の検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "PVC には k1s0.io/preservation-class annotation が必須です"
        # preservation-class annotation が設定されているかを確認するパターン
        pattern:
          metadata:
            annotations:
              # preservation-class annotation が任意の値で存在することを確認する
              k1s0.io/preservation-class: "?*"
