# Policy 27: release gate dual sign-off 確認ポリシー
# ConfigMap k1s0-release-gate の dual_signoff_complete が "true" でない場合を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: release gate dual sign-off の確認
  name: require-release-gate-dual-signoff
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.release_gate_dual_signoff_conformance
    # ポリシーの説明
    policies.kyverno.io/description: "release gate dual_signoff_complete が true でない場合 reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを無効化（admission 時のみ検証）
  background: false
  rules:
    # ルール名称: dual sign-off 完了状態の確認
    - name: check-dual-signoff-complete
      # 適用対象: k1s0.io/release: "true" ラベルを持つ Deployment/Pod リソース
      match:
        any:
          - resources:
              kinds:
                # Pod リソースに適用する
                - Pod
                # Deployment リソースに適用する
                - Deployment
              selector:
                matchLabels:
                  # release ラベルが true のリソースのみ対象とする
                  k1s0.io/release: "true"
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # Kubernetes システム namespace を除外
                - kube-system
      # dual sign-off 完了状態の検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "dual sign-off が完了していません。human author × 1 + ai_static_analysis evidence × 1 の二重 sign-off を完了してください"
        # ConfigMap の dual sign-off 状態を参照して検証する
        deny:
          conditions:
            any:
              # k1s0-release-gate ConfigMap の dual_signoff_complete が true でない場合は拒否する
              - key: "{{ configmap('k1s0-release-gate', 'kube-system').data.dual_signoff_complete }}"
                operator: NotEquals
                # true でない場合は拒否する
                value: "true"
