# tier1 AuthClass 必須 policy
# tier1 service の spec.authClass フィールドが設定されていることを enforce する
# 04_認証適合仕様.md §authClass 必須化 に準拠する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: tier1 AuthClass 必須化
  name: tier1-auth-class-required
  annotations:
    # 対応する tier1 適合仕様 spec_id
    k1s0.io/spec-id: detail.tier1.auth_conformance
    # ポリシーの説明
    policies.kyverno.io/description: "tier1 Tier1Service リソースに spec.authClass フィールドが必須であることを enforce する (04_認証適合仕様)"
spec:
  # Enforce モード: 違反リソースの作成・更新を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを有効化して既存リソースも検証する
  background: true
  rules:
    # ルール名称: authClass フィールドの必須化
    - name: require-auth-class
      # 適用対象: Tier1Service カスタムリソース
      match:
        any:
          - resources:
              kinds:
                # Tier1Service リソースに適用する
                - Tier1Service
      # authClass フィールドの検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "tier1: spec.authClass は必須フィールドです (04_認証適合仕様)"
        # authClass フィールドが任意の非空文字列で存在することを確認するパターン
        pattern:
          spec:
            # authClass が空でない文字列であることを検証する
            authClass: "?*"
