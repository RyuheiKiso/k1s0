# Policy 22: 手動 Secret 作成禁止ポリシー
# OpenBao operator service account 以外による Secret 作成を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: 手動 Secret 作成の禁止
  name: block-manual-secret-creation
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.secret_lifecycle_management
    # ポリシーの説明
    policies.kyverno.io/description: "OpenBao operator 以外による Secret 作成を reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを無効化（admission 時のみ検証）
  background: false
  rules:
    # ルール名称: Secret 作成者の確認
    - name: check-secret-creator
      # 適用対象: Secret リソースの作成操作
      match:
        any:
          - resources:
              kinds:
                # Secret リソースに適用する
                - Secret
            # 作成操作のみ対象とする
            subjects:
              - kind: User
                # 全ユーザーを対象とする（OpenBao SA は除外で対応する）
                name: "*"
      # 除外対象: OpenBao operator の service account は除外する
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # Kubernetes システム namespace を除外
                - kube-system
          # OpenBao operator の service account は Secret 作成を許可する
          - subjects:
              - kind: ServiceAccount
                # OpenBao operator SA を除外する
                name: "openbao-operator"
                namespace: "openbao"
      # Secret 作成者の検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "Secret の手動作成は禁止されています。OpenBao Transit を経由して Secret を管理してください"
        # OpenBao operator によって管理されていることを示す annotation の確認
        pattern:
          metadata:
            annotations:
              # OpenBao によって管理されていることを確認する
              k1s0.io/managed-by-openbao: "true"
