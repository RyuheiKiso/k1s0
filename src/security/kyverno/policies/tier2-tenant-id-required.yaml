# tier2 テナント ID 注入 policy
# AuthContext からのみ tenant_id を取得し、API 引数での受け渡しを禁止する
apiVersion: kyverno.io/v1
# Kyverno ClusterPolicy リソース宣言
kind: ClusterPolicy
metadata:
  # ポリシー名: tier2 テナント ID 直接指定禁止
  name: tier2-tenant-id-required
  annotations:
    # このポリシーが対応する適合仕様の spec-id を記載する
    k1s0.io/spec-id: detail.tier2.tenant_isolation_conformance
    # このポリシーが対応する適合仕様の説明
    k1s0.io/description: tier2 テナント ID は AuthContext 経由のみ取得可能
spec:
  # ポリシー違反時は監査ログに記録する (段階的に Enforce に移行)
  validationFailureAction: Audit
  # バックグラウンドスキャンを有効にする
  background: true
  rules:
    # ルール名: annotation への tenant_id 直書き禁止
    - name: deny-tenant-id-in-annotations
      # tier2 の Pod/Deployment/StatefulSet を対象とする
      match:
        any:
          - resources:
              # 対象リソース種別を列挙する
              kinds: [Pod, Deployment, StatefulSet]
              # tier2 名前空間パターンに一致するものを対象とする
              namespaces: ["tier2-*"]
      validate:
        # tenant_id を API annotations に直接書くことを禁止する
        message: "tier2: tenant_id を annotation に書くことは禁止です (AuthContext 経由必須)"
        deny:
          conditions:
            any:
              # k1s0.io/tenant-id annotation が空でない場合は拒否する
              - key: "{{ request.object.metadata.annotations.\"k1s0.io/tenant-id\" || '' }}"
                operator: NotEquals
                value: ""
