# Policy 26: release gate cosign 署名確認ポリシー
# ConfigMap k1s0-release-gate の cosign_signed が "true" でない場合を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: release gate cosign 署名の確認
  name: require-release-gate-cosign-signed
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.release_gate_cosign_conformance
    # ポリシーの説明
    policies.kyverno.io/description: "release gate cosign_signed が true でない場合 reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを無効化（admission 時のみ検証）
  background: false
  rules:
    # ルール名称: cosign 署名状態の確認
    - name: check-cosign-signed-status
      # 適用対象: k1s0.io/release: "true" ラベルを持つ Deployment リソース
      match:
        any:
          - resources:
              kinds:
                # Pod リソースに適用する
                - Pod
                # Deployment リソースに適用する
                - Deployment
              selector:
                matchLabels:
                  # release ラベルが true のリソースのみ対象とする
                  k1s0.io/release: "true"
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # Kubernetes システム namespace を除外
                - kube-system
      # cosign 署名状態の検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "release gate に cosign 署名が必要です。GitHub Actions OIDC による cosign keyless signing を完了してください"
        # ConfigMap の cosign 署名状態を参照して検証する
        deny:
          conditions:
            any:
              # k1s0-release-gate ConfigMap の cosign_signed が true でない場合は拒否する
              - key: "{{ configmap('k1s0-release-gate', 'kube-system').data.cosign_signed }}"
                operator: NotEquals
                # true でない場合は拒否する
                value: "true"
