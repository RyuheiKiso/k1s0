# Policy 16: ディメンション上書き防止ポリシー
# src/ 以外への k1s0 workload 配置および無効な軸名ラベルを拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: ディメンション上書き阻止
  name: block-dimension-override
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.dimension_override_gate
    # ポリシーの説明
    policies.kyverno.io/description: "無効な k1s0.io/axis ラベルを持つ workload を reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを有効化して既存リソースも検証する
  background: true
  rules:
    # ルール名称: k1s0.io/axis ラベルの有効値確認
    - name: check-valid-axis-label
      # 適用対象: k1s0.io/axis ラベルを持つ Pod リソース
      match:
        any:
          - resources:
              kinds:
                # Pod リソースに適用する
                - Pod
              selector:
                matchExpressions:
                  # k1s0.io/axis ラベルが存在する Pod のみ対象とする
                  - key: "k1s0.io/axis"
                    operator: Exists
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # Kubernetes システム namespace を除外
                - kube-system
      # axis ラベル値の検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "k1s0.io/axis ラベルは有効な軸名でなければなりません。許可値: tier1|tier2|tier3|security|ops|client|infra|data|formal|test|crosscutting|meta"
        # 許可された軸名のパターン
        pattern:
          metadata:
            labels:
              # 有効な軸名のみ許可する
              k1s0.io/axis: "tier1|tier2|tier3|security|ops|client|infra|data|formal|test|crosscutting|meta"
