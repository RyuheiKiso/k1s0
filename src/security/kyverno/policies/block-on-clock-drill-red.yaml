# Policy 12: クロックドリル中 deploy 拒否ポリシー
# ConfigMap k1s0-drill-status の clock_drill_status が "red" のとき deploy を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: クロックドリル中の deploy 阻止
  name: block-on-clock-drill-red
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.infra.clock_drill_gate
    # ポリシーの説明
    policies.kyverno.io/description: "clock_drill_status が red のとき deploy を reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを無効化（admission 時のみ検証）
  background: false
  rules:
    # ルール名称: クロックドリル状態の確認
    - name: check-clock-drill-status
      # 適用対象: Pod/Deployment/StatefulSet リソース
      match:
        any:
          - resources:
              kinds:
                # Pod リソースに適用する
                - Pod
                # Deployment リソースに適用する
                - Deployment
                # StatefulSet リソースに適用する
                - StatefulSet
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # Kubernetes システム namespace を除外
                - kube-system
      # クロックドリル状態の検証ルール（ConfigMap から状態を参照する）
      validate:
        # 違反時のエラーメッセージ
        message: "クロックドリル実行中（red）は deploy できません。ドリル完了後に再試行してください"
        # ConfigMap のドリル状態を参照して検証する
        deny:
          conditions:
            all:
              # k1s0-drill-status ConfigMap の clock_drill_status が red か確認する
              - key: "{{ configmap('k1s0-drill-status', 'kube-system').data.clock_drill_status }}"
                # red 状態の場合は拒否する
                operator: Equals
                value: "red"
