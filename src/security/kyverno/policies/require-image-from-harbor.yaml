# Policy 21: Harbor レジストリからの image 取得必須化ポリシー
# image が harbor.k1s0.internal/ で始まらない場合を拒否する（system namespace 除く）
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: Harbor レジストリからの image 要求
  name: require-image-from-harbor
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.harbor_image_required
    # ポリシーの説明
    policies.kyverno.io/description: "harbor.k1s0.internal/ 以外からの image を reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを有効化して既存リソースも検証する
  background: true
  rules:
    # ルール名称: image レジストリの確認
    - name: check-image-registry
      # 適用対象: Pod リソース
      match:
        any:
          - resources:
              kinds:
                # Pod リソースに適用する
                - Pod
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # Kubernetes システム namespace を除外
                - kube-system
                # cert-manager namespace を除外
                - cert-manager
                # istio-system namespace を除外
                - istio-system
                # monitoring namespace を除外
                - monitoring
      # image レジストリの検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "image は harbor.k1s0.internal/ レジストリから取得する必要があります"
        # 全コンテナの image が Harbor から取得されることを確認するパターン
        pattern:
          spec:
            containers:
              - image: "harbor.k1s0.internal/*"
