# Policy 25: release gate green 確認ポリシー
# ConfigMap k1s0-release-gate の status が "green" 以外の場合、release ラベル付き workload を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: release gate の green 確認
  name: require-release-gate-green
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.release_gate_conformance
    # ポリシーの説明
    policies.kyverno.io/description: "release gate が green でない場合、release ラベル付き workload を reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを無効化（admission 時のみ検証）
  background: false
  rules:
    # ルール名称: release gate の状態確認
    - name: check-release-gate-status
      # 適用対象: k1s0.io/release: "true" ラベルを持つ Pod/Deployment リソース
      match:
        any:
          - resources:
              kinds:
                # Pod リソースに適用する
                - Pod
                # Deployment リソースに適用する
                - Deployment
              selector:
                matchLabels:
                  # release ラベルが true のリソースのみ対象とする
                  k1s0.io/release: "true"
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # Kubernetes システム namespace を除外
                - kube-system
      # release gate 状態の検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "release gate が green ではありません。全 19 軸の AND-gate が green になるまで release ラベル付き workload はデプロイできません"
        # ConfigMap の release gate 状態を参照して検証する
        deny:
          conditions:
            any:
              # k1s0-release-gate ConfigMap の status が green でない場合は拒否する
              - key: "{{ configmap('k1s0-release-gate', 'kube-system').data.status }}"
                operator: NotEquals
                # green 以外の場合は拒否する
                value: "green"
