# Policy 3: NetworkPolicy 必須化ポリシー
# NetworkPolicy が設定されていない namespace への workload 配置を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: NetworkPolicy の要求
  name: require-network-policy
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.network_policy_required
    # ポリシーの説明
    policies.kyverno.io/description: "NetworkPolicy のない namespace への Pod 配置を reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを無効化（admission 時のみ検証）
  background: false
  rules:
    # ルール名称: NetworkPolicy 存在の確認
    - name: check-network-policy-exists
      # 適用対象: Pod リソース
      match:
        any:
          - resources:
              kinds:
                # Pod リソースに適用する
                - Pod
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # cert-manager namespace を除外
                - cert-manager
                # Kubernetes システム namespace を除外
                - kube-system
                # monitoring namespace を除外
                - monitoring
      # NetworkPolicy 存在確認の検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "この namespace には NetworkPolicy が必要です。NetworkPolicy を作成してから workload をデプロイしてください"
        # Kyverno の context を使って同一 namespace の NetworkPolicy を確認する
        deny:
          conditions:
            all:
              # 当該 namespace に NetworkPolicy が存在するかどうかを確認する
              - key: "{{ networkpolicies(namespace).items | length(@) }}"
                # NetworkPolicy が 0 件の場合は拒否する
                operator: Equals
                value: 0
