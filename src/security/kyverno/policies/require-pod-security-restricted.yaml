# Policy 2: Pod Security Standards restricted レベル enforcement ポリシー
# Kubernetes Pod Security Standards の restricted レベルを強制する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: Pod セキュリティ制限の要求
  name: require-pod-security-restricted
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.pod_security_restricted
    # ポリシーの説明
    policies.kyverno.io/description: "Pod Security Standards restricted レベルを enforce する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを有効化して既存リソースも検証する
  background: true
  rules:
    # ルール名称: 非 root ユーザー実行の確認
    - name: check-run-as-non-root
      # 適用対象: Pod リソース
      match:
        any:
          - resources:
              kinds:
                # Pod リソースに適用する
                - Pod
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # cert-manager namespace を除外
                - cert-manager
                # Kubernetes システム namespace を除外
                - kube-system
      # Pod セキュリティコンテキストの検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "Pod は runAsNonRoot: true を設定する必要があります"
        # 必須パターン: Pod レベルで非 root 実行を宣言する
        pattern:
          spec:
            securityContext:
              # root ユーザーでの実行を禁止する
              runAsNonRoot: true
    # ルール名称: 特権コンテナの拒否
    - name: block-privileged-containers
      # 適用対象: Pod リソース
      match:
        any:
          - resources:
              kinds:
                # Pod リソースに適用する
                - Pod
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # Kubernetes システム namespace を除外
                - kube-system
      # 特権コンテナの検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "privileged container は使用できません"
        # 必須パターン: privileged を false に設定するか未設定とする
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.containers[].securityContext.privileged }}"
                # privileged: true のコンテナを拒否する
                operator: AnyIn
                value:
                  - true
