# Policy 4: Istio Strict mTLS 必須化ポリシー
# PeerAuthentication STRICT mTLS が設定されていない workload を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: Istio Strict mTLS の要求
  name: require-istio-strict-mtls
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.istio_strict_mtls
    # ポリシーの説明
    policies.kyverno.io/description: "Istio PeerAuthentication STRICT mTLS が設定されていない workload を reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを無効化（admission 時のみ検証）
  background: false
  rules:
    # ルール名称: mTLS アノテーションの確認
    - name: check-mtls-annotation
      # 適用対象: Pod リソース（Istio sidecar が注入されるリソース）
      match:
        any:
          - resources:
              kinds:
                # Pod リソースに適用する
                - Pod
              # Istio sidecar が注入されたリソースのみ対象とする
              selector:
                matchLabels:
                  istio-injection: enabled
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # cert-manager namespace を除外
                - cert-manager
                # Kubernetes システム namespace を除外
                - kube-system
                # istio-system namespace を除外
                - istio-system
      # mTLS 設定の検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "Istio STRICT mTLS が要求されます。PeerAuthentication を STRICT モードで設定してください"
        # mTLS 設定アノテーションの確認パターン
        pattern:
          metadata:
            annotations:
              # Istio mTLS モードが STRICT であることを確認する
              k1s0.io/mtls-mode: "STRICT"
    # ルール名称: PeerAuthentication リソースの STRICT モード検証
    - name: validate-peer-authentication-mode
      # 適用対象: Istio PeerAuthentication リソース
      match:
        any:
          - resources:
              kinds:
                # Istio PeerAuthentication リソースに適用する
                - PeerAuthentication
      # PeerAuthentication の mTLS モード検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "PeerAuthentication は STRICT モードを設定する必要があります"
        # STRICT モードのパターン
        pattern:
          spec:
            mtls:
              # STRICT モードのみ許可する
              mode: STRICT
