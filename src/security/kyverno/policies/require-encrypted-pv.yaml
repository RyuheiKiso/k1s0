# Policy 17: 暗号化 PV 必須化ポリシー
# StorageClass が k1s0-encrypted でない PVC を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: 暗号化 StorageClass の要求
  name: require-encrypted-pv
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.encrypted_storage_required
    # ポリシーの説明
    policies.kyverno.io/description: "k1s0-encrypted StorageClass でない PVC を reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを有効化して既存リソースも検証する
  background: true
  rules:
    # ルール名称: 暗号化 StorageClass の確認
    - name: check-encrypted-storage-class
      # 適用対象: PersistentVolumeClaim リソース
      match:
        any:
          - resources:
              kinds:
                # PVC リソースに適用する
                - PersistentVolumeClaim
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # Kubernetes システム namespace を除外
                - kube-system
                # cert-manager namespace を除外
                - cert-manager
      # StorageClass の検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "PVC は k1s0-encrypted StorageClass を使用する必要があります"
        # k1s0-encrypted StorageClass の使用を確認するパターン
        pattern:
          spec:
            # 暗号化 StorageClass のみ許可する
            storageClassName: "k1s0-encrypted"
