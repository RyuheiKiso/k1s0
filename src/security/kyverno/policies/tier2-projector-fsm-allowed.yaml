# tier2 Projector FSM 許可 policy
# CQRS Projector の FSM 状態遷移を Kyverno で監査する
apiVersion: kyverno.io/v1
# Kyverno ClusterPolicy リソース宣言
kind: ClusterPolicy
metadata:
  # ポリシー名: tier2 Projector FSM 状態許可
  name: tier2-projector-fsm-allowed
  annotations:
    # このポリシーが対応する適合仕様の spec-id を記載する
    k1s0.io/spec-id: detail.tier2.tenant_isolation_conformance
spec:
  # ポリシー違反時は監査ログに記録する (段階的に Enforce に移行)
  validationFailureAction: Audit
  # バックグラウンドスキャンを有効にする
  background: true
  rules:
    # ルール名: Projector 状態 annotation 検証
    - name: validate-projector-state-annotation
      # tier2 の Projector コンポーネントラベルを持つ Deployment を対象とする
      match:
        any:
          - resources:
              # 対象リソース種別: Deployment のみ
              kinds: [Deployment]
              # tier2 名前空間パターンに一致するものを対象とする
              namespaces: ["tier2-*"]
              selector:
                matchLabels:
                  # Projector コンポーネントラベルが付いたリソースのみを対象とする
                  k1s0.io/component: projector
      validate:
        # projector-state annotation が許可値以外の場合はエラーメッセージを返す
        message: "tier2 Projector: k1s0.io/projector-state annotation は required|projecting|idle のいずれか"
        pattern:
          metadata:
            annotations:
              # 許可される Projector FSM 状態値を列挙する
              k1s0.io/projector-state: "required|projecting|idle"
