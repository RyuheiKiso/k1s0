# Policy 5: topologySpreadConstraints 必須化ポリシー
# Deployment に topologySpreadConstraints が設定されていない場合を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: トポロジー分散制約の要求
  name: require-topology-spread
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.infra.cluster_topology_conformance
    # ポリシーの説明
    policies.kyverno.io/description: "topologySpreadConstraints がない Deployment を reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを有効化して既存リソースも検証する
  background: true
  rules:
    # ルール名称: topologySpreadConstraints の存在確認
    - name: check-topology-spread-constraints
      # 適用対象: Deployment リソース
      match:
        any:
          - resources:
              kinds:
                # Deployment リソースに適用する
                - Deployment
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # cert-manager namespace を除外
                - cert-manager
                # Kubernetes システム namespace を除外
                - kube-system
      # topologySpreadConstraints の検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "Deployment には topologySpreadConstraints の設定が必要です"
        # topologySpreadConstraints が設定されているかを確認するパターン
        deny:
          conditions:
            all:
              # topologySpreadConstraints が未設定（空配列または null）の場合は拒否する
              - key: "{{ request.object.spec.template.spec.topologySpreadConstraints | length(@) }}"
                # 1 件以上の制約が必要
                operator: LessThan
                value: 1
