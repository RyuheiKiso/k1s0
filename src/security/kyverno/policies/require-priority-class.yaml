# Policy 23: priorityClassName 必須化ポリシー
# priorityClassName が未設定の Deployment/StatefulSet を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: priorityClassName の要求
  name: require-priority-class
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.infra.workload_priority_conformance
    # ポリシーの説明
    policies.kyverno.io/description: "priorityClassName が未設定の Deployment/StatefulSet を reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを有効化して既存リソースも検証する
  background: true
  rules:
    # ルール名称: priorityClassName の確認
    - name: check-priority-class-name
      # 適用対象: Deployment/StatefulSet リソース
      match:
        any:
          - resources:
              kinds:
                # Deployment リソースに適用する
                - Deployment
                # StatefulSet リソースに適用する
                - StatefulSet
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # Kubernetes システム namespace を除外
                - kube-system
                # cert-manager namespace を除外
                - cert-manager
      # priorityClassName の検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "Deployment/StatefulSet には priorityClassName の設定が必要です。有効な PriorityClass を設定してください"
        # priorityClassName が設定されているかを確認するパターン
        pattern:
          spec:
            template:
              spec:
                # priorityClassName が任意の値で設定されていることを確認する
                priorityClassName: "?*"
