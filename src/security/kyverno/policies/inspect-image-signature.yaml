# Policy 1: cosign image signature 検証ポリシー
# cosign による署名が存在しない Pod の image は起動を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: image の cosign 署名検証
  name: inspect-image-signature
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.cosign_image_signature
    # ポリシーの説明
    policies.kyverno.io/description: "cosign signature がない Pod image を reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを無効化（admission 時のみ検証）
  background: false
  rules:
    # ルール名称: image 署名の確認
    - name: check-image-signature
      # 適用対象: Pod リソース
      match:
        any:
          - resources:
              kinds:
                # Pod リソースに適用する
                - Pod
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # cert-manager namespace を除外
                - cert-manager
                # Kubernetes システム namespace を除外
                - kube-system
      # image 署名の検証ルール定義
      verifyImages:
        # 全コンテナの image を検証対象とする
        - imageReferences:
            - "harbor.k1s0.internal/*"
          # cosign による image 署名を必須とする
          required: true
          # cosign の attestor 設定
          attestors:
            - count: 1
              entries:
                - keyless:
                    # Fulcio OIDC keyless 署名を使用する
                    issuer: "https://github.com/login/oauth"
                    # k1s0.io ドメインの subject を要求する
                    subject: ".*@k1s0.io"
                    # Sigstore の transparency log (Rekor) を利用する
                    rekor:
                      url: https://rekor.sigstore.dev
