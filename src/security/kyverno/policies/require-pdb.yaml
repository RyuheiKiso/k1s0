# Policy 6: PodDisruptionBudget 必須化ポリシー
# PodDisruptionBudget がない Deployment の作成・更新を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: PodDisruptionBudget の要求
  name: require-pdb
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.infra.cluster_topology_conformance
    # ポリシーの説明
    policies.kyverno.io/description: "PodDisruptionBudget がない Deployment を reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを有効化して既存リソースも検証する
  background: true
  rules:
    # ルール名称: PDB 存在の確認
    - name: check-pdb-exists
      # 適用対象: Deployment リソース
      match:
        any:
          - resources:
              kinds:
                # Deployment リソースに適用する
                - Deployment
      # 除外対象: system namespace は enforcement 対象外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # cert-manager namespace を除外
                - cert-manager
                # Kubernetes システム namespace を除外
                - kube-system
      # PDB 存在確認の検証ルール
      validate:
        # 違反時のエラーメッセージ
        message: "Deployment には対応する PodDisruptionBudget が必要です。PDB を先に作成してください"
        # PDB アノテーションの確認パターン
        deny:
          conditions:
            all:
              # PDB が存在することを示すアノテーションの確認
              - key: "{{ request.object.metadata.annotations.\"k1s0.io/pdb-name\" || '' }}"
                # PDB 参照アノテーションが空の場合は拒否する
                operator: Equals
                value: ""
