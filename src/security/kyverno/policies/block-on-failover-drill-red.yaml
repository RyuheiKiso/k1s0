# Policy 11: フェイルオーバードリル中 deploy 拒否ポリシー
# FAILOVER_DRILL_STATUS が "red" のときに deploy を拒否する
apiVersion: kyverno.io/v1
# ClusterPolicy はクラスタ全体に適用されるポリシーリソース
kind: ClusterPolicy
metadata:
  # ポリシー名称: フェイルオーバードリル中の deploy 阻止
  name: block-on-failover-drill-red
  annotations:
    # このポリシーが準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.ops.failover_drill_gate
    # ポリシーの説明
    policies.kyverno.io/description: "FAILOVER_DRILL_STATUS が red のとき deploy を reject する"
spec:
  # Enforce モード: 違反リソースの作成を拒否する
  validationFailureAction: Enforce
  # バックグラウンドスキャンを無効化（admission 時のみ検証）
  background: false
  rules:
    # ルール名称: フェイルオーバードリル状態の確認
    - name: check-failover-drill-status
      # 適用対象: Pod/Deployment/StatefulSet リソース
      match:
        any:
          - resources:
              kinds:
                # Pod リソースに適用する
                - Pod
                # Deployment リソースに適用する
                - Deployment
                # StatefulSet リソースに適用する
                - StatefulSet
      # 除外対象: drill-bypass annotation がある場合は除外
      exclude:
        any:
          - resources:
              namespaces:
                # Kyverno 自身の namespace を除外
                - kyverno
                # Kubernetes システム namespace を除外
                - kube-system
              # ドリルバイパス annotation が設定されたリソースを除外する
              selector:
                matchLabels:
                  k1s0.io/drill-bypass: "true"
          - resources:
              annotations:
                # drill-bypass annotation で明示的に除外する
                k1s0.io/drill-bypass: "true"
      # ドリル状態の検証ルール（ConfigMap から状態を参照する）
      validate:
        # 違反時のエラーメッセージ
        message: "フェイルオーバードリル中（red）は deploy できません。ドリル完了後に再試行するか k1s0.io/drill-bypass: 'true' annotation を付与してください"
        # ConfigMap のドリル状態を参照して検証する
        deny:
          conditions:
            all:
              # k1s0-drill-status ConfigMap の failover_drill_status が red か確認する
              - key: "{{ configmap('k1s0-drill-status', 'kube-system').data.failover_drill_status }}"
                # red 状態の場合は拒否する
                operator: Equals
                value: "red"
