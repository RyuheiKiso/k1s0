# Harbor v2.10 コンテナレジストリ install manifest
# Harbor は k1s0 システムの内部 image registry として使用する
apiVersion: v1
# Namespace リソース定義
kind: Namespace
metadata:
  # Harbor が動作する専用 namespace
  name: harbor
  labels:
    # k1s0 管理対象であることを示すラベル
    k1s0.io/managed-by: k1s0-security
  annotations:
    # この namespace が準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.harbor_install
---
# Harbor のバージョンと install コマンドを管理する ConfigMap
apiVersion: v1
# ConfigMap リソース定義
kind: ConfigMap
metadata:
  # ConfigMap 名称: Harbor のバージョン情報と install コマンド
  name: harbor-version
  # harbor namespace に配置する
  namespace: harbor
  labels:
    # k1s0 管理対象であることを示すラベル
    k1s0.io/managed-by: k1s0-security
  annotations:
    # この ConfigMap が準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.harbor_install
data:
  # インストールする Harbor のバージョン番号
  version: "v2.10.0"
  # 使用する Helm chart のバージョン番号
  helm_chart_version: "1.14.0"
  # Helm リポジトリを追加するためのコマンド
  repo_add_command: "helm repo add harbor https://helm.goharbor.io"
  # Helm リポジトリを更新するためのコマンド
  repo_update_command: "helm repo update"
  # Harbor を install するための Helm コマンド（ClusterIP 経由でアクセスする）
  install_command: |
    helm install harbor harbor/harbor \
      -n harbor \
      --version 1.14.0 \
      --set expose.type=ClusterIP \
      --set expose.tls.enabled=true \
      --set expose.tls.certSource=secret \
      --set expose.tls.secret.secretName=harbor-tls \
      --set externalURL=https://harbor.k1s0.internal \
      --set harborAdminPassword=REPLACE_WITH_OPENBAO_MANAGED_SECRET \
      --set persistence.enabled=true \
      --set persistence.resourcePolicy=keep \
      --set trivy.enabled=true \
      --set notary.enabled=false
  # Harbor を upgrade するための Helm コマンド
  upgrade_command: |
    helm upgrade harbor harbor/harbor \
      -n harbor \
      --version 1.14.0 \
      --reuse-values
  # Trivy スキャナーの有効化フラグ
  trivy_enabled: "true"
  # 自動スキャンの有効化フラグ
  auto_scan_enabled: "true"
  # 署名なし image のプル禁止フラグ
  prevent_vul_images: "true"
  # Harbor の外部 URL
  external_url: "https://harbor.k1s0.internal"
  # Harbor の admin パスワードの管理方法
  admin_password_source: "OpenBao Transit（手動設定禁止）"
