# Harbor プロジェクト定義ファイル
# k1s0 システムで使用する 3 つの Harbor プロジェクトを定義する
# Harbor REST API または Helm values で適用する
apiVersion: v1
# ConfigMap リソース定義（Harbor プロジェクト設定を管理する）
kind: ConfigMap
metadata:
  # ConfigMap 名称: Harbor プロジェクト定義
  name: harbor-projects
  # harbor namespace に配置する
  namespace: harbor
  annotations:
    # この ConfigMap が準拠する enforcement 仕様
    k1s0.io/enforcement-spec: detail.security.harbor_project_management
data:
  # Harbor プロジェクト定義を YAML 文字列として格納する
  projects: |
    # k1s0 プラットフォームコアコンポーネント用プロジェクト
    - name: k1s0-platform
      # パブリックアクセスを禁止する（認証必須）
      public: false
      # プッシュ時に自動で Trivy スキャンを実行する
      auto_scan: true
      # 脆弱性スキャン後に高リスク image のプルを禁止する
      prevent_vul: true
      # 高リスク level の閾値を設定する
      severity: critical
      # 署名なし image のプルを禁止する
      enable_content_trust: true
      # コンテンツ信頼の Cosign を使用する
      enable_content_trust_cosign: true
      # リポジトリ上限数（0 = 無制限）
      count_limit: 0
      # ストレージ上限（-1 = 無制限）
      storage_limit: -1

    # パックマニュファクチャリング（製造軸）コンポーネント用プロジェクト
    - name: k1s0-pack-manufacturing
      # パブリックアクセスを禁止する（認証必須）
      public: false
      # プッシュ時に自動で Trivy スキャンを実行する
      auto_scan: true
      # 脆弱性スキャン後に高リスク image のプルを禁止する
      prevent_vul: true
      # 高リスク level の閾値を設定する
      severity: critical
      # 署名なし image のプルを禁止する
      enable_content_trust: true
      # コンテンツ信頼の Cosign を使用する
      enable_content_trust_cosign: true
      # リポジトリ上限数（0 = 無制限）
      count_limit: 0
      # ストレージ上限（-1 = 無制限）
      storage_limit: -1

    # コンパニオンアプリ（client 軸）コンポーネント用プロジェクト
    - name: k1s0-companion
      # パブリックアクセスを禁止する（認証必須）
      public: false
      # プッシュ時に自動で Trivy スキャンを実行する
      auto_scan: true
      # 脆弱性スキャン後に高リスク image のプルを禁止する
      prevent_vul: true
      # 高リスク level の閾値を設定する
      severity: critical
      # 署名なし image のプルを禁止する
      enable_content_trust: true
      # コンテンツ信頼の Cosign を使用する
      enable_content_trust_cosign: true
      # リポジトリ上限数（0 = 無制限）
      count_limit: 0
      # ストレージ上限（-1 = 無制限）
      storage_limit: -1
