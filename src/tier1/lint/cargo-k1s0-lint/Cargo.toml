# cargo-k1s0-lint — k1s0 tier1 Rust 独自 lint binary
# tier1/CLAUDE.md §lint ツール「cargo-deny [bans] + clippy + cargo public-api」を補完し、
# k1s0 固有の禁止 API チェックと facade 経由強制チェックを実装する。
# workspace テーブル: tier1 Cargo workspace から独立した standalone ツールとして扱う
# lint ツールはアプリケーションとは別 workspace で管理する（依存汚染防止）
[workspace]

[package]
# クレート名: cargo のサブコマンドとして「cargo k1s0-lint」で呼び出せるようにする
name = "cargo-k1s0-lint"
# バージョン: 初期実装
version = "0.1.0"
# Rust 2021 edition を使用する
edition = "2021"

# バイナリ定義: cargo k1s0-lint サブコマンドとして呼び出される
[[bin]]
# バイナリ名（cargo-<name> 形式で cargo <name> サブコマンドになる）
name = "cargo-k1s0-lint"
# エントリポイント
path = "src/main.rs"

[dependencies]
# serde: 設定ファイル読み込みに使用する（derive feature を有効化する）
serde = { version = "1", features = ["derive"] }
# serde_yaml: BannedAPIs.toml / yaml 設定ファイルのパースに使用する
serde_yaml = "0.9"
