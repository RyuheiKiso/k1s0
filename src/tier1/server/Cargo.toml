# k1s0 tier1 Rust workspace: サーバー系クレート群を管理する
[workspace]
# Rust workspace のメンバークレート一覧
members = [
    # HTTP/2 ALPN h2 ゲートウェイサーバー（Bidi conformance を担う）
    "gateway",
    # Outbox リレーサイドカー（WAL → Kafka 非同期転送）
    "sidecar",
    # ライブラリ向けバックエンド（トークン検証エンドポイント）
    "bfl",
    # コントロールプレーン（flagd 連携スタブ）
    "control_plane",
]
# Cargo workspace の依存バージョン一元管理（resolver v2 必須）
resolver = "2"

[workspace.dependencies]
# axum: 高性能 Rust Web フレームワーク（HTTP/2 対応）— 各 crate で features を指定するため base のみ
axum = { version = "0.8" }
# tokio: 非同期 I/O ランタイム（全機能を有効化する）
tokio = { version = "1", features = ["full"] }
# tower: ミドルウェア・レイヤリング用 HTTP ユーティリティ
tower = "0.5"
# tower-http: HTTP 特化ミドルウェア（トレース・圧縮等）
tower-http = { version = "0.6", features = ["trace"] }
# serde: データシリアライズ/デシリアライズフレームワーク
serde = { version = "1", features = ["derive"] }
# serde_json: JSON シリアライズ/デシリアライズライブラリ
serde_json = "1"
# tracing: 構造化ロギングフレームワーク
tracing = "0.1"
# tracing-subscriber: tracing のサブスクライバー実装
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# anyhow: エラーハンドリングライブラリ
anyhow = "1"
# thiserror: エラー型 derive macro（SpireError 等のカスタムエラー型に使用する）
thiserror = "1"
# uuid: UUID 生成ライブラリ（セッション・ドリル ID 生成に使用する）
uuid = { version = "1", features = ["v4"] }
# chrono: 日時ライブラリ（タイムスタンプ管理に使用する）
chrono = { version = "0.4", features = ["serde"] }
# bytes: ゼロコピーバイト操作
bytes = "1"
# zeroize: 機密データのゼロクリア（KeyHandle / AuthContext の drop 時）
zeroize = { version = "1", features = ["derive"] }
# hmac: HMAC 計算（webhook HMAC-SHA256 署名に使用する）
hmac = "0.12"
# sha2: SHA-2 ハッシュ関数（HMAC-SHA256 に使用する）
sha2 = "0.10"
# hex: バイト列を hex 文字列に変換する
hex = "0.4"
# futures-util: 非同期ストリームユーティリティ（SSE ストリームに使用する）
futures-util = "0.3"
# tonic: gRPC フレームワーク（server + transport features — grpc_native adapter と OTel transport に使用する）
tonic = { version = "0.12", features = ["transport"] }
# tokio-stream: tokio Stream ラッパー（gRPC bidi streaming に使用する）
tokio-stream = "0.1"
# async-stream: async generator マクロ（Stream 実装に使用する）
async-stream = "0.3"
# prost: protobuf ランタイム（tonic の proto 生成型に使用する）
prost = "0.13"
# prost-types: protobuf well-known types（Timestamp 等）
prost-types = "0.13"
# rskafka: pure Rust Kafka クライアント（C ライブラリ不要; TLS feature 無しで tcp direct 接続）
# NOTE: TLS 対応は SASL_PLAINTEXT (SCRAM/PLAIN) または mTLS proxy (envoy) 経由で実現する
rskafka = { version = "0.5", default-features = false }
# governor: rate limiting / token bucket（テナント容量適合仕様 09 の library_token_bucket に使用する）
governor = { version = "0.6", features = ["std", "quanta"] }
# reqwest: HTTP クライアント（OpenBao Transit API / JWKS 取得 — Phase C/F で bfl/key_handle に追加する）
# TLS なし: envoy が mTLS 終端するため native-tls / rustls は不要（json feature のみ有効化）
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# base64: OpenBao Transit API の input/plaintext フィールド用に Base64 エンコードする
base64 = "0.22"
# k1s0-tier1-library: tier1 canonical 型（KeyHandle / KeyClass / AuthContext 等）の共有ライブラリ
# gateway / bfl が独自定義を持たず canonical 型を参照するために追加する（重複実装 drift 防止）
k1s0-tier1-library = { path = "../library/rust" }
# jsonwebtoken: JWT 検証（RS256 / ES256 / HS256 / JWKS リモート取得に使用する）
jsonwebtoken = "9"
# web_transport は QUIC/HTTP3 が必要。pure Rust の quinn crate を使用する。
# NOTE: Zig CC 環境では C ライブラリのビルドに制約があるため wtransport は一時無効化。
#       production 環境では envoy HTTP/3 proxy で代替する。
# wtransport = { version = "0.5", features = ["self-signed"] }
# quinn = "0.11"
