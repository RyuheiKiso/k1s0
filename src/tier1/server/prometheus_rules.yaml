# prometheus_rules.yaml — tier1 の 6 slo_class 用 PrometheusRule CRD
# 07_SLO適合仕様.md §SLO §PrometheusRule に準拠する
# recording rules + alerting rules を定義する
# kube-prometheus-stack の PrometheusRule CRD として k1s0-system namespace に apply する

# Prometheus Operator の CRD API version
apiVersion: monitoring.coreos.com/v1
# リソース種別: Prometheus Operator が認識する PrometheusRule CRD
kind: PrometheusRule
metadata:
  # ルールセット名: k1s0 tier1 SLO ルール群
  name: k1s0-tier1-slo-rules
  # 配置 namespace: Prometheus Operator が watch する namespace
  namespace: k1s0-system
  # ラベル: Prometheus Operator の ruleSelector に一致させる
  labels:
    # Prometheus Operator の ruleSelector に一致するラベル
    prometheus: k1s0
    # ルールの役割を示すラベル
    role: alert-rules
    # k1s0 プロジェクトの一部であることを示すラベル
    app.kubernetes.io/part-of: k1s0
spec:
  # ルールグループのリスト
  groups:
    # ============================================================
    # v1_interactive クラス: ユーザー対話型 API の SLO rules
    # 07_SLO適合仕様.md §v1_interactive: 成功率 99.9% / p99 latency 200ms
    # ============================================================
    - name: k1s0.tier1.slo.v1_interactive
      # 評価間隔: 60 秒ごとにルールを評価する
      interval: 60s
      # ルールのリスト
      rules:
        # v1_interactive の 5 分間成功率を計算する recording rule
        - record: k1s0:tier1:slo:v1_interactive:request_success_rate_5m
          # 成功レスポンス（2xx）の割合を全レスポンスで除算する
          expr: |
            rate(k1s0_tier1_http_requests_total{slo_class="v1_interactive",code=~"2.."}[5m])
            /
            rate(k1s0_tier1_http_requests_total{slo_class="v1_interactive"}[5m])
        # v1_interactive の error rate が SLO 閾値（99.9%）を下回った場合に alert を発火する
        - alert: K1s0Tier1SloViolationInteractive
          # 成功率が 99.9% を下回った場合に発火する
          expr: |
            k1s0:tier1:slo:v1_interactive:request_success_rate_5m < 0.999
          # 5 分間継続した場合に alert を発火する（瞬間的なスパイクを無視する）
          for: 5m
          # alert のラベル
          labels:
            # 重篤度を critical に設定する（SLO 違反は最重要アラート）
            severity: critical
            # SLO クラスを示すラベル
            slo_class: v1_interactive
          # alert のアノテーション
          annotations:
            # alert の概要
            summary: "v1_interactive SLO violation (成功率 < 99.9%)"
            # alert の詳細（現在の成功率を表示する）
            description: "v1_interactive SLO が 99.9% を下回っています (現在: {{ $value | humanizePercentage }})"

    # ============================================================
    # v1_batch クラス: バッチ処理の SLO rules
    # 07_SLO適合仕様.md §v1_batch: ジョブ成功率 99.5%
    # ============================================================
    - name: k1s0.tier1.slo.v1_batch
      # 評価間隔: 60 秒ごとにルールを評価する
      interval: 60s
      rules:
        # v1_batch の 5 分間ジョブ成功率を計算する recording rule
        - record: k1s0:tier1:slo:v1_batch:job_success_rate_5m
          # 成功ジョブの割合を全ジョブで除算する
          expr: |
            rate(k1s0_tier1_batch_jobs_total{slo_class="v1_batch",status="succeeded"}[5m])
            /
            rate(k1s0_tier1_batch_jobs_total{slo_class="v1_batch"}[5m])
        # v1_batch の error rate が SLO 閾値（99.5%）を下回った場合に alert を発火する
        - alert: K1s0Tier1SloViolationBatch
          # 成功率が 99.5% を下回った場合に発火する
          expr: |
            k1s0:tier1:slo:v1_batch:job_success_rate_5m < 0.995
          # 10 分間継続した場合に alert を発火する（バッチは一時的な失敗が許容される）
          for: 10m
          labels:
            # 重篤度を warning に設定する（バッチは対話型より優先度が低い）
            severity: warning
            # SLO クラスを示すラベル
            slo_class: v1_batch
          annotations:
            # alert の概要
            summary: "v1_batch SLO violation (ジョブ成功率 < 99.5%)"
            # alert の詳細
            description: "v1_batch SLO が 99.5% を下回っています (現在: {{ $value | humanizePercentage }})"

    # ============================================================
    # v1_streaming クラス: ストリーミング処理の SLO rules
    # 07_SLO適合仕様.md §v1_streaming: p99 処理遅延 1 秒以内
    # ============================================================
    - name: k1s0.tier1.slo.v1_streaming
      # 評価間隔: 60 秒ごとにルールを評価する
      interval: 60s
      rules:
        # v1_streaming の 5 分間 p99 lag を計算する recording rule
        - record: k1s0:tier1:slo:v1_streaming:lag_p99_5m
          # histogram_quantile で p99 lag を計算する
          expr: |
            histogram_quantile(0.99,
              rate(k1s0_tier1_streaming_lag_seconds_bucket{slo_class="v1_streaming"}[5m])
            )
        # v1_streaming の p99 lag が 1 秒を超えた場合に alert を発火する
        - alert: K1s0Tier1SloViolationStreaming
          # p99 lag が 1.0 秒を超えた場合に発火する
          expr: k1s0:tier1:slo:v1_streaming:lag_p99_5m > 1.0
          # 5 分間継続した場合に alert を発火する
          for: 5m
          labels:
            # 重篤度を warning に設定する
            severity: warning
            # SLO クラスを示すラベル
            slo_class: v1_streaming
          annotations:
            # alert の概要
            summary: "v1_streaming lag SLO violation (p99 lag > 1s)"
            # alert の詳細
            description: "v1_streaming の p99 lag が 1 秒を超えています (現在: {{ $value }}s)"

    # ============================================================
    # v1_audit / v1_control_plane / v1_migration クラスの rules
    # 07_SLO適合仕様.md §v1_audit / §v1_control_plane / §v1_migration
    # ============================================================
    - name: k1s0.tier1.slo.remaining_classes
      # 評価間隔: 60 秒ごとにルールを評価する
      interval: 60s
      rules:
        # v1_audit の audit event 取りこぼし rate を計算する recording rule
        - record: k1s0:tier1:slo:v1_audit:drop_rate_5m
          # audit event の取りこぼし率を計算する（0 であることが SLO 要件）
          expr: |
            rate(k1s0_tier1_audit_events_dropped_total[5m])
        # v1_audit の取りこぼしが発生した場合に critical alert を発火する
        - alert: K1s0Tier1SloViolationAudit
          # audit event の取りこぼしが発生した場合に即座に発火する
          expr: k1s0:tier1:slo:v1_audit:drop_rate_5m > 0
          # 1 分間継続した場合に alert を発火する（audit は取りこぼし 0 が必須）
          for: 1m
          labels:
            # 重篤度を critical に設定する（audit ログ欠損は規制要件違反）
            severity: critical
            # SLO クラスを示すラベル
            slo_class: v1_audit
          annotations:
            # alert の概要
            summary: "v1_audit event drop detected"
            # alert の詳細
            description: "v1_audit の audit event 取りこぼしが発生しています"
        # v1_control_plane の reconcile 失敗率を計算する recording rule
        - record: k1s0:tier1:slo:v1_control_plane:reconcile_error_rate_5m
          # operator reconcile のエラー率を計算する
          expr: |
            rate(k1s0_tier1_operator_reconcile_errors_total[5m])
        # v1_control_plane の reconcile 失敗が続く場合に alert を発火する
        - alert: K1s0Tier1SloViolationControlPlane
          # reconcile エラー率が閾値を超えた場合に発火する
          expr: k1s0:tier1:slo:v1_control_plane:reconcile_error_rate_5m > 0.01
          # 5 分間継続した場合に alert を発火する
          for: 5m
          labels:
            # 重篤度を critical に設定する（コントロールプレーン障害は最重要）
            severity: critical
            # SLO クラスを示すラベル
            slo_class: v1_control_plane
          annotations:
            # alert の概要
            summary: "v1_control_plane reconcile error rate elevated"
            # alert の詳細
            description: "v1_control_plane の reconcile エラー率が 1% を超えています"
        # v1_migration の phase 失敗率を計算する recording rule
        - record: k1s0:tier1:slo:v1_migration:phase_failure_rate_5m
          # migration の phase 失敗率を計算する
          expr: |
            rate(k1s0_tier1_migration_phase_failures_total[5m])
        # v1_migration の phase 失敗が発生した場合に alert を発火する
        - alert: K1s0Tier1SloViolationMigration
          # migration phase 失敗率が閾値を超えた場合に発火する
          expr: k1s0:tier1:slo:v1_migration:phase_failure_rate_5m > 0
          # 2 分間継続した場合に alert を発火する
          for: 2m
          labels:
            # 重篤度を critical に設定する（migration 失敗はデータ整合性リスク）
            severity: critical
            # SLO クラスを示すラベル
            slo_class: v1_migration
          annotations:
            # alert の概要
            summary: "v1_migration phase failure detected"
            # alert の詳細
            description: "v1_migration の phase 失敗が発生しています"
