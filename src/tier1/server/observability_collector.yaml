# observability_collector.yaml — k1s0 tier1 OTel Collector 2 段 pipeline 構成
# docs/04_詳細設計/01_適合仕様/03_観測適合仕様.md §観測 Collector の 2 段 pipeline に準拠する。
# 段1: DaemonSet (gateway role) — loadbalancingexporter でバックエンドに振り分ける
# 段2: Deployment (tail-sampling) — tail_sampling processor + clickhouseexporter でサンプリング後に書き込む
---
# 段1: DaemonSet gateway — 各 Node 上で稼働して受信した OTLP を段2（tail-sampling Deployment）に転送する
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  # 名称: tier1 観測 gateway（段1）
  name: k1s0-otel-gateway
  # 配置名前空間: k1s0 システム名前空間
  namespace: k1s0-system
  # ラベル: tier1 観測 gateway コンポーネントを識別する
  labels:
    app.kubernetes.io/name: k1s0-otel-gateway
    app.kubernetes.io/component: observability-gateway
    app.kubernetes.io/part-of: k1s0
spec:
  # モード: DaemonSet（全 Node 上に 1 Pod を配置する）
  mode: daemonset
  # OTel Collector 設定（YAML テキスト）
  config:
    # receivers: データを受信するコンポーネント
    receivers:
      # OTLP receiver: gRPC / HTTP で OTLP テレメトリを受信する
      otlp:
        protocols:
          # gRPC: tier1 server / tier2 / tier3 からの OTLP/gRPC を受信する（4317 番ポート）
          grpc:
            # デフォルトポート 4317 でリッスンする
            endpoint: 0.0.0.0:4317
          # HTTP: HTTP/1.1 クライアントからの OTLP/HTTP を受信する（4318 番ポート）
          http:
            # デフォルトポート 4318 でリッスンする
            endpoint: 0.0.0.0:4318

    # processors: 受信したデータを処理するコンポーネント
    processors:
      # batch processor: バッチ送信でバックプレッシャーを緩和する
      batch:
        # 最大バッチサイズ: 送信前にバッファするスパン数
        send_batch_size: 8192
        # タイムアウト: バッファが満杯でなくても送信する最大待機時間
        timeout: 5s
      # memory_limiter: OOM を防ぐメモリ上限を設定する
      memory_limiter:
        # チェック間隔: メモリ使用量を確認する間隔
        check_interval: 1s
        # メモリ上限（ソフト）: この閾値を超えたら拒否を開始する
        limit_mib: 512
        # スパイク上限: バースト許容量
        spike_limit_mib: 128

    # exporters: 処理済みデータを送信するコンポーネント
    exporters:
      # loadbalancingexporter: 段2 tail-sampling Deployment に負荷分散してトレースを転送する
      # trace_id に基づくルーティングで tail-sampling の一貫性を保証する
      loadbalancing:
        # routing_key: trace_id（同一 trace の全 span を同一 tail-sampling Pod に送る）
        routing_key: traceID
        # resolver: K8s Service DNS で段2 tail-sampling Pod を解決する
        resolver:
          # k8s resolver: Service 経由で自動的に Pod エンドポイントを発見する
          k8s:
            # 段2 tail-sampling Service の DNS 名
            service: k1s0-otel-tailsampler
            # 段2 tail-sampling Service のポート
            ports:
              - 4317
        # プロトコル設定
        protocol:
          otlp:
            # TLS: mTLS で tier1 transport の TLS 1.3 強制ポリシーに準拠する
            tls:
              # CA cert: Kubernetes TLS secret から参照する
              ca_file: /var/run/secrets/k1s0/ca.crt
              # クライアント cert
              cert_file: /var/run/secrets/k1s0/tls.crt
              # クライアント key
              key_file: /var/run/secrets/k1s0/tls.key

    # service: pipeline の組み合わせを定義する
    service:
      # pipelines: データの流れ（receiver → processor → exporter）を定義する
      pipelines:
        # traces パイプライン: スパンを受信して段2に転送する
        traces:
          # receivers: OTLP receiver を使用する
          receivers: [otlp]
          # processors: memory_limiter → batch の順に処理する
          processors: [memory_limiter, batch]
          # exporters: loadbalancingexporter で段2に転送する
          exporters: [loadbalancing]
        # metrics パイプライン: メトリクスを受信して段2に転送する
        metrics:
          # receivers: OTLP receiver を使用する
          receivers: [otlp]
          # processors: memory_limiter → batch の順に処理する
          processors: [memory_limiter, batch]
          # exporters: loadbalancingexporter で段2に転送する
          exporters: [loadbalancing]
        # logs パイプライン: ログを受信して段2に転送する
        logs:
          # receivers: OTLP receiver を使用する
          receivers: [otlp]
          # processors: memory_limiter → batch の順に処理する
          processors: [memory_limiter, batch]
          # exporters: loadbalancingexporter で段2に転送する
          exporters: [loadbalancing]
---
# 段2: Deployment tail-sampling — スパンを収集してサンプリング後に ClickHouse に書き込む
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  # 名称: tier1 観測 tail-sampler（段2）
  name: k1s0-otel-tailsampler
  # 配置名前空間: k1s0 システム名前空間
  namespace: k1s0-system
  # ラベル: tier1 観測 tail-sampler コンポーネントを識別する
  labels:
    app.kubernetes.io/name: k1s0-otel-tailsampler
    app.kubernetes.io/component: observability-tailsampler
    app.kubernetes.io/part-of: k1s0
spec:
  # モード: Deployment（レプリカ数で水平スケールする）
  mode: deployment
  # レプリカ数: 3（HA 構成）
  replicas: 3
  # OTel Collector 設定（YAML テキスト）
  config:
    # receivers: 段1 gateway からの OTLP を受信する
    receivers:
      # OTLP receiver: 段1 gateway からの転送を受け取る（gRPC のみ）
      otlp:
        protocols:
          # gRPC: 段1 loadbalancingexporter からのトレースを受信する
          grpc:
            # デフォルトポート 4317 でリッスンする
            endpoint: 0.0.0.0:4317

    # processors: tail-sampling でサンプリングを実行する
    processors:
      # tail_sampling processor: 全スパンが揃った後にサンプリング判定を行う
      tail_sampling:
        # スパン収集タイムアウト: この時間後にサンプリング判定を実行する
        decision_wait: 30s
        # メモリ中の trace 最大数（超えた場合は古い trace を廃棄する）
        num_traces: 100000
        # expected_new_traces_per_sec: 新規 trace の流入推定値（バッファ確保に使う）
        expected_new_traces_per_sec: 1000
        # policies: サンプリングポリシー定義
        policies:
          # エラーレート: エラーを含む trace は 100% サンプリングする（エラー見逃し防止）
          - name: errors_policy
            # type: status_code ポリシー
            type: status_code
            status_code:
              # エラーステータスのみを対象にする
              status_codes: [ERROR]
          # レイテンシ異常: 高レイテンシ trace は 100% サンプリングする（SLO 違反追跡）
          - name: high_latency_policy
            # type: latency ポリシー
            type: latency
            latency:
              # threshold_ms: 2000ms 以上のスパンをサンプリングする
              threshold_ms: 2000
          # ベースライン: 正常 trace は 10% サンプリングする（コスト制御）
          - name: baseline_policy
            # type: probabilistic ポリシー（ランダムサンプリング）
            type: probabilistic
            probabilistic:
              # sampling_percentage: 10% サンプリング率
              sampling_percentage: 10
      # batch processor: ClickHouse への書き込みをバッチ化する
      batch:
        # 最大バッチサイズ: 書き込み前にバッファするスパン数
        send_batch_size: 10000
        # タイムアウト: バッファが満杯でなくても書き込む最大待機時間
        timeout: 10s
      # memory_limiter: OOM を防ぐメモリ上限を設定する
      memory_limiter:
        # チェック間隔: メモリ使用量を確認する間隔
        check_interval: 1s
        # メモリ上限（ソフト）: tail-sampling は大量の trace を保持するので上限を高めに設定する
        limit_mib: 2048
        # スパイク上限: バースト許容量
        spike_limit_mib: 512

    # exporters: サンプリング済みトレースを ClickHouse に書き込む
    exporters:
      # clickhouse exporter: サンプリング済みトレースを ClickHouse OLAP DB に書き込む
      clickhouse:
        # ClickHouse への接続 DSN（k1s0-system 名前空間の ClickHouse Service を参照する）
        endpoint: tcp://clickhouse.k1s0-system.svc.cluster.local:9000
        # データベース名: k1s0 観測データを格納するデータベース
        database: k1s0_telemetry
        # テーブル名プレフィックス: otel_traces / otel_metrics / otel_logs
        traces_table_name: otel_traces
        # ログテーブル名
        logs_table_name: otel_logs
        # メトリクステーブル名
        metrics_table_name: otel_metrics
        # TLS: ClickHouse への接続も TLS 1.3 を使用する（03_観測適合仕様.md §データ保護）
        tls:
          # CA cert: Kubernetes TLS secret から参照する
          ca_file: /var/run/secrets/k1s0/ca.crt
          # クライアント cert
          cert_file: /var/run/secrets/k1s0/tls.crt
          # クライアント key
          key_file: /var/run/secrets/k1s0/tls.key
        # 書き込みタイムアウト: ClickHouse 書き込みのタイムアウト
        timeout: 30s
        # 非同期インサート: ClickHouse の Async Insert を使用して書き込みスループットを向上させる
        async_insert: true

    # service: pipeline の組み合わせを定義する
    service:
      # pipelines: データの流れ（receiver → processor → exporter）を定義する
      pipelines:
        # traces パイプライン: tail-sampling 後に ClickHouse に書き込む
        traces:
          # receivers: OTLP receiver を使用する（段1 gateway から受信する）
          receivers: [otlp]
          # processors: memory_limiter → tail_sampling → batch の順に処理する
          processors: [memory_limiter, tail_sampling, batch]
          # exporters: ClickHouse に書き込む
          exporters: [clickhouse]
        # metrics パイプライン: メトリクスを ClickHouse に書き込む
        metrics:
          # receivers: OTLP receiver を使用する
          receivers: [otlp]
          # processors: memory_limiter → batch の順に処理する（metrics は tail-sampling 不要）
          processors: [memory_limiter, batch]
          # exporters: ClickHouse に書き込む
          exporters: [clickhouse]
        # logs パイプライン: ログを ClickHouse に書き込む
        logs:
          # receivers: OTLP receiver を使用する
          receivers: [otlp]
          # processors: memory_limiter → batch の順に処理する（logs は tail-sampling 不要）
          processors: [memory_limiter, batch]
          # exporters: ClickHouse に書き込む
          exporters: [clickhouse]
