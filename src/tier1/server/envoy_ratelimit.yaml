# envoy_ratelimit.yaml — Envoy グローバル rate-limit フィルタ設定
# 09_テナント容量適合仕様.md §enforcement_layer §envoy に準拠する
# Envoy ratelimit filter で API リクエスト上限を適用する
# envoy/envoy.yaml の http_filters セクション（envoy.filters.http.ratelimit）から参照される設定

# ============================================================
# Envoy rate-limit service 設定
# envoy.filters.http.ratelimit フィルタが参照するドメイン設定
# ============================================================

# rate-limit ドメイン名: 複数サービスが共有する場合の名前空間として機能する
domain: k1s0_tier1_ratelimit

# ============================================================
# rate-limit サービスの接続設定
# envoy.filters.http.ratelimit フィルタが rate-limit gRPC サービスに接続する設定
# ============================================================
ratelimit_service:
  # gRPC サービス接続設定
  grpc_service:
    # Envoy 内部 cluster を使用して rate-limit サービスに接続する
    envoy_grpc:
      # rate-limit サービスの Envoy cluster 名（envoy.yaml の static_resources.clusters で定義する）
      cluster_name: k1s0_ratelimit_service
    # タイムアウト: rate-limit サービスへの gRPC 呼び出しタイムアウト（250ms）
    # タイムアウト超過時は failure_mode_deny の設定に従う
    timeout: 0.25s

# failure_mode_deny: rate-limit サービスに接続できない場合の動作
# true = リクエストを deny する（フェイルセーフ）
# false = リクエストを通過させる（フェイルオープン）
# 09_テナント容量適合仕様.md §exhaustion_response=reject に準拠して true に設定する
failure_mode_deny: true

# ============================================================
# rate-limit 記述子（descriptor）設定
# Envoy が rate-limit サービスに送信するメタデータの定義
# ============================================================

# グローバル rate-limit 記述子のリスト
descriptors:
  # テナント ID ごとの rate limit 記述子
  - key: tenant_id
    # テナント ID に基づく 1 分あたりのリクエスト上限
    # v1_starter_shared クラス（09_テナント容量適合仕様.md §quota_class）相当のデフォルト値
    rate_limit:
      # 1 分間に 1000 リクエストまで許可する
      requests_per_unit: 1000
      # 単位: 分（MINUTE）
      unit: MINUTE

  # slo_class=v1_interactive の API への rate limit 記述子
  - key: slo_class
    # v1_interactive クラスに対して独立した rate limit を適用する
    value: v1_interactive
    # v1_interactive クラスの 1 分あたりのリクエスト上限
    # インタラクティブ API は過負荷を防ぐために低レートに絞る
    rate_limit:
      # 1 分間に 100 リクエストまで許可する（SLO 保護のためバッファを持たせる）
      requests_per_unit: 100
      # 単位: 分（MINUTE）
      unit: MINUTE

  # slo_class=v1_batch の API への rate limit 記述子
  - key: slo_class
    # v1_batch クラスに対して独立した rate limit を適用する
    value: v1_batch
    # v1_batch クラスの 1 分あたりのリクエスト上限
    # バッチ API はインタラクティブより高いレートを許容する
    rate_limit:
      # 1 分間に 5000 リクエストまで許可する
      requests_per_unit: 5000
      # 単位: 分（MINUTE）
      unit: MINUTE

  # slo_class=v1_streaming の API への rate limit 記述子
  - key: slo_class
    # v1_streaming クラスに対して独立した rate limit を適用する
    value: v1_streaming
    # v1_streaming クラスの 1 秒あたりのリクエスト上限（ストリーミングは秒単位で評価する）
    rate_limit:
      # 1 秒間に 500 リクエストまで許可する
      requests_per_unit: 500
      # 単位: 秒（SECOND）
      unit: SECOND
