# k1s0 tier1 sidecar: Outbox リレーサイドカー
[package]
# パッケージ名: k1s0-tier1-sidecar
name = "k1s0-tier1-sidecar"
# バージョン: 0.1.0
version = "0.1.0"
# Rust エディション: 2021 を使用する
edition = "2021"

[dependencies]
# tokio: 非同期 I/O ランタイム
tokio = { workspace = true }
# axum: ヘルスチェックエンドポイント用 HTTP サーバー
axum = { workspace = true }
# serde: シリアライズフレームワーク
serde = { workspace = true }
# serde_json: JSON ライブラリ
serde_json = { workspace = true }
# tracing: 構造化ロギング
tracing = { workspace = true }
# tracing-subscriber: ロギングサブスクライバー
tracing-subscriber = { workspace = true }
# anyhow: エラーハンドリング
anyhow = { workspace = true }
# sqlx: PostgreSQL クライアント（outbox_message テーブルの SELECT FOR UPDATE SKIP LOCKED に使用する）
# runtime-tokio: tokio 非同期 runtime 対応、postgres: PostgreSQL ドライバ
# uuid / chrono / json: outbox_message 型のデコードに使用する
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
# rskafka: pure Rust Kafka クライアント（outbox_message → Kafka relay に使用する; C ライブラリ不要）
rskafka = { workspace = true }
# uuid: idempotency_key / row id の型に使用する
uuid = { workspace = true }
# chrono: Kafka Record の timestamp に使用する
chrono = { workspace = true }
