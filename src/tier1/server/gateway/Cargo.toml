# k1s0 tier1 gateway: HTTP/2 ALPN h2 サーバー + Bidi handshake state machine
[package]
# パッケージ名: k1s0-tier1-gateway
name = "k1s0-tier1-gateway"
# バージョン: 0.1.0
version = "0.1.0"
# Rust エディション: 2021 を使用する
edition = "2021"

[dependencies]
# axum: HTTP/2 対応 Web フレームワーク（http2 + sse feature を有効化）
axum = { workspace = true, features = ["http2", "macros", "json"] }
# tokio: 非同期 I/O ランタイム
tokio = { workspace = true }
# tower: ミドルウェアレイヤリング
tower = { workspace = true }
# tower-http: HTTP 特化ミドルウェア
tower-http = { workspace = true }
# serde: シリアライズフレームワーク
serde = { workspace = true }
# serde_json: JSON ライブラリ
serde_json = { workspace = true }
# tracing: 構造化ロギング
tracing = { workspace = true }
# tracing-subscriber: ロギングサブスクライバー
tracing-subscriber = { workspace = true }
# anyhow: エラーハンドリング
anyhow = { workspace = true }
# uuid: UUID 生成（セッション・ハンドシェイク ID に使用する）
uuid = { workspace = true }
# chrono: 日時ライブラリ（conformance テスト実行日時に使用する）
chrono = { workspace = true }
# bytes: ゼロコピーバイト操作
bytes = { workspace = true }
# zeroize: KeyHandle drop 時のゼロクリア
zeroize = { workspace = true }
# hmac: webhook HMAC-SHA256 署名
hmac = { workspace = true }
# sha2: SHA-256 ハッシュ
sha2 = { workspace = true }
# hex: hex エンコード
hex = { workspace = true }
# futures-util: SSE ストリームユーティリティ
futures-util = { workspace = true }
# opentelemetry: OTel SDK コア（spec 03 観測 - W3C traceparent 伝搬）
opentelemetry = { version = "0.27", features = ["trace"] }
# opentelemetry_sdk: OTel SDK ランタイム実装
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
# opentelemetry-otlp: OTLP exporter（Collector への送信）
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
# tracing-opentelemetry: tracing と OTel のブリッジ
tracing-opentelemetry = "0.28"
# tonic: gRPC フレームワーク（server + transport features — grpc_native adapter + OTel に使用する）
tonic = { workspace = true }
# prost: protobuf ランタイム（tonic proto 生成型に使用する）
prost = { workspace = true }
# prost-types: protobuf well-known types（Timestamp 等）
prost-types = { workspace = true }
# tokio-stream: gRPC bidi streaming 用 Stream ラッパー
tokio-stream = { workspace = true }
# async-stream: async generator マクロ（Stream 実装に使用する）
async-stream = { workspace = true }
# rskafka: pure Rust Kafka クライアント（messaging_bridge adapter に使用する）
rskafka = { workspace = true }
# governor: token bucket rate limiter（テナント容量適合仕様 09 の library_token_bucket に使用する）
governor = { workspace = true }
# reqwest: HTTP クライアント（OpenBao Transit API 呼び出しに使用する — Phase F で有効化）
# workspace = true で src/tier1/server/Cargo.toml の reqwest エントリを継承する
reqwest = { workspace = true }
# base64: OpenBao Transit API の input / plaintext フィールド用 Base64 エンコード
base64 = { workspace = true }
# k1s0-hlc: Hybrid Logical Clock（wall-clock TTL 禁止規律の物理機構）
# webhook adapter の idempotency-key 24h TTL 管理に使用する
k1s0-hlc = { path = "../../../client/hlc_lib/rust" }
# k1s0-tier1-library: tier1 canonical 型（KeyHandle / KeyClass 等）の共有ライブラリ
# gateway 独自の KeyClass / KeyHandle 定義を削除し canonical 実装を参照するために追加する
k1s0-tier1-library = { workspace = true }

[dev-dependencies]
# reqwest: 統合テスト用 HTTP クライアント（HTTP/2 + rustls-tls で pkg-config 不要）
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# axum-test: axum ルーターを in-process で HTTP テストするためのフレームワーク（Testcontainers 不要）
# axum 0.8 と互換性のある v20 系を使用する（v15 は axum 0.7 に依存するため不適）
axum-test = "20"
