# k1s0 tier1 control_plane: flagd 連携コントロールプレーンスタブ
[package]
# パッケージ名: k1s0-tier1-cp
name = "k1s0-tier1-cp"
# バージョン: 0.1.0
version = "0.1.0"
# Rust エディション: 2021 を使用する
edition = "2021"

[dependencies]
# tokio: 非同期 I/O ランタイム
tokio = { workspace = true }
# axum: HTTP サーバー
axum = { workspace = true }
# serde: シリアライズフレームワーク
serde = { workspace = true }
# serde_json: JSON ライブラリ
serde_json = { workspace = true }
# tracing: 構造化ロギング
tracing = { workspace = true }
# tracing-subscriber: ロギングサブスクライバー
tracing-subscriber = { workspace = true }
# anyhow: エラーハンドリング
anyhow = { workspace = true }
# kube: Kubernetes API クライアント（CustomResource derive / runtime watcher に使用する）
kube = { version = "0.95", features = ["runtime", "derive"] }
# k8s-openapi: Kubernetes 標準型（kube が要求するバージョンと一致させる）
k8s-openapi = { version = "0.23", features = ["v1_31"] }
# futures-util: watcher stream の next() に使用する
futures-util = { workspace = true }
# tokio-stream: watcher を StreamExt で処理するために使用する
tokio-stream = { workspace = true }
# schemars: kube::CustomResource derive が要求する JSON Schema 生成ライブラリ
schemars = "0.8"
