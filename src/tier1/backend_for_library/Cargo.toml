# k1s0 tier1 backend_for_library: ライブラリ向けバックエンド（トークン検証エンドポイント）
[package]
# パッケージ名: k1s0-tier1-bfl
name = "k1s0-tier1-bfl"
# バージョン: 0.1.0
version = "0.1.0"
# Rust エディション: 2021 を使用する
edition = "2021"

[dependencies]
# tokio: 非同期 I/O ランタイム
tokio = { workspace = true }
# axum: HTTP サーバー（HTTP/2 対応）
axum = { workspace = true }
# serde: シリアライズフレームワーク
serde = { workspace = true }
# serde_json: JSON ライブラリ
serde_json = { workspace = true }
# tracing: 構造化ロギング
tracing = { workspace = true }
# tracing-subscriber: ロギングサブスクライバー
tracing-subscriber = { workspace = true }
# anyhow: エラーハンドリング
anyhow = { workspace = true }
# uuid: AuthContext の相関 ID 生成に使用する
uuid = { workspace = true }
