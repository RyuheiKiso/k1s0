# Litmus ChaosEngine: tier1 noisy neighbor ストレージ枯渇テスト
# 09_テナント容量適合仕様に基づくテナント間 Storage quota 独立性を検証する
# このマニフェストを apply すると pod-io-stress chaos experiment が実行される
# 使用方法: kubectl apply -f litmus_noisy_neighbor_v1_per_tenant_storage.yaml

# Litmus ChaosEngine API バージョン
apiVersion: litmuschaos.io/v1alpha1
# リソース種別: ChaosEngine
kind: ChaosEngine
# メタデータ設定
metadata:
  # ChaosEngine リソース名: storage noisy neighbor テスト
  name: tier1-noisy-neighbor-storage-test
  # 対象 namespace: tier1 テスト用 namespace
  namespace: tier1-test
  # ラベル: テスト種別と quota_class を明示する
  labels:
    # テスト種別: noisy neighbor テスト
    test-type: noisy-neighbor
    # 適合仕様参照: 09_テナント容量適合仕様
    spec-ref: "09_tenant_capacity"
    # quota class: storage quota の分離テスト
    k1s0.io/quota-class: v1_per_tenant_storage
# ChaosEngine の仕様設定
spec:
  # 対象アプリケーション情報
  appinfo:
    # 対象 namespace
    appns: tier1-test
    # 対象アプリのラベルセレクター
    applabel: "app=tier1-gateway"
    # 対象 API グループ
    appkind: deployment
  # Chaos 実験用サービスアカウント
  chaosServiceAccount: litmus-admin
  # 実験後のターゲット Pod の処理方法（delete: chaos 後に Pod を削除する）
  jobCleanUpPolicy: delete
  # モニタリング設定: Prometheus メトリクスを有効化する
  monitoring: true
  # 実行する Chaos 実験リスト
  experiments:
    # pod-io-stress: 対象 Pod の I/O を高負荷状態にしてストレージ枯渇を再現する実験
    - name: pod-io-stress
      # 実験の仕様設定
      spec:
        # 実験のコンポーネント設定
        components:
          # 環境変数設定
          env:
            # TOTAL_CHAOS_DURATION: chaos 実験の継続時間（秒）
            - name: TOTAL_CHAOS_DURATION
              # 60 秒間 I/O ストレスを与えてストレージ枯渇シナリオを再現する
              value: "60"
            # FILESYSTEM_UTILIZATION_PERCENTAGE: ストレージ消費率（%）
            - name: FILESYSTEM_UTILIZATION_PERCENTAGE
              # 90% まで埋めて v1_per_tenant_storage quota の境界をテストする
              value: "90"
            # TARGET_CONTAINER: chaos を当てるコンテナ名
            - name: TARGET_CONTAINER
              # tier1-gateway コンテナを対象とする
              value: "tier1-gateway"
            # CHAOS_NAMESPACE: chaos を当てる namespace
            - name: CHAOS_NAMESPACE
              # tier1-test namespace を対象とする
              value: "tier1-test"
            # QUOTA_CLASS: 対象 quota_class を明示する（harness 側での選択キーに使用する）
            - name: QUOTA_CLASS
              # storage quota class を指定する
              value: "v1_per_tenant_storage"
        # 実験のステータス確認設定
        status:
          # ChaosResult: chaos 実験の結果を確認する
          - name: ChaosResult
            # 期待する結果: v1_per_tenant_storage 分離テストが pass すること
            value: v1_per_tenant_storage_isolation_pass
