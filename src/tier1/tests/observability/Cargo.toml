# tier1 観測 property test 用 Cargo.toml
# docs/04_詳細設計/01_適合仕様/03_観測適合仕様.md §PII redaction は単一の真 + Collector 強制 の
# property test harness クレートを定義する。
[package]
# クレート名: tier1-observability-tests
name = "tier1-observability-tests"
# バージョン: 初期版
version = "0.1.0"
# エディション: 2021（最新安定版）
edition = "2021"

# ランタイム依存クレート（property test は serde_json を lib.rs レベルで使用する）
[dependencies]
# serde_json: JSON ライブラリ（attribute map の構築と検証に lib.rs レベルで使用する）
serde_json = "1"

# 開発・テスト専用依存クレート
[dev-dependencies]
# anyhow: テスト内エラーハンドリングの統一に使用する
anyhow = "1"
