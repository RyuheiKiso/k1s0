# tier1 migration pair テスト用 Cargo.toml
# 02_移行Pair適合仕様に基づく 4 migration pair × 5 phase のテストクレートを定義する
[package]
# クレート名: tier1-migration-tests
name = "tier1-migration-tests"
# バージョン: 初期版
version = "0.1.0"
# エディション: 2021（最新安定版）
edition = "2021"

# ランタイム依存クレート（lib ターゲットが使用する依存クレートを宣言する）
[dependencies]
# tokio: 非同期ランタイム（async fn / join / select に使用する）
tokio = { version = "1", features = ["full"] }
# anyhow: エラーハンドリングの統一に使用する
anyhow = "1"

# 開発・テスト専用依存クレート
[dev-dependencies]
# NOTE: testcontainers / testcontainers-modules は WSL 環境で ring クレートの C コンパイルが
# 失敗するため dev-dependencies から除外している。Docker 実環境での E2E テスト実行は
# docker-compose.yaml を使い、個別に cargo test --features testcontainers で実行すること。
# serde: YAML / JSON のシリアライズ・デシリアライズ（テストマトリックス読み込みに使用する）
serde = { version = "1", features = ["derive"] }
# serde_yaml: YAML パース（test_matrix.yaml の読み込みに使用する）
serde_yaml = { workspace = true }
# serde_json: JSON シリアライズ（テスト結果の出力に使用する）
serde_json = "1"
