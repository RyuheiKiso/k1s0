# tier1 migration pair テスト用 Cargo.toml
# 02_移行Pair適合仕様に基づく 4 migration pair × 5 phase のテストクレートを定義する
[package]
# クレート名: tier1-migration-tests
name = "tier1-migration-tests"
# バージョン: 初期版
version = "0.1.0"
# エディション: 2021（最新安定版）
edition = "2021"

# ============================================================
# 条件付きコンパイル feature 定義
# ============================================================

[features]
# default: testcontainers を CI デフォルト有効にする（Y-tier1-1 解消: mandatory smoke test）
# Docker デーモン未起動の環境では testcontainers が DOCKER_HOST 経由で自動 skip する
# CI は Docker-in-Docker / docker socket mount で実行するため常時 green になる
default = ["testcontainers"]
# testcontainers feature: Docker が利用可能な環境でのみ有効化する
# `cargo test` でデフォルト実行され、`cargo test --no-default-features` で無効化できる
testcontainers = ["dep:testcontainers"]

# ランタイム依存クレート（lib ターゲットが使用する依存クレートを宣言する）
[dependencies]
# tokio: 非同期ランタイム（async fn / join / select に使用する）
tokio = { version = "1", features = ["full"] }
# anyhow: エラーハンドリングの統一に使用する
anyhow = "1"
# testcontainers: Docker コンテナ管理（testcontainers feature が有効な場合のみリンクする）
# WSL 環境の ring クレートビルド問題を回避するため optional とする
# Docker socket 直接経由で動作するため ring クレート問題は発生しない
# bollard は testcontainers が内部依存として管理するため別途宣言しない
testcontainers = { version = "0.22", optional = true }

# 開発・テスト専用依存クレート
[dev-dependencies]
# serde: YAML / JSON のシリアライズ・デシリアライズ（テストマトリックス読み込みに使用する）
serde = { version = "1", features = ["derive"] }
# serde_yaml: YAML パース（test_matrix.yaml の読み込みに使用する）
serde_yaml = { workspace = true }
# serde_json: JSON シリアライズ（テスト結果の出力に使用する）
serde_json = "1"
