# tier1 migration テスト用ローカル環境
# 02_移行Pair適合仕様の relational_pg ペアで使用する PostgreSQL ソース / ターゲットを起動する
# 使用方法: docker compose up -d && cargo test --test migration_e2e

# Docker Compose バージョン指定
version: '3.8'

# サービス定義
services:
  # PostgreSQL ソース DB (CNPG 相当): Strimzi 移行元として使用する
  postgres_source:
    # PostgreSQL バージョン 16 イメージを使用する
    image: postgres:16
    # 環境変数: ソース DB の接続情報を設定する
    environment:
      # ソース DB 名
      POSTGRES_DB: source_db
      # ソース DB ユーザー名
      POSTGRES_USER: test
      # ソース DB パスワード
      POSTGRES_PASSWORD: test
    # ポートマッピング: ホスト 15432 をコンテナ 5432 にマッピングする
    ports:
      - "15432:5432"
    # ヘルスチェック: DB が起動して接続可能になるまで待機する
    healthcheck:
      # pg_isready コマンドで接続確認する
      test: ["CMD-SHELL", "pg_isready -U test -d source_db"]
      # 5 秒ごとにチェックする
      interval: 5s
      # タイムアウトは 3 秒とする
      timeout: 3s
      # 5 回失敗したら unhealthy とみなす
      retries: 5

  # PostgreSQL ターゲット DB (StackGres 相当): 移行先として使用する
  postgres_target:
    # PostgreSQL バージョン 16 イメージを使用する
    image: postgres:16
    # 環境変数: ターゲット DB の接続情報を設定する
    environment:
      # ターゲット DB 名
      POSTGRES_DB: target_db
      # ターゲット DB ユーザー名
      POSTGRES_USER: test
      # ターゲット DB パスワード
      POSTGRES_PASSWORD: test
    # ポートマッピング: ホスト 15433 をコンテナ 5432 にマッピングする
    ports:
      - "15433:5432"
    # ヘルスチェック: DB が起動して接続可能になるまで待機する
    healthcheck:
      # pg_isready コマンドで接続確認する
      test: ["CMD-SHELL", "pg_isready -U test -d target_db"]
      # 5 秒ごとにチェックする
      interval: 5s
      # タイムアウトは 3 秒とする
      timeout: 3s
      # 5 回失敗したら unhealthy とみなす
      retries: 5
