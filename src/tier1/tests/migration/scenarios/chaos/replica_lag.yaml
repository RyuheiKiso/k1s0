# chaos シナリオ: replica_lag — レプリケーション遅延時の migration 整合性を検証する
# spec 02 §chaos_test §replica_lag に対応する
# StateReplicate フェーズ中にレプリケーション遅延が発生した場合の
# データ整合性保証（HLC ベースの causality 順序）を確認する
apiVersion: litmuschaos.io/v1alpha1
# ChaosExperiment リソース種別を指定する
kind: ChaosExperiment
metadata:
  # chaos 実験の名前（kebab-case）
  name: migration-replica-lag
  # 配置 namespace
  namespace: k1s0-test
  # ラベルでシナリオ種別を識別する
  labels:
    # k1s0 migration chaos テストのラベル
    app: k1s0-migration-chaos
    # シナリオ種別ラベル
    scenario: replica-lag
spec:
  definition:
    # 実験スコープ: Namespaced（pod レベルのネットワーク遅延注入）
    scope: Namespaced
    # 使用する chaos runner image
    image: litmuschaos/go-runner:3.3.0
    # 実験実行コマンドを指定する
    command:
      # bash でコマンドを実行する
      - /bin/bash
      # chaos ロジックのインラインスクリプト
      - -c
      # 実行する chaos の説明ログを出力する
      - echo "replica lag chaos for migration StateReplicate consistency test"
    # chaos パラメータを引数として渡す
    args:
      # chaos の種類: ネットワーク遅延注入（レプリケーション遅延をシミュレートする）
      - -action=network-latency
      # 対象ネットワークインターフェース
      - -network_interface=eth0
      # 注入する遅延量: 500ms（レプリケーション遅延として大きな値を設定する）
      - -network_latency=500
      # 遅延のジッター量: 100ms（ランダム性を持たせる）
      - -network_jitter=100
      # chaos 継続時間: 180 秒（StateReplicate フェーズ全体をカバーする）
      - -total_chaos_duration=180
    # 環境変数で chaos の対象を指定する
    env:
      # 対象 pod のラベルセレクター（migration 先 DB replica pod）
      - name: TARGET_POD_LABELS
        # migration 先のレプリカ pod を対象とする
        value: "role=migration-target-replica"
      # chaos の対象 namespace
      - name: APP_NAMESPACE
        # テスト用 namespace を指定する
        value: "k1s0-test"
