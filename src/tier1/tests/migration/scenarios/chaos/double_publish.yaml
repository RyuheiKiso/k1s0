# chaos シナリオ: double_publish — デュアルライト時の重複メッセージ配信を検証する
# spec 02 §chaos_test §double_publish に対応する
# DualWriteRamp フェーズ中に同一メッセージが両ブローカーに重複配信される状況を注入する
apiVersion: litmuschaos.io/v1alpha1
# ChaosExperiment リソース種別を指定する
kind: ChaosExperiment
metadata:
  # chaos 実験の名前（kebab-case）
  name: migration-double-publish
  # 配置 namespace
  namespace: k1s0-test
  # ラベルでシナリオ種別を識別する
  labels:
    # k1s0 migration chaos テストのラベル
    app: k1s0-migration-chaos
    # シナリオ種別ラベル
    scenario: double-publish
spec:
  definition:
    # 実験スコープ: Namespaced（pod レベルのメッセージ重複注入）
    scope: Namespaced
    # 使用する chaos runner image
    image: litmuschaos/go-runner:3.3.0
    # 実験実行コマンドを指定する
    command:
      # bash でコマンドを実行する
      - /bin/bash
      # chaos ロジックのインラインスクリプト
      - -c
      # 実行する chaos の説明ログを出力する
      - echo "double publish chaos for migration DualWriteRamp test"
    # chaos パラメータを引数として渡す
    args:
      # chaos の種類: メッセージ重複注入
      - -action=pod-io-stress
      # 対象の producer pod を指定する
      - -target_label=role=migration-producer
      # 重複注入率: 全メッセージの 50% を重複させる
      - -duplicate_rate=50
      # chaos 継続時間: 60 秒
      - -total_chaos_duration=60
    # 環境変数で chaos の対象 pod を指定する
    env:
      # 対象 pod のラベルセレクター（migration producer）
      - name: TARGET_POD_LABELS
        # DualWriteRamp 中の producer pod を対象とする
        value: "role=migration-producer"
      # chaos の対象 namespace
      - name: APP_NAMESPACE
        # テスト用 namespace を指定する
        value: "k1s0-test"
