# block-single-region-kek-reconstruction.yaml — KEK の単一リージョン再構成を防ぐ ClusterPolicy
# docs/04_詳細設計/01_適合仕様/05_鍵管理適合仕様.md §M=3 N=5 Shamir ceremony に準拠する。
# KEK の単一リージョン再構成は Shamir Secret Sharing の耐性モデルを破壊するため、
# kek.single_region_reconstruction: "allowed" または kek-* Secret の
# single_region_allowed: "true" 設定を admission 時に deny する。

# Kyverno ClusterPolicy の API version
apiVersion: kyverno.io/v1
# リソース種別: クラスタ全体に適用する ClusterPolicy
kind: ClusterPolicy
metadata:
  # ポリシー名（kebab-case）
  name: k1s0-block-single-region-kek-reconstruction
  # ポリシーのアノテーション
  annotations:
    # ポリシーのタイトル
    policies.kyverno.io/title: "Block Single-Region KEK Reconstruction"
    # ポリシーのカテゴリ
    policies.kyverno.io/category: "Tier1 Enforcement Layer E"
    # 対象 Kyverno バージョン
    policies.kyverno.io/minversion: "1.11.0"
    # ポリシーの説明文
    policies.kyverno.io/description: >
      KEK（Key Encryption Key）の単一リージョン再構成を許可する設定を Deny する。
      ConfigMap の kek.single_region_reconstruction: "allowed" または
      Secret（名前が kek- で始まる）の stringData.single_region_allowed: "true" を禁止する。
      Shamir M=3 N=5 ceremony は複数リージョンのシャード保持者が物理的に集合する場合のみ
      実行可能とし、単一リージョンでの再構成を阻止する
      (05_鍵管理適合仕様.md §M=3 N=5 Shamir ceremony)。
spec:
  # ポリシーが失敗した場合の全体動作（Enforce = admission deny する）
  validationFailureAction: Enforce
  # バックグラウンド処理を無効化する（admission 時のみ評価する）
  background: false
  # ルールのリスト
  rules:
    # ConfigMap で kek.single_region_reconstruction: "allowed" を設定している場合に deny する
    - name: deny-configmap-single-region-kek
      # マッチ条件: ConfigMap の作成・更新を対象にする
      match:
        any:
          - resources:
              # 対象 resource kind: ConfigMap
              kinds:
                - ConfigMap
              # create / update 操作を対象にする
              operations:
                - CREATE
                - UPDATE
      # 除外条件: kyverno / kube-system 名前空間は除外する
      exclude:
        any:
          - resources:
              # システム名前空間を除外する
              namespaces:
                - kyverno
                - kube-system
      # 検証条件: ConfigMap の data に kek.single_region_reconstruction: "allowed" がないこと
      validate:
        # deny メッセージ: オペレーターへの説明
        message: >
          ConfigMap に kek.single_region_reconstruction: "allowed" を設定することは禁止されています。
          KEK の単一リージョン再構成は Shamir M=3 N=5 の耐性モデルを破壊します
          (05_鍵管理適合仕様.md §M=3 N=5 Shamir ceremony)。
        # 検証条件: data["kek.single_region_reconstruction"] が "allowed" でないこと
        deny:
          conditions:
            # any: kek.single_region_reconstruction が "allowed" の場合に deny する
            any:
              # ConfigMap の data フィールドで kek.single_region_reconstruction を確認する
              - key: "{{ request.object.data.\"kek.single_region_reconstruction\" }}"
                # 演算子: "allowed" と等しい場合に deny する
                operator: Equals
                # "allowed" が設定されている場合に deny する
                value: "allowed"

    # Secret（名前が kek- で始まる）で single_region_allowed: "true" を設定している場合に deny する
    - name: deny-secret-single-region-kek
      # マッチ条件: Secret の作成・更新を対象にする
      match:
        any:
          - resources:
              # 対象 resource kind: Secret
              kinds:
                - Secret
              # create / update 操作を対象にする
              operations:
                - CREATE
                - UPDATE
              # 名前が kek- で始まる Secret のみを対象にする
              names:
                - "kek-*"
      # 除外条件: kyverno / kube-system 名前空間は除外する
      exclude:
        any:
          - resources:
              # システム名前空間を除外する
              namespaces:
                - kyverno
                - kube-system
      # 検証条件: stringData.single_region_allowed が "true" でないこと
      validate:
        # deny メッセージ: オペレーターへの説明
        message: >
          kek-* Secret に stringData.single_region_allowed: "true" を設定することは禁止されています。
          KEK の単一リージョン再構成は Shamir M=3 N=5 の耐性モデルを破壊します
          (05_鍵管理適合仕様.md §M=3 N=5 Shamir ceremony)。
        # 検証条件: stringData.single_region_allowed が "true" でないこと
        deny:
          conditions:
            # any: single_region_allowed が "true" の場合に deny する
            any:
              # Secret の stringData フィールドで single_region_allowed を確認する
              - key: "{{ request.object.stringData.single_region_allowed }}"
                # 演算子: "true" と等しい場合に deny する
                operator: Equals
                # "true" が設定されている場合に deny する
                value: "true"
