# maintainer_turnover_freeze.yaml — maintainer_turnover signal で Pod admission を deny する ClusterPolicy
# 08_OSSライフサイクル適合仕様.md §signal: maintainer_turnover に準拠する
# OSSInventory の status.triggeredSignals に maintainer_turnover が含まれる OSS を image とする Pod を block する

# Kyverno ClusterPolicy の API version
apiVersion: kyverno.io/v1
# リソース種別: クラスタ全体に適用する ClusterPolicy
kind: ClusterPolicy
metadata:
  # ポリシー名（kebab-case: oss signal 名に対応する）
  name: k1s0-oss-maintainer-turnover-freeze
  # ポリシーの説明アノテーション
  annotations:
    # ポリシーのタイトル
    policies.kyverno.io/title: "OSS Maintainer Turnover Freeze"
    # ポリシーのカテゴリ
    policies.kyverno.io/category: "OSS Lifecycle Enforcement"
    # 対象 Kyverno バージョン
    policies.kyverno.io/minversion: "1.11.0"
    # ポリシーの説明文
    policies.kyverno.io/description: >
      maintainer_turnover signal がトリガーされた OSS パッケージを image として使用する Pod を deny する。
      08_OSSライフサイクル適合仕様.md §signal: maintainer_turnover に準拠する。
      OSSInventory リソースの status.triggeredSignals に "maintainer_turnover" が含まれる場合に deny を発動する。
      トリガー条件: メンテナー健全性スコアが 30 未満（evaluateSpecSignals で評価）。
spec:
  # ポリシーが失敗した場合の全体動作（Enforce = admission deny する）
  validationFailureAction: Enforce
  # バックグラウンド処理を無効化する（admission 時のみ評価する）
  background: false
  # ルールのリスト
  rules:
    # Pod の image が maintainer_turnover signal を持つ OSS パッケージに紐づく場合に deny する
    - name: deny-pod-with-maintainer-turnover-signal
      # マッチ条件: Pod の作成・更新を対象にする
      match:
        any:
          - resources:
              # 対象 resource kind を列挙する
              kinds:
                - Pod
              # create / update 操作を対象にする
              operations:
                - CREATE
                - UPDATE
      # 除外条件: kyverno / kube-system / k1s0-system 名前空間は除外する
      exclude:
        any:
          - resources:
              # kyverno の system namespace を除外する（自己 deny 防止）
              namespaces:
                - kyverno
                - kube-system
                - k1s0-system
      # コンテキスト: maintainer_turnover signal がトリガーされた OSSInventory リソース一覧を参照する
      context:
        # maintainer_turnover signal がトリガーされた OSSInventory リソース一覧を取得する
        - name: ossInventories
          # Kubernetes API から OSSInventory リソースを取得する
          apiCall:
            # OSSInventory の API パス（namespace スコープ）
            urlPath: "/apis/tier1.k1s0.io/v1/namespaces/{{request.object.metadata.namespace}}/ossinventories"
            # jmesPath: maintainer_turnover signal を持つ OSSInventory を抽出する
            jmesPath: "items[?contains(status.triggeredSignals, 'maintainer_turnover')]"
      # 検証条件: maintainer_turnover signal がトリガーされた OSSInventory が存在する場合に deny する
      validate:
        # deny メッセージ: maintainer_turnover signal の原因と対処方法をオペレーターに伝える
        message: >
          この Pod の image は maintainer_turnover signal がトリガーされた OSS パッケージに紐づいています。
          メンテナー健全性スコアが閾値（30）以上に回復して OSSInventory の status.triggeredSignals から
          "maintainer_turnover" が除去されるまで Pod の作成 / 更新は禁止されています
          (08_OSSライフサイクル適合仕様.md §signal: maintainer_turnover)。
        # 検証条件: maintainer_turnover signal を持つ OSSInventory が 0 件であることを確認する
        deny:
          conditions:
            all:
              # ossInventories の件数が 1 件以上の場合は deny する
              - key: "{{ length(ossInventories) }}"
                # 演算子: 以上
                operator: GreaterThanOrEquals
                # 値: 1 件以上の場合に deny する
                value: "1"
