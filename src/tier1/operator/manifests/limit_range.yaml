# limit_range.yaml — k1s0 テナント namespace の Kubernetes LimitRange テンプレート
# 09_テナント容量適合仕様.md §enforcement_layer §kubernetes に準拠する
# operator が各テナント namespace に apply する LimitRange の雛形
# PLACEHOLDER_TENANT_NAMESPACE は operator が実際のテナント namespace 名に置換する

# Kubernetes LimitRange の API version
apiVersion: v1
# リソース種別: namespace 内のコンテナ / Pod にリソース上限を設定する
kind: LimitRange
metadata:
  # LimitRange 名（テナント namespace に apply する際の名前）
  name: k1s0-tenant-limits
  # 適用先 namespace: operator が動的に実際のテナント namespace 名に設定する
  namespace: PLACEHOLDER_TENANT_NAMESPACE
  # ラベル: k1s0 operator が管理するリソースであることを示す
  labels:
    # k1s0 管理対象であることを示すラベル
    app.kubernetes.io/managed-by: k1s0-operator
    # LimitRange のコンポーネント種別を示すラベル
    app.kubernetes.io/component: tenant-limit-range
    # k1s0 プロジェクトの一部であることを示すラベル
    app.kubernetes.io/part-of: k1s0
spec:
  # 制限値のリスト
  limits:
    # コンテナレベルの制限: 各コンテナに個別に適用する
    - type: Container
      # デフォルトの CPU / メモリ limit: requests/limits を指定しないコンテナに自動適用する
      default:
        # デフォルト CPU limit: 500m（0.5 コア）
        cpu: "500m"
        # デフォルトメモリ limit: 512MiB
        memory: "512Mi"
      # デフォルトの CPU / メモリ request: requests を指定しないコンテナに自動適用する
      defaultRequest:
        # デフォルト CPU request: 100m（0.1 コア）
        cpu: "100m"
        # デフォルトメモリ request: 128MiB
        memory: "128Mi"
      # コンテナの最大リソース制限: これを超えた limit 指定は admission deny される
      max:
        # 最大 CPU limit: 4 コア
        cpu: "4"
        # 最大メモリ limit: 8GiB
        memory: "8Gi"
      # コンテナの最小リソース制限: これを下回った request 指定は admission deny される
      min:
        # 最小 CPU request: 10m
        cpu: "10m"
        # 最小メモリ request: 16MiB
        memory: "16Mi"
    # Pod レベルの制限: Pod 内の全コンテナ合計に適用する
    - type: Pod
      # Pod 全体の最大リソース制限: Pod 内全コンテナの合計がこれを超えると deny される
      max:
        # Pod 全体の最大 CPU limit: 8 コア
        cpu: "8"
        # Pod 全体の最大メモリ limit: 16GiB
        memory: "16Gi"
