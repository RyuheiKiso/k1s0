# auth/classes.yaml — 認証適合仕様 auth_class 定義 (SoT)
# spec: docs/04_詳細設計/01_適合仕様/04_認証適合仕様.md

spec_ref: "04_認証適合仕様"
schema_version: "v1"

# 5 auth_class。各 class は subject_kind / token_type / lifetime / refresh / step_up と allowed_purpose を宣言する。
auth_classes:
  - id: v1_human_session
    subject_kind: human
    token_type: dpop_bound_jwt
    lifetime: "medium (<1h)"
    refresh: rotating
    step_up: on_high_risk
    allowed_purpose:
      - business_op
      - support
      - export
      - migration
      - emergency

  - id: v1_workload_jwt
    subject_kind: workload
    token_type: jwt_short
    lifetime: "short (<5m)"
    refresh: not_applicable
    step_up: never
    allowed_purpose:
      - business_op
      - migration

  - id: v1_device_attest
    subject_kind: device
    token_type: jwt_attested
    lifetime: "long (<24h)"
    refresh: one_shot
    step_up: on_first_use
    allowed_purpose:
      - business_op

  - id: v1_federated_exchange
    subject_kind: external_subject
    token_type: exchange_jwt
    lifetime: "short (<5m)"
    refresh: not_applicable
    step_up: never
    allowed_purpose:
      - business_op

  - id: v1_emergency_step_up
    subject_kind: human
    token_type: dpop_bound_jwt
    lifetime: "very_short (<10m)"
    refresh: not_applicable
    step_up: always
    allowed_purpose:
      - emergency
