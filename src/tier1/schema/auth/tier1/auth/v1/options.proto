// tier1 認証適合仕様 v1 — proto option + message 定義
// 04_認証適合仕様.md §v1 auth_class セット（5 class）と AuthContext スキーマを
// 機械可読な form に固定する。
// tier3 業務 SPA / tier2 Service 間 RPC が AuthContext を参照する際に
// このモジュールを import して型安全性を担保する。
syntax = "proto3";

package tier1.auth.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/k1s0-io/k1s0/tier1/auth/v1;authv1";
option java_multiple_files = true;
option java_package = "io.k1s0.tier1.auth.v1";

// AuthClass は 04_認証適合仕様.md §v1 auth_class セット（5 class）を宣言する。
// class 1 値が subject_kind / token_type / lifetime_class / refresh_policy / step_up_required を
// 一意に導出する（dimension override 禁止）。
enum AuthClass {
  // デフォルト（未指定）— AuthContext を要求する API では必須フィールド
  AUTH_CLASS_UNSPECIFIED = 0;
  // v1_human_session: 業務担当者 SPA セッション
  // OIDC code flow + DPoP 鍵束縛（RFC 9449）、rotating refresh、on_high_risk step_up
  AUTH_CLASS_HUMAN_SESSION = 1;
  // v1_workload_jwt: K8s ServiceAccount projection / SPIFFE/SPIRE SVID
  // 短 TTL JWT（<5m）、自動 renew は workload runtime 担当、step_up=never
  AUTH_CLASS_WORKLOAD_JWT = 2;
  // v1_device_attest: 工場端末・KIOSK
  // TPM/HSM device cert、長 TTL（<24h）、one_shot refresh、on_first_use step_up
  AUTH_CLASS_DEVICE_ATTEST = 3;
  // v1_federated_exchange: 親会社/取引先 IdP からの RFC 8693 token exchange
  // audience-restricted 短命 JWT（<5m）、act/may_act claim
  AUTH_CLASS_FEDERATED_EXCHANGE = 4;
  // v1_emergency_step_up: break-glass アクセス
  // always step_up、TTL<10m、no refresh、purpose=emergency 強制
  AUTH_CLASS_EMERGENCY_STEP_UP = 5;
}

// SubjectKind は subject の本質的な種別を宣言する。
enum SubjectKind {
  // デフォルト（未指定）
  SUBJECT_KIND_UNSPECIFIED = 0;
  // 業務担当者（human）
  SUBJECT_KIND_HUMAN = 1;
  // Workload（K8s Pod / SPIRE agent など）
  SUBJECT_KIND_WORKLOAD = 2;
  // 工場端末・KIOSK デバイス
  SUBJECT_KIND_DEVICE = 3;
  // 外部 IdP からの federated subject
  SUBJECT_KIND_EXTERNAL_SUBJECT = 4;
}

// TokenType は wire 上のトークン種別を宣言する。
enum TokenType {
  // デフォルト（未指定）
  TOKEN_TYPE_UNSPECIFIED = 0;
  // DPoP 鍵束縛 JWT（RFC 9449）
  TOKEN_TYPE_DPOP_BOUND_JWT = 1;
  // 通常 JWT（短 TTL）
  TOKEN_TYPE_JWT_SHORT = 2;
  // device attestation chain 付き JWT
  TOKEN_TYPE_JWT_ATTESTED = 3;
  // RFC 8693 token exchange JWT（audience-restricted）
  TOKEN_TYPE_EXCHANGE_JWT = 4;
}

// StepUpPolicy は step_up の発動条件を宣言する。
enum StepUpPolicy {
  // デフォルト（未指定）
  STEP_UP_POLICY_UNSPECIFIED = 0;
  // 一切の step_up 不要
  STEP_UP_POLICY_NEVER = 1;
  // 初回使用時のみ
  STEP_UP_POLICY_ON_FIRST_USE = 2;
  // 高リスク action 直前
  STEP_UP_POLICY_ON_HIGH_RISK = 3;
  // 常に（break-glass 等）
  STEP_UP_POLICY_ALWAYS = 4;
}

// AuthContext は tier1 Library が transaction 開始時に PostgreSQL GUC に SET LOCAL する
// session_context の認証拡張部分を宣言する。
// 04_認証適合仕様.md §AuthContext スキーマに準拠。
// tier2 の TenantContext（4 GUC）と組み合わせて 1 つの session_context を構成する。
message AuthContext {
  // auth_class: v1_human_session 等
  AuthClass auth_class = 1;
  // subject_id: canonical subject（Keycloak sub など）
  string subject_id = 2;
  // subject_kind: human / workload / device / external_subject
  SubjectKind subject_kind = 3;
  // token_id: JWT jti（revocation tracking）
  string token_id = 4;
  // session_id: human / device のセッション識別子
  string session_id = 5;
  // audience: token aud（federated に必須）
  string audience = 6;
  // scopes: OAuth scopes
  repeated string scopes = 7;
  // dpop_jkt: DPoP key thumbprint（dpop_bound_jwt のみ）
  string dpop_jkt = 8;
  // attestation_level: device attestation level（jwt_attested のみ）
  string attestation_level = 9;
  // step_up_proven_at: 最終 step_up challenge 時刻
  google.protobuf.Timestamp step_up_proven_at = 10;
  // token_type: wire 上のトークン種別
  TokenType token_type = 11;
  // step_up_required: step_up 発動条件
  StepUpPolicy step_up_required = 12;
}

// AuthMethodOptions は認証が必要な RPC メソッドに付与する option を宣言する。
message AuthMethodOptions {
  // required_auth_class: このメソッドが要求する auth_class（UNSPECIFIED = 全 class 許可）
  AuthClass required_auth_class = 1;
  // min_step_up: このメソッドが要求する最小 step_up レベル
  StepUpPolicy min_step_up = 2;
  // allowed_purposes: このメソッドで許可される purpose 一覧（空 = 制限なし）
  repeated string allowed_purposes = 3;
}

// auth_method は認証が必要な RPC に付与する method option。
// (tier1.auth.v1.auth_method).required_auth_class = AUTH_CLASS_HUMAN_SESSION 形式で使用する。
extend google.protobuf.MethodOptions {
  // auth_method: このメソッドに付与する認証オプション
  AuthMethodOptions auth_method = 50001;
}
