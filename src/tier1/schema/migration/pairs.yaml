# migration/pairs.yaml — 移行 Pair 適合仕様 primary pair 定義 (SoT)
# spec: docs/04_詳細設計/01_適合仕様/02_移行Pair適合仕様.md

spec_ref: "02_移行Pair適合仕様"
schema_version: "v1"

# 4 primary migration pair。各 pair は from/to の OSS ペアと wire 互換性レベルを宣言する。
pairs:
  - pair_id: relational_pg_pair
    from:
      name: PostgreSQL
      operator: CloudNativePG
    to:
      name: PostgreSQL
      operator: StackGres
    wire_compat: complete
    wire_compat_note: "同一エンジンのため完全互換"

  - pair_id: messaging_kafka_pair
    from:
      name: Apache Kafka
      operator: Strimzi
    to:
      name: RedPanda
    wire_compat: wire_complete
    wire_compat_note: "Kafka API 互換のため wire レベルで完全互換"

  - pair_id: workflow_pair
    from:
      name: Temporal
    to:
      name: Cadence
    wire_compat: partial
    wire_compat_note: "state model に部分的差異あり"

  - pair_id: rule_engine_pair
    from:
      name: ZEN Engine
    to:
      name: 自製DSL backend
      lang: Rust
    wire_compat: same_dsl_semantics
    wire_compat_note: "同一 DSL セマンティクス上での実装差異"
