# migration/phases.yaml — 移行 Pair 適合仕様 phase 定義 (SoT)
# spec: docs/04_詳細設計/01_適合仕様/02_移行Pair適合仕様.md

spec_ref: "02_移行Pair適合仕様"
schema_version: "v1"

# 5 phase を決定論的順序で定義する。各 phase の assertion_id は {phase_id}_{pair_id}_pass 形式。
# 4 pair × 5 phase = 20 cell すべて非空。
phases:
  - phase_id: schema_diff
    order: 1
    input: "旧 backend の schema/state"
    output: "差分レポート + 露出概念影響箇所"
    business_impact: none

  - phase_id: state_replicate
    order: 2
    input: "旧 backend の状態スナップショット"
    output: "新 backend の同期状態"
    business_impact: none

  - phase_id: dual_write_ramp
    order: 3
    input: "業務トラフィック"
    output: "二重書込 + 読取 ramp 切替"
    business_impact: "読取: 旧 100% → 新 100% へ ramp"

  - phase_id: cutover
    order: 4
    input: "dual_write 完了状態"
    output: "新 backend 単独動作"
    business_impact: "短時間 write freeze"

  - phase_id: rollback
    order: 5
    input: "cutover 後 24h 以内の異常検知"
    output: "旧 backend へ切戻し"
    business_impact: "短時間 write freeze"

# assertion_id の命名規則
assertion_id_pattern: "{phase_id}_{pair_id}_pass"

# phase × pair マトリクス (全 20 cell 非空を保証)
pairs_ref:
  - relational_pg_pair
  - messaging_kafka_pair
  - workflow_pair
  - rule_engine_pair
