# migration/scenarios.yaml — 10 scenario 障害注入定義 (SoT)
# spec: docs/04_詳細設計/01_適合仕様/02_移行Pair適合仕様.md §製造業 pack stress test
# 4 full_dry_run + 6 障害注入 = 10 scenario を定義する

spec_ref: "02_移行Pair適合仕様"
schema_version: "v1"

# 10 scenario の定義（spec §製造業 pack stress test の番号に対応させる）
scenarios:
  # シナリオ 1: relational_pg_pair 全 5 phase の full dry-run
  - scenario_id: full_dry_run
    scenario_no: 1
    # 対象ペア
    pair_id: relational_pg_pair
    # 主要フェーズ: 全 5 phase を順番に実行する
    phases: [schema_diff, state_replicate, dual_write_ramp, cutover, rollback]
    # シナリオ種別: full（障害注入なし）
    kind: full
    # シナリオの説明
    description: "発注 / 検査 aggregate (32) を CNPG → StackGres で全 5 phase 通しで検証する"

  # シナリオ 2: messaging_kafka_pair 全 5 phase の full dry-run
  - scenario_id: full_dry_run_kafka
    scenario_no: 2
    # 対象ペア
    pair_id: messaging_kafka_pair
    # 主要フェーズ: 全 5 phase を順番に実行する
    phases: [schema_diff, state_replicate, dual_write_ramp, cutover, rollback]
    # シナリオ種別: full
    kind: full
    # シナリオの説明
    description: "Domain Event topic (39 event_feed) を Kafka → RedPanda で全 5 phase 通しで検証する"

  # シナリオ 3: workflow_pair 全 5 phase の full dry-run
  - scenario_id: full_dry_run_workflow
    scenario_no: 3
    # 対象ペア
    pair_id: workflow_pair
    # 主要フェーズ: 全 5 phase を順番に実行する
    phases: [schema_diff, state_replicate, dual_write_ramp, cutover, rollback]
    # シナリオ種別: full
    kind: full
    # シナリオの説明
    description: "多段承認 Workflow を Temporal → Cadence で全 5 phase 通しで検証する"

  # シナリオ 4: rule_engine_pair 全 5 phase の full dry-run
  - scenario_id: full_dry_run_rule
    scenario_no: 4
    # 対象ペア
    pair_id: rule_engine_pair
    # 主要フェーズ: 全 5 phase を順番に実行する
    phases: [schema_diff, state_replicate, dual_write_ramp, cutover, rollback]
    # シナリオ種別: full
    kind: full
    # シナリオの説明
    description: "検査ルール決定表を ZEN → 自製 DSL backend で全 5 phase 通しで検証する"

  # シナリオ 5: replication_lag 障害注入（relational_pg_pair / dual_write_ramp フェーズ）
  - scenario_id: replica_lag
    scenario_no: 5
    # 対象ペア
    pair_id: relational_pg_pair
    # 主要フェーズ: dual_write_ramp での lag 注入を検証する
    phases: [dual_write_ramp]
    # シナリオ種別: fault_injection（障害注入）
    kind: fault_injection
    # 障害注入の種類
    fault_type: replica_lag
    # シナリオの説明
    description: "replication_lag 注入時に cutover 抑止が正しく動作することを検証する"

  # シナリオ 6: partition_rebalance 障害注入（messaging_kafka_pair / cutover フェーズ）
  - scenario_id: partition_rebalance
    scenario_no: 6
    # 対象ペア
    pair_id: messaging_kafka_pair
    # 主要フェーズ: cutover 中の partition rebalance を検証する
    phases: [cutover]
    # シナリオ種別: fault_injection
    kind: fault_injection
    # 障害注入の種類
    fault_type: partition_rebalance
    # シナリオの説明
    description: "partition rebalance 中の cutover でメッセージ喪失 0 を検証する"

  # シナリオ 7: open_workflow_cutover（workflow_pair / cutover フェーズ）
  - scenario_id: open_workflow_cutover
    scenario_no: 7
    # 対象ペア
    pair_id: workflow_pair
    # 主要フェーズ: open workflow 1000 件超での cutover を検証する
    phases: [cutover]
    # シナリオ種別: fault_injection
    kind: fault_injection
    # 障害注入の種類
    fault_type: open_workflow_bulk
    # シナリオの説明
    description: "open workflow 1000 件超での cutover で in-flight workflow の継続を検証する"

  # シナリオ 8: rule_eval_mismatch_rollback（rule_engine_pair / rollback フェーズ）
  - scenario_id: rule_eval_mismatch_rollback
    scenario_no: 8
    # 対象ペア
    pair_id: rule_engine_pair
    # 主要フェーズ: rule evaluation 不一致検知後の rollback を検証する
    phases: [rollback]
    # シナリオ種別: fault_injection
    kind: fault_injection
    # 障害注入の種類
    fault_type: rule_eval_mismatch
    # シナリオの説明
    description: "rule evaluation 不一致発覚 → rollback で旧 ZEN Engine に正常復帰することを検証する"

  # シナリオ 9: cutover_23h_rollback（relational_pg_pair / rollback フェーズ）
  - scenario_id: cutover_23h_rollback
    scenario_no: 9
    # 対象ペア
    pair_id: relational_pg_pair
    # 主要フェーズ: cutover 後 23h 経過時点の rollback を検証する
    phases: [rollback]
    # シナリオ種別: fault_injection
    kind: fault_injection
    # 障害注入の種類（24h 以内の rollback 期限を検証する）
    fault_type: late_rollback_within_24h
    # シナリオの説明
    description: "cutover 後 23h 経過時点の rollback で旧 CNPG への切戻しとデータ整合を検証する"

  # シナリオ 10: atomic_triple_write_violation（relational_pg_pair / dual_write_ramp フェーズ）
  - scenario_id: atomic_triple_write_violation
    scenario_no: 10
    # 対象ペア
    pair_id: relational_pg_pair
    # 主要フェーズ: dual_write_ramp 中の P1〜P4 違反検知を検証する
    phases: [dual_write_ramp]
    # シナリオ種別: fault_injection
    kind: fault_injection
    # 障害注入の種類
    fault_type: atomic_triple_write_p1_p4_violation
    # シナリオの説明
    description: "dwr 中の atomic 三表書込 P1〜P4 違反を検知して cutover を自動停止することを検証する"

# scenario_id 命名規則（参照整合 CI が検証する）
scenario_id_pattern: "{scenario_type}_{pair_id_prefix}_{detail}"

# test runner との接続マッピング（lib.rs の run_scenario 関数の dispatch table と対応する）
runner_mapping:
  # run_scenario("full_dry_run", pair) → run_full_dry_run_scenario(pair)
  - scenario_id: full_dry_run
    rust_fn: run_full_dry_run_scenario
  # run_scenario("replica_lag", pair) → run_replica_lag_scenario(pair)
  - scenario_id: replica_lag
    rust_fn: run_replica_lag_scenario
  # run_scenario("network_partition", pair) → run_network_partition_scenario(pair)
  - scenario_id: network_partition
    rust_fn: run_network_partition_scenario
  # run_scenario("partition_rebalance", pair) → run_partition_rebalance_scenario(pair)
  - scenario_id: partition_rebalance
    rust_fn: run_partition_rebalance_scenario
  # run_scenario("open_workflow_cutover", pair) → run_open_workflow_cutover_scenario(pair)
  - scenario_id: open_workflow_cutover
    rust_fn: run_open_workflow_cutover_scenario
  # run_scenario("rule_eval_mismatch_rollback", pair) → run_rule_eval_mismatch_rollback_scenario(pair)
  - scenario_id: rule_eval_mismatch_rollback
    rust_fn: run_rule_eval_mismatch_rollback_scenario
  # run_scenario("cutover_23h_rollback", pair) → run_cutover_23h_rollback_scenario(pair)
  - scenario_id: cutover_23h_rollback
    rust_fn: run_cutover_23h_rollback_scenario
  # run_scenario("atomic_triple_write_violation", pair) → run_atomic_triple_write_violation_scenario(pair)
  - scenario_id: atomic_triple_write_violation
    rust_fn: run_atomic_triple_write_violation_scenario
  # run_scenario("disk_full", pair) → run_disk_full_scenario(pair)
  - scenario_id: disk_full
    rust_fn: run_disk_full_scenario
  # run_scenario("clock_skew", pair) → run_clock_skew_scenario(pair)
  - scenario_id: clock_skew
    rust_fn: run_clock_skew_scenario
