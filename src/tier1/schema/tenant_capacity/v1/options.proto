// tier1 テナント容量適合仕様 v1 — proto option 定義
// 09_テナント容量適合仕様.md §v1 quota_class セット（5 class）を機械可読な form に固定する。
// Library 公開 API には (tier1.tenant_capacity.v1.quota_method) option が必須（Buf lint）。
syntax = "proto3";

package tier1.tenant_capacity.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/k1s0-io/k1s0/tier1/tenant_capacity/v1;tenantcapacityv1";
option java_multiple_files = true;
option java_package = "io.k1s0.tier1.tenant_capacity.v1";

// QuotaClass は 09_テナント容量適合仕様.md §v1 quota_class セット（5 class）を宣言する。
// class 1 値が enforcement_layer / fairness_model / burst_window / exhaustion_response を
// 一意に導出する。
enum QuotaClass {
  QUOTA_CLASS_UNSPECIFIED = 0;
  // v1_per_tenant_qps: per-tenant API QPS
  // Envoy Local Rate Limit filter、burst 2x、reject_429
  V1_PER_TENANT_QPS = 1;
  // v1_per_tenant_concurrency: per-tenant 同時実行上限
  // Library token bucket、queue_with_timeout
  V1_PER_TENANT_CONCURRENCY = 2;
  // v1_per_tenant_volume: per-tenant ストレージ byte / event count / row count
  // storage layer quota、overflow_to_cold
  V1_PER_TENANT_VOLUME = 3;
  // v1_per_tenant_compute: per-tenant CPU / GPU / memory
  // OSS native quota（Temporal / KEDA / pgvector）、shed_by_priority
  V1_PER_TENANT_COMPUTE = 4;
  // v1_global_fair_queue: 全テナント横断公平 share
  // broker layer（Kafka partition rebalance）、partition_rebalance
  V1_GLOBAL_FAIR_QUEUE = 5;
}

// EnforcementLayer は quota を強制する物理 enforcement 層を宣言する。
enum EnforcementLayer {
  ENFORCEMENT_LAYER_UNSPECIFIED = 0;
  // Envoy Gateway Local Rate Limit filter
  ENVOY_LOCAL_RATE_LIMIT = 1;
  // Library 内 token bucket（in-process）
  LIBRARY_TOKEN_BUCKET = 2;
  // storage layer（Rook+Ceph / CloudNativePG / ClickHouse / Kafka）
  STORAGE_LAYER_QUOTA = 3;
  // OSS native quota（Temporal / KEDA / pgvector）
  OSS_NATIVE_QUOTA = 4;
  // broker layer（Kafka partition rebalance / Istio destination rule）
  BROKER_LAYER = 5;
}

// ExhaustionResponse は quota 枯渇時の挙動を宣言する。
enum ExhaustionResponse {
  EXHAUSTION_RESPONSE_UNSPECIFIED = 0;
  // 429 Too Many Requests + Retry-After
  REJECT_429 = 1;
  // deadline まで queue して打ち切り
  QUEUE_WITH_TIMEOUT = 2;
  // cold storage（S3/Ceph RGW）に overflow
  OVERFLOW_TO_COLD = 3;
  // priority に基づき低優先ワークロードを shed
  SHED_BY_PRIORITY = 4;
  // Kafka partition を rebalance
  PARTITION_REBALANCE = 5;
}

// QuotaMethodOptions は quota 計測対象の API メソッドに付与する option を宣言する。
// Library 公開 API には quota_method option が必須（Buf lint CI fail）。
message QuotaMethodOptions {
  // quota_class: 適用する quota class
  QuotaClass quota_class = 1;
  // enforcement_layer: 強制する物理層（class から導出されるが明記可能）
  EnforcementLayer enforcement_layer = 2;
  // exhaustion_response: 枯渇時の挙動（class から導出されるが明記可能）
  ExhaustionResponse exhaustion_response = 3;
  // burst_window_ms: burst を許容する時間窓（ms）（0=continuous）
  int32 burst_window_ms = 4;
}

// quota_method は quota 計測対象の API に付与する method option。
extend google.protobuf.MethodOptions {
  QuotaMethodOptions quota_method = 50003;
}
