// tier1 スキーマ進化 policy descriptor v1
// 06_スキーマ進化適合仕様.md §migration_pair / §dry_run_phase の policy descriptor を定義する。
// MigrationPairDescriptor は dry_run.lock.yaml の migration pair エントリと 1:1 に対応する。
syntax = "proto3";

// パッケージ宣言: tier1.schema_evolution.v1 名前空間を使用する
package tier1.schema_evolution.v1;

// import: SchemaClass / MigrationPairPolicy を参照する
import "tier1/schema_evolution/v1/options.proto";

// Go パッケージパス宣言
option go_package = "github.com/k1s0-io/k1s0/tier1/schema_evolution/v1;schemaevolutionv1";
// Java マルチファイル生成を有効にする（options.proto と同パッケージ内で値を統一する）
option java_multiple_files = true;
// Java パッケージ宣言（options.proto と同パッケージ内で値を統一する）
option java_package = "io.k1s0.tier1.schema_evolution.v1";

// DryRunPhase は migration pair dry_run の 5 フェーズを宣言する。
// 02_移行Pair適合仕様.md §dry_run_phase（5 phase）と対応する。
enum DryRunPhase {
  // デフォルト（未指定）
  DRY_RUN_PHASE_UNSPECIFIED = 0;
  // shadow: 新旧両書き込み、読み取りは旧スキーマのみ（フェーズ 1）
  DRY_RUN_PHASE_SHADOW = 1;
  // dual_read: 読み取りを新旧両方から行い差分をモニタリングする（フェーズ 2）
  DRY_RUN_PHASE_DUAL_READ = 2;
  // cutover: 読み取りを新スキーマに切り替え、旧スキーマへの書き込みを継続（フェーズ 3）
  DRY_RUN_PHASE_CUTOVER = 3;
  // cleanup: 旧スキーマへの書き込みを停止し、旧フィールドを tombstone にする（フェーズ 4）
  DRY_RUN_PHASE_CLEANUP = 4;
  // complete: 旧スキーマを完全削除して migration pair を closed にする（フェーズ 5）
  DRY_RUN_PHASE_COMPLETE = 5;
}

// MigrationPairDescriptor は migration pair の policy を宣言する。
// dry_run.lock.yaml の各 pair エントリと 1:1 で対応し、Buf codegen の input にする。
message MigrationPairDescriptor {
  // pair_id: migration pair の一意識別子（例: "msg_v1_to_v2"）
  string pair_id = 1;
  // old_message_fqn: 旧メッセージの完全修飾名（例: "tier1.bidi.v1.HandshakeRequest"）
  string old_message_fqn = 2;
  // new_message_fqn: 新メッセージの完全修飾名（例: "tier1.bidi.v2.HandshakeRequest"）
  string new_message_fqn = 3;
  // schema_class: 変更の schema_class（通常 v1_breaking_allowed）
  SchemaClass schema_class = 4;
  // migration_pair_policy: dry_run で使用する migration pair policy
  MigrationPairPolicy migration_pair_policy = 5;
  // current_phase: 現在の dry_run フェーズ（dry_run.lock.yaml の current_phase と同期する）
  DryRunPhase current_phase = 6;
  // breaking_window_days: breaking change の猶予日数
  int32 breaking_window_days = 7;
}

// SchemaEvolutionPolicy は spec 06 全体の policy bundle を宣言する。
// Buf codegen の root input として使用する。
message SchemaEvolutionPolicy {
  // pairs: 全 migration pair descriptor のリスト
  repeated MigrationPairDescriptor pairs = 1;
  // default_breaking_window_days: 個別指定がない場合のデフォルト猶予日数（通常 90 日）
  int32 default_breaking_window_days = 2;
  // require_migration_pair_for_breaking: v1_breaking_allowed 変更に migration pair 必須フラグ
  bool require_migration_pair_for_breaking = 3;
}
