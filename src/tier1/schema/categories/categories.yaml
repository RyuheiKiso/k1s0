# categories.yaml — tier1 Library 17 機能カテゴリ定義
# docs/03_概要設計/02_tier1設計方針/04_提供機能カテゴリ.md の SoT
# 各カテゴリの抽象化レベル / 露出許可概念 / 禁止 OSS 型 を宣言する。
# cargo-k1s0-lint の FACADE_REQUIRED_PATTERNS はこのファイルから導出される。

# バージョン
version: "1.0.0"
# 設計方針参照
design_policy_ref: "docs/03_概要設計/02_tier1設計方針/04_提供機能カテゴリ.md"
# 適合仕様参照
spec_ref: "docs/04_詳細設計/01_適合仕様/08_OSSライフサイクル適合仕様.md"

# 17 機能カテゴリ定義
categories:

  # カテゴリ 01: Observability / Logging
  - id: observability_logging
    # 人間可読な名前
    name: "Observability / Logging"
    # 対象スタック（both: frontend + backend、backend: backend のみ、frontend: frontend のみ）
    target: both
    # 抽象化レベル（L3: wire 互換 / L2*: 同族差し替え / L1+: 単一深耕）
    abstraction_level: L3
    # 露出許可概念（このカテゴリで tier2/tier3 に露出してよい概念）
    exposed_concepts:
      - "structured_log_entry"
      - "log_level"
      - "log_context_propagation"
      - "trace_span"
    # 禁止 OSS 型（公開 API シグネチャへの直接露出禁止）
    banned_oss_types_in_public_api: []
    # 現行実装 OSS
    current_oss: ["OpenTelemetry Library", "Collector"]

  # カテゴリ 02: Observability / Tracing
  - id: observability_tracing
    # 人間可読な名前
    name: "Observability / Tracing"
    # 対象スタック
    target: both
    # 抽象化レベル
    abstraction_level: L3
    # 露出許可概念
    exposed_concepts:
      - "trace_span"
      - "span_context"
      - "trace_propagation_header"
    # 禁止 OSS 型
    banned_oss_types_in_public_api: []
    # 現行実装 OSS
    current_oss: ["OpenTelemetry Library", "ClickHouse", "Jaeger v2"]

  # カテゴリ 03: Observability / Metrics
  - id: observability_metrics
    # 人間可読な名前
    name: "Observability / Metrics"
    # 対象スタック
    target: both
    # 抽象化レベル
    abstraction_level: L3
    # 露出許可概念
    exposed_concepts:
      - "counter"
      - "histogram"
      - "gauge"
      - "metric_attributes"
    # 禁止 OSS 型
    banned_oss_types_in_public_api: []
    # 現行実装 OSS
    current_oss: ["OpenTelemetry Library", "Prometheus"]

  # カテゴリ 04: Observability / Profiling
  - id: observability_profiling
    # 人間可読な名前
    name: "Observability / Profiling"
    # 対象スタック（backend のみ）
    target: backend
    # 抽象化レベル（L2*: pprof 族の同族差し替え保証）
    abstraction_level: "L2star"
    # 露出許可概念
    exposed_concepts:
      - "profile_type"
      - "sampling_rate"
      - "label_cardinality"
    # 禁止 OSS 型（Parca 固有の型を公開 API に出さない）
    banned_oss_types_in_public_api:
      - "parca_agent::"
      - "ParcaClient"
    # 現行実装 OSS
    current_oss: ["Parca"]

  # カテゴリ 05: Authentication / Authorization
  - id: auth
    # 人間可読な名前
    name: "Authentication / Authorization"
    # 対象スタック
    target: both
    # 抽象化レベル（L3: OIDC/OAuth2.1 wire 互換）
    abstraction_level: L3
    # 露出許可概念
    exposed_concepts:
      - "AuthContext"
      - "auth_class"
      - "tenant_id_claim"
      - "oidc_token_claims"
    # 禁止 OSS 型（Keycloak Java SDK 型の直接露出禁止）
    banned_oss_types_in_public_api:
      - "KeycloakPrincipal"
      - "KeycloakDeployment"
      - "org.keycloak"
    # 現行実装 OSS
    current_oss: ["Keycloak"]

  # カテゴリ 06: Secret Management
  - id: secret
    # 人間可読な名前
    name: "Secret Management"
    # 対象スタック（backend のみ）
    target: backend
    # 抽象化レベル（L3: OpenBao/Vault API wire 互換）
    abstraction_level: L3
    # 露出許可概念
    exposed_concepts:
      - "KeyHandle"
      - "secret_class"
      - "rotation_cadence"
    # 禁止 OSS 型（生 Vault/OpenBao client 型の直接露出禁止）
    banned_oss_types_in_public_api:
      - "VaultClient"
      - "vaultrs::"
      - "openbao::"
    # 現行実装 OSS
    current_oss: ["OpenBao", "External Secrets Operator"]

  # カテゴリ 07: Configuration / Feature Flag
  - id: feature_flag
    # 人間可読な名前
    name: "Configuration / Feature Flag"
    # 対象スタック
    target: both
    # 抽象化レベル（L2*: OpenFeature provider 族の同族差し替え保証）
    abstraction_level: "L2star"
    # 露出許可概念
    exposed_concepts:
      - "evaluation_context"
      - "flag_key"
      - "flag_value"
      - "feature_targeting_rule"
    # 禁止 OSS 型（flagd 固有のトランスポート型の直接露出禁止）
    banned_oss_types_in_public_api:
      - "FlagdProvider"
      - "flagd::"
    # 現行実装 OSS
    current_oss: ["OpenFeature", "flagd"]

  # カテゴリ 08: KeyValue / Cache
  - id: kv_cache
    # 人間可読な名前
    name: "KeyValue / Cache"
    # 対象スタック（backend のみ）
    target: backend
    # 抽象化レベル（L3: RESP wire 互換）
    abstraction_level: L3
    # 露出許可概念
    exposed_concepts:
      - "cache_key"
      - "cache_ttl_hlc"
      - "distributed_lock"
      - "pub_sub_channel"
    # 禁止 OSS 型（Valkey/Redis クライアント型の直接露出禁止）
    banned_oss_types_in_public_api:
      - "valkey::"
      - "redis::"
      - "RedisClient"
      - "ValkeyClient"
    # 現行実装 OSS
    current_oss: ["Valkey"]

  # カテゴリ 09: Object Storage
  - id: object_store
    # 人間可読な名前
    name: "Object Storage"
    # 対象スタック（backend のみ）
    target: backend
    # 抽象化レベル（L3: S3 API wire 互換）
    abstraction_level: L3
    # 露出許可概念
    exposed_concepts:
      - "object_key"
      - "bucket_name"
      - "presigned_url"
      - "object_metadata"
    # 禁止 OSS 型（Rook/Ceph 固有の型の直接露出禁止）
    banned_oss_types_in_public_api:
      - "CephClient"
      - "rook::"
      - "librados::"
    # 現行実装 OSS
    current_oss: ["Rook+Ceph RGW"]

  # カテゴリ 10: RPC / Gateway
  - id: rpc_gateway
    # 人間可読な名前
    name: "RPC / Gateway"
    # 対象スタック
    target: both
    # 抽象化レベル（L3: gRPC/Connect RPC wire 互換）
    abstraction_level: L3
    # 露出許可概念
    exposed_concepts:
      - "rpc_method_descriptor"
      - "transport_class"
      - "conformance_class"
      - "capability_negotiation"
    # 禁止 OSS 型（Envoy 内部 filter chain 型の直接露出禁止）
    banned_oss_types_in_public_api:
      - "envoy::"
      - "EnvoyClient"
    # 現行実装 OSS
    current_oss: ["Envoy Gateway", "gRPC"]

  # カテゴリ 11: Messaging / EventBus
  - id: messaging
    # 人間可読な名前
    name: "Messaging / EventBus"
    # 対象スタック（backend のみ）
    target: backend
    # 抽象化レベル（L1+: Kafka セマンティクスへの単一深耕）
    abstraction_level: "L1plus"
    # 露出許可概念（L1+ のため OSS 固有概念の一部を露出してよい）
    exposed_concepts:
      - "topic_name"
      - "partition_key"
      - "consumer_group"
      - "offset"
      - "outbox_message"
      - "dlq_policy"
      - "exactly_once_semantics"
    # 禁止 OSS 型（低レベル Kafka producer/consumer の直接露出禁止）
    banned_oss_types_in_public_api:
      - "confluent_kafka::"
      - "rdkafka::"
      - "rskafka::"
      - "KafkaProducer"
      - "KafkaConsumer"
    # 現行実装 OSS
    current_oss: ["Apache Kafka (Strimzi)"]

  # カテゴリ 12: Schema Registry
  - id: schema_registry
    # 人間可読な名前
    name: "Schema Registry"
    # 対象スタック（backend のみ）
    target: backend
    # 抽象化レベル（L2*: Confluent Registry wire 互換族）
    abstraction_level: "L2star"
    # 露出許可概念
    exposed_concepts:
      - "schema_id"
      - "compatibility_mode"
      - "schema_artifact"
      - "schema_group"
    # 禁止 OSS 型（Apicurio 固有の実装型の直接露出禁止）
    banned_oss_types_in_public_api:
      - "ApicurioClient"
      - "apicurio_registry::"
    # 現行実装 OSS
    current_oss: ["Apicurio Registry", "Buf"]

  # カテゴリ 13: Relational Store / Single-leader
  - id: relational_store
    # 人間可読な名前
    name: "Relational Store / Single-leader"
    # 対象スタック（backend のみ）
    target: backend
    # 抽象化レベル（L1+: PostgreSQL セマンティクスへの単一深耕）
    abstraction_level: "L1plus"
    # 露出許可概念（L1+ のため PostgreSQL 固有概念の一部を露出してよい）
    exposed_concepts:
      - "transaction_isolation_level"
      - "advisory_lock"
      - "partition_lifecycle"
      - "rls_context"
      - "pg_extensions"
    # 禁止 OSS 型（低レベル PostgreSQL ドライバの直接露出禁止）
    banned_oss_types_in_public_api:
      - "Npgsql::"
      - "tokio_postgres::"
      - "PgConnection"
      - "NpgsqlConnection"
    # 現行実装 OSS
    current_oss: ["PostgreSQL (CloudNativePG)", "PgBouncer", "pg_partman"]

  # カテゴリ 14: Relational Store / Distributed SQL
  - id: distributed_sql
    # 人間可読な名前
    name: "Relational Store / Distributed SQL"
    # 対象スタック（backend のみ）
    target: backend
    # 抽象化レベル（L1+: 将来カテゴリ。現時点未定）
    abstraction_level: "L1plus"
    # 露出許可概念（tier3 が Single-leader と排他選択する際に使用する概念）
    exposed_concepts:
      - "distributed_transaction"
      - "sharding_key"
    # 禁止 OSS 型
    banned_oss_types_in_public_api: []
    # 現行実装 OSS（未定）
    current_oss: []

  # カテゴリ 15: Vector Search
  - id: vector_search
    # 人間可読な名前
    name: "Vector Search"
    # 対象スタック（backend のみ）
    target: backend
    # 抽象化レベル（L1+: pgvector 単一深耕）
    abstraction_level: "L1plus"
    # 露出許可概念（pgvector 固有の概念を露出してよい）
    exposed_concepts:
      - "vector_index_type"
      - "distance_function"
      - "ann_query"
      - "hnsw_params"
      - "ivfflat_params"
    # 禁止 OSS 型（pgvector 外の vector engine 型の直接露出禁止）
    banned_oss_types_in_public_api:
      - "QdrantClient"
      - "MilvusClient"
      - "qdrant::"
    # 現行実装 OSS
    current_oss: ["pgvector"]

  # カテゴリ 16: Workflow / Long-running Saga
  - id: workflow
    # 人間可読な名前
    name: "Workflow / Long-running Saga"
    # 対象スタック（backend のみ）
    target: backend
    # 抽象化レベル（L1+: Temporal 単一深耕）
    abstraction_level: "L1plus"
    # 露出許可概念（Temporal 固有の概念を露出してよい）
    exposed_concepts:
      - "workflow_id"
      - "activity_id"
      - "workflow_run_id"
      - "compensation_activity"
      - "deterministic_execution"
      - "workflow_namespace"
    # 禁止 OSS 型（低レベル Temporal SDK 型の直接露出禁止）
    banned_oss_types_in_public_api:
      - "temporalio::"
      - "TemporalClient"
      - "WorkflowClient"
    # 現行実装 OSS
    current_oss: ["Temporal"]

  # カテゴリ 17: Rule Engine
  - id: rule_engine
    # 人間可読な名前
    name: "Rule Engine"
    # 対象スタック（backend のみ）
    target: backend
    # 抽象化レベル（L1+: ZEN Engine 単一深耕）
    abstraction_level: "L1plus"
    # 露出許可概念（ZEN Engine 固有の概念を露出してよい）
    exposed_concepts:
      - "decision_table_id"
      - "rule_evaluation_context"
      - "decision_result"
    # 禁止 OSS 型（低レベル ZEN Engine 型の直接露出禁止）
    banned_oss_types_in_public_api:
      - "zen_engine::"
      - "ZenEngine"
    # 現行実装 OSS
    current_oss: ["ZEN Engine"]
