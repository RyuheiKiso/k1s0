# key_management/scenarios.yaml — 鍵管理適合仕様 scenario 定義 (SoT)
# spec: docs/04_詳細設計/01_適合仕様/05_鍵管理適合仕様.md

spec_ref: "05_鍵管理適合仕様"
schema_version: "v1"

# 8 primary scenario。各 scenario は対象 key_class を宣言する。
scenarios:
  - id: key_generation
    classes:
      - v1_data_dek
      - v1_data_kek
      - v1_token_signing
      - v1_audit_root_signing
      - v1_mtls_workload

  - id: rotation_cycle
    classes:
      - v1_data_dek
      - v1_data_kek
      - v1_token_signing
      - v1_audit_root_signing
      - v1_mtls_workload

  - id: crypto_shred_proves_unread
    classes:
      - v1_data_dek
      - v1_data_kek

  - id: revocation_propagation
    classes:
      - v1_token_signing
      - v1_audit_root_signing

  - id: external_notary_attestation_chain
    classes:
      - v1_audit_root_signing

  - id: hsm_zeroize_audit
    classes:
      - v1_data_kek

  - id: dpop_proof_of_possession
    classes:
      - v1_token_signing

  # M-of-N Shamir 閾値式セレモニー
  - id: kek_threshold_ceremony
    classes:
      - v1_data_kek
    note: "M-of-N Shamir 閾値式鍵セレモニー"
