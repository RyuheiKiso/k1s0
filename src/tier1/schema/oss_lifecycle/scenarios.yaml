# oss_lifecycle/scenarios.yaml — OSS ライフサイクル適合仕様 scenario 定義 (SoT)
# spec: docs/04_詳細設計/01_適合仕様/08_OSSライフサイクル適合仕様.md

spec_ref: "08_OSSライフサイクル適合仕様"
schema_version: "v1"

# 6 primary scenario。各 scenario は対象 lifecycle_class を宣言する。
scenarios:
  - id: license_change_detected
    classes:
      - v1_l1plus_primary
      - v1_l2star_member

  - id: cve_backlog_overflow_freezes_deploy
    classes:
      - v1_l1plus_primary
      - v1_l3_runtime

  - id: dry_run_cadence_elapsed_blocks_release
    classes:
      - v1_l1plus_pair_target

  - id: l2star_conformance_drift_demotes_member
    classes:
      - v1_l2star_member

  - id: major_up_with_compat_test
    classes:
      - v1_l3_runtime
      - v1_inhouse_authoritative

  - id: spec_drift_detected
    classes:
      - v1_inhouse_authoritative
