// tier1 OSS ライフサイクル適合仕様 v1 — OSS inventory 定義
// 08_OSSライフサイクル適合仕様.md §v1 lifecycle_class セット（6 class）と
// 02_採用OSS一覧.md との byte-equal 整合を確保する機械可読 schema を宣言する。
syntax = "proto3";

package tier1.oss_lifecycle.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/k1s0-io/k1s0/tier1/oss_lifecycle/v1;osslifecyclev1";
option java_multiple_files = true;
option java_package = "io.k1s0.tier1.oss_lifecycle.v1";

// LifecycleClass は 08_OSSライフサイクル適合仕様.md §v1 lifecycle_class セット（6 class）を宣言する。
enum LifecycleClass {
  // ライフサイクルクラス未指定（デフォルト値）
  LIFECYCLE_CLASS_UNSPECIFIED = 0;
  // L1+ プライマリ：最優先で採用・保守する中核 OSS（Primary pair の片方）
  LIFECYCLE_CLASS_L1PLUS_PRIMARY = 1;
  // L1+ ペアターゲット：Primary と対をなす L1+ 採用候補 OSS
  LIFECYCLE_CLASS_L1PLUS_PAIR_TARGET = 2;
  // L2* メンバー：L1+ に準ずる品質で採用・保守する OSS（LTS 維持対象）
  LIFECYCLE_CLASS_L2STAR_MEMBER = 3;
  // L3 ランタイム：実行環境依存で間接採用する OSS（移行計画対象外）
  LIFECYCLE_CLASS_L3_RUNTIME = 4;
  // 予約カテゴリ：フォーク / community 移管済みで将来分類が確定していない OSS
  LIFECYCLE_CLASS_RESERVED_CATEGORY = 5;
  // 内製権威：内製代替実装が正式に採用されており当該 OSS は廃止済み
  LIFECYCLE_CLASS_INHOUSE_AUTHORITATIVE = 6;
}

// LicenseKind は OSS ライセンスの種別を宣言する（GPL 汚染リスクを識別するため）。
enum LicenseKind {
  // デフォルト（未指定）
  LICENSE_KIND_UNSPECIFIED = 0;
  // Apache License 2.0
  LICENSE_KIND_APACHE_2 = 1;
  // MIT License
  LICENSE_KIND_MIT = 2;
  // BSD 2-Clause License
  LICENSE_KIND_BSD_2 = 3;
  // BSD 3-Clause License
  LICENSE_KIND_BSD_3 = 4;
  // ISC License
  LICENSE_KIND_ISC = 5;
  // Mozilla Public License 2.0
  LICENSE_KIND_MPL_2 = 6;
  // GNU Lesser General Public License v2.1
  LICENSE_KIND_LGPL_2_1 = 7;
  // GNU Affero General Public License v3.0
  LICENSE_KIND_AGPL_3 = 8;
  // Proprietary / Commercial License
  LICENSE_KIND_PROPRIETARY = 9;
}

// OssEntry は 02_採用OSS一覧.md の 1 エントリに対応する機械可読 record を宣言する。
message OssEntry {
  // id: kebab-case の一意識別子（例: axum, kafka-broker）
  string id = 1;
  // name: 人間向け表示名
  string name = 2;
  // version_pin: cargo.lock / go.sum / pnpm-lock.yaml 等で固定したバージョン
  string version_pin = 3;
  // lifecycle_class: 現時点の OSS ライフサイクル状態
  LifecycleClass lifecycle_class = 4;
  // license: ライセンス種別
  LicenseKind license = 5;
  // used_by_axes: 使用している軸の一覧（例: [tier1, tier2]）
  repeated string used_by_axes = 6;
  // last_security_audit_at: 最終セキュリティ監査日時
  google.protobuf.Timestamp last_security_audit_at = 7;
  // eol_at: EOL 予定日時（EOL_ANNOUNCED 以上の class のみ）
  google.protobuf.Timestamp eol_at = 8;
  // migration_target: 置き換え先（EOL_ANNOUNCED / REPLACED_INHOUSE のみ）
  string migration_target = 9;
}

// OssInventory は 02_採用OSS一覧.md 全体を機械可読な form に固定する。
// oss_inventory.lock.yaml はこの schema の build artifact として生成される。
message OssInventory {
  // entries: 採用 OSS エントリの全リスト
  repeated OssEntry entries = 1;
  // generated_at: 生成日時
  google.protobuf.Timestamp generated_at = 2;
  // schema_version: このメッセージのバージョン
  string schema_version = 3;
}
