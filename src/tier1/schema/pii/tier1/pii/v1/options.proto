// tier1 PII 適合仕様 v1 — フィールドレベル PII annotation 定義
// tier1/CLAUDE.md §必須 annotation「(tier1.pii.field_pii)」の物理化。
// PII フィールドを宣言し、Outbox 書込時の redaction class を機械可読形式で固定する。
//
// Buf custom lint 責務:
//   - PII フィールドには (tier1.pii.v1.field_pii).contains_pii = true が必須
//   - contains_pii = true のフィールドには redaction_class が UNSPECIFIED 禁止
//   - 未指定フィールドは contains_pii = false とみなし lint 警告なし
syntax = "proto3";

// パッケージ名: tier1.pii.v1（他の tier1 annotation と同一命名空間に置く）
package tier1.pii.v1;

// google.protobuf.FieldOptions: フィールドレベル option を定義するために必要
import "google/protobuf/descriptor.proto";

// Go パッケージパス
option go_package = "github.com/k1s0-io/k1s0/tier1/pii/v1;piiv1";
// Java クラス名（多ファイル展開）
option java_multiple_files = true;
// Java パッケージ名
option java_package = "io.k1s0.tier1.pii.v1";

// RedactionClass は PII フィールドのデータマスキング方式を宣言する。
// Outbox relay が write 時に適用する変換の種別を決定する。
enum RedactionClass {
  // デフォルト（未指定）— contains_pii=true のフィールドでは Buf lint が fail にする
  REDACTION_CLASS_UNSPECIFIED = 0;
  // REDACTION_CLASS_HASH: SHA-256 / HMAC-SHA256 ハッシュ化（検索可能な擬名化）
  // 主要用途: 個人識別子 / メールアドレス / 電話番号
  REDACTION_CLASS_HASH = 1;
  // REDACTION_CLASS_MASK: 部分マスキング（例: mail@example.com → m***@e***.com）
  // 主要用途: ログ出力 / 監査イベントでの可読性を保持しつつ PII を非表示化
  REDACTION_CLASS_MASK = 2;
  // REDACTION_CLASS_TOKENIZE: ランダムトークン置換（Format Preserving Encryption 等）
  // 主要用途: 非可逆 de-identification が必要な医療 / 金融データ
  REDACTION_CLASS_TOKENIZE = 3;
  // REDACTION_CLASS_SUPPRESS: フィールド完全削除（Outbox message から除去する）
  // 主要用途: ペイロード内の補助 PII（既に HASH 等で別フィールドに保持済みの場合）
  REDACTION_CLASS_SUPPRESS = 4;
  // REDACTION_CLASS_ENCRYPT: フィールドレベル暗号化（OpenBao Transit / AES-GCM 256bit）
  // 主要用途: 保管要件のある PII（key_class=v1_data_dek と組み合わせる）
  REDACTION_CLASS_ENCRYPT = 5;
}

// FieldPiiOptions は PII フィールドに付与する option セットを宣言する。
// tier1/CLAUDE.md §必須 annotation 「(tier1.pii.field_pii)」の実体。
message FieldPiiOptions {
  // contains_pii: このフィールドが PII を含む場合 true を宣言する（Buf lint 必須チェック）
  bool contains_pii = 1;
  // redaction_class: contains_pii=true の場合は必須（UNSPECIFIED 禁止）
  RedactionClass redaction_class = 2;
  // pii_category: GDPR / CCPA 等の規制フレームワーク上のカテゴリ名（例: "name" / "email" / "health"）
  string pii_category = 3;
}

// field_pii は proto フィールドに付与するカスタム option を宣言する。
// 使用例: string email = 1 [(tier1.pii.v1.field_pii) = { contains_pii: true, redaction_class: REDACTION_CLASS_HASH }];
// field_id 50010: tier1 annotation の番号帯（50000–50999 を tier1 が管理する）
extend google.protobuf.FieldOptions {
  // field_pii: フィールドごとの PII 属性を宣言する
  FieldPiiOptions field_pii = 50010;
}
