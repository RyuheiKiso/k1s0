# bidi/scenarios.yaml — Bidi 適合仕様 scenario 定義 (SoT)
# spec: docs/04_詳細設計/01_適合仕様/01_Bidi適合仕様.md

spec_ref: "01_Bidi適合仕様"
schema_version: "v1"

# 各 scenario は assertion_id と対象 conformance class を持つ。
# adapter × class の supports マトリクスは capabilities.lock.yaml (generated) に委譲する。
scenarios:
  - id: parallel_send
    assertion: pl_seq_monotonic_per_session
    classes:
      - v1_interactive
      - v1_event_feed
      - v1_bulk_upload

  - id: resume_after_disconnect
    assertion: rd_seq_continuous_across_resume
    # TLS version に非依存
    classes:
      - v1_interactive
      - v1_alert
      - v1_event_feed

  - id: slow_consumer_backpressure
    assertion: backpressure_applied_correctly
    classes:
      - v1_interactive
      - v1_event_feed
      - v1_bulk_upload

  - id: half_close_initiator
    # SUPPORTED class のみ対象
    assertion: half_close_terminates_cleanly
    classes:
      - v1_interactive
      - v1_bulk_upload

  - id: proxy_buffering_injection
    assertion: proxy_buffer_inject_handled
    classes:
      - v1_interactive
      - v1_alert
      - v1_event_feed
      - v1_live_snapshot

  - id: tls_disconnect
    # HLC resume_token を必須包含する
    assertions:
      - rd_seq_continuous_across_resume
      - resume_token_hlc_valid
    classes:
      - v1_interactive
      - v1_alert
      - v1_event_feed

  - id: large_message
    assertion: large_msg_fragmented_correctly
    classes:
      - v1_interactive
      - v1_bulk_upload

  - id: long_idle
    assertion: keepalive_maintained_after_idle
    classes:
      - v1_interactive
      - v1_alert
      - v1_event_feed
      - v1_live_snapshot

  # v2 拡張枠として予約。実装時に確定する。
  - id: reserved_scenario_1
    status: reserved
    note: "v2 拡張時に確定"
