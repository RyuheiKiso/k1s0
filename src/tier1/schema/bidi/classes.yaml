# bidi/classes.yaml — Bidi 適合仕様 conformance class 定義 (SoT)
# spec: docs/04_詳細設計/01_適合仕様/01_Bidi適合仕様.md

spec_ref: "01_Bidi適合仕様"
schema_version: "v1"

# 全 Bidi conformance class の一覧。各 class はスコープ内の ordering/resumable/half_close/delivery/direction を固定する。
conformance_classes:
  - id: v1_interactive
    ordering: SESSION_ORDERED
    half_close: SUPPORTED
    resumable: REQUIRED
    max_msg_lag_ms: 200
    direction: bidirectional
    delivery_guarantee: at_most_once_effective

  - id: v1_alert
    ordering: SESSION_ORDERED
    half_close: UNUSED
    resumable: REQUIRED
    max_msg_lag_ms: 200
    direction: server_to_client
    delivery_guarantee: at_most_once_effective

  - id: v1_event_feed
    ordering: SESSION_ORDERED
    half_close: UNUSED
    resumable: REQUIRED
    max_msg_lag_ms: 5000
    direction: server_to_client
    delivery_guarantee: at_most_once_effective

  - id: v1_live_snapshot
    ordering: UNORDERED
    half_close: UNUSED
    resumable: NONE
    max_msg_lag_ms: 500
    direction: server_to_client
    delivery_guarantee: latest_wins

  - id: v1_bulk_upload
    ordering: UNORDERED
    half_close: SUPPORTED
    resumable: NONE
    max_msg_lag_ms: 0
    direction: client_to_server
    delivery_guarantee: at_least_once

# 禁止組合せ: 業務的矛盾・意味論として薄い組合せを明示する
forbidden_combinations:
  - ordering: SESSION_ORDERED
    resumable: NONE
    reason: "セッション順序保証があるのに再開不可は業務的に矛盾"
  - ordering: UNORDERED
    resumable: REQUIRED
    reason: "順序保証なしで再開必須は意味論として薄い"
