# slo/classes.yaml — SLO 適合仕様 slo_class 定義 (SoT)
# spec: docs/04_詳細設計/01_適合仕様/07_SLO適合仕様.md

spec_ref: "07_SLO適合仕様"
schema_version: "v1"

# 6 slo_class。各 class は sli_kind / target / window / multi_window_burn_rate / alert_severity を宣言する。
slo_classes:
  - id: v1_request_availability
    sli_kind: availability
    target: "99.9%"
    window: 30d
    multi_window_burn:
      fast:
        window: 2h
        multiplier: 14.4
      slow:
        window: 24h
        multiplier: 3
    alert_severity: page_immediate

  - id: v1_request_latency_p99
    sli_kind: latency
    target: "p99 ≤ class.target"
    window: 30d
    multi_window_burn:
      fast:
        window: 1h
        multiplier: 14
      slow:
        window: 6h
        multiplier: 3
    alert_severity: page_immediate

  - id: v1_request_latency_p99_cross_region
    sli_kind: latency
    target: "p99 ≤ class.target"
    window: 30d
    multi_window_burn:
      fast:
        window: 1h
        multiplier: 14
      slow:
        window: 6h
        multiplier: 3
    alert_severity: page_immediate

  - id: v1_event_freshness
    sli_kind: freshness
    target: "p95 ≤ class.target"
    window: 7d
    multi_window_burn:
      fast:
        window: 30m
        multiplier: 14
      slow:
        window: 4h
        multiplier: 3
    alert_severity: page_business_hours

  - id: v1_workflow_completion
    sli_kind: completion_rate
    target: "99.5%"
    window: 30d
    multi_window_burn:
      fast:
        window: 4h
        multiplier: 14
      slow:
        window: 3d
        multiplier: 3
    alert_severity: ticket_only

  - id: v1_data_durability
    sli_kind: durability
    target: "99.999999999%"
    window: 365d
    multi_window_burn:
      any_loss: immediate
    alert_severity: page_immediate
