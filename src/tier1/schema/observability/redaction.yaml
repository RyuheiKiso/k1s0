# observability/redaction.yaml — 観測適合仕様 PII redaction 定義 (SoT)
# spec: docs/04_詳細設計/01_適合仕様/03_観測適合仕様.md

spec_ref: "03_観測適合仕様"
schema_version: "v1"

# OTel Collector processor が物理削除する PII field の一覧
pii_fields:
  - field: "tier2.actor.email"
  - field: "tier2.actor.phone"
  - field: "tier2.actor.full_name"
  - field: "tier2.aggregate.address"
  - field: "tier3.form.input.value"

# 適用箇所: OTel Collector processor による物理削除
application:
  processors:
    - type: attributes_processor
      action: delete
    - type: transform_processor
      action: delete_key

# audit signal は PII 構造的不在のため適用外
exclusions:
  - signal: audit
    reason: "PII 構造的不在 (tier2 で担保)"

# actor 識別子の固定方針
actor_identifier:
  allowed: "Keycloak subject (不可逆 ID, sub claim)"
  forbidden:
    - "氏名"
    - "メール"
    - "電話"
    - "端末 ID"
  reason: "不可逆 ID のみを signal に出し、個人特定可能情報は signal に含めない"
