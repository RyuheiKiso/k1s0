# observability/signals.yaml — 観測適合仕様 signal class 定義 (SoT)
# spec: docs/04_詳細設計/01_適合仕様/03_観測適合仕様.md

spec_ref: "03_観測適合仕様"
schema_version: "v1"

# 5 signal class。各 signal は SoR / retention / redaction ルールと投入経路を持つ。
signals:
  - id: logs
    sor: "ClickHouse logs table"
    retention: "規制要件次第"
    redaction: collector_required
    ingestion_path:
      - "OTel SDK"
      - "DaemonSet Collector"
      - "ClickHouse logs table"

  - id: metrics
    sor: Prometheus
    retention: "短期 + 月次 downsample"
    redaction: low_cardinality_required
    ingestion_path:
      - "OTel SDK"
      - "DaemonSet Collector"
      - "Prometheus"

  - id: traces
    sor: "ClickHouse traces table (Jaeger v2 UI)"
    retention: tail_sampled
    redaction: collector_required
    # 2 段構成: traceId による routing → tail-sampling
    ingestion_path:
      - "OTel SDK"
      - "DaemonSet Collector (段1)"
      - "loadbalancingexporter (routing_key: traceId)"
      - "tail-sampling Deployment (段2)"
      - "clickhouseexporter"

  - id: profiles
    sor: Parca
    retention: "短期"
    redaction: low_cardinality_required
    ingestion_path:
      - "OTel SDK"
      - "DaemonSet Collector"
      - "Parca"

  - id: audit
    sor: "ClickHouse audit table"
    retention: "10年+"
    redaction: pii_structurally_absent
    redaction_note: "PII 構造的不在は tier2 で担保"
    ingestion_path:
      - "PostgreSQL audit_local"
      - "Audit relay"
      - "ClickHouse audit table"
