# observability/correlation.yaml — 観測適合仕様 cross-signal correlation contract (SoT)
# spec: docs/04_詳細設計/01_適合仕様/03_観測適合仕様.md

spec_ref: "03_観測適合仕様"
schema_version: "v1"

# cross-signal correlation の主キーと注入箇所を定義する
primary_key:
  name: trace_id
  format: "W3C traceparent の trace-id (16 byte hex)"

# 各 signal への trace_id 注入箇所
trace_id_injection:
  logs:
    location: "ClickHouse logs.trace_id 列"
    indexed: true
  metrics:
    location: "Prometheus exemplar の trace_id label"
  traces:
    location: "OTel span の trace-id (自然に存在)"
  profiles:
    location: 'Parca label "trace_id"'
  audit:
    location: "audit_local.trace_id → ClickHouse audit.trace_id"

# cross-tier propagation: 単一 trace が全 tier を貫く
cross_tier_propagation:
  direction: "tier3 → tier2 → tier1"
  guarantee: "1 trace が全 tier を貫く"

# signal 間の join 契約
cross_signal_joins:
  - signals: [logs, traces]
    method: "ClickHouse equi-join on trace_id"
  - signals: [metrics, traces]
    method: "exemplar trace_id 起点に Jaeger drill-down"
  - signals: [profiles, traces]
    method: "Parca label trace_id 起点"
  - signals: [audit, logs, traces]
    method: "audit.trace_id 相関"
