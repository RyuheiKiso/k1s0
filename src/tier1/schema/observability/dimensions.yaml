# observability/dimensions.yaml — 観測適合仕様 attribute layer 定義 (SoT)
# spec: docs/04_詳細設計/01_適合仕様/03_観測適合仕様.md

spec_ref: "03_観測適合仕様"
schema_version: "v1"

# 4 attribute layer を namespace_prefix / owner_tier / examples で定義する。
# 全 layer は OpenTelemetry Weaver で各言語定数コードを生成する。
layers:
  - id: core
    namespace_prefix: "(OTel SC base)"
    owner_tier: OTel upstream
    examples:
      - "http.*"
      - "rpc.*"
      - "db.*"
      - "messaging.*"
      - "faas.*"

  - id: tier1_ext
    namespace_prefix: "tier1."
    owner_tier: tier1
    examples:
      - "tier1.bidi.*"
      - "tier1.transport.*"
      - "tier1.oss.exposed.*"

  - id: tier2_ext
    namespace_prefix: "tier2."
    owner_tier: tier2
    examples:
      - "tier2.tenant.id"
      - "tier2.aggregate.id"
      - "tier2.business_event"
      - "tier2.aggregate_class"
      - "tier2.purpose"

  - id: tier3_ext
    namespace_prefix: "tier3."
    owner_tier: tier3
    examples:
      - "tier3.screen.id"
      - "tier3.interaction.kind"
      - "tier3.web_vitals.*"
      - "tier3.layer"

# 不変条件: layer 間の参照方向と禁止操作を明示する
invariants:
  - "core 属性の rename/削除を ext layer は行わない"
  - "tier2_ext は tier1_ext を参照する"
  - "tier3_ext は tier2_ext を参照する"
  - "Companion 拡張は tier1_ext + tier2_ext のサブセットを最小 NuGet で配布する"
  - "全 layer は OpenTelemetry Weaver で各言語定数コードを生成する"
