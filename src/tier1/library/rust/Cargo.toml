# k1s0 tier1 Library Rust クレート定義
# 05_鍵管理適合仕様.md / 04_認証適合仕様.md に基づく 4 言語等価強度 SDK の Rust 実装
[package]
# クレート名: k1s0-tier1-library
name = "k1s0-tier1-library"
# エディション: 2021（最新安定版）
edition = "2021"
# バージョン
version = "0.1.0"

[dependencies]
# serde: シリアライズ/デシリアライズ（derive feature を有効化する）
serde = { version = "1", features = ["derive"] }
# anyhow: エラーハンドリング（Result 型の統一）
anyhow = "1"
# zeroize: 機密データのゼロクリア（KeyHandle drop 時にメモリをゼロクリアする）
zeroize = { version = "1", features = ["derive"] }
# uuid: UUID v4 生成（セッション ID / トークン ID に使用する）
uuid = { version = "1", features = ["v4"] }
# chrono: 日時ライブラリ（step_up_proven_at タイムスタンプに使用する）
chrono = { version = "0.4", features = ["serde"] }
# sqlx: compile-time 型安全 SQL（PgRepository の DB アクセスに使用する）
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
# serde_json: JSON シリアライズ/デシリアライズ（PgRepository の payload 変換に使用する）
serde_json = "1"
# tokio: 非同期ランタイム（async trait の executor）
tokio = { version = "1", features = ["full"] }
# async-trait: async fn in trait を安定版で使用するためのマクロ
async-trait = "0.1"
# reqwest: HTTP クライアント（OpenBao Transit API 呼び出しに使用する）
reqwest = { workspace = true }
# base64: OpenBao Transit API の input / signature フィールド用 Base64 エンコード
base64 = { workspace = true }
