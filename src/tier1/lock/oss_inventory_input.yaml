    # lifecycle_class: tier1 transport の主要フレームワークのため v1_l1plus_primary を指定する
    lifecycle_class: v1_l1plus_primary
    # version: 現行採用バージョン（semver 表記）
    version: "0.8.1"
    # cargo update --dry-run で axum の新しいパッチバージョンが利用可能かを確認した
    drill_state: green
    notes: "cargo update --dry-run: axum 0.8.x patch update available, cargo test passed after update, no breaking changes detected"
    sbom_hash: "sha256:1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b"
    cosign_signature_verified_at: "2026-05-20T00:00:00Z"
    health_check_last_at: "2026-05-20T00:00:00Z"
    signal_source_endpoint: "https://github.com/tokio-rs/axum/releases"
