# tier1 OSS lifecycle drill 実行結果
# generate_oss_inventory.py が本ファイルを読み込んで oss_inventory.lock.yaml を生成する
# cargo update --dry-run + go list -m -u all による version bump dry-run 結果を記録する
# lifecycle_class: 08_OSSライフサイクル適合仕様.md §lifecycle_class セット canonical 名（v1_l1plus_primary 等）
# version: 使用中の semver バージョン文字列

