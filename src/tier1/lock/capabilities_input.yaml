    notes: "EventSource SSE: direction=server→client, ordering=UNORDERED, latest-wins"

  # ========= paired_post_sse (supports: v1_interactive, v1_alert, v1_event_feed, v1_live_snapshot) =========
  # v1_bulk_upload は構造的不可（半二重 emulation であり client→server bulk に不向き）
  - cell_id: v1_interactive__paired_post_sse
    conformance_class: v1_interactive
    adapter: paired_post_sse
    status: green
    assertion_run_result_id: "assert_2026-05-21_v1_interactive_paired_post_sse"
    notes: "POST↔SSE pair: half-duplex emulation, _crosscutting/12_ua_aware_adapter 連携, NoDoubleHandshake holds"
  - cell_id: v1_alert__paired_post_sse
    conformance_class: v1_alert
    adapter: paired_post_sse
    status: green
    assertion_run_result_id: "assert_2026-05-21_v1_alert_paired_post_sse"
    notes: "POST↔SSE pair: direction=server→client, lag≤200ms"
  - cell_id: v1_event_feed__paired_post_sse
    conformance_class: v1_event_feed
    adapter: paired_post_sse
    status: green
    assertion_run_result_id: "assert_2026-05-21_v1_event_feed_paired_post_sse"
