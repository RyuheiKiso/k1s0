  - cell_id: v1_live_snapshot__paired_post_sse
    conformance_class: v1_live_snapshot
    adapter: paired_post_sse
    status: green
    assertion_run_result_id: "assert_2026-05-21_v1_live_snapshot_paired_post_sse"
    notes: "POST↔SSE pair: direction=server→client, ordering=UNORDERED, latest-wins"

  # ========= long_poll (supports: v1_event_feed のみ) =========
  - cell_id: v1_event_feed__long_poll
    conformance_class: v1_event_feed
    adapter: long_poll
    status: green
    assertion_run_result_id: "assert_2026-05-21_v1_event_feed_long_poll"
    notes: "fetch long-poll: direction=server→client, lag≤5000ms, resume_token re-issue on reconnect"

  # ========= webhook (supports: v1_alert, v1_event_feed, v1_live_snapshot) =========
  - cell_id: v1_alert__webhook
    conformance_class: v1_alert
    adapter: webhook
    status: green
    assertion_run_result_id: "assert_2026-05-21_v1_alert_webhook"
    notes: "HMAC-SHA256 signed webhook: direction=server→client, lag≤200ms, retry-after header"
  - cell_id: v1_event_feed__webhook
    conformance_class: v1_event_feed
