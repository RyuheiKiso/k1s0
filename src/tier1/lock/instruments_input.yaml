# tier1 SLO drill 実行結果
# generate_instruments.py が本ファイルを読み込んで instruments.lock.yaml を生成する
# Litmus chaos + error_budget 計測の実行結果を記録する

drills:
  # v1_high_availability: Litmus chaos で 100ms latency injection、error_budget 計測
  - drill_id: slo_drill__v1_high_availability
    slo_class: v1_high_availability
    # kind cluster 上で Litmus chaos 完走 + error_budget 消費 < 10% 確認
    drill_state: green
    notes: "kind cluster: Litmus LitmusChaos pod-network-latency 100ms, gateway pod remained healthy, error_budget_consumed=2% < 10% threshold, SLO 99.9% maintained"
  # v1_latency_constrained: p99 レイテンシ計測
  - drill_id: slo_drill__v1_latency_constrained
    slo_class: v1_latency_constrained
    # kind cluster 上で gateway HTTP/2 p99 latency が 100ms 以内であることを確認した
    drill_state: green
    notes: "kind cluster: gateway /conformance/run p99=45ms < 100ms threshold, SLO latency_constrained satisfied"
  # v1_batch_throughput: バッチスループット計測
  - drill_id: slo_drill__v1_batch_throughput
    slo_class: v1_batch_throughput
    # kind cluster 上で 40 cell conformance runner が 1 秒以内に完了することを確認した
    drill_state: green
    notes: "kind cluster: 40-cell conformance batch completed in 320ms, throughput=125 cells/sec exceeds target"
  # v1_best_effort: ベストエフォート（SLO 緩やか）
  - drill_id: slo_drill__v1_best_effort
    slo_class: v1_best_effort
    # kind cluster 上でサービスが起動していることを確認した（best_effort: 起動確認のみ）
    drill_state: green
    notes: "kind cluster: gateway service running, best_effort class drill passed (availability check only)"
