# tier1 スキーマ進化レジストリ検証結果（6 schema_class）
# generate_registries.py が本ファイルを読み込んで registries.lock.yaml を生成する
# Buf breaking check / Apicurio compat API / sqlx-cli 検証結果を記録する

registries:
  # v1_external_proto: Buf BSR、BACKWARD 互換
  - schema_class: v1_external_proto
    schema_kind: proto_external
    registry_backend: buf_bsr
    # kind cluster 上で Buf breaking check が BACKWARD 互換を enforce することを確認した
    drift_status: zero
    notes: "kind cluster: buf breaking --against .git#branch=main run on external proto, 0 breaking changes detected, BACKWARD compatibility enforced"
  # v1_internal_proto: Buf BSR internal、互換性 NONE（同期 deploy 前提）
  - schema_class: v1_internal_proto
    schema_kind: proto_internal
    registry_backend: buf_bsr_internal
    # kind cluster 上で internal proto が Argo Rollouts と連動した同期 deploy で管理されることを確認した
    drift_status: zero
    notes: "kind cluster: internal proto NONE compatibility mode verified, Argo Rollouts canary deploy simulated, all replicas updated simultaneously"
  # v1_event_avro: Apicurio Registry、FULL 互換
  - schema_class: v1_event_avro
    schema_kind: event_avro
    registry_backend: apicurio
    # kind cluster 上で Apicurio compat API が FULL 互換を enforce することを確認した
    drift_status: zero
    notes: "kind cluster: Apicurio Registry FULL compatibility check via REST API, domain_event Avro schema registered, breaking evolution rejected (HTTP 409)"
  # v1_db_ddl: sqlx-cli migration、forward_backward_via_migration
  - schema_class: v1_db_ddl
    schema_kind: db_ddl
    registry_backend: sqlx_migrations
    # kind cluster 上で sqlx migration が forward-only で適用されることを確認した
    drift_status: zero
    notes: "kind cluster: sqlx migrate run applied migrations 0001-0005 in order, forward-only verified, NOT NULL column added with DEFAULT, rolling upgrade window compatible"
  # v1_config_yaml: リポジトリ内 yaml、BACKWARD 互換
  - schema_class: v1_config_yaml
    schema_kind: config_yaml
    registry_backend: yaml_in_repo
    # kind cluster 上で config yaml の BACKWARD 互換検証が動作することを確認した
    drift_status: zero
    notes: "kind cluster: tier1 control_plane tenant config yaml validated against schema, BACKWARD compatible keys-only change tested, deprecated keys flagged after 6-month window"
  # v1_otel_semconv: OpenTelemetry Weaver、FULL 互換
  - schema_class: v1_otel_semconv
    schema_kind: otel_semconv
    registry_backend: weaver
    # kind cluster 上で OTel Weaver SemConv 拡張が FULL 互換で管理されることを確認した
    drift_status: zero
    notes: "kind cluster: OTel Weaver registry validated, tier1 signal attribute names match SemConv catalog, FULL compatibility check passed, no drift between gateway emitted attributes and weaver registry"
