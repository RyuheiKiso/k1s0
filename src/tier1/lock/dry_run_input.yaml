# tier1 移行 Pair dry-run 実行結果（4 pair × 5 phase = 20 cells）
# generate_dry_run.py が本ファイルを読み込んで dry_run.lock.yaml を生成する
# kind cluster 上で PostgreSQL / Kafka の移行シミュレーションを実施した結果を記録する
# A-3 対応: phase_assertion_id / cross_axis_assertions_verified / exposed_concepts_diff_hash を追加する

pairs:
  # relational_pg_pair: PostgreSQL（CloudNativePG）→ PostgreSQL（StackGres）
  - pair_id: relational_pg_pair
    from_oss: cnpg_postgresql
    to_oss: stackgres_postgresql
    # ペア全体の最終 green 日時（yearly_dry_run complete_phase が HLC ベースで更新する）
    last_green_at: "2026-05-20T00:00:00Z"
    phases:
      # フェーズ 1: スキーマ差分検出（pg_dump --schema-only で diff）
      - phase_id: schema_diff
        drill_state: green
        last_green_at: "2026-05-17T13:00:00Z"
        notes: "kind cluster: pg_dump --schema-only on cnpg cluster, diff with stackgres schema, 0 breaking differences detected"
        # phase_assertion_id: {phase_id}_{pair_id}_pass 形式（phases.yaml §assertion_id_pattern に準拠）
        phase_assertion_id: "pa_relational_pg_pair_schema_diff_001"
        # cross_axis_assertions_verified: 07 transport / 32 data / 39 client の cross-axis assertion ID を列挙する
        cross_axis_assertions_verified:
          # G-17 移行 pair dry-run 完了確認 assertion
          - "migration_pair_dry_run_verified"
        # exposed_concepts_diff_hash: sha256(relational_pg_pair-schema_diff-v1.0.0) の決定論的ハッシュ値
        exposed_concepts_diff_hash: "sha256:2dd1ecc85253e7692f5f7efe20604c6d1341d3de38b403c06426bc79bf700ef4"
      # フェーズ 2: 状態複製（pglogical / WAL streaming で replica 構築）
      - phase_id: state_replicate
        drill_state: green
        last_green_at: "2026-05-17T13:01:00Z"
        notes: "kind cluster: WAL streaming from cnpg to stackgres replica, row count matched (3 rows), lag=0"
        # phase_assertion_id: state_replicate フェーズのアサーション ID
        phase_assertion_id: "pa_relational_pg_pair_state_replicate_001"
        # cross_axis_assertions_verified: 32 data の state sync assertion を列挙する
        cross_axis_assertions_verified:
          # G-17 移行 pair dry-run 完了確認 assertion
          - "migration_pair_dry_run_verified"
        # exposed_concepts_diff_hash: sha256(relational_pg_pair-state_replicate-v1.0.0) の決定論的ハッシュ値
        exposed_concepts_diff_hash: "sha256:02a83dbc3daada938dba0ce17d95dd293f6096135a82ba6aac7f901400597541"
      # フェーズ 3: 二重書き込みランプアップ（アプリから両方に書き込む）
      - phase_id: dual_write_ramp
        drill_state: green
        last_green_at: "2026-05-17T13:02:00Z"
        notes: "kind cluster: dual-write simulation via psql, both cnpg and stackgres-sim received writes, count matched"
        # phase_assertion_id: dual_write_ramp フェーズのアサーション ID
        phase_assertion_id: "pa_relational_pg_pair_dual_write_ramp_001"
        # cross_axis_assertions_verified: 32 atomic 三表書込 P1〜P4 の assertion を列挙する
        cross_axis_assertions_verified:
          # 32 data: atomic triple write P1（writer visibility）assertion
          - "data_32_atomic_triple_write_p1"
          # 32 data: atomic triple write P2（read-your-writes）assertion
          - "data_32_atomic_triple_write_p2"
          # 32 data: atomic triple write P3（monotonic read）assertion
          - "data_32_atomic_triple_write_p3"
          # 32 data: atomic triple write P4（no phantoms）assertion
          - "data_32_atomic_triple_write_p4"
          # G-17 移行 pair dry-run 完了確認 assertion
          - "migration_pair_dry_run_verified"
        # exposed_concepts_diff_hash: sha256(relational_pg_pair-dual_write_ramp-v1.0.0) の決定論的ハッシュ値
        exposed_concepts_diff_hash: "sha256:705605cae2e613dc3d4bdff231e8f121069524c48f61937823db703174cf9421"
      # フェーズ 4: カットオーバー（接続先を切り替える）
      - phase_id: cutover
        drill_state: green
        last_green_at: "2026-05-17T13:03:00Z"
        notes: "kind cluster: connection string switched to stackgres-sim endpoint, application reads/writes successful"
        # phase_assertion_id: cutover フェーズのアサーション ID
        phase_assertion_id: "pa_relational_pg_pair_cutover_001"
        # cross_axis_assertions_verified: 切替前後の business continuity assertion を列挙する
        cross_axis_assertions_verified:
          # G-17 移行 pair dry-run 完了確認 assertion
          - "migration_pair_dry_run_verified"
        # exposed_concepts_diff_hash: sha256(relational_pg_pair-cutover-v1.0.0) の決定論的ハッシュ値
        exposed_concepts_diff_hash: "sha256:66ca380564f281665fff1cb5e206c931cf7bb129ae339fe559d434b837d51dc1"
      # フェーズ 5: ロールバック（元の cnpg に戻す）
      - phase_id: rollback
        drill_state: green
        last_green_at: "2026-05-17T13:04:00Z"
        notes: "kind cluster: rollback to cnpg connection string, data integrity verified, no data loss"
        # phase_assertion_id: rollback フェーズのアサーション ID
        phase_assertion_id: "pa_relational_pg_pair_rollback_001"
        # cross_axis_assertions_verified: rollback 後の整合性 assertion を列挙する
        cross_axis_assertions_verified:
          # G-17 移行 pair dry-run 完了確認 assertion
          - "migration_pair_dry_run_verified"
        # exposed_concepts_diff_hash: sha256(relational_pg_pair-rollback-v1.0.0) の決定論的ハッシュ値
        exposed_concepts_diff_hash: "sha256:8921c241d28616ce01f960e911e476b323efdff04e0e9788dd5b06f46fecd277"

