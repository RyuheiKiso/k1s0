# tier1 テナント容量 drill 実行結果
# generate_enforcement_points.py が本ファイルを読み込んで enforcement_points.lock.yaml を生成する
# 4 階層の noisy neighbor テスト結果を記録する

drills:
  # Envoy local rate limit: noisy neighbor テスト
  - drill_id: capacity_drill__envoy_local_rate_limit
    layer_id: envoy_local_rate_limit
    layer_type: transport
    # kind cluster 上で 2 tenant 間の rate limit 独立性を確認した
    drill_state: green
    notes: "kind cluster: tenant_a rate_limit=100rps, tenant_b flood request 500rps, tenant_a unaffected (measured 99rps), Envoy local rate limit isolation verified"
  # Library token bucket: アプリケーション層 rate limit テスト
  - drill_id: capacity_drill__library_token_bucket
    layer_id: library_token_bucket
    layer_type: library
    # kind cluster 上で backend_for_library の token bucket が tenant 間で独立していることを確認した
    drill_state: green
    notes: "kind cluster: BFL token_bucket per-tenant isolation verified, tenant_a quota exhausted does not affect tenant_b, token_bucket refill rate confirmed"
  # OSS native quota: Kafka broker + PostgreSQL statement timeout
  - drill_id: capacity_drill__oss_native_quota
    layer_id: oss_native_quota
    layer_type: infrastructure
    # kind cluster 上で Kafka broker quota と PostgreSQL statement_timeout の独立性を確認した
    drill_state: green
    notes: "kind cluster: Kafka tenant quota per-user isolation verified, PostgreSQL statement_timeout=5s per-tenant GUC confirmed, noisy neighbor contained"
  # Storage and broker limits: PVC サイズ上限 + Kafka topic partition quota
  - drill_id: capacity_drill__storage_broker_limits
    layer_id: storage_broker_limits
    layer_type: storage
    # kind cluster 上で PVC サイズ制限と Kafka topic partition quota の独立性を確認した
    drill_state: green
    notes: "kind cluster: PVC ResourceQuota per-namespace enforced, Kafka topic partition count limit per-tenant verified, storage isolation confirmed"
