# tier1 認証 IdP capability 一覧
# generate_idp_capabilities.py が本ファイルを読み込んで idp_capabilities.lock.yaml を生成する
# 04_認証適合仕様.md §v1 auth_class セット（5 class）に基づく
# idp_id は auth_class 名を使用し、auth_protocol で実装技術を識別する

capabilities:
  # v1_human_session: 業務担当者 SPA セッション
  # OIDC code flow + DPoP 鍵束縛（RFC 9449）、rotating refresh、on_high_risk step_up
  - idp_id: v1_human_session
    auth_protocol: oidc_dpop_bound
    status: green
    notes: "BFL /auth/verify: OIDC code flow + DPoP proof-of-possession verified, AuthContext(auth_class=v1_human_session) returned, raw token not in response, rotating refresh confirmed"

  # v1_workload_jwt: K8s ServiceAccount projection or SPIFFE/SPIRE SVID
  # 短 TTL JWT、自動 renew は kubelet projected volume / spire-agent 担当、step_up=never
  - idp_id: v1_workload_jwt
    auth_protocol: jwt_svid
    status: green
    notes: "BFL /auth/verify: K8s ServiceAccount SVID JWT validated, AuthContext(auth_class=v1_workload_jwt) returned, TTL<5m confirmed, exp/aud strict"

  # v1_device_attest: 工場端末・KIOSK、TPM/HSM device cert、長 TTL、one_shot refresh
  - idp_id: v1_device_attest
    auth_protocol: jwt_attested
    status: green
    notes: "BFL /auth/verify: device attestation chain verified, AuthContext(auth_class=v1_device_attest) returned, TTL<24h, one_shot refresh confirmed, re-attestation required on expiry"

  # v1_federated_exchange: 親会社/取引先 IdP からの RFC 8693 token exchange
  # audience-restricted 短命 JWT、act/may_act claim
  - idp_id: v1_federated_exchange
    auth_protocol: token_exchange
    status: green
    notes: "BFL /auth/verify: RFC 8693 token exchange validated, audience-restricted JWT, AuthContext(auth_class=v1_federated_exchange) returned, act/may_act claim verified"

  # v1_emergency_step_up: break-glass アクセス
  # always step_up (WebAuthn/FIDO2/TOTP)、TTL<10m、no refresh、purpose=emergency 強制
  - idp_id: v1_emergency_step_up
    auth_protocol: oidc_dpop_stepup
    status: green
    notes: "BFL /auth/verify: break-glass always step_up enforced, AuthContext(auth_class=v1_emergency_step_up, purpose=emergency) returned, TTL<10m, refresh rejected, audit signal emitted"
