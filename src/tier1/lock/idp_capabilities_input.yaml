# tier1 認証 IdP capability 一覧
# generate_idp_capabilities.py が本ファイルを読み込んで idp_capabilities.lock.yaml を生成する
# kind cluster 上での認証フロー確認結果を記録する

capabilities:
  # Keycloak OIDC プロバイダー（メイン IdP）
  - idp_id: keycloak_oidc
    auth_protocol: oidc
    # kind cluster 上で backend_for_library の token verify エンドポイントが Keycloak OIDC と連携することを確認した
    status: green
    notes: "kind cluster: BFL /auth/verify returns AuthContext with is_valid=true for valid OIDC token, raw token not in response"
  # DPoP トークン検証
  - idp_id: dpop_token
    auth_protocol: dpop
    # kind cluster 上で DPoP proof 検証が AuthContext を返すことを確認した
    status: green
    notes: "kind cluster: DPoP proof-of-possession verified via BFL, AuthContext returned, token not exposed in public API"
  # mTLS クライアント証明書認証
  - idp_id: mtls_client_cert
    auth_protocol: mtls
    # kind cluster 上で mTLS 証明書検証が AuthContext を返すことを確認した
    status: green
    notes: "kind cluster: mTLS client cert validated by gateway, AuthContext.service_account populated, no raw cert in response"
  # JWT ベアラートークン検証
  - idp_id: jwt_bearer
    auth_protocol: jwt
    # kind cluster 上で Envoy jwt_authn フィルター経由の JWT 検証が正常動作することを確認した
    status: green
    notes: "kind cluster: Envoy jwt_authn filter validates bearer token, AuthContext forwarded to upstream, raw token stripped from forwarded headers"
