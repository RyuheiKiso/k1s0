# 軸 × verification_class の cadence override テーブル
# デフォルト cadence は verification_classes.yaml の cadence_days を使用する
# override が必要な組み合わせのみここに列挙する
overrides:
  # infra 軸 × v1_fault_chaos: 90日周期（クラスタ全体の障害演習頻度）
  - axis: infra
    verification_class: v1_fault_chaos
    cadence_days: 90
  # data 軸 × v1_fault_chaos: 30日周期（データ整合性の障害演習は高頻度）
  - axis: data
    verification_class: v1_fault_chaos
    cadence_days: 30
  # security 軸 × v1_fault_chaos: 90日周期（セキュリティ障害演習頻度）
  - axis: security
    verification_class: v1_fault_chaos
    cadence_days: 90

# 全 90 entry の cadence 解決ルール
# 1. overrides に一致する axis+verification_class があれば cadence_days を上書き
# 2. 一致しない場合は verification_classes.yaml の cadence_days を使用
# 3. cadence_days: 0 は "compile-time のみ（実行周期なし）" を意味する
cadence_resolution_rule: override_then_parent_default

# デフォルト cadence 参照元
default_cadence_source: src/test/verification_classes.yaml

# 網羅チェック用: 18 軸一覧
axes:
  - tier1
  - tier2
  - tier3
  - infra
  - data
  - security
  - ops
  - client
  - test
  - cross_http2
  - cross_kek
  - cross_schema
  - cross_fsm
  - cross_slo
  - cross_bff
  - cross_pii
  - cross_edge
  - meta

# 網羅チェック用: 5 verification_class 一覧
verification_classes:
  - v1_type_invariant
  - v1_property_axiom
  - v1_contract_pair
  - v1_scenario_replay
  - v1_fault_chaos

