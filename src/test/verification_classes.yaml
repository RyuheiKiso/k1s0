# 5 検証クラスの定義（coverage_matrix の列定義）
verification_classes:
  - class_id: v1_type_invariant
    description: 型不変条件（typestate / phantom type / sealed enum で compile-time enforcement）
    cadence_days: 0
    tool: rustc/scalac/tsc/dotnet-build
    coverage_weight: 0.3
  - class_id: v1_property_axiom
    description: プロパティ公理（property-based test + QuickCheck / Hedgehog / fast-check）
    cadence_days: 7
    tool: cargo-test/pytest/jest
    coverage_weight: 0.25
  - class_id: v1_contract_pair
    description: 契約ペア（Pact / Bruno による consumer-provider contract test）
    cadence_days: 14
    tool: pact/bruno
    coverage_weight: 0.2
  - class_id: v1_scenario_replay
    description: シナリオ再現（Playwright e2e + transcript replay）
    cadence_days: 7
    tool: playwright/k6
    coverage_weight: 0.15
  - class_id: v1_fault_chaos
    description: 障害混沌（Litmus Chaos + chaos-mesh fault injection drill）
    cadence_days: 90
    tool: litmus/chaos-mesh
    coverage_weight: 0.1
