# src/ops/alert_catalog/slo_breach_rules.yaml
# Prometheus PrometheusRule: SLO error budget burn rate アラートルール
# ops 適合仕様 17 の alertmanager_routing orchestrator に対応する
# signal_class v1_slo_breach の 5 段階 burn rate alert を定義する
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  # PrometheusRule 名
  name: k1s0-slo-breach-alerts
  # monitoring namespace に配置する (Prometheus Operator が監視する)
  namespace: monitoring
  labels:
    # Prometheus Operator がこのルールを読み込むラベル
    prometheus: kube-prometheus
    # k1s0 ops axis に属することを示すラベル
    k1s0.io/axis: ops
    # signal_class を示すラベル
    k1s0.io/signal-class: v1_slo_breach
spec:
  # PrometheusRule グループ定義
  groups:
    # SLO breach アラートグループ
    - name: k1s0.slo_breach
      # ルール評価間隔: 1 分
      interval: 1m
      rules:
        # アラート: SLO error budget burn rate が 6x を超えた場合 (page)
        - alert: K1s0SloErrorBudgetBurnRatePage
          # burn rate が 6x を超えたかどうかを判定する式
          expr: |
            (
              sum(rate(k1s0_request_errors_total[1h])) /
              sum(rate(k1s0_request_total[1h]))
            ) / on() group_left() k1s0_slo_error_rate_threshold > 6
          # 5 分間継続した場合にアラートを発火する
          for: 5m
          labels:
            # アラート重大度: page
            severity: page
            # 対応する signal_class
            signal_class: v1_slo_breach
            # ops axis を示すラベル
            axis: ops
          annotations:
            # アラートサマリー
            summary: "SLO error budget burn rate が 6x を超えた"
            # アラート詳細
            description: "k1s0 SLO の error budget burn rate が 6x を超えました。現在の burn rate: {{ $value }}x"
            # 対応 runbook へのリンク
            runbook_url: "https://docs.k1s0.internal/ops/runbook/v1_slo_breach"

        # アラート: SLO error budget burn rate が 14.4x を超えた場合 (freeze)
        - alert: K1s0SloErrorBudgetBurnRateFreeze
          # burn rate が 14.4x を超えたかどうかを判定する式
          expr: |
            (
              sum(rate(k1s0_request_errors_total[5m])) /
              sum(rate(k1s0_request_total[5m]))
            ) / on() group_left() k1s0_slo_error_rate_threshold > 14.4
          # 2 分間継続した場合にアラートを発火する
          for: 2m
          labels:
            # アラート重大度: critical (freeze 発動)
            severity: critical
            # 対応する signal_class
            signal_class: v1_slo_breach
            # ops axis を示すラベル
            axis: ops
          annotations:
            # アラートサマリー
            summary: "SLO error budget burn rate が 14.4x を超えた (freeze 発動)"
            # アラート詳細
            description: "k1s0 SLO の error budget burn rate が 14.4x を超えました。error_budget_freeze を true に設定してください。現在の burn rate: {{ $value }}x"
            # 対応 runbook へのリンク
            runbook_url: "https://docs.k1s0.internal/ops/runbook/v1_slo_breach#freeze"

    # 容量違反アラートグループ
    - name: k1s0.capacity_breach
      # ルール評価間隔: 2 分
      interval: 2m
      rules:
        # アラート: テナント volume が quota の 80% を超えた場合 (warning)
        - alert: K1s0TenantVolumeWarning
          # テナント volume 使用率が 80% を超えたかどうかを判定する式
          expr: |
            k1s0_tenant_volume_used_bytes /
            k1s0_tenant_volume_quota_bytes > 0.8
          # 10 分間継続した場合にアラートを発火する
          for: 10m
          labels:
            # アラート重大度: warning
            severity: warning
            # 対応する signal_class
            signal_class: v1_capacity_breach
            # ops axis を示すラベル
            axis: ops
          annotations:
            # アラートサマリー
            summary: "テナント volume 使用率が 80% を超えた"
            # アラート詳細
            description: "テナント {{ $labels.tenant_id }} の volume 使用率が 80% を超えました。"
            # 対応 runbook へのリンク
            runbook_url: "https://docs.k1s0.internal/ops/runbook/v1_capacity_breach"

    # 変更誘発アラートグループ
    - name: k1s0.change_induced
      # ルール評価間隔: 1 分
      interval: 1m
      rules:
        # アラート: deploy 直後に SLO burn rate が急増した場合
        - alert: K1s0ChangeInducedSloSpike
          # deploy 直後 (15m 以内) に burn rate が 3x を超えた場合を検知する式
          expr: |
            (
              increase(kube_deployment_status_observed_generation[15m]) > 0
            ) and (
              (
                sum(rate(k1s0_request_errors_total[5m])) /
                sum(rate(k1s0_request_total[5m]))
              ) / on() group_left() k1s0_slo_error_rate_threshold > 3
            )
          # 3 分間継続した場合にアラートを発火する
          for: 3m
          labels:
            # アラート重大度: page
            severity: page
            # 対応する signal_class
            signal_class: v1_change_induced
            # ops axis を示すラベル
            axis: ops
          annotations:
            # アラートサマリー
            summary: "deploy 後に SLO burn rate が急増した (変更誘発)"
            # アラート詳細
            description: "直近の deploy 後に SLO error budget burn rate が {{ $value }}x に急増しました。rollback を検討してください。"
            # 対応 runbook へのリンク
            runbook_url: "https://docs.k1s0.internal/ops/runbook/v1_change_induced"
