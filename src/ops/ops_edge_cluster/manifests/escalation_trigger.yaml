# src/ops/ops_edge_cluster/manifests/escalation_trigger.yaml
# ops-edge cluster の escalation trigger 設定
# target cluster が障害中でも ops-edge cluster から Mattermost / Argo に escalation を発火する
# K8s 基盤 manifests は src/_crosscutting/10_ops_edge_cluster/manifests/ が管理する
# このファイルは escalation trigger config のみ (ops CLAUDE.md の制約に従う)
apiVersion: v1
kind: ConfigMap
metadata:
  # ConfigMap 名: ops-edge escalation trigger 設定
  name: k1s0-escalation-trigger-config
  # ops-edge cluster の ops namespace に配置する
  namespace: k1s0-ops-edge
  labels:
    # k1s0 ops axis に属することを示すラベル
    k1s0.io/axis: ops
    # ops-edge cluster コンポーネントを示すラベル
    k1s0.io/component: escalation-trigger
data:
  # escalation trigger 設定 (YAML 形式の文字列として格納する)
  trigger_config: |
    # ops-edge cluster が監視する Prometheus endpoint 設定
    prometheus_endpoints:
      # target cluster の Prometheus Federation endpoint
      - url: "https://prometheus.k1s0-target.internal/federate"
        # 収集するメトリクス (ops loop シグナルのみ federate する)
        match_selectors:
          # SLO 関連メトリクスを federate する
          - '{job=~"k1s0.*",__name__=~"k1s0_request_.*"}'
          # capacity 関連メトリクスを federate する
          - '{__name__=~"k1s0_tenant_volume_.*"}'
          # ops loop 関連メトリクスを federate する
          - '{__name__=~"k1s0_ops_loop_.*"}'

    # escalation trigger ルール
    trigger_rules:
      # target cluster が完全に応答しない場合 (5 分間接続不可) に escalation を発火する
      - name: target_cluster_outage
        # 接続タイムアウト秒数
        timeout_seconds: 300
        # 接続失敗時の escalation 先 (Mattermost + PagerDuty)
        escalation_channel: "#sre-critical"
        # escalation する signal_class
        signal_class: v1_dependency_outage
        # Argo Workflows API エンドポイント (ops-edge cluster 内のローカル Argo)
        argo_api_url: "http://argo-workflows-server.k1s0-ops-edge.svc.cluster.local:2746"
        # 起動する WorkflowTemplate 名
        workflow_template: k1s0-escalation-engine

      # SLO burn rate が 14.4x を超えた場合に ops-edge から backup escalation を発火する
      - name: slo_freeze_backup
        # 発火条件: federate された burn rate が 14.4x を超えた場合
        prometheus_expr: |
          (
            sum(rate(federated_k1s0_request_errors_total[5m])) /
            sum(rate(federated_k1s0_request_total[5m]))
          ) > 14.4
        # 持続時間: 2 分間継続で発火
        for_minutes: 2
        # escalation 先
        escalation_channel: "#sre-critical"
        # 対応する signal_class
        signal_class: v1_slo_breach
