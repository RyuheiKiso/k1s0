# src/ops/escalation_engine/mattermost_config.yaml
# Mattermost 通知チャンネル設定
# 各 signal_class に対応するチャンネルと escalation ルールを定義する
# 実際の webhook URL は OpenBao Transit で管理して Secret に注入する
apiVersion: v1
kind: ConfigMap
metadata:
  # ConfigMap 名: k1s0 Mattermost escalation 設定
  name: k1s0-mattermost-escalation-config
  # ops namespace に配置する
  namespace: k1s0-ops
  labels:
    # k1s0 ops axis に属することを示すラベル
    k1s0.io/axis: ops
    # escalation engine コンポーネントを示すラベル
    k1s0.io/component: escalation-engine
data:
  # escalation ルール設定 (YAML 形式の文字列として格納する)
  escalation_rules: |
    # signal_class ごとの Mattermost チャンネルと escalation 先を定義する
    escalation_rules:
      # v1_slo_breach: SLO 違反は #incident チャンネルに通知してページングする
      - signal_class: v1_slo_breach
        # 通知先チャンネル
        channel: "#incident"
        # 14.4x 以上は #sre-critical に escalation する
        escalation_threshold_multiplier: 14.4
        escalation_channel: "#sre-critical"
        # on-call チームに mention する
        mention_group: "@oncall-sre"

      # v1_capacity_breach: 容量違反は #ops-alerts チャンネルに通知する
      - signal_class: v1_capacity_breach
        # 通知先チャンネル
        channel: "#ops-alerts"
        # 90% 使用率超えは #incident に escalation する
        escalation_threshold_percent: 90
        escalation_channel: "#incident"
        # インフラチームに mention する
        mention_group: "@oncall-infra"

      # v1_change_induced: 変更誘発は #deploy-alerts チャンネルに通知する
      - signal_class: v1_change_induced
        # 通知先チャンネル
        channel: "#deploy-alerts"
        # auto rollback 発動時は #incident に escalation する
        escalation_trigger: auto_rollback_triggered
        escalation_channel: "#incident"
        # 変更担当者と SRE に mention する
        mention_group: "@oncall-sre"

      # v1_dependency_outage: 依存障害は #ops-alerts チャンネルに通知する
      - signal_class: v1_dependency_outage
        # 通知先チャンネル
        channel: "#ops-alerts"
        # IDP 障害は #incident に escalation する
        escalation_trigger: idp_outage
        escalation_channel: "#incident"
        # インフラと SRE に mention する
        mention_group: "@oncall-sre"

      # v1_drill_failure: ドリル失敗は #sre-drills チャンネルに通知する（ページングなし）
      - signal_class: v1_drill_failure
        # 通知先チャンネル
        channel: "#sre-drills"
        # escalation なし（ドリル失敗は非緊急）
        escalation_channel: null
        # SRE チームに mention する
        mention_group: "@sre-team"
