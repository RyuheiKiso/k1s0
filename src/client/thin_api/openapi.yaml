# tier1 Thin API Client 定義
# OpenAPI 3.0 形式でクライアント向け API を定義する
openapi: '3.0.3'
info:
  title: k1s0 Thin API Client
  version: 1.0.0
  description: tier1 gateway への Thin API クライアント定義
paths:
  /api/v1/resources:
    get:
      summary: リソース一覧を取得する
      operationId: listResources
      parameters:
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
  /api/v1/resources/{id}:
    get:
      summary: リソースを ID で取得する
      operationId: getResource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
