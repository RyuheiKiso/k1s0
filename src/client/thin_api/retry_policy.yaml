# thin_api クライアントのリトライポリシー
# RFC 7807 エラーに基づいたリトライ設定
version: 1.0.0
retry_policy:
  # リトライ対象 HTTP ステータスコード
  retry_on: [429, 500, 502, 503, 504]
  # 最大リトライ回数
  max_retries: 3
  # 初期待機時間 (ミリ秒)
  initial_delay_ms: 100
  # バックオフ乗数
  multiplier: 2.0
  # 最大待機時間 (ミリ秒)
  max_delay_ms: 10000
  # idempotency_key ヘッダー名
  idempotency_key_header: Idempotency-Key
