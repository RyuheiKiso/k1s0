name: docs_lint

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'img/**'
      - 'ARCHITECTURE.md'
      - 'tools/docs_lint/**'
      - 'tools/lock_yaml_generator/**'
      - '.github/workflows/docs_lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'img/**'
      - 'ARCHITECTURE.md'
      - 'tools/docs_lint/**'
      - 'tools/lock_yaml_generator/**'
      - '.github/workflows/docs_lint.yml'

jobs:
  lint:
    name: docs lint (8 check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run docs_lint (bash baseline)
        run: bash tools/docs_lint/run_lint.sh

      - name: Run docs_lint (Python strict)
        run: python3 tools/docs_lint/run_lint.py
        continue-on-error: false

  release_gate_check:
    name: release_gate documentation_integrity cell
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml click rich jsonschema

      - name: Regen and verify meta.docs_lint_green cell
        run: |
          python3 -m tools.lock_yaml_generator.cli all
          python3 -c "
          import yaml, sys
          with open('src/_meta/lock/release_gate.lock.yaml') as f:
              data = yaml.safe_load(f)
          cells = {c['cell_id']: c['status'] for c in data.get('cells', [])}
          cell_status = cells.get('meta.docs_lint_green', 'missing')
          print(f'meta.docs_lint_green: {cell_status}')
          if cell_status != 'green':
              print(f'FAIL: meta.docs_lint_green is {cell_status!r}', file=sys.stderr)
              sys.exit(1)
          print('OK: meta.docs_lint_green is green')
          "
