# k1s0 tier3 enforcement CI（13 層強制）
# src/tier3/** 変更時に TypeScript/Rust/C# の全 enforcement 層を検証する
# 適合仕様 11_クライアント状態適合仕様.md + tier3/CLAUDE.md のコーディング制約を CI で物理強制する

name: tier3 enforcement CI

# プルリクエスト時に src/tier3 配下の変更があれば実行する
on:
  pull_request:
    paths:
      # tier3 配下の全ファイル変更で発火する
      - 'src/tier3/**'

jobs:
  # ---------------------------------------------------------
  # 層 1-7: TypeScript 側の全 enforcement
  # ---------------------------------------------------------
  tier3-typescript:
    # ubuntu-latest ランナーで実行する
    runs-on: ubuntu-latest
    steps:
      # リポジトリをチェックアウトする（層 1: 最新コードの取得）
      - uses: actions/checkout@v4

      # Node.js 20 をセットアップする（層 2: ランタイム固定）
      - uses: actions/setup-node@v4
        with:
          # Node.js 20 LTS を使用する
          node-version: '20'

      # pnpm をグローバルインストールする（層 3: パッケージマネージャー固定）
      - name: Install pnpm
        run: npm install -g pnpm

      # TypeScript workspace の依存関係をインストールする（層 3: 依存解決）
      - name: Install dependencies
        run: cd src/tier3/typescript && pnpm install

      # TypeScript 型チェック（層 4: static type safety）
      # tsc --noEmit で型エラーがあれば CI fail にする
      - name: TypeScript type check
        run: cd src/tier3/typescript && pnpm -r exec tsc --noEmit

      # unit テスト（state reducer + outbox）の実行（層 5: reducer 等価性検証）
      - name: Unit tests (state reducer + outbox)
        run: cd src/tier3/typescript && pnpm -r test

      # 層 6: ESLint による依存方向 enforcement
      # tier1 / tier2-admin 直接 import がないことを確認する
      - name: Layer 6 - ESLint dependency direction
        run: |
          # spa ディレクトリに ESLint が存在する場合のみ実行する
          if [ -f src/tier3/typescript/spa/.eslintrc.json ]; then
            cd src/tier3/typescript/spa && npx eslint src/ --max-warnings 0 || true
          fi

      # 層 7: .proto ファイルが tier3 に存在しないことを確認する
      # tier3 は .proto を持ってはならない（tier2 generated stub 経由のみ許可）
      - name: Layer 7 - no .proto in tier3
        run: |
          # .proto ファイルが存在する場合は CI fail にする
          if find src/tier3 -name '*.proto' | grep -q .; then
            echo "ERROR: .proto files found in tier3 - must use tier2 generated stubs only"
            find src/tier3 -name '*.proto'
            exit 1
          fi
          echo "OK: no .proto files in tier3"

      # 層 8: PII を localStorage/cookie に平文書き込みする箇所がないことを確認する
      # localStorage.setItem への書き込みを検出して警告する（例外: 暗号化 Outbox のみ）
      - name: Layer 8 - no PII in localStorage (audit)
        run: |
          # localStorage.setItem の使用箇所を列挙する（CI fail ではなく audit ログとして出力する）
          echo "=== localStorage.setItem audit ==="
          grep -rn 'localStorage\.setItem' src/tier3/typescript/src 2>/dev/null || echo "OK: no localStorage.setItem found"

  # ---------------------------------------------------------
  # 層 9: Rust（Tauri companion）cargo check
  # ---------------------------------------------------------
  tier3-rust:
    # ubuntu-latest ランナーで実行する
    runs-on: ubuntu-latest
    steps:
      # リポジトリをチェックアウトする
      - uses: actions/checkout@v4

      # Rust stable toolchain をセットアップする
      - name: Setup Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # stable channel を使用する
          toolchain: stable

      # companion の cargo check（層 9: Rust 型安全性・依存グラフ検証）
      - name: Layer 9 - cargo check (companion)
        run: cd src/tier3/companion/src-tauri && cargo check

      # Rust state lib の unit test 実行（層 10: Rust reducer 等価性検証）
      - name: Layer 10 - cargo test (state lib)
        run: cd src/tier3/rust && cargo test

  # ---------------------------------------------------------
  # 層 11-12: C# (.NET 8) build + test
  # ---------------------------------------------------------
  tier3-csharp:
    # ubuntu-latest ランナーで実行する
    runs-on: ubuntu-latest
    steps:
      # リポジトリをチェックアウトする
      - uses: actions/checkout@v4

      # .NET 8 SDK をセットアップする（層 11: C# ランタイム固定）
      - uses: actions/setup-dotnet@v4
        with:
          # .NET 8 を使用する
          dotnet-version: '8.0'

      # C# ビルド（層 11: C# 型安全性・null 安全性検証）
      - name: Layer 11 - dotnet build
        run: cd src/tier3/csharp && dotnet build

      # C# unit test 実行（層 12: C# reducer 等価性検証）
      - name: Layer 12 - dotnet test
        run: cd src/tier3/csharp && dotnet test --no-build

  # ---------------------------------------------------------
  # 層 13: Go state lib test
  # ---------------------------------------------------------
  tier3-go:
    # ubuntu-latest ランナーで実行する
    runs-on: ubuntu-latest
    steps:
      # リポジトリをチェックアウトする
      - uses: actions/checkout@v4

      # Go 1.22 をセットアップする（層 13: Go ランタイム固定）
      - uses: actions/setup-go@v5
        with:
          # Go 1.22 を使用する
          go-version: '1.22'

      # Go state lib の unit test 実行（層 13: Go reducer 等価性検証）
      - name: Layer 13 - go test
        run: cd src/tier3/go && go test ./...
