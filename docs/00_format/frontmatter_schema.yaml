# ============================================================
# frontmatter schema (JSON Schema draft 2020-12 互換)
# ============================================================
# - 全 .md ドキュメントの YAML frontmatter を検証する schema。
# - 規約本文は docs/00_format/conventions/frontmatter.md を参照。
# - lint 実装は Phase 5 (tools/docs_lint/frontmatter_validator.py)。
# ============================================================

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://k1s0.local/schemas/docs/frontmatter.yaml"
title: "k1s0 documentation frontmatter"
type: object
additionalProperties: false

required:
  - id
  - axis
  - phase
  - kind
  - status
  - depends_on
  - covered_by

properties:

  id:
    type: string
    description: |
      <phase_short>.<axis>.<slug> 形式。配置パスから機械的に導出可能であること。
      不一致は CI fail。
    pattern: "^(plan|req|arch|detail|format|env)\\.[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"

  axis:
    type: string
    description: 19 軸 (10 主要軸 + 8 cross-cutting cluster + 1 meta) + overview の enum。
    enum:
      - tier1
      - tier2
      - tier3
      - infra
      - data
      - security
      - ops
      - client
      - test
      - formal
      - cross_http2
      - cross_kek
      - cross_schema
      - cross_fsm
      - cross_slo
      - cross_bff
      - cross_pii
      - cross_edge
      - meta
      - overview

  phase:
    type: string
    description: フェーズ enum。cross_cutting と format は配置場所に制約。
    enum:
      - plan
      - requirement
      - architecture
      - detail
      - cross_cutting
      - format
      - env_setup

  kind:
    type: string
    description: ドキュメントの種別 enum。
    enum:
      - responsibility
      - positioning
      - non_scope
      - oss
      - policy
      - ops_dx
      - enforcement
      - conformance_spec
      - cross_cut_spec
      - index
      - plan_doc
      - requirement
      - architecture
      - detail
      - template
      - convention
      - style
      - linter
      - glossary

  status:
    type: string
    description: |
      draft = WIP、locked = 1.0.0 ship blocker 対象、archived = 本流 OSS stack と drift した過去構想の保存のみ。
      locked のドキュメントは TBD / 未定 / TODO / あとで書く / 後述 が残存していたら CI fail。
      archived は lint の forbidden 表現 / 空セクション check を除外、frontmatter required fields は維持。
    enum:
      - draft
      - locked
      - archived

  depends_on:
    type: array
    description: |
      同一 repo 内の他 .md の id 配列。空配列 [] 許容。
      dangling 参照は CI fail。
    items:
      type: string
      pattern: "^(plan|req|arch|detail|format|env)\\.[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"
    uniqueItems: true

  covered_by:
    type: object
    description: defense-in-depth 6 層 + 5 proof_class への bind 宣言。
    additionalProperties: false
    required:
      - defense_in_depth_layers
      - proof_classes
    properties:
      defense_in_depth_layers:
        type: array
        description: 該当する層のみ列挙。空配列 [] 許容（規約 / 用語集等）。
        items:
          type: string
          enum: [A, B, C, D, E, F]
        uniqueItems: true
      proof_classes:
        type: array
        description: |
          formal 関連時のみ列挙、空配列 [] 許容。
          5 proof_class（19 軸 × 5 = 95 cell matrix）— 04_5proof_class論.md が権威。
        items:
          type: string
          enum:
            - v1_temporal_safety_proof
            - v1_temporal_liveness_proof
            - v1_refinement_proof
            - v1_program_correctness_proof
            - v1_runtime_modelcheck_proof
        uniqueItems: true

  lock_artifacts:
    type: array
    description: 当ドキュメントが宣言する *.lock.yaml の名前配列。
    items:
      type: string
      pattern: "^[a-z][a-z0-9_]*\\.lock\\.yaml$"
    uniqueItems: true

  related_axes:
    type: array
    description: |
      cross_* spec が論理的に依存する従来 10 軸の宣言。
      depends_on は spec 単位の参照、related_axes は軸単位の補助 link。
      cross_* 以外の spec でも関連軸を宣言する場合に使用可。
    items:
      type: string
      enum:
        - tier1
        - tier2
        - tier3
        - infra
        - data
        - security
        - ops
        - client
        - test
        - formal
        - cross_http2
        - cross_kek
        - cross_schema
        - cross_fsm
        - cross_slo
        - cross_bff
        - cross_pii
        - cross_edge
        - meta
        - overview
    uniqueItems: true

  trace:
    type: object
    description: |
      docs↔src semantic trace skeleton の FR-ID 宣言。
      generate_trace_ledger.py が本フィールドを読み込み trace_ledger.lock.yaml を生成する。
      run_lint.py [12/12] が fr_ids パターンを検証する。
    additionalProperties: false
    properties:
      fr_ids:
        type: array
        description: "FR-<axis>-NNN 形式の functional requirement ID リスト。"
        items:
          type: string
          pattern: "^FR-[a-z][a-z0-9_]*-[0-9]{3}$"
        uniqueItems: true
      br_ids:
        type: array
        description: "BR-<axis>-NNN 形式の business reason ID リスト（L1 層）。"
        items:
          type: string
          pattern: "^BR-[a-z][a-z0-9_]*-[0-9]{3}$"
        uniqueItems: true
      realized_by_specs:
        type: array
        description: "本 FR-ID が実現する L3 conformance spec の id 参照リスト。"
        items:
          type: string
          pattern: "^(plan|req|arch|detail|format|env)\\.[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"
        uniqueItems: true

# ============================================================
# forbidden field（schema レベルで CI 拒否）
# ============================================================
# additionalProperties: false により、下記 field を含む frontmatter は schema 検証段階で fail する。
# 個別禁止理由は docs/00_format/conventions/frontmatter.md を参照。
#   - changelog
#   - last_updated
#   - last_modified
#   - author
#   - reviewers
#   - version
#   - created_at
#   - tags
# ============================================================
