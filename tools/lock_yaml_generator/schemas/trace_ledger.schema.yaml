# trace_ledger.schema.yaml
# trace_ledger.lock.yaml の JSON Schema 定義。
# generate_trace_ledger.py が生成する artifact の検証に使用する。

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://k1s0.local/schemas/lock/trace_ledger.yaml"
title: "k1s0 trace ledger v1"
description: "docs 適合仕様の FR-ID ↔ spec_id 対応関係を記録する lock.yaml の schema。"
type: object
required:
  - _AUTO_GENERATED
  - schema_version
  - generated_at
  - axis_registry_ref
  - summary
  - edges
additionalProperties: false

properties:

  _AUTO_GENERATED:
    type: string
    description: "生成器名を示すヘッダ。手書き禁止の物理マーカー。"

  schema_version:
    type: string
    enum: ["v1"]
    description: "schema バージョン。変更時は breaking change として扱う。"

  generated_at:
    type: string
    description: "ISO8601 UTC タイムスタンプ。"

  axis_registry_ref:
    type: object
    description: "axis_registry.lock.yaml への参照（整合確認用）。"
    required: [lock, sha256]
    additionalProperties: false
    properties:
      lock:
        type: string
        description: "参照先 lock.yaml のファイル名。"
      sha256:
        type: string
        description: "sha256:<hex> 形式のチェックサム。"

  summary:
    type: object
    description: "FR-ID 被覆率サマリ。release_gate DSL が参照するフィールドを含む。"
    required: [total_specs, specs_with_fr_ids, fr_to_spec_ratio]
    additionalProperties: false
    properties:
      total_specs:
        type: integer
        minimum: 0
        description: "走査した適合仕様 .md の総数。"
      specs_with_fr_ids:
        type: integer
        minimum: 0
        description: "trace.fr_ids が 1 件以上存在する spec 数。"
      fr_to_spec_ratio:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "specs_with_fr_ids / total_specs。release_gate の ratchet_ge 閾値として使用。"

  edges:
    type: array
    description: "FR-ID と spec_id の対応関係リスト（L2 FR ↔ L3 spec の edges）。"
    items:
      type: object
      required: [fr_id, spec_id, spec_path, kind]
      additionalProperties: false
      properties:
        fr_id:
          type: string
          pattern: "^FR-[a-z][a-z0-9_]*-[0-9]{3}$"
          description: "FR-<axis>-NNN 形式の functional requirement ID。"
        spec_id:
          type: string
          description: "docs frontmatter の id フィールド値（detail.<axis>.<slug>）。"
        spec_path:
          type: string
          description: "REPO_ROOT からの相対パス（docs/04_詳細設計/...）。"
        kind:
          type: string
          enum: ["fr_to_spec"]
          description: "edge 種別。現 v1 は fr_to_spec のみ。"
        verifier:
          type: string
          enum: ["docs_lint", "axis_mismatch"]
          description: "検証主体。axis_mismatch は FR-ID の axis が axis_registry に存在しない場合。"
