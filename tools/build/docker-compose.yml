services:
  # Harbor コンテナレジストリ
  harbor:
    image: goharbor/harbor-core:v2.10.0
    ports:
      - "5000:5000"
    environment:
      HARBOR_ADMIN_PASSWORD: Harbor12345
    volumes:
      - harbor-data:/data

  # Apicurio Schema Registry
  apicurio:
    image: quay.io/apicurio/apicurio-registry:2.6.8.Final
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_URL: jdbc:postgresql://apicurio-db:5432/apicurio
      QUARKUS_DATASOURCE_USERNAME: apicurio
      QUARKUS_DATASOURCE_PASSWORD: apicurio
    depends_on:
      - apicurio-db
    volumes:
      - apicurio-data:/deployments

  # Apicurio のバックエンド PostgreSQL
  apicurio-db:
    image: postgres:16
    environment:
      POSTGRES_USER: apicurio
      POSTGRES_PASSWORD: apicurio
      POSTGRES_DB: apicurio

  # OpenBao シークレット管理（dev モード）
  openbao:
    image: ghcr.io/openbao/openbao:2.0.0
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    cap_add:
      - IPC_LOCK

  # アプリケーション用 PostgreSQL
  postgresql:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: k1s0
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ClickHouse 分析用 OLAP DB
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  # Kafka メッセージブローカー（PLAINTEXT）
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: ""
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  harbor-data:
  apicurio-data:
  clickhouse-data:
  postgres-data:
  kafka-data:
