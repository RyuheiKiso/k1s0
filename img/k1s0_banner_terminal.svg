<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" width="1280" height="200" role="img" aria-label="Keep It Simple, 0 Vendor Lock-in.">
  <title>Keep It Simple, 0 Vendor Lock-in.</title>
  <desc>k1s0 tagline banner. Cyan typewriter line on black.</desc>
  <defs>
    <style><![CDATA[
      .bg     { fill: #0d1117; }
      .border { fill: none; stroke: #21262d; stroke-width: 1; }
      .term {
        font-family: 'SF Mono','Menlo','Consolas','Source Code Pro','Liberation Mono',monospace;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.2px;
        dominant-baseline: alphabetic;
      }
      .prompt { fill: #22d3ee; }
      .hero   { fill: #a5f3fc; }
      .line   { clip-path: inset(0 100% 0 0); animation: type 10s infinite; }
      @keyframes type {
        0%, 4%   { clip-path: inset(0 100% 0 0); }
        30%      { clip-path: inset(0 0    0 0); }
        96%      { clip-path: inset(0 0    0 0); }
        100%     { clip-path: inset(0 100% 0 0); }
      }
      .cursor { fill: #22d3ee; animation: blink 10s infinite; }
      @keyframes blink {
        0%,   30%   { opacity: 0; }
        30.1%, 40%  { opacity: 1; }
        40.1%, 48%  { opacity: 0; }
        48.1%, 56%  { opacity: 1; }
        56.1%, 64%  { opacity: 0; }
        64.1%, 72%  { opacity: 1; }
        72.1%, 80%  { opacity: 0; }
        80.1%, 88%  { opacity: 1; }
        88.1%, 96%  { opacity: 0; }
        96.1%, 100% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .line, .cursor { animation: none !important; }
        .line { clip-path: none !important; }
        .cursor { opacity: 1 !important; }
      }
    ]]></style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="200" rx="10" />
  <rect class="border" x="0.5" y="0.5" width="1279" height="199" rx="10" />

  <g transform="translate(195, 120)">
    <text class="term line" x="0" y="0">
      <tspan class="prompt">$</tspan><tspan class="hero" dx="14">Keep It Simple, 0 Vendor Lock-in.</tspan>
    </text>
    <rect class="cursor" x="892" y="-36" width="16" height="44" />
  </g>
</svg>
