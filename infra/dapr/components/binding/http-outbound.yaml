# =============================================================================
# tier1 Binding API の HTTP output binding（bindings.http）
#
# 設計正典:
#   docs/03_要件定義/20_機能要件/10_tier1_API要件/05_Binding_API.md (FR-T1-BINDING-003)
#   docs/05_実装/00_ディレクトリ設計/50_infraレイアウト/04_Dapr_Component配置.md
#
# 業務根拠:
#   BR-PLATGOV-004 (SSRF 攻撃踏み台化リスクの構造的封じ込め)
#
# 役割:
#   tier2 が外部 HTTP API を呼ぶ経路を tier1 facade に集約し、URL の allowlist 管理を
#   Component YAML 1 箇所に集中させる。Dapr bindings.http は Component metadata `url`
#   で送信先ベース URL を固定し、operation で HTTP method を切り替える。
#   tier2 は handler.metadata.path で endpoint を指定するが、host は変更不能。
#
# テナント分離:
#   tier ごとに別 Component を立て、scopes 制御で読込許可を分離する。
#   ここでは「社内認証 API」用の単一 Component 例を示す（テナント別 Component は採用初期で展開）。
#
# 関連:
#   FR-T1-BINDING-003 (HTTP Output Binding)
#   NFR-E-NW-001 (外部 URL allowlist)
#   NFR-B-PERF-002 (HTTP リクエストレイテンシ)
# =============================================================================
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: http-outbound
  namespace: k1s0-tier1
  labels:
    app.kubernetes.io/part-of: k1s0
    app.kubernetes.io/component: dapr-component
spec:
  type: bindings.http
  version: v1
  metadata:
    # 送信先ベース URL (NFR-E-NW-001 allowlist の根幹: host は本値で固定)
    # 採用組織は社内 API ゲートウェイ等を指定する。tier2 は metadata.path で
    # 末尾の endpoint のみ指定可能。host を上書きする経路は存在しない。
    - name: url
      value: https://internal-api.k1s0.example.com
    # HTTP method の既定値 (operation で create/get/post/put/patch/delete を上書き可能)
    - name: MTLSRootCA
      secretKeyRef:
        name: http-outbound-mtls
        key: ca.crt
    - name: MTLSClientCert
      secretKeyRef:
        name: http-outbound-mtls
        key: tls.crt
    - name: MTLSClientKey
      secretKeyRef:
        name: http-outbound-mtls
        key: tls.key
    # error への変換規則: 5xx は再試行可 / 4xx は呼出側エラー
    - name: errorIfNot2XX
      value: "true"
    # output 専用 (receive は無効)
    - name: directionsList
      value: output
auth:
  secretStore: vault
scopes:
  - tier1-facade-state
