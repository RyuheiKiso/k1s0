# =============================================================================
# tier1 Binding API の Cron input binding（bindings.cron）
#
# 設計正典:
#   docs/03_要件定義/20_機能要件/10_tier1_API要件/05_Binding_API.md (FR-T1-BINDING-004)
#   docs/05_実装/00_ディレクトリ設計/50_infraレイアウト/04_Dapr_Component配置.md
#
# 役割:
#   k8s CronJob の個別マニフェスト管理を排し、Cron 式を Dapr Component で集中管理する。
#   Dapr sidecar が schedule に従って application HTTP port (POST /<binding-name>) を叩き、
#   tier2 アプリの handler が起動する。実行履歴は AuditInterceptor (privileged RPC =
#   Binding.Invoke) で自動記録される。
#
#   ※リリース時点では Component YAML 提供のみ。tier2 SDK 高水準 facade
#     `k1s0.Binding.OnSchedule(handler)` の SDK 結線は採用初期で展開する。それまでは
#     tier2 アプリが直接 Dapr Subscribe HTTP 経路を実装するか、k8s CronJob 手動管理を継続。
#
# テナント分離:
#   schedule は Component 単位で固定 (テナント越境を構造的に防止)。テナント別の
#   schedule が必要な場合は Component を tenant-<id>-cron-<name> 命名で個別配備する。
#
# 関連:
#   FR-T1-BINDING-004 (Cron Input Binding)
#   NFR-E-MON-002 (Binding 操作の Audit 記録)
# =============================================================================
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: cron-daily
  namespace: k1s0-tier1
  labels:
    app.kubernetes.io/part-of: k1s0
    app.kubernetes.io/component: dapr-component
spec:
  type: bindings.cron
  version: v1
  metadata:
    # Cron 式 (5 フィールド標準: 分 時 日 月 曜日)
    # 例は毎日 03:00 (UTC) に実行。採用側は要件に合わせて編集する。
    - name: schedule
      value: "0 3 * * *"
    # input 専用 (output operation は無効)
    - name: directionsList
      value: input
auth:
  secretStore: vault
scopes:
  - tier1-facade-state
